# Bij elke upload naar main: de site bouwen met de lichte telefoonversie erbij, en online zetten.
# Eenmalig nodig: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Site en telefoonversie
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - uses: actions/cache@v4
        with:
          path: .tel-cache
          key: tel-${{ hashFiles('art/*') }}
          restore-keys: tel-
      - run: python tools/maak_tel.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  online:
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.uitrol.outputs.page_url }}
    steps:
      - id: uitrol
        uses: actions/deploy-pages@v4
