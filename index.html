<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elementaal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --bg:#0e1216; --board:#141a20; --cell:#1c242c; --cell-hi:#27313b;
  --line:#2f3a45; --line-soft:#242e37;
  --ink:#e9e4d6; --muted:#8b96a0; --dim:#5c6873;
  --gold:#c9a86a; --gold-soft:#8f7443; --danger:#d5503c; --good:#5cb56e;
  --water:#3f8fd8; --steen:#b8874f; --vuur:#d5503c; --gras:#4da35c;
  --cw:clamp(56px,7vw,92px); --chh:calc(var(--cw)*1.4);
  --hw:clamp(60px,7.2vw,96px); --hh:calc(var(--hw)*1.4);
  font-size:15px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; max-width:100%; overflow:hidden; overscroll-behavior:none;
  -webkit-text-size-adjust:100%; touch-action:manipulation}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"VT323",ui-monospace,monospace;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit; cursor:pointer}
#app{
  height:100vh; height:100dvh; max-width:100vw; overflow:hidden; display:grid;
  transition:padding-top .18s ease;
  grid-template-columns:minmax(210px,270px) minmax(0,1fr) minmax(150px,190px);
  gap:0; position:relative;
  background:
    radial-gradient(1200px 700px at 50% 42%, rgba(201,168,106,.05), transparent 60%),
    radial-gradient(900px 500px at 50% -10%, rgba(63,143,216,.05), transparent 55%),
    radial-gradient(900px 500px at 50% 110%, rgba(213,80,60,.05), transparent 55%),
    var(--bg);
}
/* ---------- left rail ---------- */
#left{display:flex; flex-direction:column; min-height:0; padding:10px 8px 10px 12px; gap:10px; border-right:1px solid var(--line-soft)}
#preview{flex:0 0 auto; display:flex; justify-content:center}
#chain{flex:0 0 auto; max-height:34vh; overflow-y:auto}
/* Het logboek begint dicht. Je klikt het open als je wilt terugkijken. */
#logknop{flex:0 0 auto; width:100%; text-align:left; padding:7px 9px; cursor:pointer;
  font-family:"VT323",ui-monospace,monospace; font-size:.92rem; letter-spacing:.04em;
  color:var(--muted); background:#141b22; border:1px solid var(--line-soft); border-radius:4px}
#logknop:hover{color:var(--ink); border-color:var(--gold-soft)}
#logknop::after{content:" ▸"; color:var(--dim)}
body.logopen #logknop::after{content:" ▾"}
body.logopen #logknop{color:var(--gold); border-color:var(--gold-soft)}
#log{display:none}
body.logopen #log{display:block; flex:1 1 0; min-height:0; overflow-y:auto; font-size:.8rem; color:var(--muted);
  border-top:1px solid var(--line-soft); padding-top:6px; scrollbar-width:thin}
#log .le{padding:2px 2px; line-height:1.3; border-left:2px solid transparent; padding-left:6px}
#log .le.hot{color:var(--ink); border-left-color:var(--gold-soft)}
#log .le em{color:var(--gold); font-style:normal}
/* ---------- right rail ---------- */
#right{display:flex; flex-direction:column; min-height:0; padding:16px 12px 12px 8px; gap:8px;
  border-left:1px solid var(--line-soft); align-items:center}
#piles1{margin-top:2px}
#piles0{margin-bottom:22px}
#rtools{margin-top:2px}
#piles1,#piles0{display:flex; gap:10px; align-items:flex-start}
#rmid{flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; width:100%}
#turnbadge{font-family:"VT323",ui-monospace,monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.5}
#turnbadge b{color:var(--gold); display:block; font-size:.9rem}
#actions{display:flex; flex-direction:column; gap:8px; width:100%; align-items:center}
.abtn{
  width:100%; padding:10px 8px; border-radius:10px; border:1px solid var(--gold-soft);
  background:linear-gradient(180deg,#3a3221,#241f14);
  color:var(--gold); font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:.82rem; letter-spacing:.06em;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  transition:filter .15s, transform .1s;
}
.abtn:hover{filter:brightness(1.25)} .abtn:active{transform:translateY(1px)}
.abtn.primary{border-color:var(--gold); color:#f4e8c8;
  background:linear-gradient(180deg,#59491f,#33290f);
  box-shadow:0 0 18px rgba(201,168,106,.28), inset 0 1px 0 rgba(255,255,255,.1); animation:btnpulse 1.6s ease-in-out infinite}
.abtn.ghost{border-color:var(--line); color:var(--muted); background:linear-gradient(180deg,#222a32,#171d23)}
@keyframes btnpulse{0%,100%{box-shadow:0 0 10px rgba(201,168,106,.18)}50%{box-shadow:0 0 22px rgba(201,168,106,.4)}}
#rtools{display:flex; gap:6px}
/* In het verhaal geen klok en geen regelboek — die horen bij vrij spel. */
body.verhaal #klokbtn, body.verhaal #rtools [data-btn="help"]{display:none}
.tbtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#1a2129; color:var(--muted); font-size:.85rem}
.tbtn:hover{color:var(--ink); border-color:var(--gold-soft)}
/* ---------- piles ---------- */
.pile{position:relative; width:calc(var(--cw)*.82); height:calc(var(--chh)*.82); cursor:default}
.pile .lab{position:absolute; left:50%; transform:translateX(-50%); bottom:-15px; font-size:.62rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
.pile .cnt{position:absolute; right:-7px; top:-7px; min-width:20px; height:20px; padding:0 4px; border-radius:10px;
  background:#0b0e12; border:1px solid var(--gold-soft); color:var(--gold); font-size:.7rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; z-index:3}
.deckstack{position:absolute; inset:0}
.deckstack .cardback{position:absolute; inset:0}
.pile.grave{cursor:pointer}
.pile.grave .gtop{position:absolute; inset:0; opacity:.75; filter:saturate(.55) brightness(.8)}
.pile.grave:hover .gtop{opacity:1}
.pile .empty{position:absolute; inset:0; border:1px dashed var(--line); border-radius:8px; opacity:.5}
/* ---------- center ---------- */
#center{display:grid; grid-template-rows:auto 1fr auto; min-height:0; min-width:0; position:relative; padding:6px 10px}
.pside{display:flex; align-items:center; gap:14px; padding:2px 6px; min-height:calc(var(--hh) + 8px)}
.pside .pinfo{display:flex; flex-direction:column; gap:2px; min-width:120px}
.pname{font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:.82rem; letter-spacing:.1em; color:var(--muted)}
.pname.active{color:var(--gold); text-shadow:0 0 12px rgba(201,168,106,.5)}
.plife{display:flex; gap:3px; align-items:center}
.plife .hp{width:13px; height:13px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff8d7d, #b3311f 70%); box-shadow:0 0 6px rgba(213,80,60,.6)}
.plife .hp.off{background:#2a3038; box-shadow:none; opacity:.6}
.plife .lnum{margin-left:6px; font-weight:700; color:var(--danger); font-size:.9rem}
.pdeckinfo{font-size:.68rem; color:var(--dim)}
/* hand */
.hand{flex:1; display:flex; justify-content:center; align-items:center; gap:3px;
  min-width:0; height:var(--hh); position:relative}
.hcard{width:min(var(--hw), calc((100% - (var(--n,5) - 1) * 3px) / var(--n,5)));
  height:var(--hh); margin:0; position:relative;
  transition:transform .15s, box-shadow .15s; flex:0 0 auto}
.pside.bottom .hcard.up:hover{transform:translateY(calc(var(--hh)*-0.05)) scale(1.07); z-index:5}
.pside.top .hcard.up:hover{transform:translateY(calc(var(--hh)*0.05)) scale(1.07); z-index:5}
.hcard.legal{cursor:pointer}
.hcard.legal .card{box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(201,168,106,.55)}
.hcard.flashlegal .card{box-shadow:0 0 0 2px #7fd0ff, 0 0 18px rgba(80,180,255,.6); animation:flashglow 1.2s ease-in-out infinite}
@keyframes flashglow{0%,100%{box-shadow:0 0 0 2px #7fd0ff,0 0 10px rgba(80,180,255,.4)}50%{box-shadow:0 0 0 2px #bce7ff,0 0 22px rgba(120,200,255,.8)}}
.hcard.unplayable .card{filter:brightness(.55) saturate(.6)}
/* ---------- field ---------- */
#fieldwrap{display:flex; flex-direction:column; justify-content:center; min-height:0; gap:10px; position:relative; padding:0 4px}
.frow{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:clamp(6px,1vw,14px); justify-items:center}
.col{position:relative; width:calc(var(--cw) + 18px); height:calc(var(--chh) + 20px)}
.slot{position:absolute; border-radius:9px}
.slot.cr{left:0; bottom:0; width:var(--cw); height:var(--chh); z-index:2}
.slot.sp{right:0; width:calc(var(--cw)*.74); height:calc(var(--chh)*.74); z-index:1}
.frow.rowtop .slot.cr{bottom:0; top:auto}
.frow.rowtop .slot.sp{top:0; transform:rotate(7deg)}
.frow.rowbot .slot.cr{top:0; bottom:auto}
.frow.rowbot .slot.sp{bottom:0; transform:rotate(-7deg)}
.slot .ph{position:absolute; inset:0; border:1.5px dashed var(--line); border-radius:9px; opacity:.55;
  display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.85rem; background:rgba(255,255,255,.015)}
.slot.sp .ph::after{content:"✦"; opacity:.6}
.slot.cr .ph::after{content:""}
.slot.hl{cursor:pointer}
.slot.sp.hl{z-index:6}
.slot.cr.hl{z-index:7}
.slot.tgt,.slot.atk{z-index:5}
.slot.hl .ph, .slot.hl .card{box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(201,168,106,.6); opacity:1; border-style:solid; animation:slotpulse 1.1s ease-in-out infinite}
@keyframes slotpulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(201,168,106,.4)}50%{box-shadow:0 0 0 2px #ecd9ac,0 0 22px rgba(201,168,106,.85)}}
.slot.tgt{cursor:pointer}
.slot.tgt .card{box-shadow:0 0 0 2px #ff9d4d, 0 0 20px rgba(255,140,60,.7); animation:tgtpulse 1s ease-in-out infinite}
@keyframes tgtpulse{0%,100%{box-shadow:0 0 0 2px #ff9d4d,0 0 12px rgba(255,140,60,.5)}50%{box-shadow:0 0 0 2px #ffc78f,0 0 24px rgba(255,160,80,.9)}}
.slot.atk{cursor:pointer}
.slot.atk .card{box-shadow:0 0 0 2px var(--danger), 0 0 18px rgba(213,80,60,.65); animation:atkpulse 1.2s ease-in-out infinite}
@keyframes atkpulse{0%,100%{box-shadow:0 0 0 2px var(--danger),0 0 10px rgba(213,80,60,.45)}50%{box-shadow:0 0 0 2px #ff8f7d,0 0 22px rgba(255,110,90,.85)}}
.slot.spent .card{filter:brightness(.7) saturate(.75)}
/* De spell die onder een creature-plek ligt straalt zijn kleur omhoog: zo zie je in één
   oogopslag wat er afgaat als daar een creature komt te staan. */
/* Sommige beesten hangen boven hun eigen kaart en ademen. */
.slot.cr.dicht .cardback{position:absolute; inset:0; border-radius:9px}
.rookvraag{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:1.6rem; color:#b9c6d4;
  text-shadow:0 0 12px rgba(140,160,185,.9); pointer-events:none;
  animation:rookvraag 2.8s ease-in-out infinite}
@keyframes rookvraag{0%,100%{opacity:.55}50%{opacity:1}}
/* De dichte mist: elke kaart op het bord is dezelfde naamloze vlek. */
.mistkaart{position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background:#1b2129}
.mistkaart .cardback{position:absolute; inset:0; opacity:.22; filter:grayscale(1) brightness(.7)}
.mistkaart::after{content:""; position:absolute; inset:0;
  background:radial-gradient(circle at 46% 38%, rgba(168,182,198,.20), transparent 58%),
             radial-gradient(circle at 62% 74%, rgba(140,155,172,.14), transparent 52%)}
.slot.mist{border-color:#4a5563; background:#141920;
  box-shadow:inset 0 0 22px rgba(0,0,0,.55)}
.slot.mist .rookvraag{z-index:2; color:#dbe4ee; font-size:1.5rem;
  text-shadow:0 2px 0 #0a0d12, 0 0 16px rgba(190,208,228,.55)}
.slot.mist .atkgem,.slot.mist .hpgem,.slot.mist .stat{z-index:3}
/* De overkant: één egale muur van rook, overal precies hetzelfde. */
.slot.mist.blind{border-color:#2b333d; background:#10141a; box-shadow:inset 0 0 30px rgba(0,0,0,.7)}
.mistmuur{position:absolute; inset:0; border-radius:inherit; overflow:hidden;
  background:
    radial-gradient(circle at 34% 30%, rgba(150,165,182,.16), transparent 60%),
    radial-gradient(circle at 70% 72%, rgba(120,136,155,.13), transparent 58%),
    linear-gradient(165deg, #1b2029, #10141a 70%)}
.mistmuur::after{content:""; position:absolute; inset:-30%;
  background:radial-gradient(circle at 50% 50%, rgba(190,205,222,.10), transparent 62%);
  animation:mistdraai 9s linear infinite}
@keyframes mistdraai{0%{transform:translate(-6%,3%) scale(1)}
  50%{transform:translate(6%,-4%) scale(1.12)}100%{transform:translate(-6%,3%) scale(1)}}
/* Het rookveld: slierten die over het bord trekken. */
#rooklaag{position:fixed; inset:0; z-index:3; pointer-events:none; display:none}
#rooklaag.aan{display:block}
#rooklaag i{position:absolute; display:block; border-radius:50%;
  background:radial-gradient(circle at 40% 45%, rgba(198,212,228,.38), rgba(126,141,161,.22) 55%, rgba(0,0,0,0) 78%);
  filter:blur(3px); animation:rookdrijf linear infinite}
@keyframes rookdrijf{0%{transform:translateX(-18vw) translateY(0) scale(1); opacity:0}
  12%{opacity:.9}88%{opacity:.78}100%{transform:translateX(120vw) translateY(-40px) scale(1.3); opacity:0}}
/* Dik genoeg om zwaar aan te voelen, dun genoeg om je eigen kant en de knoppen te kunnen lezen.
   Dat hij niets van zíjn kant ziet komt van de blinde muren, niet van deze waas. */
#rookmist{position:fixed; inset:0; z-index:2; pointer-events:none; display:none;
  background:
    radial-gradient(ellipse at 30% 30%, rgba(150,164,182,.16), transparent 55%),
    radial-gradient(ellipse at 72% 60%, rgba(132,146,166,.13), transparent 52%),
    linear-gradient(180deg, rgba(120,132,148,.34), rgba(66,76,90,.46) 55%, rgba(26,32,41,.58))}
#rookmist.aan{display:block}
/* De tutorialbalk: één opdracht tegelijk, met een uitknop. */
/* De tutorial is een pop-up: hij staat vóór het bord en je komt er alleen langs door
   hem te lezen. Daarna is de opdracht het enige wat je nog kunt doen. */
#tutpop{position:fixed; inset:0; z-index:420; display:none;
  align-items:center; justify-content:center; padding:18px;
  background:rgba(6,9,14,.72)}
#tutpop.aan{display:flex}
#tutpop .tutdoos{width:min(560px,94vw); border:3px solid var(--gold); border-radius:6px;
  background:#141a20; color:var(--ink); padding:20px 22px 18px;
  box-shadow:0 10px 40px rgba(0,0,0,.7); text-align:center}
#tutpop .tutnr{font-family:"Press Start 2P",ui-monospace,monospace; font-size:.5rem;
  color:var(--gold); letter-spacing:.1em; margin-bottom:12px}
#tutpop .tuttxt{font-size:1.05rem; line-height:1.5; text-align:left}
#tutpop .tutknoppen{display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px}
#tutpop .tutok{font-family:"Press Start 2P",ui-monospace,monospace; font-size:.52rem;
  padding:12px 18px; border:3px solid var(--gold); border-radius:4px;
  background:linear-gradient(180deg,#59491f,#33290f); color:#f4e8c8; cursor:pointer}
#tutpop .tutok:hover{filter:brightness(1.2)}
#tutpop .tutweg{font-family:"Press Start 2P",ui-monospace,monospace; font-size:.44rem;
  padding:12px 14px; border:2px solid var(--line); border-radius:4px; background:#1c242c;
  color:var(--muted); cursor:pointer}
#tutpop .tutweg:hover{color:var(--ink); border-color:var(--gold-soft)}
#tutpop.nee .tutdoos{animation:tutnee .4s ease-out 1}
@keyframes tutnee{0%,100%{transform:translateX(0)}
  25%{transform:translateX(-9px)}60%{transform:translateX(8px)}}
@media (max-width:900px), (pointer:coarse){ #tutpop .tuttxt{font-size:.95rem} }
/* Seraf: wit licht, en een beeld dat niet helemaal stil blijft liggen. */
#praatbel.hard .pbbel{border-width:4px; border-color:#ffe08a; color:#fffdf2; background:#1a1408;
  font-size:1.5rem; letter-spacing:.14em; text-align:center; line-height:1.5;
  box-shadow:0 0 26px 8px rgba(255,224,138,.55), inset 0 0 18px rgba(255,224,138,.25);
  animation:hardbel .5s steps(2,end) 4}
#praatbel.hard .pbnaam{display:none}
@keyframes hardbel{0%,100%{opacity:1}50%{opacity:.55}}
#witflits{position:fixed; inset:0; z-index:450; pointer-events:none; opacity:0; background:#fffdf2}
#witflits.aan{animation:witflits .7s ease-out 1 both}
@keyframes witflits{0%{opacity:0}8%{opacity:.85}26%{opacity:.4}100%{opacity:0}}
#glitchlaag{position:fixed; inset:0; z-index:4; pointer-events:none; display:none; mix-blend-mode:screen;
  background:repeating-linear-gradient(0deg, rgba(255,253,242,.05) 0 2px, rgba(0,0,0,0) 2px 4px)}
#glitchlaag.aan{display:block; animation:glitchband 5.5s steps(1,end) infinite}
@keyframes glitchband{0%,88%{opacity:.35; transform:translateY(0)}
  90%{opacity:.9; transform:translateY(-6px)}92%{opacity:.4; transform:translateY(5px)}
  94%{opacity:.95; transform:translateY(-3px)}96%,100%{opacity:.35; transform:translateY(0)}}
#app.glitcht{animation:glitchbeef 5.5s steps(1,end) infinite}
@keyframes glitchbeef{0%,88%{transform:translate(0,0); filter:none}
  89%{transform:translate(-3px,1px); filter:hue-rotate(12deg) saturate(1.3)}
  91%{transform:translate(2px,-2px)}
  93%{transform:translate(-2px,0); filter:hue-rotate(-10deg)}
  95%{transform:translate(1px,2px)}96%,100%{transform:translate(0,0); filter:none}}
/* Wel een klap, geen stroboscoop: verschuiven en verkleuren in plaats van omkeren. */
#app.stuk{animation:appstuk .8s steps(1,end) 1}
@keyframes appstuk{0%{transform:translate(0,0); filter:none}
  10%{transform:translate(-10px,4px); filter:contrast(1.7) hue-rotate(30deg)}
  22%{transform:translate(8px,-5px); filter:none}
  34%{transform:translate(-6px,-2px); filter:contrast(1.5) hue-rotate(-25deg) saturate(1.8)}
  46%{transform:translate(5px,3px); filter:none}
  62%{transform:translate(-3px,0); filter:saturate(2)}
  100%{transform:translate(0,0); filter:none}}
/* Iets lost op in rook: het scherm wast even grijs weg. */
#grijsflits{position:fixed; inset:0; z-index:440; pointer-events:none; opacity:0;
  background:radial-gradient(120% 90% at 50% 45%, rgba(210,220,232,.85), rgba(120,132,150,.6) 55%, rgba(40,46,58,.4))}
#grijsflits.aan{animation:grijsflits 1.6s ease-out 1 both}
@keyframes grijsflits{0%{opacity:0}18%{opacity:1}60%{opacity:.7}100%{opacity:0}}
.cresprite{position:absolute; left:50%; bottom:72%; width:135%; transform:translateX(-50%);
  z-index:6; pointer-events:none; filter:drop-shadow(0 0 10px rgba(255,90,30,.6));
  animation:crebob 2.6s ease-in-out infinite}
.cresprite svg{width:100%; height:auto; display:block}
@keyframes crebob{0%,100%{transform:translate(-50%,0) scale(1)}
  50%{transform:translate(-50%,-6px) scale(1.05)}}
.spelgloed{position:absolute; inset:-4px; border-radius:12px; pointer-events:none; z-index:0;
  animation:spelgloed 2.6s ease-in-out infinite}
@keyframes spelgloed{0%,100%{opacity:.72}50%{opacity:1}}
.spelgloed[data-spel="vuur"] {box-shadow:0 0 0 2px var(--vuur),  0 0 15px 3px rgba(213,80,60,.5)}
.spelgloed[data-spel="water"]{box-shadow:0 0 0 2px var(--water), 0 0 15px 3px rgba(63,143,216,.5)}
.spelgloed[data-spel="gras"] {box-shadow:0 0 0 2px var(--gras),  0 0 15px 3px rgba(77,163,92,.5)}
.spelgloed[data-spel="steen"]{box-shadow:0 0 0 2px var(--steen), 0 0 15px 3px rgba(184,135,79,.5)}
/* 💧 in 💧 — deze spell gaat niet af */
.slot.sp.dood .card{filter:grayscale(.75) brightness(.6)}
.dkruis{position:absolute; right:0; width:calc(var(--cw)*.74); height:calc(var(--chh)*.74);
  z-index:9; display:flex; align-items:center; justify-content:center; pointer-events:none;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:2.1rem; color:#ff4b39;
  background:rgba(24,5,3,.5); border:3px solid #ff4b39; border-radius:9px;
  text-shadow:0 0 10px rgba(255,60,40,.95), 0 2px 0 #2a0a06;
  box-shadow:0 0 16px 4px rgba(255,60,40,.45);
  animation:dkruis .55s steps(2,end) infinite}
.frow.rowtop .dkruis{top:0; transform:rotate(7deg)}
.frow.rowbot .dkruis{bottom:0; transform:rotate(-7deg)}
@keyframes dkruis{0%,100%{opacity:1}50%{opacity:.5}}
/* creature statuses */
.stat{position:absolute; left:-6px; top:-6px; display:flex; flex-direction:column; gap:2px; z-index:4}
.stat span{width:18px; height:18px; border-radius:50%; background:#0c1014; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:.62rem}
.hpgem{position:absolute; right:-7px; bottom:-7px; z-index:4; min-width:22px; height:22px; padding:0 3px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #4a5560, #171d23 75%);
  border:1px solid var(--gold-soft); color:#fff; font-weight:700; font-size:.8rem;
  display:flex; align-items:center; justify-content:center; text-shadow:0 1px 2px #000}
.hpgem.buff{border-color:var(--good); color:#a8ecb5}
.hpgem.hurt{border-color:var(--danger); color:#ffb3a6}
.understack{position:absolute; z-index:0; inset:0}
.understack i{position:absolute; inset:0; border-radius:9px; display:block;
  background:linear-gradient(160deg,#2a2440,#161226); border:1px solid #3a3148;
  box-shadow:0 2px 5px rgba(0,0,0,.5)}
.understack i::after{content:"✦"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--gold); opacity:.5; font-size:.8rem}
/* ---------- ribbon ---------- */
#ribbon{display:flex; align-items:center; justify-content:center; gap:4px; padding:8px 0; margin:2px auto;
  position:relative; width:min(92%, 680px); z-index:3}
#ribbon::before,#ribbon::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold-soft))}
#ribbon::after{background:linear-gradient(90deg,var(--gold-soft),transparent)}
.ph-step{font-family:"VT323",ui-monospace,monospace; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); padding:3px 9px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
.ph-step.on{color:#f1e2ba; border-color:var(--gold-soft); background:rgba(201,168,106,.1); text-shadow:0 0 10px rgba(201,168,106,.6)}
/* ---------- banner ---------- */
#banner{position:absolute; top:calc(var(--hh)*.96 + 8px); left:50%; transform:translateX(-50%); z-index:30;
  max-width:min(90%,560px); text-align:center; pointer-events:none; transition:opacity .2s}
#banner .btxt{display:inline-block; padding:7px 18px; border-radius:22px; background:rgba(10,13,17,.92);
  border:1px solid var(--gold-soft); color:#f0e6c8; font-size:.88rem; box-shadow:0 4px 18px rgba(0,0,0,.6)}
#banner .btxt b{color:var(--gold)}
#banner.hidden{opacity:0}
/* ---------- cards ---------- */
.card{position:absolute; inset:0; border-radius:9px; overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35);
  display:flex; flex-direction:column;
}
.card .cn{font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:.56rem; letter-spacing:.08em; text-transform:uppercase;
  text-align:center; padding:3px 2px 1px; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.7); white-space:nowrap; overflow:hidden}
.card .ci{flex:1; display:flex; align-items:center; justify-content:center; font-size:calc(var(--cw)*.42);
  text-shadow:0 2px 8px rgba(0,0,0,.5); filter:drop-shadow(0 0 6px rgba(255,255,255,.15))}
.card .cm{text-align:center; font-size:.52rem; padding:1px 2px 3px; color:rgba(255,255,255,.75); letter-spacing:.05em; text-transform:uppercase}
.card.spellcard{filter:saturate(.85)}
.card.spellcard .ci{font-size:calc(var(--cw)*.34)}
.el-water{--c1:#5da5e6; --c2:#1c4f86}
.el-steen{--c1:#cfa06a; --c2:#6e4b26}
.el-vuur{--c1:#e87258; --c2:#8e2417}
.el-gras{--c1:#6cbd79; --c2:#256030}
.el-licht{--c1:#f4f1e6; --c2:#9a9384}
.draftbox{max-width:min(1020px,96vw); max-height:92vh; overflow-y:auto}
.draftbox .dsec{margin:14px 0 4px; border-top:1px solid var(--line-soft); padding-top:10px}
.draftbox .dsect{font-family:"VT323",ui-monospace,monospace; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase; color:var(--gold); margin-bottom:8px}
.aecard.chosen{border-color:var(--gold); box-shadow:0 0 0 2px rgba(201,168,106,.55), 0 0 20px rgba(201,168,106,.3)}
.aecard.licht{background:linear-gradient(170deg,#262a2f,#15181c); border-color:#cfc9b6}
.aecard.licht .aet{background:linear-gradient(160deg,#f3efe2,#b9b3a2); color:#2a2721}
.aecard.licht .aei{filter:drop-shadow(0 0 8px rgba(255,255,255,.75))}
.aecard.licht .aex{color:#cfcabb}
.aecard.licht:hover{box-shadow:0 0 26px rgba(240,236,220,.45)}
.aecard.licht.chosen{border-color:#efe9d5; box-shadow:0 0 0 2px rgba(240,236,220,.6), 0 0 22px rgba(240,236,220,.28)}
/* draftscherm: aether en lichtkaart naast elkaar, bans eronder — zo min mogelijk scrollen */
.ovbox.draftbox{max-width:min(1340px,97vw); padding:18px 22px}
.draftbox h2{font-size:1.02rem; letter-spacing:.1em; margin-bottom:4px}
.draftbox > .sub{font-size:.76rem; line-height:1.4; margin-bottom:6px}
.draftbox .obtn{margin-top:10px}
.draftbox .dgrid{display:flex; gap:16px; align-items:stretch}
.draftbox .dgrid > .dsec{min-width:0; border-top:none; padding-top:0; margin-top:8px}
.draftbox .dgrid > .dae{flex:1.15 1 0}
.draftbox .dgrid > .dlt{flex:1.15 1 0}
.draftbox .dgrid > .dban{flex:.72 1 0}
.draftbox .dgrid > .dsec + .dsec{border-left:1px solid var(--line-soft); padding-left:16px}
.draftbox .aerow{flex-wrap:nowrap; align-items:stretch; gap:8px; margin:6px 0 0}
.draftbox .aecard{width:auto; flex:1 1 0; min-width:0; max-width:230px; display:flex; flex-direction:column; padding-bottom:8px}
.draftbox .aecard .aet{font-size:.7rem; padding:7px 5px 5px; letter-spacing:.04em}
.draftbox .aecard .aex{flex:1 1 auto; font-size:.615rem; line-height:1.3; padding:3px 6px 6px;
  max-height:min(38vh,300px); overflow-y:auto}
.draftbox .aecard .aei{font-size:1.25rem; padding:5px 0 1px}
.draftbox .aecard:hover{transform:none}
.draftbox .dban .gravelist{max-height:none; display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:4px 0 0}
.draftbox .dban .gc{width:52px; flex:0 0 auto}
.draftbox .dban .banx{font-size:1.1rem}
.draftbox .dsect{margin-bottom:4px}
@media (max-width:1050px){
  .draftbox .dgrid{flex-wrap:wrap}
  .draftbox .dgrid > .dsec{flex:1 1 100%}
  .draftbox .dgrid > .dsec + .dsec{border-left:none; padding-left:0; border-top:1px solid var(--line-soft); padding-top:8px}
}
.el-wolk{--c1:#b9c3cc; --c2:#4d5a66}
.card.el-licht .cn,.card.el-licht .cm{color:#2a2721}
.card.light .cn{white-space:normal; font-size:.45rem; line-height:1.15; letter-spacing:.03em; padding:3px 3px 1px}
.card.light .ci{font-size:calc(var(--cw)*.34)}
.card.el-licht .ci{filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
.cardback{border-radius:9px; border:1px solid #3a3148;
  background:
    radial-gradient(circle at 50% 42%, rgba(201,168,106,.22), transparent 55%),
    linear-gradient(160deg,#252033,#141020);
  box-shadow:0 3px 8px rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center}
.cardback::after{content:"✦"; color:var(--gold); font-size:1.15rem; opacity:.85; text-shadow:0 0 10px rgba(201,168,106,.7)}
.hcard>.card,.hcard>.cardback{position:absolute; inset:0}
/* ---------- preview ---------- */
#preview .pvkort{font-size:1.06em; line-height:1.35; color:var(--ink)}
#preview .pvmeer{margin:6px 10px 10px; font-size:.9em; color:var(--muted)}
#preview .pvmeer summary{cursor:pointer; color:var(--dim); font-family:"VT323",ui-monospace,monospace;
  letter-spacing:.06em; list-style:none}
#preview .pvmeer summary::before{content:"▸ "}
#preview .pvmeer[open] summary::before{content:"▾ "}
#preview .pvmeer summary:hover{color:var(--gold-soft)}
#preview .pvmeer p{margin:6px 0 0}
#preview .pv{width:min(238px,100%); border-radius:14px; border:1px solid var(--gold-soft);
  background:linear-gradient(165deg,#1b222a,#10151b); box-shadow:0 8px 30px rgba(0,0,0,.6); overflow:hidden}
.pv .pvhead{display:flex; align-items:center; gap:9px; padding:10px 12px;
  background:linear-gradient(160deg,var(--c1),var(--c2)); border-bottom:1px solid rgba(0,0,0,.4)}
.pv .pvhead .ic{font-size:1.5rem; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.pv .pvhead .nm{font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:1.05rem; letter-spacing:.1em; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pv .sec{padding:8px 12px; border-bottom:1px solid var(--line-soft)}
.pv .sec:last-child{border-bottom:none}
.pv .sect{font-family:"VT323",ui-monospace,monospace; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:3px}
.pv .sec p{font-size:.78rem; line-height:1.4; color:#cfd6dc}
.pv .vs{font-size:.72rem; color:var(--muted); padding:7px 12px; display:flex; justify-content:space-between}
.pv .vs b{font-weight:700}
.pv .cur{padding:6px 12px; font-size:.78rem; color:var(--gold); border-top:1px solid var(--line-soft)}
/* circle diagram (default preview) */
#preview .circ{width:min(238px,100%); border-radius:14px; border:1px solid var(--line);
  background:linear-gradient(165deg,#171d24,#0f1419); padding:10px 6px 4px; text-align:center}
#preview .circ .t{font-family:"VT323",ui-monospace,monospace; font-size:.68rem; letter-spacing:.16em; color:var(--muted); text-transform:uppercase}
#preview .circ svg{width:100%; height:auto}
/* ---------- chain ---------- */
#chain .cht{font-family:"VT323",ui-monospace,monospace; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:2px 0 5px}
.chitem{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; margin-bottom:5px;
  background:linear-gradient(160deg,#1d242c,#151a20); border:1px solid var(--line); font-size:.76rem; line-height:1.25}
.chitem.top{border-color:var(--gold-soft); box-shadow:0 0 12px rgba(201,168,106,.2)}
.chitem .chic{width:26px; height:26px; flex:0 0 auto; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:.85rem; background:linear-gradient(160deg,var(--c1),var(--c2)); border:1px solid rgba(255,255,255,.15)}
.chitem .who{color:var(--gold); font-weight:700}
.chitem .first{margin-left:auto; font-size:.6rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; flex:0 0 auto}
/* ---------- fx ---------- */
#fx{position:fixed; inset:0; pointer-events:none; z-index:80; isolation:isolate; contain:layout paint style}
.fly{position:fixed; z-index:81; transition:transform .45s cubic-bezier(.4,.1,.3,1), opacity .45s; will-change:transform}
.pop{position:fixed; z-index:82; font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:1.25rem; text-shadow:0 2px 6px #000;
  animation:popup 1s ease-out forwards; white-space:nowrap}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6); opacity:0}18%{transform:translate(-50%,-8px) scale(1.15); opacity:1}75%{opacity:1}100%{transform:translate(-50%,-34px) scale(1); opacity:0}}
.pop.dmg{color:#ff7a63}.pop.heal{color:#7fe08f}.pop.imm{color:#bcd5ea; font-size:.95rem}.pop.kill{color:#ffb14d}
.lunge-up{animation:lup .3s ease-in-out}
.lunge-down{animation:ldn .3s ease-in-out}
@keyframes lup{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px) scale(1.07)}}
@keyframes ldn{0%,100%{transform:translateY(0)}45%{transform:translateY(26px) scale(1.07)}}
.atkline{position:fixed; z-index:79; height:3px; background:linear-gradient(90deg,rgba(213,80,60,.1),#ff8668,rgba(213,80,60,.1));
  transform-origin:0 50%; border-radius:2px; opacity:0; animation:lineflash .45s ease-out forwards; box-shadow:0 0 10px rgba(255,120,90,.8)}
@keyframes lineflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
/* gevechtsfase-melding */
#battlecry{position:fixed; inset:0; z-index:85; pointer-events:none; display:flex; align-items:center; justify-content:center;
  opacity:0; animation:bcry 1.15s cubic-bezier(.2,.7,.3,1) forwards}
#battlecry .bc{font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:2.6rem; letter-spacing:.28em; color:#ffd0c2;
  text-shadow:0 0 22px rgba(255,90,60,.9), 0 4px 18px #000; white-space:nowrap}
#battlecry::before{content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(200,45,25,.34) 0%, rgba(140,20,10,.16) 45%, rgba(0,0,0,0) 72%)}
@keyframes bcry{0%{opacity:0; transform:scale(.86)}14%{opacity:1; transform:scale(1.02)}
  62%{opacity:1; transform:scale(1)}100%{opacity:0; transform:scale(1.06)}}
/* ✦ lichtkaart */
#fx .lightburst{position:absolute; inset:-10px; border-radius:14px; pointer-events:none;
  background:radial-gradient(circle at 50% 50%, rgba(255,255,255,.95) 0%, rgba(255,250,225,.55) 34%, rgba(255,246,210,0) 72%);
  animation:lburst .62s ease-out forwards}
@keyframes lburst{0%{opacity:0; transform:scale(.4)}22%{opacity:1; transform:scale(1.04)}100%{opacity:0; transform:scale(1.35)}}
#fx .lray{position:absolute; left:50%; top:50%; width:2px; height:64px; margin:-32px 0 0 -1px; transform-origin:50% 50%;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.95),rgba(255,255,255,0));
  animation:lray .6s ease-out forwards}
@keyframes lray{0%{opacity:0; transform:rotate(var(--a)) scaleY(.2)}30%{opacity:1}100%{opacity:0; transform:rotate(var(--a)) scaleY(1.8)}}
/* beurtwissel-melding */
#turncry{position:fixed; inset:0; z-index:84; pointer-events:none; display:flex; align-items:center; justify-content:center;
  opacity:0; animation:tcry 1.35s cubic-bezier(.2,.7,.3,1) forwards}
#turncry .tc{position:relative; font-family:"VT323",ui-monospace,monospace; font-weight:700; font-size:1.9rem; letter-spacing:.3em;
  white-space:nowrap; text-align:center; padding:15px 34px; border-radius:3px; border:1px solid}
#turncry .tc .sm{display:block; font-family:"VT323",ui-monospace,monospace; font-weight:500; font-size:.72rem;
  letter-spacing:.24em; opacity:.72; margin-top:7px}
#turncry .tc::before,#turncry .tc::after{content:""; position:absolute; left:12%; right:12%; height:1px; opacity:.85}
#turncry .tc::before{top:-1px} #turncry .tc::after{bottom:-1px}
#turncry.mine .tc{color:#f0e3bc; border-color:rgba(201,168,106,.8); background:linear-gradient(180deg,rgba(62,50,24,.5),rgba(24,20,12,.5));
  text-shadow:0 0 20px rgba(212,178,110,.8), 0 3px 14px #000}
#turncry.mine .tc::before,#turncry.mine .tc::after{background:linear-gradient(90deg,transparent,#e3c684,transparent)}
#turncry.mine::before{content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(201,168,106,.20) 0%, rgba(120,92,30,.09) 46%, rgba(0,0,0,0) 72%)}
#turncry.theirs .tc{color:#c6dcee; border-color:rgba(96,146,190,.75); background:linear-gradient(180deg,rgba(20,40,60,.55),rgba(10,16,24,.5));
  text-shadow:0 0 20px rgba(104,164,214,.75), 0 3px 14px #000}
#turncry.theirs .tc::before,#turncry.theirs .tc::after{background:linear-gradient(90deg,transparent,#7fb6e2,transparent)}
#turncry.theirs::before{content:""; position:absolute; inset:0;
  background:radial-gradient(ellipse at center, rgba(72,132,192,.20) 0%, rgba(28,58,92,.09) 46%, rgba(0,0,0,0) 72%)}
@keyframes tcry{0%{opacity:0; transform:translateY(-22px) scale(.96)}
  15%{opacity:1; transform:translateY(0) scale(1)}
  72%{opacity:1; transform:translateY(0) scale(1)}
  100%{opacity:0; transform:translateY(12px) scale(1.03)}}
.pside.turnnow{animation:sideglow 1.2s ease-out}
@keyframes sideglow{0%,100%{filter:none}35%{filter:drop-shadow(0 0 12px rgba(201,168,106,.7))}}
.ph-step.on.battle{color:#ff8f7d; border-color:var(--danger)}
@keyframes phpulse{0%,100%{box-shadow:0 0 0 rgba(213,80,60,0)}50%{box-shadow:0 0 14px rgba(213,80,60,.85)}}
.ph-step.battlenow{animation:phpulse 1s ease-in-out 3}
.frow.battlenow{animation:rowglow 1.1s ease-out}
@keyframes rowglow{0%,100%{filter:none}35%{filter:drop-shadow(0 0 12px rgba(213,80,60,.75))}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
/* ---------- kaart-effecten ---------- */
#fx .fxl{position:fixed; z-index:81; pointer-events:none; will-change:transform,opacity}
/* vuur */
#fx .fball{width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #fff6d8 0%, #ffd166 22%, #ff7a2e 52%, #c2320f 78%, rgba(120,26,6,0) 100%);
  box-shadow:0 0 18px 6px rgba(255,132,50,.65), 0 0 44px 14px rgba(255,90,20,.3);
  animation:fbspin .5s linear infinite}
@keyframes fbspin{to{transform:rotate(360deg)}}
#fx .ftrail{width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
  background:radial-gradient(circle,#ffca6a 0%,#ff6a1e 55%,rgba(200,60,10,0) 100%);
  animation:ftfade .45s ease-out forwards}
@keyframes ftfade{0%{opacity:.9; transform:scale(1)}100%{opacity:0; transform:scale(.25)}}
#fx .spark{width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; animation:sparkfly var(--d,.7s) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes sparkfly{0%{opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.2)}}
#fx .shock{border-radius:50%; border:3px solid rgba(255,208,130,.95); animation:shockout .45s ease-out forwards;
  box-shadow:0 0 22px rgba(255,150,60,.75), inset 0 0 18px rgba(255,140,50,.5)}
@keyframes shockout{0%{transform:scale(.12); opacity:1}100%{transform:scale(1.65); opacity:0}}
#fx .scorch{position:absolute; inset:-6px; border-radius:12px; animation:scorchflash .5s ease-out forwards;
  background:radial-gradient(circle at 50% 50%, rgba(255,240,205,.98) 0%, rgba(255,158,60,.88) 34%, rgba(206,60,14,.5) 66%, rgba(120,20,0,0) 100%)}
@keyframes scorchflash{0%{opacity:0; transform:scale(.5)}14%{opacity:1; transform:scale(1.04)}100%{opacity:0; transform:scale(1.16)}}
/* uiteenvallen */
#fx .ash{position:absolute; width:var(--w); height:var(--h); background:var(--c); border-radius:1px;
  animation:ashrise var(--d) cubic-bezier(.25,.7,.4,1) forwards; opacity:.95}
@keyframes ashrise{0%{transform:translate(0,0) rotate(0deg); opacity:.95}
  100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)); opacity:0}}
#fx .fxghost{position:absolute; inset:0; animation:ghostout .62s ease-in forwards; transform-origin:50% 60%}
@keyframes ghostout{0%{opacity:.85; transform:scale(1)}
  45%{opacity:.45; transform:scale(1.05) translateY(-4px)}
  100%{opacity:0; transform:scale(1.14) translateY(-12px)}}
/* doorns */
#fx .thorns{position:absolute; inset:-8px; overflow:visible}
#fx .thorns path{fill:none; stroke:#4d9b45; stroke-width:3.2; stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(90,215,95,.65));
  stroke-dasharray:var(--len); stroke-dashoffset:var(--len);
  animation:vinegrow .38s ease-out forwards, vinefade .5s ease-in .62s forwards}
#fx .thorns polygon{fill:#a8e08a; opacity:0; filter:drop-shadow(0 0 3px rgba(120,230,110,.7)); animation:thpop .22s ease-out var(--td) forwards, vinefade .5s ease-in .62s forwards}
@keyframes vinegrow{to{stroke-dashoffset:0}}
@keyframes thpop{from{opacity:0; transform:scale(.2)}to{opacity:.95; transform:scale(1)}}
@keyframes vinefade{to{opacity:0}}
#fx .drainbead{width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%;
  background:radial-gradient(circle,#c8f5a8,#54a83f); box-shadow:0 0 8px rgba(120,230,110,.8);
  animation:beadmove var(--d,.55s) cubic-bezier(.4,0,.5,1) forwards}
@keyframes beadmove{0%{opacity:0; transform:translate(0,0) scale(.5)}
  15%{opacity:1; transform:translate(calc(var(--tx)*.15),calc(var(--ty)*.15 - 14px)) scale(1)}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.5)}}
/* water */
#fx .splashring{border-radius:50%; border:3px solid rgba(126,206,255,.9); animation:ringout .55s ease-out forwards;
  box-shadow:0 0 16px rgba(110,190,255,.6), inset 0 0 14px rgba(110,190,255,.4)}
@keyframes ringout{0%{transform:scale(.1); opacity:1}70%{opacity:.55}100%{transform:scale(1.6); opacity:0}}
#fx .wsheet{position:absolute; inset:0; border-radius:9px; background:linear-gradient(180deg,rgba(120,205,255,.55),rgba(40,120,200,.15));
  animation:wsheetdrop .5s ease-out forwards}
@keyframes wsheetdrop{0%{transform:translateY(-120%); opacity:0}30%{opacity:.9}100%{transform:translateY(6%); opacity:0}}
#fx .drop{width:7px; height:9px; margin:-4px 0 0 -3px; border-radius:50% 50% 45% 45%;
  background:linear-gradient(180deg,#d6f0ff,#4ea7e8); box-shadow:0 0 6px rgba(120,200,255,.8);
  animation:dropfly var(--d,.62s) cubic-bezier(.2,.5,.5,1) forwards}
@keyframes dropfly{0%{opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.55)}}
/* steen */
#fx .rock{width:var(--s); height:var(--s); margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);
  background:linear-gradient(150deg,#b6a893,#7b6f60 45%,#4d463d);
  border:1px solid rgba(255,255,255,.16); box-shadow:0 3px 8px rgba(0,0,0,.55);
  clip-path:polygon(24% 4%,72% 0,100% 34%,92% 82%,54% 100%,12% 88%,0 46%);
  animation:rockfall var(--d,.5s) cubic-bezier(.5,0,.85,1) forwards}
@keyframes rockfall{0%{opacity:0; transform:translate(var(--fx0),-92px) rotate(0deg)}
  12%{opacity:1}100%{opacity:1; transform:translate(0,0) rotate(var(--rot))}}
#fx .rockrest{animation:rocksettle .5s ease-out .5s forwards}
@keyframes rocksettle{to{opacity:0; transform:translateY(6px) scale(.9)}}
#fx .dust{border-radius:50%; background:radial-gradient(circle,rgba(206,192,170,.75),rgba(150,138,120,0) 70%);
  animation:dustout .55s ease-out forwards}
@keyframes dustout{0%{transform:scale(.2); opacity:0}25%{opacity:.85}100%{transform:scale(1.7); opacity:0}}
.thud{animation:thudsq .3s ease-out}
@keyframes thudsq{0%,100%{transform:scaleY(1)}35%{transform:scaleY(.9) translateY(4px)}}

/* ---------- live: melding + verbindingsbalk ---------- */
.livetoast{position:fixed; left:50%; top:18px; transform:translate(-50%,-18px); z-index:130;

.livetoast.show{opacity:1; transform:translate(-50%,0)}
.livetoast.bad{background:linear-gradient(160deg,#2c1e1a,#1d1411); border-color:#9f5a44; color:#f2c3b2;
  box-shadow:0 10px 34px rgba(0,0,0,.6), 0 0 22px rgba(200,90,60,.25)}
.deckrow{display:grid; grid-template-columns:112px 1fr 54px 56px 60px;

/* ==================================================================
   8-BIT ARCADE SKIN — staat achteraan, dus overschrijft het oude vel
   ================================================================== */
:root{
  --bg:#0a0e18; --board:#111a2c; --cell:#1a2740; --cell-hi:#28395a;
  --line:#3d5a8c; --line-soft:#1f2d47;
  --ink:#f6f4e4; --muted:#a8bcd8; --dim:#6f83a6;
  --gold:#ffd447; --gold-soft:#b8860f; --danger:#ff4d3d; --good:#4ee06a;
  --water:#3fa9ff; --steen:#e0a24a; --vuur:#ff5a3c; --gras:#4ee06a;
  --ink2:#0a0e18;
  font-size:16px;
}
*,*::before,*::after{border-radius:0 !important}
body{font-family:"VT323",ui-monospace,monospace; letter-spacing:.02em; image-rendering:pixelated}
button,input{font-family:"VT323",ui-monospace,monospace}
h1,h2,h3,.abtn,.obtn,.ph-step,.dsect,.cht,.aet,#turnbadge,.pvhead .nm,.card .cn,.card .cm,
#banner .btxt b,#turncry .tc,#battlecry .bc,.who,.first,.seg,.dkel{
  font-family:"Press Start 2P",ui-monospace,monospace; letter-spacing:0}
h1{font-size:1.5rem; line-height:1.5} h2{font-size:.95rem; line-height:1.7}
h3{font-size:.66rem; line-height:1.9}
.sub,#log,.aex,.pv p,.deckrow,.le{font-size:1.02rem; line-height:1.25}
/* pixelraster op de achtergrond + scanlines */
#app{background:
  repeating-linear-gradient(0deg, rgba(61,90,140,.10) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, rgba(61,90,140,.10) 0 1px, transparent 1px 8px),
  radial-gradient(900px 520px at 50% 45%, #16233a 0%, var(--bg) 70%)}
#app::after{content:""; position:fixed; inset:0; z-index:200; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply; opacity:.55}
#left{border-right:3px solid var(--line-soft)}
#right{border-left:3px solid var(--line-soft)}
#log{border-top:3px solid var(--line-soft)}
#log .le{border-left-width:3px}
/* ---------- knoppen: harde pixelrand met slagschaduw ---------- */
.abtn,.obtn,.tbtn,.tswitch,.seg{
  border:3px solid var(--ink2) !important; background:var(--gold); color:var(--ink2);
  box-shadow:0 4px 0 0 var(--gold-soft), 0 4px 0 3px var(--ink2);
  text-shadow:none; font-weight:400; transition:none; padding:9px 10px}
.abtn{font-size:.6rem; line-height:1.6}
.obtn{font-size:.62rem; line-height:1.7; padding:11px 14px}
.abtn:hover,.obtn:hover,.tbtn:hover,.seg:hover{filter:brightness(1.12); transform:translateY(-1px)}
.abtn:active,.obtn:active,.tbtn:active{transform:translateY(4px); box-shadow:0 0 0 3px var(--ink2)}
.abtn.ghost{background:#2a3a58; color:var(--ink); box-shadow:0 4px 0 0 #16223a, 0 4px 0 3px var(--ink2)}
/* De hint-regels onder de actieknoppen zijn eruit: ze duwden de knop over de balk heen. */
.tbtn{width:34px; height:34px; padding:0; font-size:1rem; background:#2a3a58; color:var(--gold);
  box-shadow:0 3px 0 0 #16223a, 0 3px 0 3px var(--ink2)}
.seg{padding:6px 9px; font-size:.5rem; background:#2a3a58; color:var(--muted); box-shadow:0 3px 0 0 #16223a, 0 3px 0 3px var(--ink2)}
.seg.on{background:var(--good); color:var(--ink2)}

/* ---------- panelen ---------- */

/* ---------- startscherm: arcade-kast ---------- */
.ovbox.startbox{max-width:min(700px,94vw); padding:0 0 24px; overflow-x:hidden}
.startbox > *:not(.marquee):not(.attract){padding-left:22px; padding-right:22px}
.startbox .marquee{position:relative; padding:20px 16px 16px;

.startbox .marquee::after{content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg, rgba(255,212,71,.07) 0 2px, transparent 2px 9px)}
.startbox .coin{font-family:"VT323",monospace; font-size:.8rem; letter-spacing:.6em; color:var(--gold);

@keyframes coinblink{50%{opacity:.15}}
.startbox .bigtitle{position:relative; z-index:1; margin:0; color:var(--gold);

@keyframes tglow{50%{filter:brightness(1.22)}}
.startbox .tagline{position:relative; z-index:1; margin-top:12px;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:.44rem; line-height:1.9;
  letter-spacing:.24em; color:var(--muted)}
.startbox .attract{display:flex; align-items:center; justify-content:center; gap:9px;
  padding:18px 12px 8px; flex-wrap:wrap}
.startbox .mini{position:relative; width:52px; height:73px; flex:0 0 auto}
.startbox .mini .card .cn{font-size:.3rem}
.startbox .mini .card .cm{display:none}
.startbox .m0{animation:bob 2.6s ease-in-out infinite}
.startbox .m1{animation:bob 2.6s ease-in-out .35s infinite}
.startbox .m2{animation:bob 2.6s ease-in-out .7s infinite}
.startbox .m3{animation:bob 2.6s ease-in-out 1.05s infinite}
@keyframes bob{50%{transform:translateY(-7px)}}
.startbox .ring{width:104px; flex:0 0 auto; opacity:.9; filter:hue-rotate(-8deg)}
.startbox .startfacts{margin:2px 0 4px; font-size:.92rem; color:var(--muted)}
.startbox .mlabel{display:flex; align-items:center; justify-content:center; gap:9px;
  font-family:"Press Start 2P",ui-monospace,monospace; font-size:.52rem; line-height:1.8;
  letter-spacing:.08em; color:var(--mc,var(--ink)); margin:20px 0 6px;
  text-shadow:2px 2px 0 var(--ink2)}
.startbox .mlabel::before{content:"\25B6"; color:var(--gold); font-size:.5rem;
  animation:pixblink .9s steps(2,end) infinite}
.startbox .mnote{font-size:.92rem; color:var(--dim); margin-bottom:10px}
.startbox .mrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap}
@media (max-width:900px), (max-height:560px), (pointer:coarse){

}
.pklok{font-family:"Press Start 2P",ui-monospace,monospace; font-size:.5rem; letter-spacing:.04em;

.pklok.loopt{color:var(--gold); border-color:var(--gold-soft); animation:klokpuls 1s steps(2,end) infinite}
.pklok.krap{color:var(--danger); border-color:var(--danger)}
@keyframes klokpuls{50%{filter:brightness(1.35)}}
#klokbtn.aan{background:var(--good) !important; color:var(--ink2) !important}
.pickbox .pickrow{display:flex; gap:12px; justify-content:center; margin:18px 0 8px; flex-wrap:wrap}
.pickbox .pickrow .obtn{flex:1 1 150px; min-height:96px; font-size:.72rem; line-height:1.7; padding:14px 12px}
.pickbox .pickrow .obtn .bsub{font-size:.72rem; margin-top:9px; line-height:1.25}
.infobox{max-width:min(520px,94vw); text-align:left}
.infobox .infohead{display:flex; align-items:center; gap:14px; margin-bottom:12px}
.infobox .infoic{font-size:2.4rem; line-height:1; flex:0 0 auto}
.infobox h2{margin:0; font-size:.82rem; line-height:1.6}
.infobox .infosub{font-family:"Press Start 2P",ui-monospace,monospace; font-size:.42rem;
  letter-spacing:.1em; color:var(--dim); margin-top:7px; line-height:1.8}
.infobox .infotxt{font-size:1.06rem; line-height:1.35; color:var(--ink);
  border-top:3px solid var(--line-soft); padding-top:12px; margin-bottom:16px}
.infobox .infotxt b{color:var(--ik)}
/* levens groter en beter leesbaar */
.plife{gap:5px}
.plife .hp{width:18px; height:18px}
.plife .lnum{font-size:1.5rem; margin-left:9px}
/* aetherkaartje groter en aantikbaar */
.aemini{font-size:.98rem; padding:5px 11px; cursor:pointer; margin-top:5px}
.aemini:hover,.aemini:active{background:rgba(122,85,184,.3); color:#e2d0ff}
.deckrow .dkkans{display:flex; flex-direction:column; align-items:flex-end; line-height:1.1}
.deckrow .dkk1{grid-area:k1} .deckrow .dkk2{grid-area:k2}
@media (max-width:900px), (pointer:coarse){
  .deckrow{grid-template-columns:1fr 54px 56px 60px;

  .deckrow .dkkans span{font-size:.55rem}
}
.deckrow .dkkans b{color:var(--gold); font-size:.86rem; font-variant-numeric:tabular-nums}
.deckrow .dkkans span{font-size:.62rem; color:var(--dim); letter-spacing:.04em}
.startbox .cyclestrip{display:flex; align-items:center; justify-content:center; gap:7px;
  flex-wrap:wrap; margin:4px 0 12px; font-size:1.15rem}
.startbox .cyclestrip .cy{display:inline-flex; align-items:center; justify-content:center;
  width:30px; height:30px; background:#16223a; border:3px solid var(--ink2);

.startbox .cyclestrip .ar{color:var(--gold); font-size:.6rem; opacity:.8}
.startbox .cyclestrip .cylab{font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:.4rem; letter-spacing:.16em; color:var(--dim); margin-left:8px}
/* knopkleuren per sectie */
.ovbox .obtn.b-cmd{background:#6b45a0; color:#f2e6ff; text-shadow:2px 2px 0 rgba(0,0,0,.55);
  box-shadow:0 4px 0 0 #35204f, 0 4px 0 3px var(--ink2)}
.ovbox .obtn.b-basis{background:#2b6f9e; color:#e2f3ff; text-shadow:2px 2px 0 rgba(0,0,0,.55);
  box-shadow:0 4px 0 0 #163d59, 0 4px 0 3px var(--ink2)}
.ovbox .obtn.b-live{background:#2f8a48; color:#e2ffe9; text-shadow:2px 2px 0 rgba(0,0,0,.55);
  box-shadow:0 4px 0 0 #17492a, 0 4px 0 3px var(--ink2)}
.ovbox .obtn .bsub{display:block; font-family:"VT323",ui-monospace,monospace; font-size:.58rem;
  line-height:1.25; letter-spacing:.06em; opacity:.72; margin-top:8px; font-weight:400; text-shadow:none}
.ovbox .obtn.b-dim{background:#2a3a58 !important; color:var(--muted) !important;
  box-shadow:0 4px 0 0 #16223a, 0 4px 0 3px var(--ink2) !important}
/* ---------- speelveld ---------- */
.slot{border:2px solid var(--line-soft); background:rgba(26,39,64,.5)}
.slot .ph{border:2px dashed var(--line-soft); opacity:.5}
.slot.hl{box-shadow:0 0 0 3px var(--gold); animation:pixblink .5s steps(2,end) infinite}
.slot.tgt{box-shadow:0 0 0 3px var(--danger); animation:pixblink .4s steps(2,end) infinite}
.slot.atk{box-shadow:0 0 0 3px var(--good)}
@keyframes pixblink{50%{filter:brightness(1.6)}}
/* ---------- kaarten ---------- */
.card{border:3px solid var(--ink2); background:var(--c2); overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18), 3px 3px 0 0 rgba(0,0,0,.5)}
.card .ci{position:absolute; inset:0; padding:0; display:block; filter:none; text-shadow:none}
.card .ci .pix{display:block; width:100%; height:100%; image-rendering:pixelated}
.card .cn{position:absolute; left:0; right:0; top:0; z-index:2;
  font-size:.4rem; line-height:1.5; padding:3px 2px; color:#fff;
  background:#0a0e18; border-bottom:2px solid #000;
  text-shadow:1px 1px 0 #000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.card .cm{position:absolute; left:0; right:0; bottom:0; z-index:2;
  font-size:.3rem; line-height:1.6; padding:3px 2px; color:var(--gold);
  background:#0a0e18; border-top:2px solid #000; text-shadow:1px 1px 0 #000;
  white-space:nowrap; overflow:hidden; text-overflow:clip}
.card.light .cn,.card.light .cm{color:#fff}
.card.light .cn{font-size:.32rem; white-space:normal; line-height:1.4}
.card.spellcard{filter:none}
.card.spellcard .ci .pix{opacity:.62}
.card.spellcard::after{content:""; position:absolute; inset:0; z-index:1;
  background:repeating-linear-gradient(45deg, rgba(255,212,71,.16) 0 4px, transparent 4px 10px)}
.cardback{border:3px solid var(--ink2) !important; overflow:hidden;
  background:
    repeating-linear-gradient(45deg, #2b3f74 0 5px, #22315c 5px 10px) !important;
  box-shadow:inset 0 0 0 2px #4a6bb0, 3px 3px 0 0 rgba(0,0,0,.5) !important}
.cardback::after{content:""; position:absolute; left:50%; top:50%; width:34%; height:24%;
  transform:translate(-50%,-50%) rotate(45deg); background:var(--gold);
  box-shadow:0 0 0 3px var(--ink2), inset 0 0 0 3px #8a6410; text-shadow:none; font-size:0}
/* Dezelfde achterkant, maar dan verbrand: wat er onder de as vandaan komt hoort niet in het deck. */
.cardback.verdorven{position:absolute; inset:0; border-color:#0a0405 !important;
  background:repeating-linear-gradient(45deg, #3a0d08 0 5px, #170503 5px 10px) !important;
  box-shadow:inset 0 0 0 2px #8f2d20, 3px 3px 0 0 rgba(0,0,0,.6), 0 0 16px rgba(255,106,42,.35) !important}
.cardback.verdorven::after{background:#ff6a2a;
  box-shadow:0 0 0 3px #0a0405, inset 0 0 0 3px #5a1a12, 0 0 14px rgba(255,106,42,.85);
  transform:translate(-50%,-50%) rotate(45deg) skewX(8deg)}
.cardback.verdorven::before{content:""; position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(112deg, transparent 42%, rgba(255,106,42,.75) 43%, transparent 44%),
             linear-gradient(64deg, transparent 62%, rgba(255,106,42,.5) 63%, transparent 64%),
             radial-gradient(circle at 50% 115%, rgba(255,106,42,.35), transparent 60%)}
/* Dezelfde achterkant, maar dan jaren onder water: donkerblauw, aangevreten, met licht dat
   er van heel diep doorheen komt. */
.cardback.verzopen{position:absolute; inset:0; border-color:#04121f !important;
  background:repeating-linear-gradient(45deg, #0b2f4d 0 5px, #06182a 5px 10px) !important;
  box-shadow:inset 0 0 0 2px #1f78c4, 3px 3px 0 0 rgba(0,0,0,.6), 0 0 18px rgba(31,120,196,.4) !important}
.cardback.verzopen::after{background:#4fb0ec;
  box-shadow:0 0 0 3px #04121f, inset 0 0 0 3px #0b4a86, 0 0 16px rgba(79,176,236,.9);
  transform:translate(-50%,-50%) rotate(45deg) skewY(9deg)}
.cardback.verzopen::before{content:""; position:absolute; inset:0; pointer-events:none;
  animation:verzopen 5.5s ease-in-out infinite;
  background:linear-gradient(96deg, transparent 30%, rgba(169,226,255,.5) 31%, transparent 32%),
             linear-gradient(78deg, transparent 66%, rgba(169,226,255,.32) 67%, transparent 68%),
             radial-gradient(circle at 50% -14%, rgba(169,226,255,.42), transparent 62%)}
@keyframes verzopen{0%,100%{opacity:.72; transform:translateY(0)}50%{opacity:1; transform:translateY(1px)}}
/* 👑 Een troon: goud op nachtblauw, met een ring die heel langzaam draait. */
.cardback.troon{position:absolute; inset:0; border-color:#0d0a18 !important;
  background:repeating-linear-gradient(45deg, #241d3c 0 5px, #16112a 5px 10px) !important;
  box-shadow:inset 0 0 0 2px #8a76c4, 3px 3px 0 0 rgba(0,0,0,.6), 0 0 20px rgba(201,168,106,.35) !important}
.cardback.troon::after{background:var(--gold);
  box-shadow:0 0 0 3px #0d0a18, inset 0 0 0 3px #6a5a9a, 0 0 16px rgba(201,168,106,.9);
  transform:translate(-50%,-50%) rotate(45deg)}
.cardback.troon::before{content:""; position:absolute; inset:14% 12%; pointer-events:none;
  border:2px solid rgba(217,198,245,.55); border-radius:50%;
  box-shadow:inset 0 0 10px rgba(255,253,242,.35), 0 0 12px rgba(217,198,245,.35);
  animation:troonring 9s linear infinite}
@keyframes troonring{to{transform:rotate(360deg)}}
.el-water{--c1:#4fb0ec; --c2:#06294f}
.el-steen{--c1:#cfa06a; --c2:#241a10}

/* ---------- deck-overzicht ---------- */

  :root{
    --cw:min(17.2vw,10.5dvh); --chh:calc(var(--cw)*1.4);

  border:3px solid var(--ink2); box-shadow:0 0 0 3px var(--line-soft); text-align:center}
/* het praatje */
.praatscherm{width:min(760px,96vw); display:flex; flex-direction:column; align-items:center; gap:0}
.praatscherm .praatsprite{transition:filter 1s ease, width .6s ease}
.praatscherm.groot .praatsprite{animation:none}
/* Een reus staat niet in de rij maar vult het scherm: hij hangt vast aan de bovenrand,
   zijn onderkant loopt gewoon door onder de schermrand door, en de tekstballon zakt naar
   beneden en komt vóór hem te liggen. Zo kan hij groeien zonder dat zijn hoofd eraf gaat. */
/* Let op: géén transform op dit blok. Een transform maakt van een element het
   ankerpunt voor position:fixed erbinnen, en dan hangt de reus niet meer aan het
   scherm maar aan de tekstballon. Centreren gaat daarom met marges. */
.praatscherm.reus{position:fixed; left:0; right:0; bottom:16px; top:auto;
  margin:0 auto; width:min(760px,96vw)}
.praatscherm.reus .sprwrap{--sprgroei:1}
.praatscherm.reus .praatsprite{position:fixed; left:50%; top:0; bottom:auto;
  transform:translateX(-50%); margin:0; width:auto !important;
  display:flex; justify-content:center; z-index:0;
  filter:drop-shadow(10px 10px 0 rgba(0,0,0,.7))}
.praatscherm.reus .praatsprite .sprwrap{width:auto}
/* object-fit houdt de verhouding heel als hij op een smal scherm tegen de zijkanten
   aanloopt; zonder dat wordt hij platgedrukt in plaats van kleiner. */
.praatscherm.reus .praatsprite .sprbeeld{height:111vh; width:auto; max-width:100vw;
  object-fit:contain; object-position:center top}
.praatscherm.reus .praatbox,
.praatscherm.reus .praathint,
.praatscherm.reus .praatkeus{position:relative; z-index:2}
/* de hint staat nu op de reus in plaats van op de achtergrond — die moet leesbaar blijven */
.praatscherm.reus .praathint{text-shadow:0 2px 0 #000, 0 0 7px #000, 0 0 3px #000}
@media (max-width:900px), (pointer:coarse){
  .praatscherm.reus{bottom:10px}
  .praatscherm.reus .praatsprite .sprbeeld{height:78vh} }
/* De sprite zakt met zijn voeten achter de bovenrand van de tekstballon. Het deinen gaat
   alleen naar benéden, zodat hij nooit los van die rand komt te zweven. */
.praatsprite{width:min(190px,38vw); image-rendering:pixelated; filter:drop-shadow(6px 6px 0 rgba(0,0,0,.6));
  animation:sprbob 2.4s steps(2,end) infinite; margin-bottom:-16px; position:relative; z-index:0}
.praatsprite svg{width:100%; height:auto; display:block}
/* Een eigen tekening vervangt de pixelversie volledig: die wordt niet meer getekend.
   Ontbreekt het bestand, dan haalt de img zichzelf weg en blijft de plek leeg.
   --sprgroei bepaalt hoe groot de tekening staat ten opzichte van de oude sprite. */
.sprwrap{position:relative; display:block; width:100%; --sprgroei:1.75}
.sprwrap .sprbeeld{display:block; width:100%; height:auto; image-rendering:pixelated;
  transform:scale(calc(var(--sprgroei) * var(--sprmaat, 1))); transform-origin:center bottom;
  opacity:0}
.sprwrap .sprbeeld.klaar{opacity:1}
.praatsprite .sprwrap{width:100%}
/* In de kleine praatbalk links blijft hij op ware grootte, anders past hij niet. */
.pbspr .sprwrap{--sprgroei:1}
/* In de praatbalk staat iedereen even groot: de maatcorrectie per personage geldt hier niet,
   anders is de een ineens kleiner dan de ander in hetzelfde balkje. */
#praatbel .pbspr .sprbeeld{transform:scale(1) !important; transform-origin:center bottom}
@keyframes sprbob{50%{transform:translateY(4px)}}
/* Een silhouet dat door het donker schuift: traag, en het deint mee bij elke stap. */
.praatsprite.loopt{animation:sprloop 9s ease-in-out infinite}
/* Een rondje dat begint en eindigt op precies dezelfde plek: hij deint heen en weer en
   komt altijd weer uit waar hij begon. Een lus die ergens anders eindigt dan hij begint
   springt bij elke herhaling terug, en dat las als wegdrijven. */
@keyframes sprloop{
  0%{transform:translateX(-6%) translateY(0)}
  12.5%{transform:translateX(-3%) translateY(4px)}
  25%{transform:translateX(0) translateY(0)}
  37.5%{transform:translateX(3%) translateY(4px)}
  50%{transform:translateX(6%) translateY(0)}
  62.5%{transform:translateX(3%) translateY(4px)}
  75%{transform:translateX(0) translateY(0)}
  87.5%{transform:translateX(-3%) translateY(4px)}
  100%{transform:translateX(-6%) translateY(0)}}
@media (prefers-reduced-motion:reduce){ .praatsprite.loopt{animation:none} }

/* De tekstballon waarin je tegenstander tijdens het potje praat — nooit klikbaar, nooit weg te klikken */
/* Hij staat met zijn voeten op de onderlijn; de tekstballon schuift daardoor omhoog
   en komt naast zijn hoofd te hangen in plaats van naast zijn voeten. */
/* De ballon staat bóven hem in plaats van ernaast. Zo past het hele blokje in de linkerkolom
   en kan hij helemaal onderaan staan zonder over je levensbalk of het speelveld te vallen. */
#praatbel{position:fixed; left:14px; bottom:0; z-index:60; display:none;
  flex-direction:column-reverse; align-items:flex-start; gap:7px;
  pointer-events:none; max-width:min(300px,28vw)}
#praatbel.show{display:flex}
/* Hij staat plat op de onderrand van het scherm en zweeft niet: geen deining, geen marge.
   Daardoor hoeft de rest van de bel geen ruimte vrij te houden voor dat op-en-neer. */
#praatbel .pbspr{width:280px; flex:0 0 280px; image-rendering:pixelated;
  align-self:flex-start; margin-bottom:0; animation:none;
  filter:drop-shadow(4px 4px 0 rgba(0,0,0,.6))}
#praatbel .pbspr svg{width:100%; height:auto; display:block}
#praatbel .pbbel{position:relative; background:#0d1119; border:3px solid var(--pbk,var(--danger));
  border-radius:4px; padding:11px 14px; color:var(--ink); font-family:"VT323",ui-monospace,monospace;
  font-size:1.32rem; line-height:1.18; box-shadow:0 4px 0 rgba(0,0,0,.5)}
#praatbel .pbbel{width:100%}
/* het pijltje wijst nu omlaag, naar zijn hoofd */
#praatbel .pbbel::after{content:""; position:absolute; left:118px; bottom:-13px; width:0; height:0;
  border:7px solid transparent; border-top-color:var(--pbk,var(--danger))}
#praatbel .pbnaam{display:block; font-family:"Press Start 2P",ui-monospace,monospace;
  font-size:.46rem; letter-spacing:.1em; color:var(--pbk,var(--danger)); margin-bottom:7px}
#praatbel.puls{animation:pbpuls .5s steps(3,end) 1}
@keyframes pbpuls{0%{transform:translateX(0)}33%{transform:translateX(-3px)}66%{transform:translateX(3px)}}
@media (max-width:900px), (max-height:560px), (pointer:coarse){
  /* Op de telefoon staat hij bovenin, nét onder de regel met levens van je tegenstander —
     hij hangt dus over diens dichte kaarten, niet over informatie die je nodig hebt. */
  /* op de telefoon staat hij bovenin en is er breedte zat: daar weer naast elkaar */
  #praatbel{flex-direction:row; align-items:flex-start; max-width:none}
  #praatbel .pbspr{width:150px; flex:0 0 150px; align-self:flex-end}
  #praatbel .pbbel::after{left:-11px; top:15px; bottom:auto;
    border-top-color:transparent; border-right-color:var(--pbk,var(--danger))}
  #praatbel{left:6px; right:64px; bottom:auto; top:calc(env(safe-area-inset-top,0px) + 30px);
    max-width:none; gap:7px}   /* rechts blijft de ☰-knop vrij */
  #praatbel .pbspr{width:80px; flex:0 0 80px}
  #praatbel .pbbel{font-size:1.15rem; padding:8px 10px}
}
/* 🌧 Regen over het hele scherm — schuine strepen die naar beneden lopen. */

#valzwart.aan{animation:valzwart 1.5s ease-out 1 both}
@keyframes valzwart{0%{opacity:0}7%{opacity:1}62%{opacity:1}100%{opacity:0}}
#app.beeft{animation:beeft .55s cubic-bezier(.36,.07,.19,.97) 1}
@keyframes beeft{0%,100%{transform:translate(0,0)}
  12%{transform:translate(-6px,4px)}28%{transform:translate(5px,-3px)}
  46%{transform:translate(-4px,-4px)}64%{transform:translate(3px,3px)}82%{transform:translate(-2px,1px)}}
/* Een korte paarse flits over het hele scherm: er wordt een 🟣 aetherkracht aangezet. */
#paarsflits{position:fixed; inset:0; z-index:400; pointer-events:none; opacity:0;
  background:radial-gradient(125% 95% at 50% 45%, rgba(198,132,255,.72), rgba(96,32,170,.5) 52%, rgba(30,8,60,.25) 80%)}
#paarsflits.aan{animation:paarsflits 1.15s ease-out 1 both}
@keyframes paarsflits{0%{opacity:0}16%{opacity:1}55%{opacity:.75}100%{opacity:0}}
/* de sfeer van de wereld ook achter de schermen */
#overlay{transition:background-color 1.1s ease}
#app.w0 #overlay{background:rgba(5,6,10,.94)}
#app.w0{background:
  repeating-linear-gradient(0deg, rgba(140,160,190,.035) 0 1px, transparent 1px 9px),
  radial-gradient(900px 540px at 50% 40%, #171a22 0%, #0a0b10 58%, #040508 100%)}
#app.w1 #overlay{background:rgba(46,33,20,.9)}
#app.w2 #overlay{background:rgba(18,44,27,.9)}
#app.w3 #overlay{background:rgba(52,20,11,.9)}
#app.w4 #overlay{background:rgba(11,38,62,.9)}
#app.w5 #overlay{background:rgba(52,58,76,.9)}
/* werelden: sfeer op de achtergrond */
/* Wereld 1 heeft één basiskleur, en elk level mag daar zijn eigen draai aan geven. */
#app.w1{--raster:rgba(207,160,106,.07); --vlak:#3a2b1c; --diep:#1a120a;
  background:
  repeating-linear-gradient(0deg, var(--raster) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, var(--raster) 0 1px, transparent 1px 8px),
  radial-gradient(1100px 620px at 50% 45%, var(--vlak) 0%, var(--diep) 72%)}
#app.w1.lv1-1{--vlak:#3f2f1e; --diep:#1b130a}                                    /* stoffig bruin */
#app.w1.lv1-2{--raster:rgba(198,200,206,.055); --vlak:#34353a; --diep:#15171c}    /* grijs, kale trainingsgrond */
#app.w1.lv1-3{--raster:rgba(232,214,176,.075); --vlak:#544936; --diep:#282216}  /* beige, hoger en opener */
#app.w1.lv1-4{--raster:rgba(150,150,170,.05); --vlak:#26232c; --diep:#0f0e14}     /* donker, terug het hol in */
#app.w1.lv1-5{--raster:rgba(255,140,80,.055); --vlak:#3b2a22; --diep:#160d09}     /* de zaal van Magnus */
#app.w2{background:
  repeating-linear-gradient(0deg, rgba(127,209,140,.07) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, rgba(127,209,140,.07) 0 1px, transparent 1px 8px),
  radial-gradient(1100px 620px at 50% 45%, #173a24 0%, #08160e 72%)}
#app.w3{background:
  repeating-linear-gradient(0deg, rgba(255,176,58,.07) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, rgba(255,176,58,.07) 0 1px, transparent 1px 8px),
  radial-gradient(1100px 620px at 50% 40%, #47180d 0%, #170805 72%)}
#app.w4{background:
  repeating-linear-gradient(0deg, rgba(169,226,255,.07) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, rgba(169,226,255,.07) 0 1px, transparent 1px 8px),
  radial-gradient(1100px 620px at 50% 45%, #0d3358 0%, #05131f 72%)}
@keyframes regen{to{transform:translate3d(-22px, 90px, 0)}}
#app.w5{background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 8px),
  repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 8px),
  radial-gradient(1100px 620px at 50% 42%, #4a5570 0%, #1b1f2e 72%)}
@media (max-width:900px), (pointer:coarse){
  .praatsprite{width:min(140px,34vw)}
  .praattxt{font-size:1.1rem}
  .praatbox{min-height:118px; padding:12px 13px 18px}
  .storybox .lvchip{flex:1 1 44%; min-height:66px}
}


/* Gekanteld is er nauwelijks hoogte: de praatbel gaat in de lege strook links naast het bord. */
@media (orientation:landscape) and (max-height:620px){
  #praatbel{left:4px; right:auto; top:auto; bottom:0; max-width:min(300px,38vw); gap:6px}
  #praatbel .pbspr{width:70px; flex:0 0 70px}
  #praatbel .pbbel{font-size:1.02rem; padding:6px 9px; line-height:1.12}
  #praatbel .pbnaam{font-size:.38rem; margin-bottom:4px}
}

function rnd(){ RNG |= 0; RNG = RNG + 0x6D2B79F5 | 0;

const $ = s => document.querySelector(s);

/* Typeloze aethers (el === null) tonen alle vier de symbolen en kleuren geen kaarten paars. */
const aeIcon = k => AETHERS[k].ic ? AETHERS[k].ic

const hasAe = (p, k) => aeList(p).includes(k);
const aeFuseKey = (p, el) => aeList(p).find(k => AETHERS[k].fuse && AETHERS[k].el === el) || null;
const aeFuse = (p, el) => { const k = aeFuseKey(p, el); return k ? Object.assign({key:k}, AETHERS[k].fuse) : null; };
const aeFuseAny = p => aeList(p).some(k => AETHERS[k].fuse);
function fuseTributes(p, el){          // elke eigen creature mag als offer dienen

function fuseOk(p, el, speed){

}
const aeBoosts = (p, el) => aeList(p).some(k => AETHERS[k].el && AETHERS[k].el === el);   // typeloze aethers kleuren niets
const atkOf = (cr, p) => {            // aanvalskracht: helft van de levens, minimaal 1
  if(!cr) return 1;
  const hb = (typeof hitteBonus === "function" ? hitteBonus(p) : 0)
           + (typeof getijBonus === "function" ? getijBonus(cr, p) : 0);
  const bodem = cr.minAtk || EL[cr.card.el].minAtk || 1;          // sommigen slaan nooit zachter dan dit
  if(EL[cr.card.el].vastAtk) return EL[cr.card.el].vastAtk + hb;   // sommige beesten slaan altijd even hard
  if(cr.card.el === "steen" && hasAe(p, "ae_stonefull")) return Math.max(bodem, cr.hp) + hb;
  return Math.max(bodem, Math.floor(cr.hp / 2)) + hb;
};

function buildDeck(p){
  const banned = (S && S.match ? S.match.bannedEl[p] : []) || [];
  const cnt = {}; ORDER.forEach(el => cnt[el] = 7);   // overal hetzelfde deck: 4 × 7 = 28 kaarten
  banned.forEach(el => { if(cnt[el] > 0) cnt[el]--; });
  const base = ORDER.flatMap(el => Array.from({length:cnt[el]}, () => ({id:++cid, el, owner:p})));
  const lts = (S && S.lt ? S.lt[p] : []) || [];        // ✦ lichtkaarten uit eerdere potjes
  const licht = lts.flatMap(k => Array.from({length:LIGHTS[k].n}, () => ({id:++cid, el:"licht", lk:k, owner:p})));
  return shuffle(base.concat(licht));
}
function addLights(p, key){
  const n = LIGHTS[key].n;
  for(let i=0;i<n;i++) P(p).deck.push({id:++cid, el:"licht", lk:key, owner:p});
  shuffle(P(p).deck);

}

/* ---- Commander (best of 3) ---- */
/* Één draftscherm per speler: 🟣 aether, ✦ lichtkaart en de bans tegelijk.
   De startende speler kiest eerst; de ander kiest daarna uit wat overblijft, en wat
   dan nog over is gaat voorgoed uit de pool. */
async function commanderSetup(){
  const m = S.match, starter = m.firstPicker;
  addLog(`— 🟣 Potje ${m.game} · stand ${m.wins[0]}–${m.wins[1]} — ${pName(starter)} kiest eerst en begint.`, true);
  if(!m.gone) m.gone = [];
  if(!m.goneL) m.goneL = [];
  if(!S.lt) S.lt = [[],[]];
  const takenA = [].concat(S.ae[0], S.ae[1], m.gone);
  const offerA = shuffle(Object.keys(AETHERS).filter(k => !takenA.includes(k) && !AETHERS[k].verhaal)).slice(0,3);
  const metLicht = m.lights !== false;
  const takenL = [].concat(S.lt[0], S.lt[1], m.goneL);
  const offerL = metLicht ? shuffle(Object.keys(LIGHTS).filter(k => !takenL.includes(k))).slice(0,3) : [];
  const nBan = m.game === 1 ? 10 : 5;
  const gekozen = [];
  for(const p of [starter, opp(starter)]){
    const six = [], apart = [];                 // ✦ lichtkaarten kun je niet bannen
    while(six.length < nBan && P(p).deck.length){
      const c = P(p).deck.pop();
      if(c.el === "licht") apart.push(c); else six.push(c);
    }
    P(p).deck.push(...apart);
    if(!isBot(p)) await ensureHolder(p);
    const res = await waitUI("draft", {p, aethers:offerA.slice(), lights:offerL.slice(),
      cards:six, selA:0, selL:0, sel:[], first:p === starter});
    const r = res && typeof res === "object" ? res : {a:0, l:0, ban:[]};
    let ka = offerA[Math.min(r.a || 0, offerA.length-1)];
    let kl = metLicht ? offerL[Math.min(r.l || 0, offerL.length-1)] : null;
    if(DRAFTFORCE){                                    // testmodus: vaste keuzes
      if(DRAFTFORCE.ae && DRAFTFORCE.ae[p]){
        ka = DRAFTFORCE.ae[p];
        const tt = aeList(p).concat([ka]).map(k => AETHERS[k].el).filter(Boolean);
        r.ban = six.filter(c => !tt.includes(c.el)).map(c => c.id);   // bans passend bij de opgelegde aether
      }
      if(DRAFTFORCE.lt && DRAFTFORCE.lt[p]) kl = metLicht ? DRAFTFORCE.lt[p] : null;
    }
    S.ae[p].push(ka); if(offerA.indexOf(ka) >= 0) offerA.splice(offerA.indexOf(ka), 1);
    if(kl){ S.lt[p].push(kl); if(offerL.indexOf(kl) >= 0) offerL.splice(offerL.indexOf(kl), 1); }
    addLog(`${pName(p)} kiest 🟣 <em>${AETHERS[ka].name}</em>${kl ? ` en ✦ <em>${LIGHTS[kl].name}</em>` : ""}.`, true);
    const banIds = r.ban || [];
    const bans = six.filter(c => banIds.includes(c.id));
    const keep = six.filter(c => !banIds.includes(c.id));
    bans.forEach(c => m.bannedEl[p].push(c.el));
    P(p).deck.push(...keep);
    addLog(`${pName(p)} bant ${bans.length} kaart${bans.length===1?"":"en"}${bans.length?" ("+bans.map(c=>icon(c.el)).join(" ")+")":""} voor de rest van de match.`, true);
    if(kl) addLights(p, kl);
    gekozen.push({p, ka, kl});
  }
  if(offerA[0]) m.gone.push(offerA[0]);
  if(metLicht && offerL[0]) m.goneL.push(offerL[0]);
  addLog(`Weggelegd en voorgoed uit de pool: ${offerA[0] ? "🟣 " + AETHERS[offerA[0]].name : "—"}${metLicht && offerL[0] ? " en ✦ " + LIGHTS[offerL[0]].name : ""}.`, true);
  shuffle(P(0).deck); shuffle(P(1).deck);   // eerst bannen en kiezen, dán pas schudden en delen
  dealHands(starter);
  await ensureHolder(starter);
  await startTurnSequence();
}
function nextGame(){
  if(!S.over || S.mode !== "commander" || !S.match) return;
  MUT++;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- lookups ---- */
function eachCre(fn){ for(let p=0;p<2;p++) for(let c=0;c<5;c++){ const cr=P(p).cols[c].cre; if(cr) fn(cr,p,c); } }
function allCreIds(pred){ const out=[]; eachCre((cr,p,c)=>{ if(!pred || pred(cr,p,c)) out.push(cr.card.id); }); return out; }
function findCre(id){ let hit=null; eachCre((cr,p,c)=>{ if(cr.card.id===id) hit={cr,p,c}; }); return hit; }
/* Plekken waar een creature mag verschijnen: leeg, of bezet door een oplosbare wolk. */
function openCols(p, excl){
  const out = [];
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if((!cr || EL[cr.card.el].overheen) && c !== excl) out.push(c);
  }
  return out;
}
function emptyCols(p, excl){ const out=[]; for(let c=0;c<5;c++) if(!P(p).cols[c].cre && c!==excl) out.push(c); return out; }
function freeSpellCols(p){ return [0,1,2,3,4]; } // spells mogen een bezette spell-plek overschrijven (oude wordt gediscard)
function handHasFlash(p){ return P(p).hand.some(cd => EL[cd.el].flash); }
function flashFuseOk(p){
  if(!aeFuseAny(p)) return false;
  return P(p).hand.some(cd => fuseOk(p, cd.el, "flash"));
}
function handHasLight(p){ return P(p).hand.some(cd => cd.el === "licht" && lightPlayable(p, cd)); }
function hasLegalFlash(p){ return (handHasFlash(p) && openCols(p).length > 0) || flashFuseOk(p) || handHasLight(p); }
function canPlayCreature(p){ return openCols(p).length > 0; }
function creSlotsFor(p, el){
  return openCols(p).map(c => ({p, c, kind:"cre"}));
}
function canAttack(cr, p){
  if(EL[cr.card.el].stil) return false;              // meubilair valt niet aan
  // ✦ Ontzag legt een heel bord een beurt lang stil
  if(S.ontzag && S.ontzag[p] === S.gTurn) return false;
  // Summoning sickness bestaat alleen in de allereerste beurt van de startende speler
  if(!(p === S.tp && S.phase === "battle" && (S.gTurn > 1 || cr.played < S.gTurn) && cr.attackedT !== S.gTurn
       && (cr.ent === 0 || !!EL[cr.card.el].entVrij))) return false;
  const st = S && S.story;
  if(st){
    if(st.stilstand) return false;                       // 🌊 doodtij: er beweegt niets
    if(st.sluis != null){
      const c = P(p).cols.findIndex(x => x.cre === cr);  // 🚪 door een dichte sluis gaat niets
      if(c >= 0 && c === st.sluis) return false;
    }
  }
  return true;
}
/* 🚪 De Sluiswachter (4-1): elke beurt valt er in één kolom een poort. Daar kan niemand
   doorheen — jij niet en hij niet — en de poort schuift elke beurt een kolom op. */
function sluisBij(){
  const st = S && S.story;
  if(!st || !st.sluisAan || S.over) return;
  st.sluis = st.sluis == null ? (st.sluisStart != null ? st.sluisStart : 2) : (st.sluis + 1) % 5;
  addLog(`🚪 <em>De sluis in kolom ${st.sluis + 1} klapt dicht.</em> Daar gaat deze beurt niets door, aan geen van beide kanten.`, true);
  if(!FAST) AU.play("rock");

}
/* 💀 Aan het eind van zijn beurt roept de kapitein zijn doden terug. Ze komen niet als
   zichzelf terug maar als 💀 skelet: één leven, en ze slaan minstens zo hard als hij.
   Heb je hém omgelegd, dan gebruikt hij die beurt om zichzelf uit het zand te trekken. */
async function verzopenTerug(){
  const st = S && S.story;
  if(!st || !st.verzopen || S.over || S.tp !== 1) return;
  if(st.kapWeg){
    const vrij = emptyCols(1);
    if(!vrij.length){ addLog(`💀 De kapitein wil overeind komen, maar er is geen plek op het dek.`, true); return; }
    const c = vrij[Math.floor(rnd() * vrij.length)];
    const kaart = st.kapKaart || {id:++cid, el:"kapitein", owner:1};
    st.kapWeg = false; st.kapKaart = null;
    placeCre(1, c, kaart);
    const cr = P(1).cols[c].cre;
    if(cr){ cr.hp = EL.kapitein.hp; cr.played = 0; }
    if(!FAST){ fxSplash(creSel(1, c)); AU.play("water"); }
    addLog(`💀 <em>De kapitein trekt zichzelf uit het zand.</em> Hij zet zijn hoed weer op — en de bemanning blijft deze beurt liggen, want hij had het even druk.`, true);
    render();
    if(!FAST) await sleep(420);
    return;
  }
  const n0 = st.verzopenN || 0;
  if(!n0) return;
  const kap = P(1).cols.some(c => c.cre && c.cre.card.el === "kapitein");
  if(!kap) return;
  let n = 0;
  const max = st.verzopenMax || 2;
  while(st.verzopenN > 0 && n < max && emptyCols(1).length && !S.over){
    const vrij = emptyCols(1);
    const c = vrij[Math.floor(rnd() * vrij.length)];
    placeCre(1, c, {id:++cid, el:"skelet", owner:1, token:true});
    const cr = P(1).cols[c].cre;
    if(cr){ cr.hp = 1; cr.played = 0; cr.minAtk = 3; }
    st.verzopenN--;
    if(!FAST){ fxSplash(creSel(1, c)); AU.play("water"); }
    n++;
    render();
    if(!FAST) await sleep(300);
  }
  if(n) addLog(`💀 <em>Het wrak geeft ${n} man terug</em> — als skelet: <b>1 leven</b> en <b>minstens 3 schade</b>. De kapitein roept en ze komen${st.verzopenN ? `; er wachten er nog ${st.verzopenN}` : ""}.`, true);
}
/* 🌊 Op deze diepte houdt niets kleins het. Aan het eind van elke ronde wordt alles met
   2 of minder levens verpletterd, aan allebei de kanten. */
async function drukPlet(){
  const st = S && S.story;
  if(!st || !st.drukAan || S.over) return;
  const doelen = [];
  eachCre((cr, pp, cc) => { if(cr.hp <= 2) doelen.push([pp, cc]); });
  addLog(`🌊 <em>De druk zakt.</em> Alles met 2 of minder levens wordt verpletterd${doelen.length ? "" : " — er staat niets kleins"}.`, true);
  if(!FAST && doelen.length){
    const el = document.getElementById("druklaag");
    if(el){ el.classList.remove("puls"); void el.offsetWidth; el.classList.add("puls"); }
    AU.play("thud");
  }
  for(const [pp, cc] of doelen){
    const cr = P(pp).cols[cc].cre; if(!cr) continue;
    pop(creSel(pp, cc), "KRAAK", "kill");
    destroyCre(pp, cc, "de druk");
  }
  render();
  if(!FAST && doelen.length) await sleep(460);
}
/* 🌥 Nimbus' wolkendek: elke beurt komt er bij degene die aan zet is een wolk bij. Ze zitten
   in de weg — bij hem én bij jou. */
function wolkBij(){
  const st = S && S.story;
  if(!st || !st.wolkdek || S.over) return;
  const p = S.tp, vrij = emptyCols(p);
  if(!vrij.length){ addLog(`🌥 Er is bij ${pName(p)} geen plek meer voor nog een wolk.`); return; }
  const c = vrij[Math.floor(rnd() * vrij.length)];
  placeCre(p, c, {id:++cid, el:"wolk", owner:p, token:true});
  const cr = P(p).cols[c].cre; if(cr) cr.played = 0;
  addLog(`🌥 <em>Er zakt een wolk in kolom ${c + 1}</em> van ${pName(p)}. Hij mag meteen mee.`, true);
  if(!FAST) fxLight(creSel(p, c));
  render();
}
/* 🌊 Het getij van de Diepstroom: drie standen die om de ronde doorschuiven.
   vloed — het staat hoog: 🔥 Vuur dooft en 💧 Water slaat 2 harder.
   eb    — het water trekt weg: aan het eind van de ronde verliest álles 1 leven.

    }

/* Het beest van de Balrog likt elke beurt zijn wonden. */
function balrogHeelt(){
  const st = S && S.story;
  if(!st || !st.balrogHeal || S.tp !== 1 || S.over) return;
  for(let c=0;c<5;c++){
    const cr = P(1).cols[c].cre;

    const max = EL.balrog.hp;
    if(cr.hp >= max) continue;
    const n = Math.min(st.balrogHeal, max - cr.hp);
    cr.hp += n;
    pop(creSel(1, c), "+" + n, "heal");
    addLog(`👹 De Balrog trekt zich weer bij elkaar: +${n} leven (nu ${cr.hp}).`, true);
  }
  render();
