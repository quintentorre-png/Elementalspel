/* De regels van het huidige praatje: uit STORY, of los meegegeven. */
function praatRegels(){
  if(!M || M.type !== "praat") return [];
  if(M.regels) return M.regels;
  const L = STORY[M.id];
  return (L && L[M.fase]) || [];
}
/* Per regel mag de sfeer omschakelen — dat vloeit over dankzij de CSS-transitie. */
function praatScene(){
  const L = STORY[M.id], r = praatRegels()[M.i];
  if(r && r.bg !== undefined) storySkin(r.bg);
  else if(M.i === 0 && L && !M.regels) storySkin(L.wereld);
  /* mu: op een regel zet een ander deuntje op. mu:null maakt het stil.
     Staat er niets, dan loopt de muziek gewoon door. */
  if(r && r.mu !== undefined) AU.zet(r.mu);
  if(r && r.paars) paarsFlits();
  if(r && r.val) valKlap();
  if(r && r.grijs) grijsFlits();
  if(r && r.wit) witFlits();
  if(r && r.glitch !== undefined) glitchAan(!!r.glitch);
}
/* Even paars over het hele scherm — iemand zet een 🟣 kracht aan. */
function paarsFlits(){
  if(FAST) return;
  let el = document.getElementById("paarsflits");
  if(!el){ el = document.createElement("div"); el.id = "paarsflits"; document.body.appendChild(el); }
  el.classList.remove("aan"); void el.offsetWidth; el.classList.add("aan");
  AU.play("light");
  setTimeout(() => el.classList.remove("aan"), 1300);
}
/* Een verhaalregel mag opmaak bevatten (<b>, <em>). De typemachine hakt hem daarom
   op in stukjes: een tag gaat er in één keer in en kost geen tijd, letters komen één
   voor één. Wat er halverwege staat blijft geldige HTML, dus je ziet nooit een losse
   <b> in beeld staan. */
function typHak(t){
  const uit = [], re = /<[^>]+>/g;
  let i = 0, m;
  while((m = re.exec(t))){
    for(const ch of t.slice(i, m.index)) uit.push({c:ch});
    uit.push({tag:m[0]});
    i = m.index + m[0].length;
  }
  for(const ch of t.slice(i)) uit.push({c:ch});
  return uit;
}
function typHTML(toks, n){
  let html = "";
  const open = [];
  for(let i=0; i<n && i<toks.length; i++){
    const tk = toks[i];
    if(tk.tag){
      html += tk.tag;
      const naam = (tk.tag.match(/^<\/?\s*([a-zA-Z][a-zA-Z0-9]*)/) || [])[1];
      if(!naam) continue;
      const kort = /\/>$/.test(tk.tag) || naam.toLowerCase() === "br";
      if(tk.tag[1] === "/"){ const j = open.lastIndexOf(naam.toLowerCase()); if(j >= 0) open.splice(j, 1); }
      else if(!kort) open.push(naam.toLowerCase());
    } else {
      html += tk.c === "&" ? "&amp;" : (tk.c === "<" ? "&lt;" : (tk.c === ">" ? "&gt;" : tk.c));
    }
  }
  for(let i = open.length - 1; i >= 0; i--) html += "</" + open[i] + ">";
  return html;
}
function praatTyp(){
  clearInterval(PRAAT);
  const r = praatRegels()[M.i];
  const el = document.getElementById("praattxt");
  if(!el || !r) return;
  el.innerHTML = "";
  const toks = typHak(r.t || "");
  let n = 0;
  M.typt = true;
  const pijl = document.getElementById("praatpijl");
  if(pijl) pijl.style.visibility = "hidden";
  PRAAT = setInterval(() => {
    if(n >= toks.length){ praatAf(); return; }
    do { n++; } while(n < toks.length && toks[n-1] && toks[n-1].tag);
    el.innerHTML = typHTML(toks, n);
    const laatst = toks[n-1];
    if(laatst && laatst.c && n % 2 === 0 && laatst.c !== " ") AU.play("blip");
  }, 26);
}
function praatAf(){
  clearInterval(PRAAT); PRAAT = null;
  if(!M || M.type !== "praat") return;
  M.typt = false;
  const r = praatRegels()[M.i];
  if(!r) return;
  const el = document.getElementById("praattxt");
  if(el) el.innerHTML = r.t;
  const pijl = document.getElementById("praatpijl");
  if(pijl) pijl.style.visibility = "visible";
}
function praatVerder(){
  if(!M || M.type !== "praat") return true;
  if(M.typt){ praatAf(); return true; }
  const R = praatRegels();
  /* Staat er een keuze onder de tekst, dan wacht het praatje op een knop. */
  if(R[M.i] && R[M.i].keuze) return true;
  if(M.i < R.length - 1){
    M.i++; praatScene(); render(); praatTyp(); return true;
  }
  const cb = M.klaar, id = M.id, fase = M.fase;
  if(cb){ clearInterval(PRAAT); PRAAT = null; M = null; render(); cb(); return true; }
  praatKlaar(id, fase);
  return true;
}
/* Springen naar een andere tak van hetzelfde level — de keuzeknoppen gebruiken dit. */
function praatGa(fase){
  if(!M || M.type !== "praat") return;
  const id = M.id, L = STORY[id];
  if(!L || !L[fase] || !L[fase].length){ praatKlaar(id, fase); return; }
  clearInterval(PRAAT); PRAAT = null;
  M = {type:"praat", id, fase, i:0, klaar:null};
  praatScene(); render(); praatTyp();
}
function praatKlaar(id, fase){
  clearInterval(PRAAT); PRAAT = null;
  const Lv = STORY[id];
  /* Takken die op een gevecht uitkomen; het level zegt zelf welke variant erbij hoort. */
  if(Lv && Lv.gevechtNa && Lv.gevechtNa[fase] !== undefined){
    M = null; startStoryGevecht(id, Lv.gevechtNa[fase]); return;
  }
  /* Een tak die het gevecht helemaal overslaat. */
  if(Lv && Lv.klaarNa && Lv.klaarNa[fase]){
    storyVoltooi(id, Lv.klaarNa[fase]);
    if((Lv.na || []).length){ praatStart(id, "na"); return; }
    M = {type:"story"}; storySkin(0); render(); return;
  }
  if(fase === "intro" && Lv && Lv.gevechtNa){ M = {type:"story"}; storySkin(0); render(); return; }
  if(fase === "intro"){ M = null; startStoryGevecht(id); return; }
  if(fase === "win"){
    storyVoltooi(id);
    if((STORY[id].na || []).length){ praatStart(id, "na"); return; }
    M = {type:"story"}; storySkin(0); render(); return;
  }
  if(fase === "verlies"){ M = null; render(); return; }   /* terug naar het verliesscherm */
  if(fase === "na"){ M = {type:"story"}; storySkin(0); render(); return; }
  M = {type:"story"}; storySkin(0); render();
}
function praatHTML(){
  const L = STORY[M.id] || {}, r = praatRegels()[M.i] || {t:""};
  const W = WERELDEN[r.bg !== undefined && WERELDEN[r.bg] ? r.bg : L.wereld] || WERELDEN[1];
  const st = [];
  if(r.sil !== undefined){
    /* een silhouet moet leesbaar blijven op zwart: hoe donkerder, hoe sterker de randgloed */
    const g = (1 - r.sil);
    st.push(`filter:brightness(${r.sil}) contrast(1.6)`
      + ` drop-shadow(0 0 ${(3 + g*7).toFixed(1)}px rgba(150,170,205,${(g*0.55).toFixed(2)}))`
      + ` drop-shadow(0 0 ${(1 + g*2).toFixed(1)}px rgba(190,205,230,${(g*0.45).toFixed(2)}))`);
  }
  if(r.loop){
    /* Elke regel bouwt het praatscherm opnieuw op, en een nieuw element begint zijn animatie
       weer bij 0% — daardoor sprong hij bij elke spatie terug naar het begin. Met een
       negatieve vertraging pikt hij de looppas op waar hij was. */
    if(M && !M.loopT0) M.loopT0 = Date.now();
    st.push(`animation-delay:-${M ? (Date.now() - M.loopT0) % 9000 : 0}ms`);
  }
  if(r.reus)       st.push("width:min(448px,76vw)");
  else if(r.groot) st.push("width:min(330px,68vw)");
  return `<div class="praatscherm${(r.groot || r.reus) ? " groot" : ""}${r.reus ? " reus" : ""}">
    <div class="praatsprite${r.loop ? " loopt" : ""}" style="${st.join(";")}">${r.s === null ? "" : spriteSVG(r.s || L.sprite)}</div>
    <div class="praatbox" style="--wk:${r.kleur || W.kleur}">
      <div class="praatnaam">${r.naam || L.vijand}</div>
      <div class="praattxt" id="praattxt"></div>
      <div class="praatpijl" id="praatpijl">▼</div>
    </div>
    ${r.keuze
      ? `<div class="praatkeus">${r.keuze.map((k,i) =>
          `<button class="pkbtn" data-act="btn" data-btn="praatkeus" data-ga="${k.ga}">${k.label}</button>`).join("")}</div>`
      : `<div class="praathint">spatie of tik om verder te gaan</div>`}
  </div>`;
}
/* ---- het gevecht ---- */
/* Een deckspec is {element: aantal}; een sleutel die een ✦ lichtkaart is, levert lichtkaarten. */
function deckUit(spec, p){
  const uit = [];
  for(const k in spec){
    const licht = !!LIGHTS[k];
    for(let i=0;i<spec[k];i++)
      uit.push(licht ? {id:++cid, el:"licht", lk:k, owner:p} : {id:++cid, el:k, owner:p});
  }
  return shuffle(uit);
}
/* Zeker weten dat iemand iets in zijn openingshand heeft: ruilen met een kaart uit het deck. */
function handGarantie(p, wensen){
  (wensen || []).forEach(w => {
    const heeft = P(p).hand.some(c => (LIGHTS[w] ? c.lk === w : (c.el === w && !c.lk)));
    if(heeft) return;
    const i = P(p).deck.findIndex(c => (LIGHTS[w] ? c.lk === w : (c.el === w && !c.lk)));
    if(i < 0) return;
    const kaart = P(p).deck.splice(i, 1)[0];
    if(P(p).hand.length){ P(p).deck.push(P(p).hand.pop()); shuffle(P(p).deck); }
    P(p).hand.push(kaart);
  });
}
/* Een gescripte openingszet: het level laat iemand zijn eerste main phase met een kaart openen. */
/* Vonk speelt vals zodra ze doodgaat. Ze vindt dat zelf volkomen redelijk. */
async function vonkPaniek(){
  const st = S && S.story;
  if(!st || !st.paniek || st.paniekGedaan || S.over || S.tp !== 1) return;
  if(laneDreiging(1) < P(1).life) return;
  st.paniekGedaan = true;
  await praatLosAwait([
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"WACHT WACHT WACHT wacht. Wacht. Nee. Even. Ho."},
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"Ze steekt haar hele arm tot aan haar schouder ónder in haar eigen deck. Dat hoort niet. Dat kan niet eens."},
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"Ik had hier nog eentje liggen voor als het niet leuk meer was! En het is niet leuk meer!"}
  ]);
  if(S.over) return;
  /* ✦ Wolkenzwerm vissen we onderin vandaan */
  const i = P(1).deck.findIndex(c => c.lk === "kuriboh");
  if(i >= 0){
    const k = P(1).deck.splice(i, 1)[0];
    addLog(`✦ Vonk vist <em>Wolkenzwerm</em> onder uit haar deck. Dat mag helemaal niet.`, true);
    const free = emptyCols(1);
    for(const c of free){
      placeCre(1, c, {id:++cid, el:"wolk", owner:1, token:true});
      render(); if(!FAST){ fxLight(creSel(1, c)); await sleep(90); }
    }
    P(1).grave.push(k);
    addLog(`✦ Wolkenzwerm zet ${free.length} wolk-creature${free.length===1?"":"s"} neer bij ${pName(1)}.`, true);
    AU.play("light"); render();
  }
  if(S.over) return;
  await praatLosAwait([
    {s:"vonk", naam:"Vonk", kleur:"#ffa53c", t:"Kijk. Een muur. Prachtig. Heel veilig. Ik voel me meteen een stuk beter."},
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"…Nee. Nee, ik heb geen muur nodig. Ik heb KAARTEN nodig."}
  ]);
  if(S.over) return;
  /* en de kaart die ze nog achterhield wordt gewoon een Zwart Gat */
  const j = P(1).hand.findIndex(c => !c.lk);
  if(j >= 0){
    const c0 = P(1).hand[j];
    addLog(`✦ Ze draait de kaart die ze nog vasthield om. Het is nu <em>Zwart Gat</em>. Hij was dat daarvoor niet.`, true);
    c0.el = "licht"; c0.lk = "darkhole";
    P(1).hand.splice(j, 1); P(1).grave.push(c0);
    if(P(1).life > 1){ P(1).life -= 1; pop(rectOf(`.pside[data-side="1"] .plife`), "-1", "dmg"); }
    let n = 0;
    for(let cc=0; cc<5; cc++) if(P(1).cols[cc].cre){ destroyCre(1, cc, "✦ Zwart Gat"); n++; }
    render(); if(!FAST) await sleep(240);
    addLog(`✦ Zwart Gat vernietigt ${n} eigen creature${n===1?"":"s"} — ${pName(1)} trekt er ${n}.`, true);
    if(n) await drawN(1, n, "✦ Zwart Gat");
  }
  render();
  if(S.over) return;
  await praatLosAwait([
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"HA! Zes kaarten! Zes! Wie is er nou dood!"},
    {s:"vonk", naam:"Vonk", kleur:"#ffa53c", t:"Ze kijkt naar het lege veld voor haar. Er trekt heel even iets van twijfel over haar gezicht. Heel even."},
    {s:"vonk_gek", naam:"Vonk", kleur:"#ffa53c", t:"Nee. Nee dit was goed. Dit was een goed plan. Doorspelen."}
  ]);
  if(!S.over){ S.ui = {mode:"busy"}; render(); }
}
async function storyOpening(){
  const o = S.story && S.story.opening;
  if(!o || o.p !== S.tp) return;
  S.story.opening = null;
  const p = o.p;
  /* Een opening mag ook gewoon een element-spell zijn. */
  if(o.el){
    let j = P(p).hand.findIndex(c => c.el === o.el && !c.lk);
    if(j < 0){
      const d = P(p).deck.findIndex(c => c.el === o.el && !c.lk);
      if(d < 0) return;
      P(p).hand.push(P(p).deck.splice(d, 1)[0]);
      j = P(p).hand.length - 1;
    }
    const kaart = P(p).hand.splice(j, 1)[0];
    const kol = o.col != null ? o.col : 2;
    addLog(`${icon(o.el)} <em>${pName(p)}</em> opent het potje met een ${EL[o.el].name}-spell in kolom ${kol+1}.`, true);
    await announcePlay(p, kaart, true, kol, false);
    await chainLoop();
    clearTimeout(botT);
    if(!S.over){ S.phase = "main1"; S.ui = {mode:"busy"}; render(); }
    return;
  }
  const i = P(p).hand.findIndex(c => c.lk === o.lk);
  if(i < 0) return;
  const card = P(p).hand.splice(i, 1)[0];
  addLog(`✦ <em>${pName(p)}</em> opent het potje met ${LIGHTS[o.lk].name}.`, true);
  const r = await announceLight(p, card, false);
  if(r === "cancel"){ P(p).hand.push(card); return; }
  await chainLoop();
  clearTimeout(botT);
  if(!S.over){ S.phase = "main1"; S.ui = {mode:"busy"}; render(); }
}
async function startStoryGevecht(id, variant){
  const basis = STORY[id]; if(!basis) return;
  /* Een level mag varianten hebben: een tak van het praatje kiest er één en die
     wordt over de basisopzet heen gelegd. */
  const L = (variant !== undefined && basis.varianten && basis.varianten[variant])
    ? Object.assign({}, basis, basis.varianten[variant]) : basis;
  MUT++;
  newGame();
  S.vsBot = true; S.set.handoff = false;
  S.mode = "classic"; S.story = {id, wereld:L.wereld, variant};
  clearTimeout(ZEGT); ZEGT = null;
  if(L.zeg){
    S.story.zeg = L.zeg;
    S.story.zegSpr = L.zegSpr || L.sprite;
    /* Een eigen houding voor de praatbalk links. Staat die er niet, dan gewoon zijn zegSpr. */
    S.story.tauntSpr = L.tauntSpr || null;
    S.story.zegNaam = L.vechtNaam || L.vijand;
    S.story.zegKleur = L.zegKleur || null;
    S.story.zegI = {}; S.story.zegOoit = {}; S.story.zin = null;
    S.story.popI = {}; S.story.popOoit = {};
    if(L.zeg.altijd) zegNu("beurt");     // er hoort meteen iets te staan
  }
  SET.autopass = [false, false]; saveSet();
  resetBoard();
  /* Het hart dat Magnus achterlaat: vanaf wereld 2 speel je met zes levens. */
  const buit0 = buitVoor(id);
  if(buit0.hart) P(0).life = buit0.hart;
  if(L.levensJij) P(0).life = L.levensJij;
  if(L.startSchade) P(0).life = Math.max(1, P(0).life - L.startSchade);
  if(L.levensVij) P(1).life = L.levensVij;
  S.ae = [ (L.aeJij || []).slice(), (L.aeVij || []).slice() ];
  S.aeKeuze = [ L.keuzeJij || null, L.keuzeVij || null ];
  P(0).deck = deckUit(L.deckJij, 0);
  P(1).deck = deckUit(L.deckVij, 1);
  (L.grafVij || []).forEach(el => P(1).grave.push({id:++cid, el, owner:1}));
  (L.grafJij || []).forEach(el => P(0).grave.push({id:++cid, el, owner:0}));
  (L.bord || []).forEach(b => {
    if(b.spell){ P(b.p).cols[b.c].spell = {card:{id:++cid, el:b.spell, owner:b.p}}; return; }
    placeCre(b.p, b.c, {id:++cid, el:b.el, owner:b.p});
    if(b.hp) P(b.p).cols[b.c].cre.hp = b.hp;
    if(b.weer && P(b.p).cols[b.c].cre) P(b.p).cols[b.c].cre.weer = b.weer;
    if(b.minAtk && P(b.p).cols[b.c].cre) P(b.p).cols[b.c].cre.minAtk = b.minAtk;
    if(b.wakker) P(b.p).cols[b.c].cre.played = 0;   // stond er al: mag meteen slaan
  });
  S.lt = [ (L.ltJij || []).slice(), (L.ltVij || []).slice() ];
  if(L.stil) S.story.stil = true;
  if(L.slaap){ S.story.slaap = true; S.story.slaapN = 0; }
  if(L.fuseVoorkeur) S.story.fuseVoorkeur = L.fuseVoorkeur;
  if(L.regen){ S.story.regenAan = true; S.story.regen = false; }
  /* Vooraf mag hij "???" heten — dat is de grap van de entree. Zodra het gevecht begint
     staat er gewoon wie het is, in de balken, in het log en in de praatbel. */
  if(L.vechtNaam) S.story.vijandNaam = L.vechtNaam;
  if(L.rotsval){ S.story.rotsAan = true; S.story.rots = null; }
  if(L.lava){ S.story.lavaAan = true; if(!FAST) lavaVerf(true); }
  if(L.rook){ S.story.rookAan = true; if(!FAST) rookVerf(true); }
  if(L.mist){ S.story.mistAan = true; if(!FAST) rookVerf(true); }
  if(L.geenChain) S.story.geenChain = true;
  if(L.brandstof) S.story.brandstof = true;
  if(L.balrogHeal) S.story.balrogHeal = L.balrogHeal;
  if(L.paniek) S.story.paniek = true;
  if(L.geenAanval) S.story.geenAanval = true;
  if(L.sluis){ S.story.sluisAan = true; S.story.sluis = null; if(L.sluisStart != null) S.story.sluisStart = L.sluisStart; }
  if(L.verzopen){ S.story.verzopen = true; S.story.verzopenN = 0; S.story.kapWeg = false;
                  if(L.verzopenMax) S.story.verzopenMax = L.verzopenMax; }
  if(L.verzuipt) S.story.verzuipt = true;
  if(L.ogen) S.story.ogen = true;
  if(L.oven) S.story.ovenAan = true;
  if(L.tronen) S.story.tronen = true;
  if(L.raad) S.story.raad = true;
  if(L.seraf){ S.story.seraf = true; S.story.serafFase = 0; S.story.vleugels = 6; }
  if(L.botten) S.story.botten = true;
  if(L.druk) S.story.drukAan = true;
  if(L.wolkdek) S.story.wolkdek = true;
  if(L.getij){ S.story.getijAan = true; S.story.getij = null; if(L.getijOffset) S.story.getijOffset = L.getijOffset; }
  if(L.biome) S.story.biome = L.biome;
  if(L.gelijkStart) S.story.gelijkStart = true;
  if(L.hitte){ S.story.hitte0 = true; S.story.hitte = L.hitteStart || 0; S.story.hitteAan = false; }
  if(L.fase2Extra) S.story.fase2Extra = L.fase2Extra;
  if(L.fase2Hand != null) S.story.fase2Hand = L.fase2Hand;
  if(L.fase2Zacht) S.story.fase2Zacht = true;
  if(L.glitch){ S.story.glitchAan = true; if(!FAST) glitchAan(true); }
  if(L.tut && L.tut.length){ S.story.tut = {i:0, stappen:L.tut.slice(), klaar:false, open:true};
                             S.story.vijZetten = JSON.parse(JSON.stringify(L.vijZetten || {})); }
  S.story.startLevens = [P(0).life, P(1).life];
  addLog(`📖 <em>${L.naam}</em> — ${L.vijand} daagt je uit.`, true);
  if(L.opening) S.story.opening = Object.assign({}, L.opening);
  storySkin(L.wereld);
  S.ui = {mode:"busy"};
  /* Welk deuntje bij dit gevecht hoort. Varianten mogen dat overschrijven, dus we
     onthouden de keuze op S.story — dan pakt het scherm hem daarna vanzelf op. */
  S.story.muziek = L.muziek || "gevecht";
  decorVerf(id);
  render();
  AU.zet(S.story.muziek);
  await storyVijandUitleg(L);
  if(S.over) return;
  await storyVoorbereiding(L, id);
  if(S.over) return;
  /* Pas nú de kaarten: je hebt eerst geband en gekozen, daarna wordt er geschud en
     getrokken. Anders zou je hand al vastliggen voordat je iets weggooide. */
  if(L.spiegelJij) storySpiegel(L);
  storyDeel(L);
  render();

/* 🪞 Hij speelt met precies wat jij hebt meegenomen: jouw deck, jouw krachten, jouw licht. */
function storySpiegel(L){
  P(1).deck = deckUit(L.deckJij, 1);
  S.lt[1] = (S.lt[0] || []).slice();
  S.lt[1].forEach(k => { for(let i=0;i<LIGHTS[k].n;i++) P(1).deck.push({id:++cid, el:"licht", lk:k, owner:1}); });
  S.ae[1] = (S.ae[0] || []).slice();
  if(S.aeKeuze[0]) S.aeKeuze[1] = S.aeKeuze[0];
  shuffle(P(1).deck);
  addLog(`🪞 <em>Hij speelt met jouw deck, jouw krachten en jouw licht.</em> Alles wat je hebt meegenomen staat ook aan de overkant.`, true);
}
/* Schudden en delen — gebeurt altijd ná het voorbereidingsscherm. */
function storyDeel(L){
  shuffle(P(0).deck); shuffle(P(1).deck);
  dealHands(L.begint);
  handGarantie(0, L.handJij); handGarantie(1, L.handVij);
  if(L.handJijVast) handVast(0, L.handJijVast);
  if(L.handVijVast) handVast(1, L.handVijVast);
  /* Eén kaart die onderin blijft liggen tot iemand hem er stiekem uit vist. */
  (L.onderop || []).forEach(k => {
    const bron = P(1).hand.findIndex(c => c.lk === k || c.el === k);
    if(bron >= 0) P(1).deck.unshift(P(1).hand.splice(bron, 1)[0]);
    const i = P(1).deck.findIndex(c => c.lk === k || c.el === k);
    if(i > 0) P(1).deck.unshift(P(1).deck.splice(i, 1)[0]);
  });
  if(L.handVijN != null){
    /* Inkorten tot de gewenste handgrootte — maar wat gegarandeerd was blijft liggen,
       ook als het toevallig al vooraan in de hand zat. */
    const moet = (L.handVij || []);
    const vast = c => moet.some(w => LIGHTS[w] ? c.lk === w : (c.el === w && !c.lk));
    while(P(1).hand.length > L.handVijN){
      let i = P(1).hand.findIndex(c => !vast(c));
      if(i < 0) i = 0;
      P(1).deck.push(P(1).hand.splice(i, 1)[0]);
    }
    shuffle(P(1).deck);
    (L.onderop || []).forEach(k => {
      const i = P(1).deck.findIndex(c => c.lk === k || c.el === k);
      if(i > 0) P(1).deck.unshift(P(1).deck.splice(i, 1)[0]);
    });
  }
  if(L.stil){ P(1).deck.push(...P(1).hand.splice(0)); }   // een struik heeft geen hand
  if(L.bovenop) L.bovenop.slice().reverse().forEach(el => {
    const i = P(0).deck.findIndex(c => c.el === el && !c.lk);
    if(i >= 0) P(0).deck.push(P(0).deck.splice(i, 1)[0]);   // dit trek je als eerste
  });
}
/* Een volledig vastgelegde openingshand — voor de tutorial. */
function handVast(p, wens){
  const nieuw = [];
  wens.forEach(el => {
    let i = P(p).hand.findIndex(c => c.el === el && !c.lk);
    if(i >= 0){ nieuw.push(P(p).hand.splice(i, 1)[0]); return; }
    i = P(p).deck.findIndex(c => c.el === el && !c.lk);
    if(i >= 0) nieuw.push(P(p).deck.splice(i, 1)[0]);
  });
  P(p).deck.push(...P(p).hand.splice(0));
  shuffle(P(p).deck);
  P(p).hand = nieuw;
}

function alGezegd(t){

/* Pakt de volgende zin uit een lijst die nog niet gebruikt is. Is alles op, dan mag de
   lijst opnieuw beginnen — maar nooit met de zin die er op dat moment al staat. */
function verseZin(lijst, sleutel, soort){
  const st = S && S.story;
  if(!lijst || !lijst.length) return null;
  if(!st[sleutel]) st[sleutel] = {};
  const start = st[sleutel][soort] || 0;
  for(let k = 0; k < lijst.length; k++){
    const i = (start + k) % lijst.length;
    if(!alGezegd(lijst[i])){ st[sleutel][soort] = (i + 1) % lijst.length; return lijst[i]; }
  }
  const i = start % lijst.length;
  st[sleutel][soort] = (i + 1) % lijst.length;
  return lijst[i];
}

function buitVoor(id){

    const gl = L.geeftLicht;

    if(L.geeftHart) hart = L.geeftHart;

  const gekozen = res && Array.isArray(res.ae) ? res.ae.filter(k => AETHERS[k]).slice(0, aeMax)
                : (res && res.ae && AETHERS[res.ae] ? [res.ae] : []);
  const lichten = res && Array.isArray(res.lt) ? res.lt.filter(k => LIGHTS[k]).slice(0, ltMax)
                : (res && res.lt && LIGHTS[res.lt] ? [res.lt] : []);
  const houd = kaarten.filter(c => weg.indexOf(c.id) < 0);
  if(houd.length){ P(0).deck.push(...houd); shuffle(P(0).deck); }
  if(kaarten.length)
    addLog(`✕ Je bant ${weg.length} kaart${weg.length === 1 ? "" : "en"}; de rest gaat terug het deck in.`, true);
  if(gekozen.length){
    S.ae[0] = gekozen.slice();
    gekozen.forEach(k => addLog(`🟣 Je neemt <em>${AETHERS[k].name}</em> mee — ${AETHERS[k].kort}.`, true));
  }
  if(lichten.length){
    S.lt[0] = lichten.slice();
    lichten.forEach(k => {
      for(let i=0;i<LIGHTS[k].n;i++) P(0).deck.push({id:++cid, el:"licht", lk:k, owner:0});
      addLog(`✦ Je schudt ${LIGHTS[k].n}× <em>${LIGHTS[k].name}</em> door je deck.`, true);
    });
    shuffle(P(0).deck);
  }
  render();
}
/* Speelt de tegenstander met een 🟣 kracht of met ✦ lichtkaarten, dan zie je vooraf wat die doen. */
async function storyVijandUitleg(L){
  const keys = (L.aeVij || []).filter(k => AETHERS[k]);

}
/* Onderbreking midden in het gevecht — bijvoorbeeld iemand die je een aether toestopt. */
async function storyEindeBeurt(){
  const L = S.story && STORY[S.story.id];
  if(!L || !L.midden || S.story.middenGedaan) return;
  if(S.tp !== 1 || S.turnNo[1] < (L.middenNa || 1)) return;
  S.story.middenGedaan = true;
  await praatAwait(S.story.id, "midden");
  if(L.middenAe){
    S.ae[0].push(L.middenAe);
    addLog(`🟣 Je krijgt <em>${AETHERS[L.middenAe].name}</em> — ${AETHERS[L.middenAe].kort}.`, true);
  }
  /* Iemand legt iets voor je neer; de spells triggeren daarbij niet. */
  (L.middenBord || []).forEach(b => {
    if(b.spell){
      P(b.p).cols[b.c].spell = {card:{id:++cid, el:b.spell, owner:b.p}};
      addLog(`${icon(b.spell)} Er wordt een ${EL[b.spell].name}-spell in kolom ${b.c+1} van ${pName(b.p)} gelegd.`, true);
    } else if(!P(b.p).cols[b.c].cre){
      placeCre(b.p, b.c, {id:++cid, el:b.el, owner:b.p});
    }
  });
  storySkin(L.wereld);
  S.ui = {mode:"busy"}; render();
}

function deckHTML(p){
  const inDeck = {}, hand = {}, bord = {}, graf = {}, geband = {};
  const RIJ = ORDER.concat((S.lt && S.lt[p] && S.lt[p].length) ? ["licht"] : []);
  RIJ.forEach(el => { inDeck[el]=0; hand[el]=0; bord[el]=0; graf[el]=0; geband[el]=0; });
  P(p).deck.forEach(c => { if(inDeck[c.el] != null) inDeck[c.el]++; });
  P(p).hand.forEach(c => { if(hand[c.el] != null) hand[c.el]++; });
  P(p).grave.forEach(c => { if(graf[c.el] != null) graf[c.el]++; });
  for(let q=0;q<2;q++) for(let c=0;c<5;c++){
    const col = P(q).cols[c];
    if(col.cre   && col.cre.card.owner === p   && bord[col.cre.card.el]   != null) bord[col.cre.card.el]++;
    if(col.spell && col.spell.card.owner === p && bord[col.spell.card.el] != null) bord[col.spell.card.el]++;
  }
  ((S.match && S.match.bannedEl[p]) || []).forEach(el => { if(geband[el] != null) geband[el]++; });
  const start = el => el === "licht"
    ? ((S.lt && S.lt[p]) || []).reduce((n,k) => n + LIGHTS[k].n, 0)
    : 7 - geband[el];
  const tot = o => RIJ.reduce((n, el) => n + (o[el]||0), 0);
  const N = P(p).deck.length;
  const nDraw = Math.min(N, hasAe(p, "ae_draw3") ? 2 : 1);
  /* Kans dat er in je volgende draw minstens één van dit type zit (hypergeometrisch). */
  const kansMinstensEen = k => {
    if(!k || !N || !nDraw) return 0;
    let mis = 1;                                  // kans dat je er géén trekt
    for(let i=0;i<nDraw;i++) mis *= (N - k - i) / (N - i);
    return Math.max(0, Math.min(1, 1 - mis));
  };
  const rij = el => {
    const s0 = start(el), links = inDeck[el];
    const pct = s0 ? Math.round(links / s0 * 100) : 0;
    const volgende = N ? links / N : 0;
    const draw = kansMinstensEen(links);
    return `<div class="deckrow">
      <div class="dkel">${icon(el)} ${EL[el].name}</div>
      <div class="dkbar"><div class="dkfill" style="width:${pct}%"></div></div>
      <div class="dknum"><b>${links}</b> / ${s0}</div>
      <div class="dkkans dkk1"><b>${(volgende*100).toFixed(0)}%</b><span>volgende</span></div>
      <div class="dkkans dkk2"><b>${(draw*100).toFixed(0)}%</b><span>in je draw</span></div>
      <div class="dksub">${[
        hand[el]   ? `hand ${hand[el]}`   : null,
        bord[el]   ? `bord ${bord[el]}`   : null,
        graf[el]   ? `graf ${graf[el]}`   : null,
        geband[el] ? `<span style="color:#e0806a">geband ${geband[el]}</span>` : null
      ].filter(Boolean).join(" · ") || "<span style='opacity:.55'>allemaal nog in je deck</span>"}</div>
    </div>`;
  };
  return `<div class="ovbox" style="max-width:min(560px,94vw);text-align:left">
    <h2 style="text-align:center">Je deck · ${pName(p)}</h2>
    <div class="sub" style="text-align:center">Nog <b>${tot(inDeck)}</b> kaarten te trekken${tot(geband) ? ` · ${tot(geband)} geband voor de hele match` : ""}. De volgorde is geschud en zie je niet.</div>
    <div style="margin:16px 0 4px">${RIJ.map(rij).join("")}</div>
    <div class="sub" style="font-size:.74rem;color:var(--dim)">De balk toont hoeveel er van dat element nog in je deck zit ten opzichte van waarmee je begon. <b>volgende</b> = de kans dat je eerstvolgende kaart dit type is; <b>in je draw</b> = de kans op minstens één in je volgende draw van ${nDraw} kaart${nDraw===1?"":"en"}.</div>${S.ui && S.ui.mode === "draft" ? `<div class="sub" style="font-size:.74rem;color:#e0c07a">De ${(S.ui.cards||[]).length} kaarten op je ban-scherm zijn hier tijdelijk uit je deck gehaald — die tellen nog niet mee.</div>` : ""}
    <div style="text-align:center;margin-top:12px"><button class="obtn ovclose" data-act="btn" data-btn="closemodal">Sluiten</button></div></div>`;
}
function helpHTML(){
  return `<div class="ovbox" style="text-align:left"><h2 style="text-align:center">Spelregels</h2>
  <div class="helptxt">
    <h3>Doel</h3><p>Breng je tegenstander van 5 naar 0 levens — of laat ze trekken uit een leeg deck (direct verlies).</p>
    <h3>Beurt</h3><p>Upkeep (per creature gaat één 🌿-token eraf) → Draw (2 kaarten) → Main → Gevecht → Main 2 → Einde. De startende speler krijgt <b>4</b> kaarten en slaat de allereerste draw over; de ander begint met 3 en trekt er in zijn eerste beurt 2 bij. Beginnen is een voordeel — een beurt voorsprong op het bord — dus de starter levert er een kaart voor in.</p>
    <h3>Je deck bekijken</h3><p>Klik op je eigen deckstapel om te zien wat er nog in zit: per element hoeveel er nog te trekken zijn ten opzichte van waarmee je begon, en waar de rest is (hand, bord, graf, geband). De volgorde is geschud en blijft verborgen, en het deck van je tegenstander kun je niet openen.</p>
    <h3>Beurt- en fasemeldingen</h3><p>Aan het begin van elke beurt verschijnt kort een melding in beeld: <b>goud</b> als jij aan zet bent, <b>staalblauw</b> als je tegenstander aan de beurt is. Ga je naar de gevechtsfase, dan zie je de rode <b>⚔ GEVECHT</b>-flits. Reactievensters midden in een chain krijgen géén melding — die zie je gewoon aan het chainpaneel links.</p>
    <h3>Dubbeltikken</h3><p>De zetknoppen staan onderaan op een eigen volle regel, zodat ze groot genoeg zijn voor je duim. Daarnaast doet een <b>dubbeltik op een leeg stuk scherm</b> steeds de meest voor de hand liggende zet: een <b>infoscherm sluiten</b>, in het <em>spelen als…</em>-scherm kiezen voor <b>creature</b>, een reactievenster <b>doorlaten</b> of een optionele keuze <b>overslaan</b> — en staat er niets open, dan ga je door naar de <b>volgende fase</b> (main → gevecht → main 2 → einde beurt). Eén losse tik doet nooit iets, dus mistikken kost je niets. Op de laptop doet de spatiebalk hetzelfde.</p>
    <h3>Kaartuitleg onderweg</h3><p><b>Houd een kaart in je hand ingedrukt</b> (of hover erover op de laptop) en je ziet precies wat hij doet — handig voor ✦ lichtkaarten. Je 🟣 aether onder je naam is aantikbaar en laat zijn volledige tekst zien. Dubbeltik of Esc sluit zo'n scherm weer.</p>
    <h3>Autopass</h3><p>Met de <b>⚡</b>-knop rechtsonder (of in het menu onder Geluid &amp; effecten) laat je de chain automatisch door: je wordt dan nooit gevraagd te reageren. Elke speler zet dat voor zichzelf, en je kunt het midden in een potje aan- en uitzetten.</p>
    <h3>Deck</h3><p>Vier elementen, <b>10 van elk</b> = 40 kaarten. Beide spelers spelen hetzelfde deck.</p>
    <h3>Kaarten spelen</h3><p>Elke kaart kan als <b>creature</b> of als <b>spell</b> (in de spell-plek van een kolom). Een spell mag ook op een bezette spell-plek: de oude wordt dan gediscard. Een spell triggert direct bij het spelen én telkens wanneer je in die kolom een creature speelt. <b>Alle vier</b> de elementen mogen als creature ook <b>⚡ flash</b> gespeeld worden: als reactie in de chain, buiten je beurt en tijdens je eigen gevechtsfase.</p>
    <p>✋ <b>Handlimiet: 7 kaarten.</b> Kom je daar met een draw boven, dan gooi je meteen weg tot je er weer zeven hebt — je kunt dus niet eindeloos blijven sparen.</p>
    <h3>Levens en aanval</h3><p>Een creature start met de levens van zijn element: 💧 Water 2, 🔥 Vuur 2, 🌿 Gras 2, 🪨 Steen <b>3</b>. Zijn <b>aanval is de helft van zijn levens</b>, naar beneden afgerond, minimaal 1 — dat geldt ook voor de schade aan een speler. Een dikke creature slaat dus harder.</p>
    <h3>Elementcirkel</h3><p>💧 → 🔥 → 🌿 → 🪨 → 💧 (sterk tegen). Sterk tegen zwak = <b>instakill</b>; zwak tegen sterk = <b>immuun</b>. Geldt voor alle schade tussen creatures. Spelers hebben geen element.</p>
    <h3>De vier elementen</h3><p>
      <b>💧 Water</b> — kies een creature en speel hem <b>opnieuw</b>, op dezelfde of een andere vrije plek. Hij <b>houdt zijn levens</b>; alleen zijn entangle-tokens vallen weg. Zijn speel-effect en de spell in de kolom waar hij landt triggeren opnieuw. Richt je op een 💧 Water-creature, of op een creature met een 💧-spell eronder, dan is de plons <b>doods</b>: er gaat niets af — niet zijn eigen effect en niet de spell in de kolom waar hij landt (je ziet dan rode kruizen over die spells). Een 💧 Water die zo terugkomt krijgt wel <b>+3 levens</b>.<br>
      <b>🪨 Steen</b> — 3 levens. Bij het spelen: geef <b>tweemaal +1 leven</b> aan een creature naar keuze (mag dezelfde zijn, mag je eigen of die van de ander).<br>
      <b>🔥 Vuur</b> — 2 schade aan een creature naar keuze. <b>Op 💧 Water doet Vuur niets.</b> Richt je het op een <b>eigen</b> creature, dan is dat een offer: instakill + een kaart trekken (ook op je eigen Water).<br>
      <b>🌿 Gras</b> — geef een creature een <b>entangle-token</b>. Elke token draint <b>−1 leven bij het doel en +1 bij de Gras zelf</b>, en kan het doel dus doden. Tegen 🪨 <b>Steen draint elke token dubbel: −2 daar, +2 hier</b> — geen instakill, maar Steen smelt wel twee keer zo snel weg. Op 🔥 Vuur werkt entangle niet.</p>
    <h3>Entangle</h3><p>Tokens <b>stapelen</b>. Een creature met tokens kan niet aanvallen. In de upkeep van de eigenaar gaat er per creature één token af.</p>
    <h3>🔥 Vuur richten</h3><p>Vuur kiest bij het spelen één doelwit. Bij je <b>tegenstander</b> mag je alles aanwijzen. Aan je <b>eigen</b> kant — waar je de creature offert (instakill, ook op Water, en jij trekt een kaart) — kun je <b>geen 🔥 Vuur</b> aanwijzen en niets in een <b>kolom met een 🔥 Vuur-spell</b>.</p>
    <h3>Chain</h3><p>Je krijgt een reactievenster op <b>gespeelde kaarten en aanvallen</b> — niet op elk los effect dat daaruit volgt; die resolven meteen. Speel je een kaart of val je aan, dan mogen <b>allebei</b> de spelers reageren met een flash voordat het resolvet: eerst degene die de link er net op zette — die houdt de prioriteit en mag dus op zijn eigen kaart doorchainen — daarna de ander. Pas als ze allebei doorlaten, resolvet de bovenste link. Je ziet daarbij precies wat er op de chain staat, inclusief het doelwit. Reacties resolven in omgekeerde volgorde (laatste eerst).<br><br>De kaart zelf staat er al — alleen zijn <b>effect</b> wacht op de chain. Daar zit de speelruimte: met een 💧 Water-flash schuif je het doelwit weg en fizzelt het effect — of dat nu je tegenstander doet, of jijzelf op je eigen link.</p>
    <h3>Neerzetten gaat altijd door</h3><p>Een kaart die je speelt <b>verschijnt meteen</b> op het veld — als creature én als spell, en ook een ⚡ flash midden in een chain. Alleen dát neerzetten gaat buiten de chain om en is niet te onderbreken.<br><br>Zijn <b>effect</b> volgt daarna gewoon de chain: je kiest je doelwit, de kaart komt als link op de chain, allebei de spelers mogen reageren, en pas bij het resolven gaat het effect af.</p>
    <h3>Targeten en fizzelen</h3><p>Je kiest je doelwit zodra de kaart op het veld staat, vóórdat je tegenstander mag reageren. Dat doelwit ligt vast op de chain — hij ziet het en kan erop reageren.<br><br>Een doelwit is een <b>kaart op een plek</b>. Staat die kaart er bij het resolven niet meer — vernietigd, of door 💧 Water naar een andere kolom verhuisd — dan <b>fizzelt</b> dat effect: er gebeurt niets. Zo dodge je een 🔥 Vuur door je eigen creature op tijd weg te spelen.<br><br>Speel je een creature in een kolom waar al een spell ligt, dan target je beide effecten meteen: eerst dat van de creature, dan dat van de spell. 🪨 Steen geeft twee keer +1 en target dus twee keer — die twee fizzelen <b>los van elkaar</b>. De kaart die je net hebt neergezet staat gewoon tussen de doelwitten, dus 🪨 Steen kan zichzelf oppompen.<br><br>Effecten die pas tijdens het resolven ontstaan — een creature die door 💧 Water opnieuw gespeeld wordt, de tweede 🪨 van Bergrug — kiezen hun doelwit op dat moment.</p>
    <h3>Gevecht</h3><p>Een creature valt altijd recht vooruit: de creature in dezelfde kolom, of anders de speler. Creatures mogen meteen aanvallen in de beurt dat ze gespeeld zijn — alleen in de allereerste beurt van de startende speler geldt summoning sickness.</p>
    <h3>Eigen bord targeten</h3><p>Zou een effect je dwingen om alléén je eigen kant van het bord te targeten, dan is die keuze automatisch optioneel.</p>
    <h3>✦ Lichtkaarten (Commander)</h3><p>Elk potje kies je op het draftscherm ook één van drie <b>lichtkaarten</b>. Daarvan gaan er <b>3 exemplaren door je deck</b> — je trekt ze dus gewoon. Een lichtkaart speel je op een <b>spell-plek</b>: hij flitst wit op, doet zijn effect en gaat <b>meteen naar het graf</b>. Lag daar al een spell, dan wordt die gediscard. Lichtkaarten mogen <b>altijd ⚡ als reactie</b> gespeeld worden en kun je niet bannen. Er zijn er negen; op het startscherm staat de <b>✦ Lichtkaarten</b>.<br><br>Twee bijzonderheden: <b>Volledige Negatie</b> gaat <b>meteen</b> af en komt niet als chain-link — de kaart die je tegenstander net speelde verdwijnt naar het graf en al zijn effecten gaan van de chain. En <b>Wolkenzwerm</b> zet wolk-creatures neer: 2 levens, geen element (dus geen instakill of immuniteit), ze mogen gewoon aanvallen, en je mag er later een echte creature overheen spelen — de wolk lost dan op.</p>
    <h3>Twee spelmodi</h3><p><b>⚜️ Basis</b> — één potje, alleen de vier elementen. <b>🟣 Commander</b> — best of 3 met aether-krachten, ✦ lichtkaarten en een ban-fase. Allebei ook live online te spelen met een roomcode.</p>
    <h3>🟣 Commander (best of 3)</h3><p>Per potje krijg je één <b>draftscherm</b> waarop je tegelijk je 🟣 aether, je ✦ lichtkaart en je bans kiest — de startende speler eerst, dan de ander uit wat overblijft; wat niemand koos wordt weggelegd. Een aether is een blijvende kracht die niet verwijderd kan worden en <b>cumulatief</b> is: wat je in potje 1 koos houd je in potje 2 en 3. De derde kaart die niemand koos gaat <b>voorgoed uit de pool</b> — over drie potjes komt elk van de negen aethers dus precies één keer langs. Op het startscherm staat een <b>📚 Bibliotheek</b> waarin je ze allemaal rustig kunt doorlezen.<br><br>Op datzelfde scherm doe je de <b>bans</b>: je trekt <b>10</b> kaarten in potje 1 en <b>5</b> in potje 2 en 3, en mag daarvan bannen zoveel je wilt — gebande kaarten zijn weg voor de héle match. Na elk potje drukken beide spelers op <b>Klaar</b> voor het volgende; de <b>verliezer</b> kiest dan als eerste een aether én begint.</p>
    <h3>🟣 Fusie</h3><p>Vier van de aethers zijn <b>fusies</b>. Heb je er één, dan kun je die kaart uit je hand ook als fusie spelen: je <b>offert direct</b> een willekeurige eigen creature — welk element maakt niet uit — en zet de fusie-creature op precies die plek neer. Het fusie-effect <b>vervangt</b> het gewone speel-effect van die creature, en werkt <b>eenmalig per kaart</b>: herspeel je hem later met 💧 Water, dan doet hij vanaf dan zijn normale elementeffect. <b>Alle vier</b> de fusies zijn <b>quickspell</b>: je mag ze dus ook midden in de chain, buiten je beurt en in je gevechtsfase spelen.</p>
    <h3>🌐 Live online spelen</h3><p>Op de gehoste versie klik je op <b>Live online</b>. Je krijgt een <b>roomcode</b> van vier tekens (en een link met die code erin). Je vriend opent dezelfde pagina, klikt op <b>Meedoen</b>, vult de code in — en jullie zijn direct verbonden, browser aan browser. Zodra de verbinding staat drukken jullie allebei op <b>Ik ben klaar</b> en begint het potje. Zetten komen meteen aan, er zit een <b>chat</b> naast het bord, en valt de verbinding weg dan komen jullie via dezelfde code terug in dezelfde partij.<br><br>Je ziet alleen je eigen hand, je eigen deck en je eigen bans. Wel eerlijk vermeld: de partij reist als startgetal plus zettenlijst, dus iemand die de pagina uitleest kán de kaarten van de ander afleiden. Prima voor een potje met een vriend, geen bescherming tegen wie per se wil valsspelen.<br><br>Binnen Claude werkt live niet — daar is netwerkverkeer geblokkeerd. Zet het bestand op een gewone webpagina (bijvoorbeeld GitHub Pages), dan werkt het wel.</p>
    <h3>Besturing</h3><p><b>Spatie</b> of <b>Enter</b> = doorlaten / overslaan / bevestigen. <b>Esc</b> of het <b>☰</b>-icoon rechtsboven = menu. Tegen de bot speel jij Speler 1.</p>

/* Welke muziek hoort er bij wat er nu op het scherm staat? Een praatje kiest zelf
   (via mu: op een regel), dus daar blijven we vanaf. Verder: startscherm, kaart,

/* Dubbeltik = de meest voor de hand liggende zet, zonder te hoeven mikken:
   – een infoscherm sluiten
   – in het "spelen als…"-scherm: creature
   – een reactievenster doorlaten of een optionele keuze overslaan
   – en anders, als er niets openstaat: door naar de volgende fase. */
let LAATSTE_TIK = 0;
function snelActie(){
  if(!S) return false;
  /* Staat de tutorial-pop-up open, dan is dit gewoon "Begrepen" — niks anders. */
  if(typeof tutOpen === "function" && tutOpen()){ S.story.tut.open = false; render(); return true; }
  if(M && (M.type === "info" || M.type === "deck" || M.type === "grave")){ M = null; render(); return true; }
  if(S.over) return false;
  const u = S.ui;
  if(pending && !isBot(u.p)){
    if(u.mode === "pickmode" && u.creOk){ doAct({t:"f", v:"cre"}); return true; }
    if(u.mode === "priority"){ doAct({t:"f", v:"pass"}); return true; }
    if(u.mode === "choice" && u.optional){ doAct({t:"f", v:null}); return true; }
    return false;
  }
  if(pending || busyFlag) return false;
  // niets openstaand: door naar de volgende fase van je eigen beurt
  if(!magIkZetten()) return false;
  if(u.mode === "main"  && S.phase === "main1"){ doAct({t:"b", b:"tobattle"}); return true; }
  if(u.mode === "battle"){ doAct({t:"b", b:"endbattle"}); return true; }
  if(u.mode === "main"  && S.phase === "main2"){ doAct({t:"b", b:"endturn"}); return true; }
  return false;
}
/* Ben ik degene die nu een zet mag doen? (bot, online en hotseat netjes uitgesloten) */
function magIkZetten(){
  if(!S || S.over) return false;
  if(isBot(S.tp)) return false;
  if(NET.on) return NET.seat === S.tp;
  return S.holder === S.tp || !S.set.handoff;
}
document.addEventListener("click", e => {
  if(M && M.type === "praat" && !e.target.closest("button")){ praatVerder(); return; }
  if(!e.target.closest("[data-act], button, input, .hcard, .slot, #right, #left, .aecard, .gc")){
    const nu = Date.now();
    if(nu - LAATSTE_TIK < 450 && snelActie()){ LAATSTE_TIK = 0; AU.play("click"); return; }
    LAATSTE_TIK = nu;
  }
  const t = e.target.closest("[data-act]");
  if(!t || !S) return;
  if(t.dataset.act === "btn") AU.play("click");
  const act = t.dataset.act;
  if(act === "btn") return onBtn(t.dataset.btn, t);
  if(S.over) return;
  if(act === "aepick"){
    if(S.ui.mode === "aetherpick" && !isBot(S.ui.p)) doAct({t:"f", v:+t.dataset.i});
    else if(S.ui.mode === "draft" && !isBot(S.ui.p)){ S.ui.selA = +t.dataset.i; draftSync(); }
    return;
  }
  if(act === "lpick"){
    if(S.ui.mode === "draft" && !isBot(S.ui.p)){ S.ui.selL = +t.dataset.i; draftSync(); }
    return;
  }
  if(act === "optpick"){
    if(S.ui.mode === "opt" && !isBot(S.ui.p)){
      const o = S.ui.opts[+t.dataset.i];
      if(o) doAct({t:"f", v:o.v});
    }
    return;
  }
  if(act === "aeinfo"){
    const d = AETHERS[t.dataset.k];
    if(d){ M = {type:"info", titel:d.name, ic:"🟣", kleur:"#c9a2ff",
      sub:`Aether · ${d.kind === "fusie" ? "fusie" : "passieve kracht"} · niet te verwijderen`, tekst:d.txt}; render(); }
    return;
  }
  if(act === "grafkaart"){
    const gp = +t.dataset.p, gi = +t.dataset.i;
    const cd = P(gp).grave[gi];
    if(cd) toonKaartInfo(cd, {type:"grave", p:gp});
    return;
  }
  if(act === "cardinfo"){
    const cd = (P(0).hand.concat(P(1).hand)).find(x => x.id === +t.dataset.id);
    if(cd) toonKaartInfo(cd);
    return;
  }
  if(act === "voorpag"){ aeBlader(t.dataset.w, +t.dataset.d); return; }
  if(act === "voorae" || act === "voorlt"){
    if(S.ui.mode === "banpick" && !isBot(S.ui.p)){
      const i = +t.dataset.i, veld = act === "voorae" ? "aeSel" : "ltSel";
      const ui = S.ui, max = (veld === "ltSel" ? ui.ltMax : ui.aeMax) || 1;
      let sel = Array.isArray(ui[veld]) ? ui[veld].slice() : (ui[veld] == null ? [] : [ui[veld]]);
      const at = sel.indexOf(i);
      if(at >= 0) sel.splice(at, 1);                 // nog een keer klikken = tóch niet
      else { sel.push(i); if(sel.length > max) sel = sel.slice(sel.length - max); }
      ui[veld] = sel; render();
    }
    return;
  }
  if(act === "bansel"){
    if((S.ui.mode === "banpick" || S.ui.mode === "draft") && !isBot(S.ui.p)){
      const id = +t.dataset.id, s = S.ui.sel, i = s.indexOf(id);
      if(i < 0) s.push(id); else s.splice(i, 1);
      if(S.ui.mode === "draft") draftSync(); else render();
    }
    return;
  }
  const p = +t.dataset.p;
  if(act === "grave"){ M = {type:"grave", p}; render(); return; }
  const u = S.ui;
  if(act === "hand"){
    const id = +t.dataset.id;
    if(u.mode === "main" && S.actor===S.tp && p === S.tp && mayAct(p)) doAct({t:"play", id});
    else if(u.mode === "battle" && p === S.tp && mayAct(p) && !isBot(p)
            && battleFlashOk(p, P(p).hand.find(cd => cd.id === id))) doAct({t:"bflash", id});
    else if(u.mode === "priority" && p === u.p && !isBot(p)){
      const card = P(p).hand.find(cd => cd.id === id);
      if(card && (card.el === "licht" ? lightPlayable(p, card)
                  : ((EL[card.el].flash && openCols(p).length) || fuseOk(p, card.el, "flash")))) doAct({t:"f", v:id});
    }
    else if(u.mode === "choice" && u.kind === "hand" && p === u.p && !isBot(p) && u.valid.includes(id)) doAct({t:"f", v:id});
    return;
  }
  if(act === "cre" || act === "spell"){
    const c = +t.dataset.col;
    if(u.p != null && isBot(u.p)) return;
    if(u.mode === "slot"){
      const kind = act === "cre" ? "cre" : "spell";
      if(u.valid.some(s => s.p===p && s.c===c && s.kind===kind)) doAct({t:"f", v:{p, c}});
      return;
    }
    if(u.mode === "choice" && u.kind === "cre" && act === "cre"){
      const cr = P(p).cols[c].cre;
      if(cr && u.valid.includes(cr.card.id)) doAct({t:"f", v:cr.card.id});
      return;
    }
    if(u.mode === "battle" && act === "cre" && p === S.tp){
      const cr = P(p).cols[c].cre;
      if(cr && canAttack(cr, p)) doAct({t:"atk", c});
      return;
    }
  }
});

const NET = {on:false, chan:"auto", seat:-1, buf:[], log:[], seed:0, seats:[null,null], kind:"classic",

const SHARE = {url:"", guess:false, copied:""};
function normURL(str){
  if(!str) return null;
  const m = String(str).match(/https?:\/\/[^\s"']*claude\.ai\/code\/artifact\/([A-Za-z0-9-]{6,})/i);
  if(m) return "https://claude.ai/code/artifact/" + m[1];
  const u = String(str).match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
  return u ? "https://claude.ai/code/artifact/" + u[1] : null;
}
function detectShareURL(){
  let saved = null;
  try{ saved = localStorage.getItem("elementaal_url"); }catch(e){}
  if(saved){ SHARE.url = saved; SHARE.guess = false; return; }
  if(NET.shareUrl){ SHARE.url = NET.shareUrl; SHARE.guess = false; return; }
  let g = normURL(document.referrer);
  if(!g){ try{ if(document.location.ancestorOrigins) for(const o of document.location.ancestorOrigins){ g = g || normURL(o); } }catch(e){} }
  if(!g) g = normURL(location.href);
  if(g){ SHARE.url = g; SHARE.guess = true; }
}
function setShareURL(v){
  const n = normURL(v) || (String(v||"").trim().startsWith("http") ? String(v).trim() : "");
  if(!n) return false;
  SHARE.url = n; SHARE.guess = false;
  try{ localStorage.setItem("elementaal_url", n); }catch(e){}
  if(NET.on) NET.shareUrl = n;
  return true;
}

    try{ const ta = document.createElement("textarea"); ta.value = t; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); }catch(e2){}

const ICE = [{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]},
             {urls:"stun:global.stun.twilio.com:3478"}];
const BROKERS = [
  {name:"PeerJS-cloud", opts:{}},

  {name:"PeerJS-cloud (2e poging)", opts:{}}

function peerOpts(){
  let o = null;
  try{
    const b = new URLSearchParams(location.search).get("broker");   // eigen broker: ?broker=host:port
    if(b){ const [h, pt] = b.split(":");
      o = {host:h, port:+pt || 9000, path:"/", secure:location.protocol === "https:"}; }
  }catch(e){}
  if(!o) o = Object.assign({}, BROKERS[LIVE.bi % BROKERS.length].opts);
  o.debug = 0;
  o.config = {iceServers:ICE};
  return o;
}
function brokerName(){
  try{ if(new URLSearchParams(location.search).get("broker")) return "eigen broker"; }catch(e){}
  return BROKERS[LIVE.bi % BROKERS.length].name;
}
function nextBroker(why){
  clearTimeout(LIVE.watchdog); LIVE.watchdog = null;
  if(LIVE.joined) return;
  LIVE.tries++;
  if(LIVE.tries > 4){
    LIVE.err = "Geen van de verbindingsservers reageert" + (why ? " (" + why + ")" : "") +
               ". Probeer het over een minuutje nog eens, of speel zolang hotseat of tegen de bot.";
    LIVE.status = ""; render(); return;
  }
  LIVE.bi++;

function openPeer(){
  if(!liveAvailable()){ LIVE.err = "De verbindingsbibliotheek kon niet laden."; render(); return; }
  try{ if(LIVE.peer) LIVE.peer.destroy(); }catch(e){}
  clearTimeout(LIVE.watchdog);
  LIVE.status = "verbinden via " + brokerName() + "…"; render();
  LIVE.watchdog = setTimeout(() => nextBroker("time-out"), 9000);   // reageert de broker niet, dan de volgende
  const id = LIVE.role === "host" ? PEER_PREFIX + LIVE.code : undefined;
  try{ LIVE.peer = id ? new Peer(id, peerOpts()) : new Peer(peerOpts()); }
  catch(e){ LIVE.err = "Verbinden lukt niet: " + e.message; render(); return; }
  LIVE.peer.on("open", () => {
    clearTimeout(LIVE.watchdog); LIVE.watchdog = null; LIVE.tries = 0;
    LIVE.status = LIVE.role === "host" ? "wachten op je vriend…" : "verbinden met room…";
    LIVE.err = "";
    if(LIVE.role === "guest") liveConnect();
    render();
  });
  LIVE.peer.on("connection", c => { if(LIVE.role === "host") bindConn(c); });
  LIVE.peer.on("disconnected", () => { LIVE.status = "verbinding hersteld worden…"; render();
    try{ LIVE.peer.reconnect(); }catch(e){} });
  LIVE.peer.on("error", err => {
    const t = (err && err.type) || "";
    if(t === "unavailable-id" && LIVE.role === "host"){ LIVE.code = roomCode(); liveSave(); openPeer(); return; }
    if(t === "peer-unavailable"){ LIVE.status = "room nog niet open — opnieuw proberen…"; liveRetry(); render(); return; }
    if(t === "browser-incompatible"){ LIVE.err = "Deze browser ondersteunt geen directe verbinding."; render(); return; }
    if(t === "network" || t === "server-error" || t === "socket-error" || t === "socket-closed"){
      nextBroker(t); return;                                   // broker onbereikbaar: probeer de volgende
    }
    LIVE.status = "verbindingsprobleem (" + (t || "onbekend") + ")"; liveRetry(); render();
  });
}
function liveConnect(){
  if(!LIVE.peer || LIVE.peer.destroyed) return;
  try{ bindConn(LIVE.peer.connect(PEER_PREFIX + LIVE.code, {reliable:true})); }catch(e){ liveRetry(); }
}
function liveRetry(){
  if(LIVE.role !== "guest" || LIVE.joined) return;
  clearTimeout(LIVE.retry);
  LIVE.retry = setTimeout(() => { if(!LIVE.joined) liveConnect(); }, 2500);
}
function bindConn(c){
  LIVE.conn = c;
  c.on("open", () => {
    LIVE.joined = true; LIVE.status = "verbonden"; LIVE.err = "";
    clearTimeout(LIVE.retry); clearTimeout(LIVE.watchdog); LIVE.watchdog = null; LIVE.tries = 0;
    liveMsg("verbonden met je tegenstander", true);
    liveNotify("🤝 Verbonden met je tegenstander");
    liveSend({t:"hello", len:NET.log.length, seed:NET.seed, kind:NET.kind});
    liveSend({t:"lready", p:NET.seat, v:LIVE.ready[NET.seat]});
    render();
  });
  c.on("data", m => onLiveData(m));
  c.on("close", () => {
    LIVE.joined = false; LIVE.status = "verbinding verbroken";
    LIVE.ready = [false, false];
    liveMsg("verbinding verbroken — opnieuw verbinden…", true);
    liveNotify("⚠ Verbinding verbroken — opnieuw verbinden…");
    render(); liveRetry();
  });
  c.on("error", () => { LIVE.status = "verbindingsfout"; render(); liveRetry(); });
}

async function applyRemote(acts){
  applyingRemote = true;
  try{
    for(const a of acts){
      const w = await waitFor(needsPending(a) ? "input" : "idle");
      if(w === "timeout"){ liveSend({t:"need"}); break; }
      NET.log.push(a);
      runAction(a);
    }
    await settleAll();
  } finally { applyingRemote = false; render(); }
}
async function onLiveData(m){
  if(!m || !m.t) return;
  if(m.t === "hello"){
    if(m.len > NET.log.length) liveSend({t:"need"});
    else if(m.len < NET.log.length) liveSync();
    return;
  }
  if(m.t === "need"){ liveSync(); return; }
  if(m.t === "sync"){
    NET.seed = m.seed; NET.kind = m.kind || NET.kind; NET.log = m.log || [];
    if(NET.log.length > 1) LIVE.started = true;
    if(m.chat && m.chat.length > LIVE.chat.length) LIVE.chat = m.chat;
    NET.buf = [];
    await replay(NET.seed, NET.log);
    render(); return;
  }
  if(m.t === "ready"){ NET.log.push({t:"rdy", p:m.p}); doReady(m.p); return; }
  if(m.t === "surrender"){
    if(!S.over){ NET.log.push({t:"sur", p:m.p}); doSurrender(m.p); render(); }
    return;
  }
  if(m.t === "act"){
    if(m.from === NET.log.length) await applyRemote(m.acts || []);
    else if(m.from > NET.log.length) liveSend({t:"need"});
    else liveSync();          // de ander liep achter: stuur de volledige stand
    return;
  }
  if(m.t === "lready"){
    const other = 1 - NET.seat;
    LIVE.ready[m.p != null ? m.p : other] = !!m.v;
    if(m.v) liveNotify("✅ Je tegenstander is klaar");
    liveMaybeStart(); render(); return;
  }
  if(m.t === "chat"){ LIVE.chat.push({who:m.who, text:String(m.text).slice(0,300)}); render(); return; }
}

/* ---- partijcode: werkt zonder bewerkrechten, je stuurt de code heen en weer ---- */
async function packCode(){
  const obj = {s:NET.seed, k:NET.kind, l:NET.log.concat(NET.buf)};
  const json = JSON.stringify(obj);
  try{
    if(typeof CompressionStream === "function"){
      const cs = new CompressionStream("gzip");
      const st = new Blob([json]).stream().pipeThrough(cs);
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      let bin = ""; for(const b of buf) bin += String.fromCharCode(b);
      return "EL1" + btoa(bin).replace(/=+$/,"");
    }
  }catch(e){}
  return "EL0" + btoa(unescape(encodeURIComponent(json))).replace(/=+$/,"");
}
async function unpackCode(code){
  const c = String(code || "").replace(/\s+/g, "");
  const body = c.slice(3), tag = c.slice(0,3);
  const b64 = body + "=".repeat((4 - body.length % 4) % 4);
  try{
    if(tag === "EL1"){
      const bin = atob(b64); const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream("gzip");
      const st = new Blob([arr]).stream().pipeThrough(ds);
      return JSON.parse(await new Response(st).text());
    }
    if(tag === "EL0") return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }catch(e){}
  return null;
}

  return false;

    const as = netActorSeat();
    if(S.over || (as >= 0 && as !== NET.seat)){
      clearInterval(NET.tick); NET.tick = null;

const PENDING_BTNS = ["pass","cancel","skip","asCre","asSpell","asFuse","cancelmode","copyCre","copySpell","handoffok"];
function needsPending(a){ return a.t === "f" || (a.t === "b" && PENDING_BTNS.includes(a.b)); }
async function waitFor(kind, max){
  const lim = max || 2000;
  for(let i=0;i<lim;i++){
    for(let k=0;k<4;k++) await Promise.resolve();
    if(kind === "input"){ if(pending) return "input"; }
    else {
      if(!busyFlag && (S.over || ["main","battle","start","lobby"].includes(S.ui.mode))) return "idle";
    }
    await new Promise(r => setTimeout(r, 0));
  }
  return "timeout";
}
async function settleAll(max){
  const lim = max || 2000;
  for(let i=0;i<lim;i++){
    for(let k=0;k<4;k++) await Promise.resolve();
    if(pending) return "input";
    if(!busyFlag && (S.over || ["main","battle","start","lobby"].includes(S.ui.mode))) return "idle";
    await new Promise(r => setTimeout(r, 0));
  }
  return "timeout";
}
async function replay(seed, log){
  FAST = true;
  try{
    srand(seed); newGame(true);
    S.set.handoff = false; S.vsBot = false;   // online/replay kent geen scherm-doorgeven
    for(const a of log){
      const w = await waitFor(needsPending(a) ? "input" : "idle");
      if(w === "timeout") break;
      runAction(a);
    }
    await settleAll();
  } finally { FAST = false; }
  render();
}

function netSnapshot(){
  return {v:1, seed:NET.seed, kind:NET.kind, seats:NET.seats, log:NET.log.concat(NET.buf), ver:NET.ver + 1,
          shareUrl: SHARE.url && !SHARE.guess ? SHARE.url : (NET.shareUrl || "")};
}
function buildDocument(snap){
  /* Alleen onze eigen head-onderdelen overnemen — geen <script>, anders raakt de
     runtime van de artifact-schil bij elke publicatie opnieuw meegekopieerd. */
  const kop = [];
  try{
    Array.from(document.head ? document.head.children : []).forEach(el => {
      const t = el.tagName;
      if(t === "SCRIPT" || t === "NOSCRIPT" || t === "BASE") return;
      kop.push(el.outerHTML);
    });
  }catch(e){}
  const head = kop.join("\n") + "\n" + STATIC_HEAD;
  const blob = btoa(unescape(encodeURIComponent(JSON.stringify(snap))));
  const lib = document.getElementById("peerlib");
  const libTag = lib ? '<scr' + 'ipt id="peerlib">' + lib.textContent + '</scr' + 'ipt>\n' : "";
  return "<!doctype html>\n<html><head>" + head + "</head><body>" + BODY_SKELETON + libTag +
    '\n<script id="netstate" type="application/json">' + blob + '</' + 'script>\n<script>' +
    PAGE_SCRIPT + '</' + 'script></body></html>';
}
async function netPublish(){
  if(!NET.api){ NET.status = "geen verbinding"; render(); return false; }
  if(NET.publishing) return false;
  NET.publishing = true;
  const snap = netSnapshot();
  NET.status = "synchroniseren…"; render();
  try{
    await NET.api.publish(buildDocument(snap));
    NET.log = snap.log; NET.buf = []; NET.ver = snap.ver; NET.status = "";
    NET.publishing = false; render();
    return true;
  }catch(err){
    NET.publishing = false;
    const code = (err && (err.code || err.name)) || "";
    if(String(code).includes("conflict")){ NET.status = "de ander was net eerder — de pagina laadt zijn versie"; }
    else if(String(code).includes("not_writer") || String(code).includes("not_granted")){
      NET.status = "je hebt geen bewerkrechten op dit artifact"; NET.readonly = true;
    } else { NET.status = "synchroniseren lukte niet: " + (err && err.message || code || "onbekend"); }
    render();
    return false;
  }
}

  if(el){ try{ snap = JSON.parse(decodeURIComponent(escape(atob(el.textContent.trim())))); }catch(e){} }
  if(snap && snap.v === 1){
    if(snap.shareUrl && (!SHARE.url || SHARE.guess)){ SHARE.url = snap.shareUrl; SHARE.guess = false; }
    NET.on = true; NET.seed = snap.seed; NET.kind = snap.kind; NET.seats = snap.seats;
    NET.log = snap.log || []; NET.buf = []; NET.ver = snap.ver || 0; NET.shareUrl = snap.shareUrl || "";
    NET.me = myId();
    NET.seat = NET.seats.indexOf(NET.me);
    await replay(NET.seed, NET.log);
    if(NET.seat < 0 && NET.seats.indexOf(null) < 0) NET.status = "je kijkt mee als toeschouwer";
    render();
  }
  if(!NET.api){
    try{ NET.api = (typeof claude !== "undefined" && claude.use) ? await claude.use("artifact") : null; }
    catch(e){ NET.api = null; }
    NET.ready = true; render();
  }
}
/* ================= ACTIES (deterministische zettenlijst) ================= */
const GAME_BTNS = ["startpvp","startbot","cmdpvp","cmdbot","onlpvp","onlcmd","nextgame","newgame",
  "handoffok","handoffdirect","tobattle","endbattle","endturn","pass","cancel","skip",
  "asCre","asSpell","asFuse","cancelmode","copyCre","copySpell","klokstart"];
function readyState(){                     // de bot is altijd meteen klaar
  const rd = S.ready || [false, false];
  return [rd[0] || isBot(0), rd[1] || isBot(1)];
}
function doReady(p){
  if(!S.over || S.over.matchDone) return;
  if(!S.ready) S.ready = [false, false];
  if(S.ready[p]) return;
  MUT++;
  S.ready[p] = true;
  addLog(`${pName(p)} is klaar voor het volgende potje.`);
  render();
  const rd = readyState();
  if(rd[0] && rd[1]) setTimeout(() => { if(S.over && !S.over.matchDone) nextGame(); }, 500);
}
function doSurrender(p){
  if(!S || S.over) return;
  MUT++;
  addLog(`<em>${pName(p)}</em> geeft op.`, true);
  gameOver(opp(p), pName(p) + " gaf de partij op.");
}
function runAction(a){
  if(!a) return;
  if(a.t === "sur") return doSurrender(a.p);
  if(a.t === "rdy") return doReady(a.p);
  if(a.t === "play") return playFromHand(a.id);
  if(a.t === "bflash") return playFlashInBattle(a.id);
  if(a.t === "atk") return declareAttack(a.c);
  if(a.t === "f") return feed(a.v);
  if(a.t === "klokuit") return klokVerloren(a.p);
  if(a.t === "b") return onBtn(a.b, null, true);
}
function act(a){
  if(NET.on){
    if(!netMayAct(a)) return;
    NET.buf.push(a);
  }
  const m0 = MUT;
  runAction(a);
  if(MUT === m0){ if(NET.on) NET.buf.pop(); return; }   // deed niets: niet opnemen
  REC.log.push(a);
  if(NET.on) netAfterAction();
}
function onBtn(btn, el, fromAction){
  const u = S.ui;
  if(!fromAction && GAME_BTNS.includes(btn)){
    if(btn === "banconfirm" || btn === "draftconfirm") return;
    return act({t:"b", b:btn});
  }
  switch(btn){
    case "startpvp": case "startbot": case "cmdpvp": case "cmdbot":
      if(u.mode==="start"){
        S.vsBot = (btn === "startbot" || btn === "cmdbot");
        SET.autopass = [false, false]; saveSet();      // elk potje begint met autopass uit
        addLog(NET.on ? "🌐 Online partij — jij bent <em>" + pName(NET.seat) + "</em>."
          : (S.vsBot ? "Je speelt tegen <em>de Bot 🤖</em>. Veel succes!" : "Hotseat: twee spelers op één scherm."), true);
        MUT++;
        if(btn.indexOf("cmd") === 0){
          S.mode = "commander";
          S.match = {wins:[0,0], game:1, bannedEl:[[],[]], firstPicker:0, gone:[], goneL:[],
                     lights: true};
          S.ae = [[],[]]; S.lt = [[],[]];
          S.ui = {mode:"busy"}; render();
          commanderSetup();
        } else {
          dealHands(0);
          S.ui = {mode:"busy"}; render();
          startTurnSequence();
        }
      } break;
    case "livehost_classic": if(u.mode==="start") liveHost("classic"); break;
    case "livehost_cmd": if(u.mode==="start") liveHost("commander"); break;
    case "livejoin": M = {type:"join"}; LIVE.err = ""; render(); break;
    case "resumelive": {
      const st = LIVE.resume; LIVE.resume = null;
      if(!st) break;
      NET.kind = st.kind || "classic";
      if(st.role === "host"){
        NET.on = true; NET.chan = "live"; NET.seat = 0; NET.log = []; NET.buf = [];
        LIVE.role = "host"; LIVE.code = st.code; LIVE.joined = false; LIVE.chat = [];
        S.vsBot = false; S.set.handoff = false;
        openPeer(); render();
      } else liveJoin(st.code);
      break;
    }
    case "dojoin": { const i = document.getElementById("roomin"); M = null; liveJoin(i ? i.value : ""); break; }
    case "liveleave": liveLeave(); break;
    case "copyroom": copyText(SHARE.url ? SHARE.url.split("#")[0] + "#room=" + LIVE.code : LIVE.code, "room"); break;
    case "sendchat": sendChat(); break;
    case "onlpvp": if(u.mode==="start"){ netCreate("classic"); } break;
    case "onlcmd": if(u.mode==="start"){ netCreate("commander"); } break;
    case "netjoin": netJoin(); break;
    case "netcancel": NET.on = false; NET.seat = -1; NET.log = []; NET.buf = []; NET.status = ""; newGame(); break;
    case "ready": if(S.over && !S.over.matchDone) act({t:"rdy", p: NET.on ? NET.seat : S.tp}); break;
    case "ready0": if(S.over && !S.over.matchDone) act({t:"rdy", p:0}); break;
    case "ready1": if(S.over && !S.over.matchDone) act({t:"rdy", p:1}); break;
    case "nextgame": nextGame(); break;
    case "draftconfirm":
      if(u.mode==="draft" && !isBot(u.p)) act({t:"f", v:{a:u.selA, l:u.selL, ban:u.sel.slice()}});
      break;
    case "banconfirm":
      if(u.mode==="banpick" && !isBot(u.p)) act({t:"f", v:voorKeus(u)});
      else if(u.mode==="draft" && !isBot(u.p)) act({t:"f", v:{a:u.selA, l:u.selL, ban:u.sel.slice()}});
      break;
    case "aeuitlegok": if(u.mode==="aeuitleg") feed(true); break;
    case "handoffok": if(u.mode==="handoff") feed(true); break;
    case "handoffdirect": MUT++; S.holder = S.actor; render(); break;
    case "tobattle": case "endbattle": case "endturn":
      if((u.mode==="main"||u.mode==="battle") && !S.over) advancePhase(btn); break;
    case "pass": if(u.mode==="priority" && !isBot(u.p)){ if(u.p === 0 && !tutMag("pass")) break; feed("pass"); } break;
    case "cancel": if(u.mode==="slot" && u.cancellable && !isBot(u.p)) feed("cancel"); break;
    case "skip": if(u.mode==="choice" && u.optional && !isBot(u.p)){ if(u.p === 0 && !tutMag("pass")) break; feed(null); } break;
    case "asCre": if(u.mode==="pickmode" && u.creOk && !isBot(u.p)) feed("cre"); break;
    case "asSpell": if(u.mode==="pickmode" && u.spOk && !u.flashCtx && !isBot(u.p)) feed("spell"); break;
    case "asFuse": if(u.mode==="pickmode" && u.fuseOk && !isBot(u.p)) feed("fuse"); break;
    case "cancelmode": if(u.mode==="pickmode" && !isBot(u.p)) feed("cancel"); break;
    case "menu": M = {type:"menu"}; render(); break;
    case "share": M = {type:"share"}; render(); break;

    case "copycode": copyText(NET.codeOut || "", "code"); break;
    case "loadcode": {
      const ta = document.getElementById("codein");
      if(ta) netJoinCode(ta.value);
      break;
    }

    case "copygame": copyText(SHARE.url, "game"); break;
    case "copyjoin": copyText(joinURL(), "join"); break;
    case "savelink": {
      const inp = document.getElementById("shinput");
      if(inp && setShareURL(inp.value)) render();
      break;
    }
    case "menuback": M = (M && M.back === "lobby") ? null : {type:"menu"}; render(); break;
    case "sharefromlobby": M = {type:"share", back:"lobby"}; render(); break;
    case "askSurrender": M = {type:"menu", confirm:"sur"}; render(); break;
    case "askLeave": M = {type:"menu", confirm:"leave"}; render(); break;
    case "surrender":
      M = null;
      act({t:"sur", p: NET.on ? NET.seat : S.tp});
      render(); break;
    case "surrenderleave":
      M = null;
      act({t:"sur", p: NET.on ? NET.seat : S.tp});
      setTimeout(() => { if(NET.chan === "live") liveLeave(); else if(NET.buf.length) netPublish().then(netLeave); else netLeave(); }, 600);
      break;
    case "leavegame": M = null; if(NET.chan === "live") liveLeave(); else netLeave(); break;
    case "askLeaveLive": M = {type:"menu", confirm:"leave"}; render(); break;
    case "tomain": M = null; NET.on = false; NET.seat = -1; NET.log = []; NET.buf = []; newGame(); break;
    case "help": M = {type:"help"}; render(); break;
    case "tutorial": M = {type:"tutorial", step:0, deck:(el && el.dataset.deck) || (S.mode==="commander" ? "commander" : "classic")}; render(); break;
    case "tutnext": if(M && M.type==="tutorial" && M.step < TUTS[M.deck].length-1){ M.step++; render(); } break;
    case "tutprev": if(M && M.type==="tutorial" && M.step > 0){ M.step--; render(); } break;
    case "tutgo": if(M && M.type==="tutorial" && el){ M.step = +el.dataset.step; render(); } break;
    case "audio": M = {type:"audio"}; render(); break;
    case "aelib": M = {type:"aelib"}; render(); break;
    case "deck": {
      const dp = el ? +el.dataset.p : 0;
      if(handVisible(dp)){ M = {type:"deck", p:dp}; render(); }
      break;
    }
    case "autopass": {
      const seats = NET.on ? (NET.seat >= 0 ? [NET.seat] : []) : (S && S.vsBot ? [0] : [0,1]);
      const alles = seats.length && seats.every(i => SET.autopass[i]);
      seats.forEach(i => SET.autopass[i] = !alles);
      saveSet(); render();
      break;
    }
    case "klokstart": klokStart(); break;
    case "apoff": SET.autopass = [false, false]; saveSet(); render(); break;
    case "ap0": SET.autopass[0] = !SET.autopass[0]; saveSet(); render(); break;
    case "ap1": SET.autopass[1] = !SET.autopass[1]; saveSet(); render(); break;
    case "liveready":    liveSetReady(true);  break;
    case "livenotready": liveSetReady(false); break;
    case "liveretry":    LIVE.err = ""; LIVE.tries = 0; LIVE.bi = 0; openPeer(); render(); break;
    case "fx_vol": case "fx_subtiel": case "fx_uit":
      SET.fx = b.slice(3); saveSet(); render();
      if(SET.fx !== "uit"){ const rr = rectOf(".slot.cr"); if(rr) fxBurn(rr); }
      break;
    case "story": M = {type:"story"}; storySkin(0); render(); break;
    case "praatkeus": {
      const ga = el && el.dataset.ga;
      if(ga) praatGa(ga);
      break;
    }
    case "storylevel": {
      const id = el && el.dataset.id;
      if(id && STORY[id] && storyVrij(id)){ storySkin(STORY[id].wereld); praatStart(id, "intro"); }
      break;
    }
    case "storycode": {
      const inp = document.getElementById("storycode");
      const w = (inp ? inp.value : "").trim().toLowerCase();
      if(w === "unlock"){ SET.story.vrij = true; saveSet(); AU.play("win"); }
      else if(inp){ inp.value = ""; inp.placeholder = "helaas…"; }
      render(); break;
    }
    case "storyverder": { const id = S.story && S.story.id; AU.zet("kaart"); decorWeg();
      if(id) praatStart(id, "win"); break; }
    case "tutweg": if(tutAan()) tutStop(false); break;
    case "tutok": if(tutAan()){ S.story.tut.open = false; render(); } break;
    case "storynog": {
      const id = S.story && S.story.id;
      if(!id) break;
      /* Zat er een keuze in het praatje, dan begin je weer bij het begin daarvan —
         anders zou je vastzitten aan een tak die je niet meer kunt kiezen. */
      if(heeftKeuze(id)){ M = null; S.over = null; storySkin(STORY[id].wereld); praatStart(id, "intro"); break; }
      startStoryGevecht(id); break; }
    case "storyterug": { AU.zet("kaart"); decorWeg(); S.story = null; newGame(); M = {type:"story"}; storySkin(0); render(); break; }
    case "closemodal": M = null; render(); break;
    case "infoterug": M = (M && M.terug) ? M.terug : null; render(); break;
    case "mlog": { const a = document.getElementById("app"); if(a) a.classList.toggle("showlog"); break; }
    case "logtoggle": document.body.classList.toggle("logopen"); break;
    case "restart":
      if(NET.on){ M = {type:"restart"}; render(); }
      else if(S.over) newGame(); else { M = {type:"restart"}; render(); }
      break;
    case "newgame": M = null; if(NET.on) netRestart(); else newGame(); break;
    case "handofftoggle":
      S.set.handoff = !S.set.handoff;
      addLog(S.set.handoff ? "👁 Hotseat-privacy <em>aan</em>: scherm-doorgeef bij beurtwissel." : "👁 Hotseat-privacy <em>uit</em>: beide handen zichtbaar zonder overdracht.", true);
      render(); break;
  }
}
/* Lang indrukken op een kaart in je hand = uitleg van die kaart (ook ✦ lichtkaarten). */
function toonKaartInfo(cd, terug){
  if(!cd) return;
  if(cd.lk){
    const d = LIGHTS[cd.lk];
    M = {type:"info", titel:d.name, ic:"✦", kleur:"#ffffff",
      sub:`Lichtkaart · ${d.n}× in je deck${d.cost ? ` · kost ${d.cost} leven` : ""}${d.tribute ? " · offert een creature" : ""}`,
      tekst:`${d.txt}<br><br><b>Spelen:</b> op een spell-plek; hij flitst, doet zijn effect en gaat meteen naar het graf. Mag altijd ⚡ als reactie.`};
  } else {
    const e2 = EL[cd.el];
    M = {type:"info", titel:e2.name, ic:icon(cd.el), kleur:`var(--${cd.el})`,
      sub:`${e2.hp} levens · aanval = de helft${e2.strong ? ` · sterk tegen ${icon(e2.strong)} ${EL[e2.strong].name}` : ""}${e2.flash ? " · ⚡ flash" : ""}`,
      tekst:`<b>Als creature:</b> ${e2.cre}${e2.sp ? `<br><br><b>Als spell:</b> ${e2.sp}` : ""}`};
  }
  if(terug) M.terug = terug;
  render();
}
let DRUKT = null, DRUKGEDAAN = false;
document.addEventListener("pointerdown", e => {
  const h = e.target.closest(".hcard[data-act='hand']");
  if(!h || !S) return;
  const id = +h.dataset.id;
  DRUKGEDAAN = false;
  clearTimeout(DRUKT);
  DRUKT = setTimeout(() => {
    const cd = (P(0).hand.concat(P(1).hand)).find(x => x.id === id);
    if(cd && handVisible(cd.owner)){ DRUKGEDAAN = true; AU.play("click"); toonKaartInfo(cd); }
  }, 480);
});
["pointerup","pointercancel","pointermove","scroll"].forEach(ev =>
  document.addEventListener(ev, () => clearTimeout(DRUKT), true));
document.addEventListener("click", e => {
  if(DRUKGEDAAN && e.target.closest(".hcard")){ DRUKGEDAAN = false; e.stopPropagation(); }
}, true);
document.addEventListener("mouseover", e => {
  const ae = e.target.closest("[data-pvae]");
  if(ae){
    const k = ae.dataset.pvae, d = AETHERS[k];
    setPreview(`<div class="pv" style="border-color:#9d6fd8">
      <div class="pvhead" style="background:linear-gradient(160deg,#7a55b8,#3a2560)"><span class="ic">🟣</span><span class="nm">${d.name}</span></div>
      <div class="sec"><div class="sect" style="color:#b48be0">Aether · passief · niet te verwijderen</div><p>${d.txt}</p></div>
    </div>`);
    return;
  }
  const t = e.target.closest("[data-pv]");
  if(!t){ return; }
  const el = t.dataset.pv;
  const cur = t.dataset.pvhp ? {hp:+t.dataset.pvhp,
    sick:(t.dataset.pvst||"").includes("s"), ent:+(t.dataset.pvent||0), spent:(t.dataset.pvst||"").includes("a"),
    atk:+(t.dataset.pvatk||0)} : null;
  setPreview(pvHTML(el, {cur, lk:t.dataset.pvlk}));
});
document.addEventListener("mouseout", e => {
  const t = e.target.closest("[data-pv]");
  if(t) setPreview(null);
});
document.addEventListener("keydown", e => {
  if(!S) return;
  const tg = e.target;
  if(tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA")){
    if(e.key === "Enter"){
      if(tg.id === "chatin"){ e.preventDefault(); sendChat(); }
      else if(tg.id === "roomin"){ e.preventDefault(); const v = tg.value; M = null; liveJoin(v); }
      else if(tg.id === "shinput"){ e.preventDefault(); if(setShareURL(tg.value)) render(); }
    }
    if(e.key === "Escape") tg.blur();
    return;   // in een invoerveld nooit spelacties triggeren
  }
  if(M && M.type === "tutorial" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    e.preventDefault();
    if(e.key === "ArrowRight" && M.step < TUTS[M.deck].length - 1) M.step++;
    if(e.key === "ArrowLeft" && M.step > 0) M.step--;
    render(); return;
  }
  if(M && M.type === "praat"){
    if(e.key === " " || e.key === "Enter" || e.key === "ArrowRight"){ e.preventDefault(); praatVerder(); }
    return;
  }
  if(e.key === "Escape"){
    if(M){ if(M.type === "menu" && M.confirm){ M = {type:"menu"}; render(); } else { M = null; render(); } return; }
    const u = S.ui;
    if(u.p != null && isBot(u.p)) return;
    if(u.mode === "slot" && u.cancellable){ doAct({t:"f", v:"cancel"}); return; }
    if(u.mode === "pickmode"){ doAct({t:"f", v:"cancel"}); return; }
    if(u.mode !== "start"){ M = {type:"menu"}; render(); }
    return;
  }
  if(e.code !== "Space" && e.key !== "Enter") return;
  if(M && M.type === "tutorial"){
    e.preventDefault();
    if(M.step < TUTS[M.deck].length - 1){ M.step++; } else { M = null; }
    render(); return;
  }
  /* Spatie doet exact wat een dubbeltik doet: infoscherm sluiten, "spelen als" op creature,
     doorlaten/overslaan, of door naar de volgende fase. */
  if(!M || M.type === "info" || M.type === "deck" || M.type === "grave"){
    if(snelActie()){ e.preventDefault(); return; }
  }
  if(M || S.over) return;
  e.preventDefault();
  const u = S.ui;
  if(u.p != null && isBot(u.p)) return;
  if(u.mode === "priority") doAct({t:"f", v:"pass"});
  else if(u.mode === "choice" && u.optional) doAct({t:"f", v:null});
  else if(u.mode === "handoff") doAct({t:"f", v:true});
  else if(u.mode === "aeuitleg") doAct({t:"f", v:true});
  else if(u.mode === "banpick") doAct({t:"f", v:voorKeus(u)});
  else if(u.mode === "draft") doAct({t:"f", v:{a:u.selA, l:u.selL, ban:u.sel.slice()}});
  else if(S.set.handoff && !S.vsBot && S.actor !== S.holder && (u.mode==="main" || u.mode==="battle")){ S.holder = S.actor; render(); }
});

/* Alle tekeningen alvast ophalen. Zo staat een sprite meteen compleet in beeld in plaats
   van dat je hem regel voor regel ziet binnendruppelen. */
const BEELD_KLAAR = {}, BEELD_CACHE = {};
/* Een plaatje dat de browser al binnen heeft mag meteen zichtbaar zijn, ook als het
   decoderen nog niet is afgerond. Anders zie je bij het doorklikken één zwart frame. */
function beeldKlaar(pad){
  if(BEELD_KLAAR[pad] === true) return true;
  const im = BEELD_CACHE[pad];
  return !!(im && im.complete && im.naturalWidth > 0);
}
function beeldenWarm(){
  const paden = [];
  if(typeof SPRITE_BEELD === "object") paden.push(...Object.values(SPRITE_BEELD));
  if(typeof DECOR_BEELD === "object") paden.push(...Object.values(DECOR_BEELD));
  paden.forEach(pad => {
    if(!pad || BEELD_KLAAR[pad] !== undefined) return;
    BEELD_KLAAR[pad] = false;
    const im = new Image();
    BEELD_CACHE[pad] = im;
    im.decoding = "async";
    im.addEventListener("load", () => {
      /* pas klaar als hij ook gedecodeerd is, anders zie je hem alsnog opbouwen */
      const af = () => { BEELD_KLAAR[pad] = true; };
      if(im.decode) im.decode().then(af, af); else af();
    });
    im.addEventListener("error", () => { BEELD_KLAAR[pad] = "fout"; });
    im.src = pad;
  });
}

/* start */
beeldenWarm();
newGame();
netBoot();
