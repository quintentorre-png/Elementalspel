    if(kind === "tobattle"){ S.phase = "battle"; addLog(`${pName(S.tp)} gaat naar de gevechtsfase.`); backToPhase(); battleCry(); }
    else if(kind === "endbattle"){ S.phase = "main2"; backToPhase(); }
    else if(kind === "endturn"){
      if(S.tp === 0) tutKlaarStap("beurt");
      await endTurn();
    }
  } finally { busyFlag = false; }
}

/* ================= BOT ================= */
async function botMove(){
  if(!S || S.over || !isBot(S.tp)) return;
  const m = S.ui.mode, p = S.tp;
  if(tutAan() && m === "main"){
    if(S.story.tutBezig) return;
    S.story.tutBezig = true;
    let deed = false;
    try{ deed = await tutVijandZet(); }
    finally { S.story.tutBezig = false; }
    if(S.over) return;
    if(deed){ backToPhase(); return; }
    if(S.phase === "main1"){ advancePhase("tobattle"); return; }
    advancePhase("endturn"); return;
  }
  if(m === "main"){
    const play = botChoosePlay(p);
    if(play){ S.botPlays++; if(play.mode === "spell") S.botSpells++; botPlan = play; await playFromHand(play.cardId); return; }
    if(S.phase === "main1"){ advancePhase("tobattle"); return; }
    advancePhase("endturn"); return;
  }
  if(m === "battle"){
    const col = botChooseAttack(p);
    if(col !== null){ declareAttack(col); return; }
    advancePhase("endbattle"); return;
  }
}
const spellVal0 = {vuur:6.2, steen:4.0, gras:3.4, water:1.2};   // 🔥 voorop, 💧 achteraan
function botChoosePlayV1(p){
  if(S && S.story && S.story.verboden != null && p === 0){
    const vrij = P(p).hand.filter(cd => magSpelen(p, cd.id));
    if(!vrij.length) return null;
  }
  const hand = P(p).hand.filter(cd => cd.el !== "licht");
  const empty = openCols(p);
  if(!hand.length) return null;

  /* Levensgevaar: dan telt geen zetlimiet meer — elke open laan waar een aanvaller
     doorheen kan wordt dichtgezet, desnoods met de laatste kaart uit de hand. */
  if(inNood(p) && empty.length){
    const gaten = [];
    for(let c=0;c<5;c++){
      const att = P(opp(p)).cols[c].cre;
      if(att && att.ent === 0 && !P(p).cols[c].cre && empty.includes(c)) gaten.push({c, att});
    }
    if(gaten.length){
      gaten.sort((a, b) => atkOf(b.att, opp(p)) - atkOf(a.att, opp(p)));
      const g = gaten[0];
      let best = null, bs = -99;
      for(const cd of hand){
        let sc = 1 + rnd() * 0.3;
        if(dmgOutcome(g.att.card.el, cd.el, 1) === "immuun") sc += 6;   // hij kan er niets mee
        if(EL[cd.el].strong === g.att.card.el) sc += 4;                 // en wij killen hem
        if(EL[g.att.card.el].strong === cd.el) sc -= 2;                 // wordt meteen weggeveegd
        if(cd.el === "steen") sc += 1;                                  // meer levens
        if(sc > bs){ bs = sc; best = cd; }
      }
      if(best) return {cardId: best.id, mode:"cre", col: g.c};
    }
  }

  /* Begint de bot het potje, dan zet hij precies één spell neer en past verder. */
  if(S.gTurn === 1 && S.tp === p){
    if(P(p).cols.some(c => c.spell)) return null;
    let best = null, bs = -99;
    for(const cd of hand){
      const sc = (spellVal0[cd.el] || 1) + rnd() * 0.4;
      if(sc > bs){ bs = sc; best = cd; }
    }
    return best ? {cardId: best.id, mode:"spell", col: 2} : null;
  }

  if(S.botPlays >= (P(p).hand.length > 5 ? 3 : 2)) return null;
  if(!empty.length) return null;
  let best = null, bestScore = 1.5;
  for(const cd of hand){
    for(const c of empty){
      let s = 2;
      const enemy = P(opp(p)).cols[c].cre;
      if(enemy){
        if(EL[cd.el].strong === enemy.card.el) s += 4;                       // wij instakillen hen in combat
        else if(dmgOutcome(enemy.card.el, cd.el, 1) === "immuun") s += 3;    // gratis blocker
        else if(EL[enemy.card.el].strong === cd.el) s -= 3;                  // zij instakillen ons
      } else s += 1;                                                          // open laan
      if(P(p).cols[c].spell) s += 4;      // hier triggert onze spell opnieuw — dat is het plan
      if(cd.el === "vuur"){
        let eff = 0;
        eachCre((cr,pp)=>{ if(pp===opp(p)){ const o = dmgOutcome("vuur", cr.card.el, 2);
          if(o === "kill" || (typeof o === "number" && cr.hp <= o)) eff = Math.max(eff, 3);
          else if(typeof o === "number") eff = Math.max(eff, 1); } });
        s += eff;
      }
      if(cd.el === "steen") s += 1.5;      // 3 levens en +1+1
      if(cd.el === "gras") s += 1;
      s += rnd() * 0.6;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "cre", col: c}; }
    }
  }
  // spells: de bot wil in beurt 1 en beurt 2 elk één spell neerzetten
  const spellVal = spellVal0;
  const spellsOpBord = P(p).cols.filter(c => c.spell).length;
  const wilSpell = S.turnNo[p] === 1 && spellsOpBord === 0;
  for(const cd of hand){
    for(let c=0;c<5;c++){
      if(P(p).cols[c].spell) continue;                 // eigen spell niet overschrijven
      let s = 2.2 + spellVal[cd.el] + (wilSpell ? 4 : 0);
      if(spellsOpBord === 0) s += 2;                   // zonder spell op het bord eerst er één neerzetten
      if(P(p).cols[c].cre) s -= 1.6;                   // triggert pas bij een vólgende creature hier
      if(!empty.includes(c)) s -= 0.5;
      if(cd.el === "vuur" && !allCreIds((cr,pp)=>pp===opp(p)).length) s -= 1.5;
      s += rnd() * 0.7;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "spell", col: c}; }
    }
  }
  return best;
}
function botChooseAttackV1(p){
  if(!botMagAanvallen(p)) return null;
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if(cr && canAttack(cr, p)){
      const def = P(opp(p)).cols[c].cre;
      if(!def) return c;
      if(dmgOutcome(cr.card.el, def.card.el, 1) !== "immuun") return c;
    }
  }
  return null;
}

/* ================= SLIMME BOT (V2) =================
   Alles wordt als score uitgedrukt: hoeveel bord- en levensvoordeel levert een zet op? */
/* Instelbare gewichten — de zelfspeel-tests draaien hiermee zoekrondes. */
const BOTW0 = {blok:1.1, vrij:2.2, kill:6, imm:4.5, sterf:6, spellslot:4.5,
            eff:1.2, spell:0.9, spellbasis:2.0, drempel:2.2, limiet:1, fus:1, licht:1, spelltrig:1, slotspell:0, race:0, reserve:0, extraSpell:0, spellhand:4, spellvroeg:0, spellnu:0, cyclespell:4, aetherspell:2.5, levenprijs:2.4, offerprijs:0.9, offermax:4.5, extraLicht:1, extraMaster:1, handmax:6,
            offerdraw:1.6, doemkorting:4, fusdodge:1, doemaanval:6, waterheal:0.9,
            greedbasis:3.2, greedhand:1.6, lichtleven:3,
            atk:2, spelUit:0, eerste:1, blokEerst:0};
/* 📖 Verhaal-tegenstanders spelen hun spells wél: ze mogen naast hun creature nog één
   spell neerleggen, en een spell die nú al iets doet telt zwaarder mee. Anders zie je
   het halve spel nooit terug bij de bazen. */
const BOTW_STORY = Object.assign({}, BOTW0,
  {extraSpell:1, spellhand:3, spellnu:0.5, extraMaster:1});
let BOTW = [BOTW0, BOTW0];               // per stoel, zodat varianten tegen elkaar kunnen
const wOf = p => (BOTW[p] === BOTW0 && S && S.story && p === 1) ? BOTW_STORY : (BOTW[p] || BOTW0);
function creWaarde(cr, p){
  if(!cr) return 0;
  return cr.hp * 1.1 + atkOf(cr, p) * 0.9 - cr.ent * 1.2;
}
/* Hoeveel schade komt er volgende beurt ongehinderd door bij speler p? */
function laneDreiging(p){
  let n = 0;
  for(let c=0;c<5;c++){
    const att = P(opp(p)).cols[c].cre;
    if(att && att.ent === 0 && !P(p).cols[c].cre) n += atkOf(att, opp(p));
  }
  return n;
}
/* Beste opbrengst van een 🔥-effect van speler p. */
function vuurWaarde(p){
  const dmg = hasAe(p, "ae_fire6") ? 5 : 2;
  let best = 0;
  for(const id of fireTargets(p)){
    const f = findCre(id); if(!f) continue;
    if(f.p !== opp(p)){                                 // eigen wezen: offeren = instakill + trek 1
      best = Math.max(best, offerVuurWaarde(p, f));
      continue;
    }
    const o = dmgOutcome("vuur", f.cr.card.el, dmg);
    if(o === "kill") best = Math.max(best, 8 + f.cr.hp);
    else if(typeof o === "number" && f.cr.hp <= o) best = Math.max(best, 7 + f.cr.hp);
    else if(typeof o === "number") best = Math.max(best, 1.5 + o * 0.4);
  }
  return best;
}
function grasWaarde(p){
  const n = hasAe(p, "ae_grassx2") ? 2 : 1;
  let best = 0;
  eachCre((cr, pp) => {
    if(pp !== opp(p) || cr.card.el === "vuur") return;
    const per = drainPer(cr.card.el) * n;
    best = Math.max(best, cr.hp <= per ? 7 + cr.hp : 3 + per * 0.8 + atkOf(cr, opp(p)) * 0.5);
  });
  return best;
}
function waterWaarde(p){
  const W = wOf(p);
  let best = 0;
  /* De truc: een herspeeld wezen mag in élke vrije kolom landen — dus ook op de plek waar
     jouw spell ligt, zodat die spell nóg een keer afgaat. */
  let verhuis = 0;
  for(const c of openCols(p)){
    const sp = P(p).cols[c].spell;
    if(sp) verhuis = Math.max(verhuis, spellTriggerWaarde(p, sp.card.el) * W.spelltrig);
  }
  const dubbel = hasAe(p, "ae_watercycle") ? 2 : 1;      // 🟣 Getijdenstroom triggert dubbel
  for(const id of waterTargets(p)){
    const f = findCre(id); if(!f) continue;
    /* Plons in het water: geen enkel effect. Wat overblijft is verplaatsen, tokens kwijt
       en — als het een 💧 Water is — drie levens erbij. */
    const doods = waterDoods(p, f.c);
    let v = doods ? (f.cr.card.el === "water" ? 3.2 : 0.3)
                  : 0.8 + effWaarde(p, f.cr.card.el) * 0.6 * dubbel;   // zijn speel-effect gaat opnieuw af
    const hier = P(p).cols[f.c].spell ? spellTriggerWaarde(p, P(p).cols[f.c].spell.card.el) * W.spelltrig : 0;
    if(!doods) v += Math.max(hier, verhuis);    // blijven staan óf naar een spell-kolom verhuizen
    if(f.cr.ent > 0) v += 2.5;                  // tokens weg
    if(!doods){
      const basis = EL[f.cr.card.el].hp;
      if(f.cr.hp < basis) v += (basis - f.cr.hp) * W.waterheal;
      else if(f.cr.hp > basis) v -= (f.cr.hp - basis) * W.waterheal * 0.8;
    }
    best = Math.max(best, v);
  }
  return best;
}
/* Mikt er op dit moment een 🔥-effect op de chain op een eigen wezen van p? */
function vuurDreiging(p){
  for(let i = S.stack.length - 1; i >= 0; i--){
    const it = S.stack[i];
    const doelen = it.type === "play" ? (it.plan || []).filter(e => e.el === "vuur" && e.tid != null)
                 : (it.type === "eff" && it.el === "vuur" && it.dec && it.tid != null ? [it] : []);
    for(const e of doelen){
      const f = findCre(e.tid);
      if(f && f.p === p && (e.tp == null || (f.p === e.tp && f.c === e.tc))) return f;
    }
  }
  return null;
}
/* Gaat dit eigen wezen sowieso dood? Dan is offeren pure winst. */
function doemt(p, f){
  const cr = f.cr;
  if(cr.ent > 0 && cr.hp <= drainPer(cr.card.el) * cr.ent) return true;   // entangle draint hem weg
  const bedreigd = vuurDreiging(p);
  if(bedreigd && bedreigd.cr.card.id === cr.card.id){
    const dmg = hasAe(opp(p), "ae_fire6") ? 5 : 2;
    const o = dmgOutcome("vuur", cr.card.el, dmg);
    if(o === "kill" || (typeof o === "number" && cr.hp <= o)) return true;
  }
  return false;
}
/* Hoe goed is het om dit eigen wezen aan je eigen 🔥 te offeren? Instakill + trek een kaart. */
function offerVuurWaarde(p, f){
  const W = wOf(p), cr = f.cr, vij = opp(p);
  let v = W.offerdraw + Math.max(0, 4 - P(p).hand.length) * 1.1;   // een kaart weegt zwaarder als je er weinig hebt
  if(cr.card.el === "wolk") v += 2;                                // een wolkje geef je met plezier weg
  if(doemt(p, f)) v += 4;                                          // hij ging tóch dood: gratis kaart
  v -= creWaarde(cr, p) * 0.55;
  const tegen = P(vij).cols[f.c].cre;
  if(tegen && tegen.ent === 0) v -= atkOf(tegen, vij) * 0.9;       // hij hield die laan dicht
  if(P(p).cols[f.c].spell) v -= 1.2;                               // die plek was juist waardevol
  return v;
}
/* Het goedkoopste eigen wezen om te offeren: {id, w, c} — of null als je er geen hebt. */
function goedkoopsteOffer(p, ids){
  let id = null, w = 1e9, col = 0;
  const lijst = ids || allCreIds((cr, pp) => pp === p);
  for(const i of lijst){
    const f = findCre(i); if(!f || f.p !== p) continue;
    let v = creWaarde(f.cr, p);
    if(f.cr.card.el === "wolk") v -= 2.5;                    // wolkjes zijn het goedkoopste offer
    if(P(p).cols[f.c].spell) v += 1.2;                       // een plek met spell hou je liever
    if(doemt(p, f)) v -= wOf(p).doemkorting;                 // dit wezen gaat tóch dood: perfect offer
    if(v < w){ w = v; id = i; col = f.c; }
  }
  return id === null ? null : {id, w, c:col};
}
/* De aanvalskracht waarmee een verse creature van dit element op het bord komt. */
function nieuwAtk(p, el){
  const hp = EL[el].hp;
  return (el === "steen" && hasAe(p, "ae_stonefull")) ? hp : Math.max(1, Math.floor(hp / 2));
}
/* Wat is het waard als de spell in deze kolom opnieuw afgaat? 🪨 triggert tweemaal;
   💧 krijgt een vaste waarde omdat waterWaarde zichzelf anders zou aanroepen. */
function spellTriggerWaarde(p, el){
  if(el === "steen") return 2 * 2.4;
  if(el === "water") return 2.5;
  return effWaarde(p, el);
}
const effWaarde = (p, el) => el === "vuur" ? vuurWaarde(p)
  : el === "gras" ? grasWaarde(p)
  : el === "water" ? waterWaarde(p)
  : el === "steen" ? 2.4 : 0;                   // 🪨 geeft altijd twee keer +1

/* Wie wint de race? > 0 = ik heb hem eerder dood dan hij mij (in beurten). */
function raceVoordeel(p){
  const vij = opp(p);
  const dps = (a, b) => { let n = 0;
    for(let c=0;c<5;c++){ const att = P(a).cols[c].cre;
      if(att && att.ent === 0 && !P(b).cols[c].cre) n += atkOf(att, a); }
    return n; };
  const mij = dps(p, vij), hun = dps(vij, p);
  return (hun > 0 ? P(p).life / hun : 99) - (mij > 0 ? P(vij).life / mij : 99);
}
/* Wat levert deze creature op precies deze plek op? */
function plekWaarde(p, el, c){
  const W = wOf(p);
  const vij = opp(p), enemy = P(vij).cols[c].cre;
  let s = 2.5;
  if(enemy){
    const wijKillen = EL[el].strong === enemy.card.el;
    const zijKillen = EL[enemy.card.el].strong === el;
    const immuun = dmgOutcome(enemy.card.el, el, 1) === "immuun";
    if(wijKillen) s += W.kill + creWaarde(enemy, vij) * 0.4;   // wij vegen hem weg
    else if(immuun) s += W.imm;                                // hij kan ons niets doen
    else if(zijKillen) s -= W.sterf;                            // wij gaan er meteen aan
    else s += 1;
    if(!P(p).cols[c].cre) s += atkOf(enemy, vij) * W.blok + (W.blokEerst ? 4 : 0);   // deze laan stond open
  } else {
    s += W.vrij;                                               // vrije laan: wij mogen aanvallen
  }
  const sp = P(p).cols[c].spell;
  if(sp) s += W.spellslot + spellTriggerWaarde(p, sp.card.el) * W.spelltrig;   // onze spell gaat opnieuw af
  /* Sta ik achter in de race, dan is dichtzetten meer waard dan een vrije laan — en andersom. */
  if(W.race){
    const r = raceVoordeel(p);
    if(r < 0){ if(!enemy) s -= W.race; else if(!P(p).cols[c].cre) s += W.race; }
    else if(r > 1 && !enemy) s += W.race * 0.6;
  }
  return s;
}
function botChoosePlayV2(p){
  const W = wOf(p);
  const vij = opp(p);
  const hand = P(p).hand.filter(cd => magSpelen(p, cd.id));
  const gewoon = hand.filter(cd => cd.el !== "licht");
  const open = openCols(p);
  if(!hand.length) return null;
  const nood = inNood(p);

  /* 1. Levensgevaar: alle open lanen dicht, zonder zetlimiet. */
  if(nood && open.length && gewoon.length){
    const gaten = [];
    for(let c=0;c<5;c++){
      const att = P(vij).cols[c].cre;
      if(att && att.ent === 0 && !P(p).cols[c].cre && open.includes(c)) gaten.push({c, att});
    }
    if(gaten.length){
      // grootste dreiging eerst; bij gelijke dreiging de kolom waar onze spell ligt
      const spellBonus = c => (P(p).cols[c].spell ? 0.5 : 0);
      gaten.sort((a, b) => (atkOf(b.att, vij) + spellBonus(b.c)) - (atkOf(a.att, vij) + spellBonus(a.c)));
      const g = gaten[0];
      let best = null, bs = -99;
      for(const cd of gewoon){
        let sc = 1 + rnd() * 0.2;
        if(dmgOutcome(g.att.card.el, cd.el, 1) === "immuun") sc += 6;
        if(EL[cd.el].strong === g.att.card.el) sc += 4;
        if(EL[g.att.card.el].strong === cd.el) sc -= 2;
        if(cd.el === "steen") sc += 1.2;
        if(sc > bs){ bs = sc; best = cd; }
      }
      if(best) return {cardId: best.id, mode:"cre", col: g.c};
    }
  }

  /* 2. Wie begint, zet precies één spell neer en past. */
  if(W.eerste && S.gTurn === 1 && S.tp === p){
    if(P(p).cols.some(x => x.spell) || !gewoon.length) return null;
    let best = null, bs = -99;
    for(const cd of gewoon){ const sc = (spellVal0[cd.el] || 1) + rnd() * 0.4;
      if(sc > bs){ bs = sc; best = cd; } }
    return best ? {cardId: best.id, mode:"spell", col: 2} : null;
  }

  const limiet = nood ? 9 : (P(p).hand.length > 5 ? W.limiet + 1 : W.limiet);
  if(S.botPlays >= limiet){
    /* Boven de zetlimiet mag alleen nog een lichtkaart die zichzelf terugverdient:
       ✦ Gulzigheid (leven + offer) en ✦ Gokkersbrouwsel kosten wat, maar leveren kaarten op. */
    /* Eén spell per beurt mag er bovenop: hij zet geen creature op het bord, maar hij
       maakt elke volgende creature in die kolom sterker. */
    if(W.extraSpell && !S.botSpells && !nood && P(p).hand.length >= W.spellhand){
      let bs2 = -1e9, beste = null;
      for(const cd of gewoon){
        for(let c=0;c<5;c++){
          if(P(p).cols[c].spell) continue;
          let sc = spellVal0[cd.el] * W.spell + spellTriggerWaarde(p, cd.el) * W.spelltrig;
          if(P(p).cols[c].cre) sc -= 1.6;                    // triggert pas bij de vólgende creature
          if(cd.el === "water" && hasAe(p, "ae_watercycle")) sc += W.cyclespell;
          if(cd.el === "vuur"  && hasAe(p, "ae_fire6"))      sc += W.aetherspell;
          if(cd.el === "gras"  && hasAe(p, "ae_grassx2"))    sc += W.aetherspell;
          sc += rnd() * 0.4;
          if(sc > bs2){ bs2 = sc; beste = {cardId: cd.id, mode:"spell", col: c}; }
        }
      }
      if(beste) return beste;
    }
    if(!W.extraLicht || nood || P(p).life <= W.lichtleven || laneDreiging(p) >= P(p).life - 1) return null;
    const off = goedkoopsteOffer(p);
    const mag = lk => {
      if(LIGHTS[lk].tribute && (!off || off.w > W.offermax)) return false;   // te duur offer
      if(lk === "siphon"){ let m = 0; eachCre((cr, pp) => { if(pp === opp(p)) m = Math.max(m, cr.hp); }); return m >= 3; }
      if(lk === "reborn") return P(p).grave.some(x => ORDER.includes(x.el)) && openCols(p).length > 0;
      return lk === "greed" || lk === "gamble" || (W.extraMaster && lk === "master");
    };
    const g = hand.find(cd => cd.el === "licht" && mag(cd.lk)
                              && lightPlayable(p, cd) && P(p).hand.length <= W.handmax);
    return g ? {cardId: g.id, mode:"licht"} : null;
  }

  let best = null, bs = W.drempel;           // onder deze drempel: liever kaarten sparen
  /* Eén flash-creature achter de hand houden als er volgende beurt iets doorkomt: die kun
     je midden in zijn aanval nog als blokker neerzetten. */
  const flashInHand = gewoon.filter(cd => EL[cd.el].flash);
  const reserveren = W.reserve && !nood && flashInHand.length === 1 && laneDreiging(p) > 0;
  const spellsOpBord = P(p).cols.filter(x => x.spell).length;
  const wilSpell = S.turnNo[p] === 1 && spellsOpBord === 0;

  /* 3. Creatures */
  for(const cd of gewoon){
    if(reserveren && EL[cd.el].flash && flashInHand.length === 1) continue;   // deze bewaren we
    for(const c of open){
      let sc = plekWaarde(p, cd.el, c) + effWaarde(p, cd.el) * W.eff + rnd() * 0.5;
      if(P(p).cols[c].cre && EL[P(p).cols[c].cre.card.el].overheen) sc -= 1.5;   // token offeren
      if(sc > bs){ bs = sc; best = {cardId: cd.id, mode:"cre", col: c}; }
    }
  }
  /* 4. Spells — de motor van de bot: het effect komt telkens terug */
  if(!W.spelUit) for(const cd of gewoon){
    for(let c=0;c<5;c++){
      if(P(p).cols[c].spell) continue;
      let sc = W.spellbasis + spellVal0[cd.el] * W.spell + effWaarde(p, cd.el) * 0.7 + (wilSpell ? 4 : 0);
      sc += spellTriggerWaarde(p, cd.el) * W.spellnu;        // wat levert één trigger nú op?
      // 🟣 aethers maken sommige spells veel sterker
      if(cd.el === "water" && hasAe(p, "ae_watercycle")) sc += W.cyclespell;
      if(cd.el === "vuur"  && hasAe(p, "ae_fire6"))      sc += W.aetherspell;
      if(cd.el === "gras"  && hasAe(p, "ae_grassx2"))    sc += W.aetherspell;
      if(cd.el === "steen" && hasAe(p, "ae_stonefull"))  sc += W.aetherspell * 0.6;
      if(spellsOpBord === 0) sc += 2;
      if(P(p).cols[c].cre) sc -= 1.6;                       // triggert pas bij de vólgende creature
      if(!open.includes(c)) sc -= 0.6;
      if(nood) sc -= 3;                                     // eerst overleven
      sc += rnd() * 0.5;
      if(sc > bs){ bs = sc; best = {cardId: cd.id, mode:"spell", col: c}; }
    }
  }
  /* 5. Fusies — het offer verdwijnt, maar op diezelfde plek komt een beter lichaam
        terug plus het fusie-effect. Alleen het verschil telt, niet de hele creature. */
  for(const cd of gewoon){
    if(!fuseOk(p, cd.el)) continue;
    const fk = aeFuseKey(p, cd.el);
    const offers = fuseTributes(p, cd.el);
    if(!offers.length) continue;
    const off = goedkoopsteOffer(p, offers);
    if(!off) continue;
    const tid = off.id, gw = off.w, gc = off.c;
    let sc;
    {
      /* Wat komt ervoor terug op precies dezelfde plek? */
      const nHp = fk === "fu_stone" ? 4 : EL[cd.el].hp;
      const nAtk = (cd.el === "steen" && hasAe(p, "ae_stonefull")) ? nHp : Math.max(1, Math.floor(nHp / 2));
      const terug = nHp * 1.1 + nAtk * 0.9;
      sc = 1.5 + (terug - gw) * 0.9;                         // ruil: nieuw lichaam vs. offer
      sc += plekWaarde(p, cd.el, gc) * 0.25;                 // de laan blijft bezet, dat telt mee
      const dmg = hasAe(p, "ae_fire6") ? 5 : 2;
      if(fk === "fu_fire"){                                  // 2 schade over het hele vijandelijke bord
        let raak = 0;
        eachCre((cr, pp) => { if(pp !== vij) return;
          const o = dmgOutcome("vuur", cr.card.el, dmg);
          if(o === "kill" || (typeof o === "number" && cr.hp <= dmg)) raak += 7 + cr.hp * 0.8;
          else if(typeof o === "number") raak += 1 + o * 0.5; });
        sc += raak;
      }
      if(fk === "fu_grass"){                                 // entangle op alles, alle drain hierheen
        let raak = 0;
        eachCre((cr, pp) => { if(pp !== vij || cr.card.el === "vuur") return;
          const per = drainPer(cr.card.el) * (hasAe(p, "ae_grassx2") ? 2 : 1);
          raak += cr.hp <= per ? 7 + cr.hp : 2 + per * 1.1; });
        sc += raak;
      }
      if(fk === "fu_water") sc += 1.8 + waterWaarde(p) * 0.9;   // trek 1 + het gewone water-effect
      if(fk === "fu_stone"){
        sc += 3;                                             // vier keer +1 leven
        const vrij2 = openCols(p, gc);
        if(vrij2.length) sc += 7 + (laneDreiging(p) > 0 ? 2.5 : 0);   // een tweede lichaam van 4 erbij
      }
    }
    sc = sc * W.fus + rnd() * 0.4;
    if(sc > bs){ bs = sc; best = {cardId: cd.id, mode:"fuse", tributeId: tid, fuseKey: fk}; }
  }
  /* 6. Lichtkaarten — één leven is een vijfde van je totaal, dus kaarten met een
        levensprijs moeten dat echt terugverdienen. */
  const dreiging = laneDreiging(p);
  for(const cd of hand){
    if(cd.el !== "licht" || !lightPlayable(p, cd)) continue;
    const kost = LIGHTS[cd.lk].cost || 0;
    // prijs van een leven: duurder naarmate je lager staat en er meer schade dreigt
    const lp = kost ? kost * (W.levenprijs + (5 - P(p).life) * 1.3 +
                              (dreiging >= P(p).life - kost ? 9 : 0)) : 0;
    // en de prijs van een tribute: het wezen dat je ervoor opgeeft komt niet terug
    const off = LIGHTS[cd.lk].tribute ? goedkoopsteOffer(p) : null;
    if(LIGHTS[cd.lk].tribute && !off) continue;
    const op = off ? off.w * W.offerprijs : 0;
    let sc = -99;
    /* Gulzigheid trekt twee kaarten, maar kost sinds de regelwijziging óók een creature.
       Die prijs zit al in `op`; hier staat alleen wat die twee kaarten waard zijn. */
    if(cd.lk === "greed")   sc = W.greedbasis + Math.max(0, 4 - P(p).hand.length) * W.greedhand;
    if(cd.lk === "siphon"){ let m = 0; eachCre((cr, pp) => { if(pp === vij) m = Math.max(m, cr.hp); });
                            sc = m >= 2 ? 4 + m * 1.6 : -9; }
    if(cd.lk === "reborn")  sc = P(p).grave.some(x => ORDER.includes(x.el)) && open.length ? 6.5
                               : (P(p).grave.length ? 2.4 : -9);
    if(cd.lk === "kuriboh"){ const leeg = emptyCols(p).length;   // kost sinds kort geen leven meer
                             sc = leeg ? 1.2 + leeg * 1.5 + (dreiging >= 2 ? 2.5 : 0) + (dreiging >= P(p).life ? 7 : 0) : -9; }
    if(cd.lk === "dfusion"){                      // gratis fusie-lichaam: waardeer het als zo'n fusie
      const fk = aeList(p).find(k => AETHERS[k].fuse);
      if(!fk || !open.length) sc = -9;
      else {
        const el = AETHERS[fk].el, nHp = fk === "fu_stone" ? 4 : EL[el].hp;
        sc = 2 + nHp * 1.1 + nieuwAtk(p, el) * 0.9;
        if(fk === "fu_fire"){ let raak = 0;
          eachCre((cr, pp) => { if(pp !== vij) return;
            const o = dmgOutcome("vuur", cr.card.el, hasAe(p,"ae_fire6") ? 5 : 2);
            if(o === "kill" || (typeof o === "number" && cr.hp <= 2)) raak += 6; });
          sc += raak; }
        if(fk === "fu_stone" && open.length >= 2) sc += 6;

    }
    if(cd.lk === "darkhole"){ const eigen = allCreIds((cr, pp) => pp === p);
                              sc = eigen.length >= 3 && dreiging === 0 ? 3 : -9; }
    if(cd.lk === "gamble")  sc = 2.0 + Math.max(0, 3 - P(p).hand.length) * 1.4;
    if(cd.lk === "master"){ // wordt een element naar keuze: waardevol als je dat element mist
      const heeft = e => P(p).hand.some(x => x.el === e);
      const mist = ORDER.filter(e => !heeft(e));
      sc = mist.length ? 2.6 + Math.max(...mist.map(e => effWaarde(p, e))) * 0.5 : 1.2;
    }
    sc = (sc - lp - op) * W.licht;
    if(sc > bs){ bs = sc; best = {cardId: cd.id, mode:"licht"}; }
  }

     altijd iets wórden. Kan de fusie, dan gaat de fusie voor op alles hierboven. */
  const vkEl = (S.story && S.story.fuseVoorkeur) || null;
  if(vkEl && p === 1){
    for(const cd of gewoon){
      if(cd.el !== vkEl || !fuseOk(p, cd.el)) continue;
      const vkFk = aeFuseKey(p, cd.el);
      const vkOff = goedkoopsteOffer(p, fuseTributes(p, cd.el));
      if(!vkFk || !vkOff) continue;
      return {cardId: cd.id, mode:"fuse", tributeId: vkOff.id, fuseKey: vkFk};

/* Aanvallen kost niets terug: doe ze allemaal, in de beste volgorde. */
const botMagAanvallen = p => !(S && S.story && S.story.geenAanval && p === 1);
function botChooseAttackV2(p){
  if(!botMagAanvallen(p)) return null;
  const vij = opp(p);
  let best = null, bs = 0;
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if(!cr || !canAttack(cr, p)) continue;
    const def = P(vij).cols[c].cre, kracht = atkOf(cr, p);
    let sc;
    if(!def){
      sc = 40 + kracht * 3;
      if(kracht >= P(vij).life) sc = 1000;                   // dit wint het potje
    } else {
      const o = dmgOutcome(cr.card.el, def.card.el, kracht);
      if(o === "immuun") continue;                           // zinloos
      if(o === "kill") sc = 25 + creWaarde(def, vij) * 1.5;
      else if(def.hp <= o) sc = 22 + creWaarde(def, vij) * 1.2;
      else sc = 4 + o * 1.2;
    }
    if(cr.ent > 0 && cr.hp <= drainPer(cr.card.el) * cr.ent) sc += wOf(p).doemaanval;  // hij sterft toch
    if(sc > bs){ bs = sc; best = c; }
  }

}
/* keuzeschakelaar: 1 = de oude bot (referentie voor tests), 2 = de slimme bot */
let BOTLVL = [2, 2];
const botChoosePlay   = p => (BOTLVL[p] === 1 ? botChoosePlayV1(p)   : botChoosePlayV2(p));
const botChooseAttack = p => (BOTLVL[p] === 1 || wOf(p).atk === 1 ? botChooseAttackV1(p) : botChooseAttackV2(p));
function botDecide(mode){
  if(!S || S.over || !pending || S.ui.mode !== mode || !isBot(S.ui.p)) return;
  if(mode === "aetherpick"){
    let bi = 0, bb = -1e9;
    S.ui.cards.forEach((k, i) => { const s = (AE_KRACHT[k] != null ? AE_KRACHT[k] : 40);
      if(s > bb){ bb = s; bi = i; } });
    feed(bi); return;
  }
  if(mode === "banpick"){ feed({ban:[], ae:[], lt:[]}); return; }
  if(mode === "aeuitleg"){ feed(true); return; }
  if(mode === "draft"){ feed(botDraft(S.ui)); return; }
  if(mode === "pickmode"){
    const m2 = botPlan && botPlan.mode;
    if(m2 === "fuse" && S.ui.fuseOk){ feed("fuse"); return; }
    feed(m2 === "spell" && S.ui.spOk ? "spell" : "cre"); return;
  }
  if(mode === "slot"){
    const valid = S.ui.valid || [];
    if(!valid.length){ feed(S.ui.cancellable ? "cancel" : null); return; }
    let pick = null;
    if(botPlan && botPlan.col != null){ pick = valid.find(s => s.c === botPlan.col); botPlan.col = null; }
    if(!pick && botPlan && botPlan.dodgeFrom != null){
      pick = valid.find(s => s.c !== botPlan.dodgeFrom && !P(s.p).cols[s.c].cre);
      botPlan.dodgeFrom = null;
    }
    if(!pick) pick = botSlotKeuze(S.ui.p, valid, S.ui.meta && S.ui.meta.el);
    feed({p: pick.p, c: pick.c}); return;
  }
  if(mode === "priority"){
    const r = botPriority(S.ui.p);
    if(r){ botPlan = {mode: r.mode || "cre", col: r.col, water: r.water, gras: r.gras,
                      dodgeFrom: r.dodgeFrom, tributeId: r.tributeId}; feed(r.cardId); }
    else feed("pass");
    return;
  }
  if(mode === "opt"){
    const vs = S.ui.opts.map(o => o.v);
    const voorkeur = ["summon","vuur","steen"];              // liever oproepen dan terugpakken
    const k = voorkeur.find(v => vs.includes(v));
    feed(k != null ? k : vs[0]); return;
  }
  if(mode === "choice"){
    if(botPlan && botPlan.doelId != null && (S.ui.valid || []).includes(botPlan.doelId)){
      const d = botPlan.doelId; botPlan.doelId = null; feed(d); return;
    }
    feed(botChoice()); return;
  }
  if(mode === "handoff"){ feed(true); }
}
/* ---- draft: aether, lichtkaart en bans in één keer ---- */
/* Gemeten sterkte, uit ~800 zelfspel-potjes waarin elke stoel een wíllekeurige aether en
   lichtkaart opgelegd kreeg: het percentage potjes dat met die kaart gewonnen werd. */
/* Gemeten in de arena: 4 onafhankelijke reeksen van ~250 potjes per optie (±1.6). */
const AE_KRACHT = {ae_draw3:68, fu_stone:61, ae_graf:60, ae_grassx2:56, fu_water:54, ae_genade:52, ae_fire6:46,
                   ae_hp3:46, ae_watercycle:43, ae_alziend:41, ae_stonefull:39, fu_fire:39, fu_grass:38};
const LT_KRACHT = {master:61, greed:59, ontzag:55, siphon:53, gamble:50, reborn:49, kuriboh:46,
                   dfusion:45, darkhole:42, negate:0};
function botDraft(u){
  const p = u.p, aanbod = u.aethers;
  /* 1. Aether: de gemeten sterkte, met een flinke bonus voor een element dat de bot al
        heeft — dan wijzen zijn bans en zijn deck dezelfde kant op. */
  const eigen = aeList(p).map(k => AETHERS[k].el).filter(Boolean);
  let a = 0, ab = -1e9;
  aanbod.forEach((k, i) => {
    let s = (AE_KRACHT[k] != null ? AE_KRACHT[k] : 40);
    if(AETHERS[k].el && eigen.includes(AETHERS[k].el)) s += 15;
    if(s > ab){ ab = s; a = i; }
  });
  const nieuweAe = aanbod[a];
  /* 2. Lichtkaart: ook op gemeten sterkte. ✦ Volledige Negatie speelt de bot nooit, dus
        die neemt hij ook niet; ✦ Directe Fusie alleen met een fusie-aether — dan is hij top. */
  const heeftFusie = aeList(p).some(k => AETHERS[k].fuse) || !!AETHERS[nieuweAe].fuse;
  let l = 0;
  if(u.lights.length){
    let lb = -1e9;
    u.lights.forEach((k, i) => {
      if(k === "negate") return;
      let s = (LT_KRACHT[k] != null ? LT_KRACHT[k] : 40);
      if(k === "dfusion") s = heeftFusie ? s + 25 : -1e6;
      if(s > lb){ lb = s; l = i; }
    });
  }
  /* 3. Bans: alles wat niet het element van een van je aethers is (typeloos → alles weg). */
  const types = aeList(p).concat([nieuweAe]).map(k => AETHERS[k].el).filter(Boolean);
  const ban = u.cards.filter(c => !types.includes(c.el)).map(c => c.id);
  return {a, l, ban};
}
/* ---- verdediging: hoeveel schade kan de tegenstander nu direct doorbrengen? ---- */
function directeSchade(p){
  let n = 0;
  for(let c=0;c<5;c++){
    const att = P(opp(p)).cols[c].cre;
    if(!att || att.ent > 0) continue;
    if(!P(p).cols[c].cre) n += atkOf(att, opp(p));
  }
  return n;
}
const inNood = p => directeSchade(p) >= P(p).life;
function botPriority(p){
  if(!P(p).hand.some(cd => magSpelen(p, cd.id))) return null;
  const top = S.stack[S.stack.length - 1];
  if(!top || !hasLegalFlash(p)) return null;
  const vrij = openCols(p);
  const flashKaart = pred => P(p).hand.find(cd => cd.el !== "licht" && EL[cd.el].flash && pred(cd));

  /* A. Een 🔥-effect mikt op een eigen creature. */
  const bedreigd = vuurDreiging(p);
  /* A1. De truc: offer dat wezen zélf voor een 🟣 fusie. Het effect fizzelt (het doelwit is
         weg) én je krijgt er een fusie-creature voor terug. */
  if(bedreigd && wOf(p).fusdodge){
    const fu = P(p).hand.find(cd => cd.el !== "licht" && fuseOk(p, cd.el, "flash")
                                    && fuseTributes(p, cd.el).includes(bedreigd.cr.card.id));
    if(fu) return {cardId: fu.id, mode:"fuse", tributeId: bedreigd.cr.card.id};
  }
  /* A2. Anders: met 💧 Water wegschuiven. */
  if(bedreigd && vrij.length){
    const w = flashKaart(cd => cd.el === "water");
    // 💧 herspeelt alleen je eigen creatures
    const mag = waterTargets(p).includes(bedreigd.cr.card.id);
    if(w && mag) return {cardId: w.id, col: vrij.find(c => c !== bedreigd.c) ?? vrij[0],
                         water: bedreigd.cr.card.id, dodgeFrom: bedreigd.c};
  }

  /* B. Een aanval op de chain. Blokkeren als het kan — en bij dreigend verlies koste wat kost. */
  if(top.type === "attack" && top.ctrl === opp(p)){
    const att = P(opp(p)).cols[top.col].cre;
    if(att && !P(p).cols[top.col].cre){
      const kracht = atkOf(att, opp(p));
      const dood = kracht >= P(p).life || inNood(p);      // dit mag niet doorkomen
      if(vrij.includes(top.col)){
        // 1) blocker die immuun is voor de aanvaller
        const imm = flashKaart(cd => dmgOutcome(att.card.el, cd.el, 1) === "immuun");
        if(imm) return {cardId: imm.id, col: top.col};
        // 2) blocker die de aanvaller juist instakillt
        const kill = flashKaart(cd => EL[cd.el].strong === att.card.el);
        if(kill) return {cardId: kill.id, col: top.col};
        // 3) bij levensgevaar: gewoon iets neerzetten, wat dan ook
        if(dood){
          const wat = flashKaart(() => true);
          if(wat) return {cardId: wat.id, col: top.col};
        }
      }
      // 4) gras-flash: entangle de aanvaller zodat hij niet doorkomt
      const gr = flashKaart(cd => cd.el === "gras");
      if(gr && vrij.length) return {cardId: gr.id, col: vrij.includes(top.col) ? top.col : vrij[0], gras: att.card.id};
    }
  }
  return null;
}
/* Waar zet de bot deze creature neer als er geen plan ligt? Niet zomaar de eerste vrije
   kolom: het liefst op zijn eigen spell, zodat die spell nóg een keer afgaat. */
function botSlotKeuze(p, valid, el){
  const W = wOf(p), vij = opp(p);
  let best = null, bs = -1e9;
  for(const s of valid){
    if(s.kind !== "cre"){                       // spell-plek: gewoon de eerste vrije
      if(best === null){ best = s; bs = -1e8; }
      continue;
    }
    let sc;
    if(el && EL[el]) sc = plekWaarde(s.p, el, s.c);
    else {
      sc = 2.5;
      const sp = P(s.p).cols[s.c].spell;
      if(sp) sc += W.spellslot + spellTriggerWaarde(s.p, sp.card.el) * W.spelltrig;
      const tegen = P(opp(s.p)).cols[s.c].cre;
      if(tegen && tegen.ent === 0) sc += atkOf(tegen, opp(s.p)) * W.blok;
      else if(!tegen) sc += W.vrij;
    }
    if(P(s.p).cols[s.c].cre) sc -= 1.5;          // we lossen hier een wolk op
    sc += rnd() * 0.4;
    if(sc > bs){ bs = sc; best = s; }
  }
  return best || valid[0];
}
function botChoice(){
  const u = S.ui, ids = u.valid, m = u.meta || {};
  const p = u.p != null ? u.p : 1, vij = opp(p);
  const F = id => findCre(id);
  const self = m.selfId != null && ids.includes(m.selfId) ? m.selfId : null;
  if(u.kind === "hand" || m.k === "discard"){
    const hand = P(p).hand;
    if(m.k === "handmax" && hand.length){
      /* Boven de limiet: eerst de overtolligste kaart weg, en lichtkaarten hou je vast. */
      const tel = {};
      hand.forEach(cd => { const k2 = cd.lk ? "licht" : cd.el; tel[k2] = (tel[k2] || 0) + 1; });
      let slecht = null, ss = -1e9;
      for(const cd of hand){
        let sc = tel[cd.lk ? "licht" : cd.el] * 1.5;
        if(cd.lk) sc -= 7; else sc -= (spellVal0[cd.el] || 1) * 0.35 + effWaarde(p, cd.el) * 0.2;
        if(sc > ss){ ss = sc; slecht = cd; }
      }
      if(slecht) return slecht.id;
    }
    const pick = hand[hand.length-1] || null;
    return pick ? pick.id : (ids[0] || null);
  }
  if(m.k === "tribute"){
    if(botPlan && botPlan.tributeId != null && ids.includes(botPlan.tributeId)){
      const t = botPlan.tributeId; botPlan.tributeId = null; return t;
    }
    // offer het minst waardevolle eigen wezen
    let slecht = null, sw = 1e9;
    for(const id of ids){ const f = F(id); if(!f) continue;
      const w = creWaarde(f.cr, p); if(w < sw){ sw = w; slecht = id; } }
    return slecht !== null ? slecht : (ids[0] || null);
  }
  if(m.k === "siphon"){
    let best = null, bs = -99;
    for(const id of ids){ const f = F(id); if(!f) continue;
      // eigen wezen dat tóch sterft: zuig hem leeg, dan wordt hij tenminste nog levens
      const sc = f.p === vij ? 4 + f.cr.hp * 2 : (doemt(p, f) ? 2 + f.cr.hp * 1.6 : -5 + f.cr.hp);
      if(sc > bs){ bs = sc; best = id; } }
    if(u.optional && bs < 0) return null;
    return best !== null ? best : (ids[0] || null);
  }
  if(m.k === "vuur"){
    const big = hasAe(p, "ae_fire6"), dmg = big ? 5 : 2;
    let best = null, bs = -99;
    for(const id of ids){
      const f = F(id); if(!f) continue;
      const o = dmgOutcome("vuur", f.cr.card.el, dmg);
      let sc;
      if(f.p === vij) sc = (o === "kill" || (typeof o === "number" && f.cr.hp <= o)) ? 6 + f.cr.hp : (o === "immuun" && !big ? -5 : 1 + f.cr.hp * 0.2);
      else sc = offerVuurWaarde(p, f);          // eigen offer: instakill + trek een kaart
      if(sc > bs){ bs = sc; best = id; }
    }
    if(u.optional && bs < 0) return null;
    return best !== null ? best : (ids[0] || null);
  }
  if(m.k === "gras"){
    if(botPlan && botPlan.gras != null && ids.includes(botPlan.gras)){ const g = botPlan.gras; botPlan.gras = null; return g; }
    let best = null, bs = -99;
    for(const id of ids){
      if(id === self) continue;                             // jezelf entanglen blokkeert je eigen aanval
      const f = F(id); if(!f) continue;
      let sc = f.p === vij ? 3 + f.cr.hp * 0.3 : -3;
      if(f.p === vij && f.cr.card.el === "steen") sc += 5;   // dubbele drain
      if(sc > bs){ bs = sc; best = id; }
    }
    if(u.optional && bs < 0) return null;
    return best !== null ? best : (ids[0] || null);
  }
  if(m.k === "steen"){
    if(self !== null) return self;                          // zichzelf oppompen is bijna altijd goed
    const own = ids.filter(id => F(id) && F(id).p === p);
    return own[0] || (u.optional ? null : (ids[0] || null));
  }
  if(m.k === "water"){
    if(botPlan && botPlan.water != null && ids.includes(botPlan.water)){ const w = botPlan.water; botPlan.water = null; return w; }
    // herspeel het liefst een eigen creature in een kolom met een eigen spell
    const W = wOf(p);
    let verhuis = 0, verhuisCol = null;
    for(const c of openCols(p)){
      const sp = P(p).cols[c].spell;
      if(sp){ const v = spellTriggerWaarde(p, sp.card.el); if(v > verhuis){ verhuis = v; verhuisCol = c; } }
    }
    const dub = hasAe(p, "ae_watercycle") ? 2 : 1;
    let best = null, bs = -99, bestCol = null;
    for(const id of ids){ const f = F(id); if(!f || f.p !== p) continue;
      let sc = 1 + creWaarde(f.cr, p) * 0.2 + effWaarde(p, f.cr.card.el) * 0.6 * dub;
      const hier = P(p).cols[f.c].spell ? spellTriggerWaarde(p, P(p).cols[f.c].spell.card.el) : 0;
      let col = null, bonus = hier;
      if(verhuis > hier){ bonus = verhuis; col = verhuisCol; }
      sc += bonus * W.spelltrig;
      if(f.cr.ent > 0) sc += 3;                 // tokens vallen weg
      const basis = EL[f.cr.card.el].hp;
      if(f.cr.hp < basis) sc += (basis - f.cr.hp) * W.waterheal;
      if(sc > bs){ bs = sc; best = id; bestCol = col; } }
    if(best !== null && bestCol !== null && botPlan) botPlan.col = bestCol;   // dáár moet hij landen
    return best !== null ? best : null;
  }
  if(m.k === "tribute") return ids[0] || null;
  if(m.k === "discard") return ids[ids.length-1] || null;
  return u.optional ? null : ids[0];
}

let M = null; // modal: {type:'grave',p} | {type:'help'} | {type:'restart'}
function circleSVG(w){
  const cx = 100, cy = 96, r = 60;
  const ring = [ORDER[0]];                       // volg de sterk-tegen-ketting, zo staan de pijlen netjes rond
  while(ring.length < ORDER.length){ const nx = EL[ring[ring.length-1]].strong; if(!nx || ring.includes(nx)) break; ring.push(nx); }
  ORDER.forEach(el => { if(!ring.includes(el)) ring.push(el); });
  const pos = ring.map((el, k) => { const a = (-90 + 360/ring.length*k) * Math.PI/180; return {el, x:cx + r*Math.cos(a), y:cy + r*Math.sin(a)}; });
  let arrows = "";
  for(let k=0;k<ORDER.length;k++){
    const a = pos[k], b = pos.find(q => q.el === EL[a.el].strong);
    if(!b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    const ux = dx/L, uy = dy/L, m = 20;
    arrows += `<line x1="${a.x+ux*m}" y1="${a.y+uy*m}" x2="${b.x-ux*(m+4)}" y2="${b.y-uy*(m+4)}"
      stroke="#c9a86a" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/>`;
  }
  const nodes = pos.map(pt =>
    `<circle cx="${pt.x}" cy="${pt.y}" r="15" fill="#1c242c" stroke="#3a4552"/>
     <text x="${pt.x}" y="${pt.y+5}" text-anchor="middle" font-size="15">${icon(pt.el)}</text>`).join("");
  return `<svg viewBox="0 0 200 192" width="${w}">
    <defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#c9a86a"/></marker></defs>
    ${arrows}${nodes}
    <text x="100" y="94" text-anchor="middle" font-size="8.5" fill="#8b96a0" font-family="Cinzel,serif" letter-spacing="1">STERK</text>
    <text x="100" y="104" text-anchor="middle" font-size="8.5" fill="#8b96a0" font-family="Cinzel,serif" letter-spacing="1">TEGEN ➜</text>
  </svg>`;
}

/* Alle creatures waar iets op de chain nu op mikt — die krijgen een ring op het bord. */
function chainDoelen(){
  const uit = {};
  if(!S || !S.stack) return uit;
  S.stack.forEach(it => {
    const lijst = it.type === "play" ? (it.plan || [])
                : it.type === "light" ? (it.plan && it.plan.tid != null ? [it.plan] : [])
                : (it.dec && it.tid != null ? [it] : []);
    lijst.forEach(e => {
      if(e.tid == null) return;
      const f = findCre(e.tid);
      if(!f || (e.tp != null && (f.p !== e.tp || f.c !== e.tc))) return;
      const nm = it.type === "light" ? "✦ " + LIGHTS[it.lk].name
               : (EL[e.el] ? icon(e.el) + " " + EL[e.el].name : "effect");
      if(!uit[e.tid]) uit[e.tid] = {door: it.ctrl, wat: nm};
    });
  });
  return uit;
}
function uiHl(){
  const u = S.ui, hl = {slots:[], cards:[], tgts:[], atks:[], mik:chainDoelen()};
  if(u.mode === "slot"){ hl.slots = u.valid; if(u.meta && u.meta.doods) hl.doods = true; }
  else if(u.mode === "choice" && u.kind === "cre") hl.tgts = u.valid;
  else if(u.mode === "priority"){
    const tst = u.p === 0 ? tutStap() : null;
    hl.cards = P(u.p).hand.filter(cd => magSpelen(u.p, cd.id) &&
      (tst ? cd.el === tst.flash : true) && (cd.el === "licht" ? lightPlayable(u.p, cd)
        : ((EL[cd.el].flash && openCols(u.p).length > 0) || fuseOk(u.p, cd.el, "flash")))
    ).map(cd => cd.id);
  }
  else if(u.mode === "choice" && u.kind === "hand") hl.handSel = u.valid;
  else if(u.mode === "battle"){
    for(let c=0;c<5;c++){ const cr=P(S.tp).cols[c].cre; if(cr && canAttack(cr,S.tp)) hl.atks.push(cr.card.id); }
    hl.cards = P(S.tp).hand.filter(cd => battleFlashOk(S.tp, cd)).map(cd => cd.id);
    hl.battleFlash = true;
  }
  return hl;
}

  }

function draftSync(){
  const u = S.ui; if(!u || u.mode !== "draft") return;
  const box = document.querySelector(".draftbox");
  const y = box ? box.scrollTop : 0;
  document.querySelectorAll('#overlay [data-act="aepick"]').forEach((el, i) => el.classList.toggle("chosen", u.selA === i));
  document.querySelectorAll('#overlay [data-act="lpick"]').forEach((el, i) => el.classList.toggle("chosen", u.selL === i));
  document.querySelectorAll('#overlay [data-act="bansel"]').forEach(el => {
    const aan = u.sel.includes(+el.dataset.id);
    el.classList.toggle("banned", aan);
    const x = el.querySelector(".banx");
    if(aan && !x){ const d = document.createElement("div"); d.className = "banx"; d.textContent = "✕"; el.appendChild(d); }
    if(!aan && x) x.remove();
  });
  const b = document.getElementById("draftbtn");
  if(b) b.innerHTML = draftBtnTxt(u);
  if(box) box.scrollTop = y;
}

function decorVerf(id){
  let laag = document.getElementById("decor");
  if(!laag){ laag = document.createElement("div"); laag.id = "decor"; document.body.appendChild(laag); }
  laag.innerHTML = "";
  if(FAST) return;
  (DECOR[id] || []).forEach(d => {
    const pad = DECOR_BEELD[d.b];
    if(!pad) return;
    const el = document.createElement("div");
    el.className = "dec" + (d.beweeg ? " " + d.beweeg : "");
    el.style.left = d.x + "%"; el.style.top = d.y + "%";
    el.style.width = (d.b2 || 8) + "%";
    if(d.traag) el.style.setProperty("--dd", d.traag + "s");
    el.style.setProperty("--do", d.op != null ? d.op : .30);
    /* Ontbreekt het bestand, dan haalt het plaatje zichzelf weg. */
    el.innerHTML = `<img src="${pad}" alt="" decoding="sync" onerror="this.closest('.dec').remove()">`;
    laag.appendChild(el);
  });
}

function spriteSVG(key){
  const d = SPR_ART[key]; if(!d) return "";
  /* Staat er een eigen tekening ingesteld, dan is dát het plaatje — de oude pixelversie
     wordt niet eens getekend, zodat er niks doorheen kan flitsen. Ontbreekt het bestand,
     dan blijft die plek gewoon leeg. */
  const beeld = SPRITE_BEELD[key];
  /* Is de tekening al binnen, dan mag hij meteen zichtbaar zijn. Zo niet, dan komt hij
     pas in beeld als hij helemaal geladen is — nooit half. */
  const maat = SPRITE_MAAT[key];
  if(beeld) return `<span class="sprwrap"${maat ? ` style="--sprmaat:${maat}"` : ""}>`
    + `<img class="sprbeeld${beeldKlaar(beeld) ? " klaar" : ""}" src="${beeld}" alt=""`
    + ` decoding="sync" onload="this.classList.add('klaar')" onerror="this.remove()"></span>`;
  return spriteSVG.pix(key);
}
spriteSVG.pix = function(key){
  const d = SPR_ART[key]; if(!d) return "";
  const pal = SPR_PAL[d.pal], art = d.art, w = art[0].length, h = art.length;
  let r = "";
  for(let y=0;y<h;y++){
    let x = 0;
    while(x < w){
      const c = art[y][x];
      let n = 1;
      while(x + n < w && art[y][x+n] === c) n++;
      if(c !== "0") r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[+c]}"/>`;
      x += n;
    }
  }
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${r}</svg>`;
};

  "3-2":{
    wereld:3, naam:"Brandstof", vijand:"Broeder As", sprite:"cultist", zegKleur:"#ff8a4a",
    intro:[
      {s:null, bg:3, naam:"…", t:"De as wordt dieper. Je loopt er tot je enkels in, en het is warm zoals badwater warm is, wat het veel erger maakt."},
      {s:null, bg:3, naam:"…", kleur:"#ff6a2a", t:"Voor je uit ligt een kloof. Er komt licht uit. Licht hoort niet uit de grond te komen."},
      {s:"cultist", bg:3, naam:"…", kleur:"#ff8a4a", t:"Aan de rand staat een man in een verbrand gewaad. Hij staat er zoals mensen bij een bushalte staan."},
      {s:"cultist", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Ah. Jij bent het. Ik had je pas over een uur ingepland, maar goed, dan schuiven we op."},
      {s:"cultist", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Broeder As. Derde Kring. Nee, dat zegt je niets, dat is ook een beetje het idee van een derde kring."},
      {s:"cultist_lach", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Wij stoken de oven. Al tweehonderd jaar. Wij weten niet wat erin gaat en wij weten niet wat eruit komt, en dat is geen probleem, dat is <b>toewijding</b>."},
      {s:"cultist", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Je kijkt alsof je daar iets van vindt. Iedereen vindt daar iets van. Ze staan er alleen zelden lang genoeg om het af te maken."},
      {s:null, bg:3, naam:"…", kleur:"#ff6a2a", t:"Hij tikt twee keer met zijn hak op de rand van de kloof. Onder je voeten begint iets te schuiven."},
      {s:"balrog", reus:true, bg:3, naam:"…", kleur:"#ff6a2a", t:"Er komt iets omhoog. Niet snel. Zoals een deur opengaat als er geen haast bij is."},
      {s:"cultist_lach", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Dit is de Balrog. Nee, niet díe. Er is geen díe. Dit is gewoon wat er onder een oven gaat wonen als je hem lang genoeg aan laat staan."},
      {s:"cultist", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Hij is van mij. Nou ja — ik voer hem. Bij dat soort dingen is dat hetzelfde."},
      {s:null, bg:3, naam:"…", kleur:"#ff6a2a", t:"👹 <b>Het beest</b> heeft <b>20 levens</b> en <b>geen element</b>: de elementcirkel doet hem niets, in geen van beide richtingen. Hij slaat als iedereen — met de <b>helft van zijn levens</b>."},
      {s:null, bg:3, naam:"…", kleur:"#ff6a2a", t:"🌿 Entangle-tokens zuigen hem wél leeg, maar ze houden hem <b>niet</b> thuis. En elke beurt van zijn baas komen er <b>2 levens</b> bij."},
      {s:"cultist_lach", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"En hij gaat niet dood. Dat is geen opschepperij, dat is gewoon administratie. Je kunt hem op nul zetten. Verder komt hij niet en verder gaat hij niet."},
      {s:"cultist", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"O — en hij slaat meteen. Hij is niet net wakker geworden. Hij heeft nooit geslapen. Ik overigens ook niet, maar daar vraagt niemand naar."},
      {s:"cultist_lach", bg:3, naam:"Broeder As", kleur:"#ff8a4a", t:"Zo. Volgens mij hebben we alles gehad. Ik ben niks vergeten. Speel maar."}

    midden:[
      {s:"cultist", naam:"Broeder As", kleur:"#ff8a4a", t:"Je speelt goed. Dat is geen compliment, dat is een observatie. Ik doe niet aan complimenten, ik doe aan notulen."},

    middenNa:2,
    win:[

      {s:"cultist_stuk", naam:"Broeder As", kleur:"#ff8a4a", t:"…Hm. Ja. Dat had ik niet."},
      {s:"cultist_stuk", naam:"…", kleur:"#ff8a4a", t:"Zijn kap valt naar achteren. Eronder zit een doodgewone vermoeide man met roet in zijn wenkbrauwen."},
      {s:"cultist_stuk", naam:"Broeder As", kleur:"#ff8a4a", t:"Weet je wat het is: hier hoeft niemand ooit iets uit te leggen. Dat is de gewoonte. Je krijgt de regels pas als je ze al overtreden hebt."},
      {s:"cultist_stuk", naam:"Broeder As", kleur:"#ff8a4a", t:"Ik heb één keer gevraagd wat er in die oven gesmeed wordt. Eén keer. Toen kwam de baas langs. Hij heeft niks gedaan. Hij heeft alleen even gekeken."},
      {s:"cultist_stuk", naam:"Broeder As", kleur:"#ff8a4a", t:"Ik heb daarna vier maanden niet gepraat. Dat was voor iedereen wel even rustig, dat geef ik toe."},

      {s:"cultist", naam:"Broeder As", kleur:"#ff8a4a", t:"Neem dit. Het is het enige wat ik heb dat 'nee' betekent. Ik heb er zelf nooit iets mee gedurfd. Jij vast wel, jij hebt dat gezicht."}

    na:[

    ],
    zegSpr:"cultist",
    zeg:{ beurt:[

        {s:"fireguy_baas", reus:true, naam:"…", kleur:"#ffd45e", t:"Wat overeind komt houdt niet op bij twee meter. Het houdt op bij de schoorsteen, en dan blijkt de schoorsteen precies zo hoog te zijn als hij."},

        {s:"fireguy_baas", reus:true, naam:"Flint", kleur:"#ffd45e", t:"De steen die je zijn berg gaf. Het woud dat je zijn ranken gaf. Vonk die je haar sprong gaf. Waar denk je dat ze dat vandaan hadden?"},
        {s:"fireguy_baas", reus:true, naam:"Flint", kleur:"#ffd45e", t:"Daarom mag er niks gegéven worden, kleine. Niet omdat het gevaarlijk is. Omdat het van mij is en ze het niet terug kunnen betalen."},
        {s:"fireguy_baas", reus:true, naam:"Flint", kleur:"#ffd45e", paars:true, t:"🟣 Dus ik wil het even terugzien. <b>Alles wat jij vandaag hebt meegenomen, speel ik ook.</b> Vind ik netjes staan naast elkaar."},
        {s:null, naam:"…", kleur:"#ff6a2a", t:"🌋 <b>Lava.</b> Aan het eind van elke ronde komt het onder je omhoog: alles op het veld dat geen 🔥 Vuur is verliest <b>1 leven</b>, aan allebei de kanten."},
        {s:null, naam:"…", kleur:"#ffd45e", t:"🔥 <b>En de hitte.</b> Die stond al die tijd op te lopen terwijl hij niets deed. Elke aanval van hem doet er nu <b>zoveel schade bovenop</b>."},
        {s:"fireguy_baas", reus:true, naam:"Flint", kleur:"#ffd45e", t:"Je bord is weg, ja. Het mijne ook. Pak er twee bij, dan sta je tenminste niet met lege handen te kijken. Ik ben niet oneerlijk, ik ben alleen groot."},
        {s:"fireguy_baas", reus:true, naam:"Flint", kleur:"#ffd45e", t:"Ik heb je gewaarschuwd toen je nog in de steen liep. Ik heb je gewaarschuwd bij het woud. Ik heb je gewaarschuwd bij de grens."},

      {s:"fireguy", naam:"Flint", kleur:"#ff8a4a", t:"En je krijgt er een stuk van mij bij. Je gaat het nodig hebben. Waar jij heen gaat is het nat en daar wordt ik nogal klein van."},
      {s:null, naam:"…", kleur:"#c684ff", paars:true, t:"🟣 Vanaf nu neem je <b>drie aethers</b> én <b>drie lichtkaarten</b> mee naar elk gevecht. En je gaat de Diepstroom in met één leven extra."},

      {s:"sluiswachter", bg:4, naam:"…", kleur:"#a9e2ff", t:"Ernaast staat een man met een pet en een klembord. Hij kijkt op zijn klembord. Hij kijkt naar de poort. Hij kijkt weer op zijn klembord."},

      {s:"sluiswachter", bg:4, naam:"…", kleur:"#a9e2ff", t:"Je vraagt van wie dat schema is. Hij bladert. Hij bladert een tijdje."},

      {s:null, bg:4, naam:"…", kleur:"#e6c88a", t:"🚪 <b>De sluis.</b> Elke beurt valt er in één kolom een poort naar beneden. Daar gaat niets door — jouw aanval niet en de zijne niet — en de poort schuift elke beurt één kolom op."},

      {s:"sluiswachter", naam:"Sluiswachter", kleur:"#a9e2ff", t:"Ik heb hier één keer iemand gehad met een halo, die vond het schema heel interessant. Hij heeft er een uur naar gekeken en toen niks gezegd."}

      {s:"sluiswachter", naam:"Sluiswachter", kleur:"#a9e2ff", t:"Ik geef u dit mee. Het zat in de kast bij de reserve-onderdelen en er hoort geen formulier bij, dus het is van niemand."},

  "4-2":{

      {s:null, bg:4, naam:"…", kleur:"#4da35c", t:"Het licht wordt groen. En dan staan ze er: schepen. Tientallen. Rechtop in het zand, met hun masten nog omhoog, alsof iemand ze heel voorzichtig heeft neergezet."},

      {s:"skelet", bg:4, naam:"…", kleur:"#d5c07a", t:"Het zijn skeletten. Ze doen hun werk. Ze doen hun werk heel goed, en ze doen het al heel lang, en het levert niets op."},

      {s:"kapitein", groot:true, bg:4, naam:"Kapitein Zoutwater", kleur:"#d5c07a", t:"AAN DEK! Er is bezoek! Kijk eens aan, kijk eens aan!"},
      {s:"kapitein", groot:true, bg:4, naam:"Kapitein Zoutwater", kleur:"#d5c07a", t:"Zoutwater is de naam. Kapitein Zoutwater. Wij liggen hier voor de kust — even, hè, tijdelijk, we wachten op de wind."},

      {s:"kapitein", groot:true, bg:4, naam:"Kapitein Zoutwater", kleur:"#d5c07a", t:"Mijn mannen zijn de beste bemanning die er vaart. Kijk ze eens gaan. Geen één klaagt ooit."},
      {s:null, bg:4, naam:"…", kleur:"#d5c07a", t:"Niemand heeft hem verteld dat hij dood is. Twee eeuwen lang heeft niemand het hart gehad."},

/* ================= TUTORIAL =================
   1-1 leert je drie dingen en verder niets: de elementcirkel, het dodgen van een effect,
   en dat een spell zijn ding meteen doet. Zolang een stap loopt kun je alleen díe zet
   doen; er is altijd een knop om de hele boel over te slaan. */
function tutAan(){ return !!(S && S.story && S.story.tut && !S.story.tut.klaar); }
function tutStap(){
  if(!tutAan()) return null;
  const t = S.story.tut;
  return t.stappen[t.i] || null;
}
function tutOpen(){ return !!(tutAan() && S.story.tut.open); }
function tutBalk(){
  let el = document.getElementById("tutpop");
  const st = tutStap();
  if(!st || !S.story.tut.open){ if(el) el.classList.remove("aan"); return; }
  if(!el){ el = document.createElement("div"); el.id = "tutpop"; document.body.appendChild(el); }
  el.innerHTML = `<div class="tutdoos">
    <div class="tutnr">Stap ${S.story.tut.i + 1} van ${S.story.tut.stappen.length}</div>
    <div class="tuttxt">${st.t}</div>
    <div class="tutknoppen">
      <button class="tutok" data-act="btn" data-btn="tutok">Begrepen</button>
      <button class="tutweg" data-act="btn" data-btn="tutweg">⏭ tutorial overslaan</button>
    </div></div>`;
  el.classList.add("aan");
}
/* Doe je iets anders dan de opdracht, dan komt de pop-up meteen terug met dezelfde stap. */
function tutNudge(txt){
  if(FAST) return;
  if(txt) addLog("🎓 " + txt);
  AU.play("blip");
  if(!S || !S.story || !S.story.tut) return;
  S.story.tut.open = true;
  tutBalk();
  const el = document.getElementById("tutpop");
  if(el){ el.classList.remove("nee"); void el.offsetWidth; el.classList.add("nee"); }
}
/* Mag deze zet nu? Zo niet: een duwtje terug en verder niets. */
function tutMag(soort, data){
  const st = tutStap();
  if(!st) return true;
  if(soort === "kaart"){
    if(st.kaart && data.el !== st.kaart){
      tutNudge(`Nu even alleen ${icon(st.kaart)} ${EL[st.kaart].name}.`); return false; }
    if(!st.kaart && !st.flash){ tutNudge("Nu even geen kaart."); return false; }
  }
  if(soort === "mode"){
    if(st.mode && data !== st.mode){
      tutNudge(st.mode === "spell" ? "Speel hem als <b>spell</b>." : "Zet hem neer als <b>creature</b>."); return false; }
  }
  if(soort === "aanval"){
    if(st.aanval == null){ tutNudge("Nog niet aanvallen."); return false; }
    if(st.aanval !== data){ tutNudge(`Val aan met de creature in kolom ${st.aanval + 1}.`); return false; }
  }
  if(soort === "beurt"){
    if(!st.beurtAf){ tutNudge("Je bent nog niet klaar."); return false; }
  }
  /* De knoppen rechtsonder: alleen die de opdracht nodig heeft doen het. */
  if(soort === "fase"){
    const mag = data === "tobattle"  ? st.aanval != null
              : data === "endbattle" ? !!st.beurtAf
              : data === "endturn"   ? !!st.beurtAf : false;
    if(!mag){
      tutNudge(st.aanval != null && data !== "tobattle" ? "Eerst aanvallen."
             : st.beurtAf ? "Lees de stap even." : "Je bent nog niet klaar met deze stap.");
      return false;
    }
  }
  if(soort === "pass"){
    if(st.flash){ tutNudge("Niet doorlaten — speel nu je kaart als reactie."); return false; }
    tutNudge("Nog even niet."); return false;
  }
  return true;
}
function tutKlaarStap(soort, data){
  const st = tutStap();
  if(!st) return;
  let raak = false;
  if(soort === "kaart" && st.kaart && data && data.el === st.kaart
     && (!st.mode || data.mode === st.mode)) raak = true;
  if(soort === "flash" && st.flash && data === st.flash) raak = true;
  if(soort === "aanval" && st.aanval != null && data === st.aanval) raak = true;
  if(soort === "beurt" && st.beurtAf) raak = true;
  if(!raak) return;
  S.story.tut.i++;
  if(S.story.tut.i >= S.story.tut.stappen.length) tutStop(true);
  else { S.story.tut.open = true; if(!FAST) AU.play("light"); }
  render();
}
function tutStop(gehaald){
  if(!S || !S.story || !S.story.tut) return;
  S.story.tut.klaar = true;
  S.story.tut.open = false;
  const el = document.getElementById("tutpop"); if(el) el.remove();
  addLog(gehaald ? "🎓 Dat waren de basics. Vanaf hier speel je zelf." : "🎓 Tutorial overgeslagen.", true);
  render();
}
/* De tegenstander denkt in de tutorial niet na: hij speelt een vast scriptje. */
async function tutVijandZet(){
  const st = S && S.story;
  if(!st || !st.tut || st.tut.klaar || !st.vijZetten) return false;
  const zetten = st.vijZetten[S.turnNo[1]];
  if(!zetten || !zetten.length) return false;
  st.vijZetten[S.turnNo[1]] = null;
  for(const z of zetten){
    if(S.over) return true;
    let i = P(1).hand.findIndex(c => c.el === z.el && !c.lk);
    if(i < 0){
      const d = P(1).deck.findIndex(c => c.el === z.el && !c.lk);
      if(d < 0) continue;
      P(1).hand.push(P(1).deck.splice(d, 1)[0]);
      i = P(1).hand.length - 1;
    }
    const kaart = P(1).hand.splice(i, 1)[0];
    botPlan = {mode: z.mode || "cre", col: z.col, doelId: null};
    if(z.doelJij){
      const f = allCreIds((cr, pp) => pp === 0)[0];
      botPlan.doelId = f != null ? f : null;
    }
    await announcePlay(1, kaart, z.mode === "spell", z.col, false);
    await chainLoop();
    if(S.over) return true;
  }
  return true;
}
/* Heeft dit level ergens in zijn praatje een keuze? Dan is de cutscene deel van het level. */
function heeftKeuze(id){
  const L = STORY[id]; if(!L) return false;
  return Object.keys(L).some(k => Array.isArray(L[k]) && L[k].some(r => r && r.keuze));
}
const storyKlaar = id => SET.story.klaar.indexOf(id) >= 0;
function storyVrij(id){
  if(SET.story.vrij) return true;
  let i = STORY_ORDER.indexOf(id);
  if(i <= 0) return true;
  /* Levels die nog niet bestaan slaan we over — anders zet één gat de rest van de wereld op slot. */
  while(i > 0 && !STORY[STORY_ORDER[i-1]]) i--;
  if(i <= 0) return true;
  return storyKlaar(STORY_ORDER[i-1]);
}
function storyVoltooi(id, extra){
  if(!storyKlaar(id)){ SET.story.klaar.push(id); }
  if(!SET.story.extra || typeof SET.story.extra !== "object") SET.story.extra = {};
  const exLicht = extra && extra.licht;
  (Array.isArray(exLicht) ? exLicht : (exLicht ? [exLicht] : [])).forEach(k => {
    if(!LIGHTS[k]) return;
    if(!Array.isArray(SET.story.extra[id])) SET.story.extra[id] = [];
    if(SET.story.extra[id].indexOf(k) < 0) SET.story.extra[id].push(k);
  });
  /* Sommige tegenstanders geven je hun kracht als je wint. */
  if(!Array.isArray(SET.story.aethers)) SET.story.aethers = [];
  if(!Array.isArray(SET.story.lichten)) SET.story.lichten = [];
  const L0 = STORY[id] || {};
  const g = L0.geeft;
  (Array.isArray(g) ? g : (g ? [g] : [])).forEach(k => {
    if(AETHERS[k] && SET.story.aethers.indexOf(k) < 0) SET.story.aethers.push(k);
  });
  const gl = L0.geeftLicht;
  (Array.isArray(gl) ? gl : (gl ? [gl] : [])).forEach(k => {
    if(LIGHTS[k] && SET.story.lichten.indexOf(k) < 0) SET.story.lichten.push(k);
  });
  if(L0.geeftHart) SET.story.hart = L0.geeftHart;
  saveSet();
}
function storySkin(w){
  const app = document.getElementById("app");
  if(!app) return;
  for(let i=0;i<=5;i++) app.classList.toggle("w" + i, w === i);
  /* Binnen een wereld heeft elk level zijn eigen kleurzweem. */
  [...app.classList].forEach(c => { if(/^lv\d/.test(c)) app.classList.remove(c); });
  const id = (S && S.story && S.story.id) || (M && M.type === "praat" && M.id) || null;
  if(id) app.classList.add("lv" + id);
}

   Handig terwijl je ze een voor een toevoegt — je ziet meteen welke naam nog leeg is. */
const MUZIEK_UITLEG = {
  titel:"titelscherm", kaart:"wereldkaart", gevecht:"vrij spel",
  w1_rustig:"1 · gesprek", w1_gespannen:"1 · gespannen", w1_vuurguy:"1 · Flint",
  w1_gevecht:"1 · gevecht", w1_nimbus:"1 · Nimbus", w1_spiegel:"1 · spiegelduel",
  w1_terugkeer:"1 · terugkeer", w1_steenbaas:"1 · Magnus", w1_baasgevecht:"1 · bazengevecht",
  winst:"winst", verloren:"verlies"
};
function muziekStand(){
  const namen = Object.keys(MUZIEK);
  const vol = namen.filter(k => MUZIEK[k]);
  const leeg = namen.filter(k => !MUZIEK[k]);
  const nu = AU.wens && MUZIEK[AU.wens] ? `Nu: <b style="color:var(--gold)">${MUZIEK_UITLEG[AU.wens] || AU.wens}</b>. ` : "";
  if(!vol.length) return `Er zit nog geen muziek in. Zet je bestanden in de tabel <b style="color:var(--gold)">MUZIEK</b> bovenin dit bestand — een pad als <code>"audio/thema.mp3"</code> naast <code>index.html</code>. Laat je een naam leeg, dan blijft het daar stil en werkt de rest gewoon.`;
  return `🎵 ${nu}<b>${vol.length}</b> van de <b>${namen.length}</b> deuntjes staan erin.`
    + (leeg.length ? ` Nog leeg: ${leeg.map(k => MUZIEK_UITLEG[k] || k).join(", ")}.` : " Alles compleet.")
    + ` Muziek uit? Zet het muziekschuifje op 0.`;
}
