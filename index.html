   MUSIC is bewust leeg gelaten: zet er je eigen muziekbestand in en het loopt vanzelf. */
const SOUNDS = {
  music:  "",                      // achtergrondmuziek buiten het gevecht, eindeloos herhaald
  battle: "audio/agni-kai.mp3",    // gevechtsmuziek: speelt in de gevechtsfase, loopt door waar hij gebleven was
  fire:   "",          // 🔥 vuurbal onderweg
  burn:   "",          // 🔥 inslag
  ash:    "",          // creature valt uiteen
  water:  "",          // 💧 splash bij het herspelen
  rock:   "",          // 🪨 rotsblokken bij +1 leven
  thorn:  "",          // 🌿 doorns / entangle
  place:  "",          // kaart neergezet
  attack: "",          // aanval
  kill:   "",          // creature sterft
  draw:   "",          // kaart trekken
  win:    "",          // gewonnen
  lose:   "",          // verloren
  click:  ""           // knopje
};
const SET = {music:0.5, sfx:0.75, fx:"vol", autopass:[false, false]};   // fx: "vol" | "subtiel" | "uit"
try{ const raw = localStorage.getItem("elementaal.set"); if(raw) Object.assign(SET, JSON.parse(raw)); }catch(e){}
if(!Array.isArray(SET.autopass)) SET.autopass = [false, false];
function saveSet(){ try{ localStorage.setItem("elementaal.set", JSON.stringify(SET)); }catch(e){} }
/* Autopass: dit scherm laat de chain automatisch door voor speler p.
   Dat gaat via een echte pass-actie, dus hij komt gewoon in de zettenlijst en over het net. */
const iControl = p => NET.on ? p === NET.seat : !isBot(p);
const autoPassOn = p => !!(SET.autopass[p] && iControl(p));
const fxOn = () => SET.fx !== "uit" && !FAST;
const fxFull = () => SET.fx === "vol";
const fxScale = n => Math.max(1, Math.round(n * (fxFull() ? 1 : 0.45)));

/* ================= AUDIO ================= */
const AU = {
  ctx:null, master:null, sfxG:null, musEl:null, batEl:null, batOn:false, fader:null, started:false,
  boot(){
    if(this.started) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) { this.started = true; return; }
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = SET.sfx; this.sfxG.connect(this.master);
    }catch(e){ this.ctx = null; }
    this.started = true;
    this.startMusic();
  },
  resume(){ if(this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  setSfx(v){ SET.sfx = v; if(this.sfxG) this.sfxG.gain.value = v; },
  setMusic(v){
    SET.music = v;
    if(this.musEl) this.musEl.volume = this.batOn ? 0 : v;
    if(this.batEl) this.batEl.volume = this.batOn ? v : 0;
  },
  /* --- speelmuziek: loopt zolang je in een potje zit, stopt op het startscherm --- */
  battle(on){
    if(FAST || this.batOn === !!on) return;
    this.batOn = !!on;
    this.boot(); this.resume();
    if(!SOUNDS.battle) return;
    if(!this.batEl){
      try{
        const a = new Audio(SOUNDS.battle);
        a.loop = true; a.volume = 0; a.preload = "auto";
        a.addEventListener("error", () => { this.batEl = null; SOUNDS.battle = ""; });
        this.batEl = a;
      }catch(e){ return; }
    }
    const b = this.batEl;
    if(on){ const pr = b.play(); if(pr && pr.catch) pr.catch(()=>{}); }
    clearInterval(this.fader);
    const step = 0.055, self = this;
    this.fader = setInterval(() => {
      const wantB = self.batOn ? SET.music : 0;
      const wantM = self.batOn ? 0 : SET.music;
      let done = true;
      const move = (el, want) => {
        if(!el) return;
        const d = want - el.volume;
        if(Math.abs(d) <= step){ el.volume = Math.max(0, Math.min(1, want)); }
        else { el.volume = Math.max(0, Math.min(1, el.volume + Math.sign(d)*step)); done = false; }
      };
      move(b, wantB); move(self.musEl, wantM);
      if(done){
        clearInterval(self.fader); self.fader = null;
        if(!self.batOn && b.volume === 0) b.pause();              // pauzeren, niet terugspoelen
        if(self.musEl){ if(self.batOn) self.musEl.pause();
                        else { const pr = self.musEl.play(); if(pr && pr.catch) pr.catch(()=>{}); } }
      }
    }, 60);
  },
  stopBattle(){ this.battle(false); },
  startMusic(){
    if(this.musEl || !SOUNDS.music) return;
    try{
      const a = new Audio(SOUNDS.music);
      a.loop = true; a.volume = SET.music; a.preload = "auto";
      const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{});
      this.musEl = a;
    }catch(e){}
  },
  /* eigen bestand als die er is, anders de synth */
  play(name, opt){
    if(FAST) return;
    this.boot(); this.resume();
    const src = SOUNDS[name];
    if(src){
      try{ const a = new Audio(src); a.volume = SET.sfx; const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
      return;
    }
    if(!this.ctx || SET.sfx <= 0) return;
    try{ (this["s_" + name] || function(){}).call(this, opt || {}); }catch(e){}
  },
  /* --- bouwstenen --- */
  noise(dur){
    const n = Math.floor(this.ctx.sampleRate * dur);
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = b; return src;
  },
  env(node, t0, peak, atk, dec){
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
    node.connect(g); g.connect(this.sfxG);
    return g;
  },
  tone(type, f0, f1, t0, dur, peak){
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    this.env(o, t0, peak, 0.012, dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
    return o;
  },
  filtNoise(dur, type, f0, f1, peak, q){
    const t0 = this.ctx.currentTime;
    const n = this.noise(dur);
    const f = this.ctx.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    f.Q.value = q || 1;
    n.connect(f);
    this.env(f, t0, peak, 0.015, dur);
    n.start(t0); n.stop(t0 + dur + 0.05);
    return t0;
  },
  /* --- stemmen --- */
  s_fire(){   // wegzoevende vuurbal
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.42, "bandpass", 420, 1500, 0.9, 2.2);
    this.tone("sawtooth", 150, 420, t0, 0.34, 0.17);
  },
  s_burn(){   // inslag
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.30, "lowpass", 2600, 320, 0.85, 1);
    this.tone("sine", 190, 46, t0, 0.30, 0.5);
    this.tone("triangle", 620, 120, t0 + 0.01, 0.14, 0.16);
  },
  s_ash(){    // uiteenvallen: knisperende sintels
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.75, "highpass", 900, 5200, 0.22, 0.7);
    this.tone("sine", 120, 40, t0, 0.5, 0.28);
    for(let i=0;i<8;i++){
      const tt = t0 + 0.05 + Math.random()*0.55;
      const o = this.ctx.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(1800 + Math.random()*2600, tt);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.05 + Math.random()*0.05, tt);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.05);
      o.connect(g); g.connect(this.sfxG); o.start(tt); o.stop(tt + 0.07);
    }
  },
  s_water(){  // plons + druppels
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.34, "bandpass", 2600, 700, 0.55, 1.4);
    this.tone("sine", 700, 190, t0, 0.16, 0.20);
    for(let i=0;i<4;i++){
      const tt = t0 + 0.14 + i*0.075 + Math.random()*0.04;
      this.tone("sine", 1500 + Math.random()*900, 420, tt, 0.09, 0.10);
    }
  },
  s_light(){  // ✦ heldere, opengaande klank
    const t0 = this.ctx.currentTime;
    [784, 1046, 1568].forEach((hz, i) => this.tone("sine", hz, hz*1.5, t0 + i*0.045, 0.42, 0.13));
    this.filtNoise(0.5, "highpass", 3000, 9000, 0.10, 0.7);
  },
  s_turn(o){  // beurtwissel: opgaand (jij) of aflopend (tegenstander) akkoord
    const t0 = this.ctx.currentTime, up = !!(o && o.mine);
    const f = up ? [330, 440, 587] : [392, 294, 233];
    f.forEach((hz, i) => this.tone(up ? "triangle" : "sine", hz, hz, t0 + i*0.08, 0.30, 0.16));
  },
  s_rock(){   // steen die neerkomt
    const t0 = this.ctx.currentTime;
    this.tone("sine", 130, 42, t0, 0.34, 0.6);
    this.filtNoise(0.14, "lowpass", 1500, 260, 0.5, 1);
    this.filtNoise(0.07, "highpass", 2400, 5200, 0.16, 0.8);
  },
  s_thorn(){  // ritselende, knerpende ranken
    const t0 = this.ctx.currentTime;
    const n = this.noise(0.5);
    const f = this.ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 5.5;
    f.frequency.setValueAtTime(900, t0);
    f.frequency.exponentialRampToValueAtTime(2300, t0 + 0.45);
    const lfo = this.ctx.createOscillator(); lfo.type = "square"; lfo.frequency.value = 26;
    const lg = this.ctx.createGain(); lg.gain.value = 0.16;
    lfo.connect(lg);
    n.connect(f);
    const g = this.env(f, t0, 0.52, 0.05, 0.45);
    lg.connect(g.gain);
    lfo.start(t0); lfo.stop(t0 + 0.55);
    n.start(t0); n.stop(t0 + 0.55);
    this.tone("triangle", 300, 130, t0 + 0.05, 0.3, 0.10);
  },
  s_place(){  const t0 = this.ctx.currentTime; this.filtNoise(0.10, "lowpass", 1800, 500, 0.30, 1); this.tone("triangle", 340, 190, t0, 0.10, 0.12); },
  s_attack(){ const t0 = this.ctx.currentTime; this.filtNoise(0.17, "bandpass", 3200, 900, 0.42, 2.4); this.tone("sawtooth", 480, 150, t0, 0.13, 0.12); },
  s_kill(){   const t0 = this.ctx.currentTime; this.tone("sine", 300, 60, t0, 0.45, 0.34); this.filtNoise(0.28, "lowpass", 1300, 200, 0.34, 1); },
  s_draw(){   this.filtNoise(0.12, "highpass", 1400, 4200, 0.20, 0.8); },
  s_click(){  const t0 = this.ctx.currentTime; this.tone("square", 900, 620, t0, 0.05, 0.085); },
  s_win(){    const t0 = this.ctx.currentTime; [392,494,587,784].forEach((f,i)=> this.tone("triangle", f, f, t0 + i*0.11, 0.34, 0.16)); },
  s_lose(){   const t0 = this.ctx.currentTime; [392,349,294,220].forEach((f,i)=> this.tone("triangle", f, f*0.98, t0 + i*0.13, 0.4, 0.14)); }
};

/* ================= KAART-EFFECTEN (visueel) ================= */
let fxHold = 0;                       // tot wanneer visuele feedback wacht (vuurbal onderweg)
function fxWait(){ const d = fxHold - (typeof performance !== "undefined" ? performance.now() : Date.now()); return d > 0 ? d : 0; }
function fxLayer(){ return document.getElementById("fx"); }
function fxAdd(node, ms){ const L = fxLayer(); if(!L) return null; L.appendChild(node); setTimeout(()=>node.remove(), ms); return node; }
function fxDiv(cls, css){ const d = document.createElement("div"); d.className = "fxl " + cls; Object.assign(d.style, css); return d; }
const ctr = r => ({x:r.left + r.width/2, y:r.top + r.height/2});
function fxBox(r, grow){
  const g = grow || 0;
  return {left:(r.left - g) + "px", top:(r.top - g) + "px", width:(r.width + g*2) + "px", height:(r.height + g*2) + "px"};
}
/* Korte rode flits zodat je niet kunt missen dat het gevecht begint. */
function battleCry(){
  AU.play("attack");
  if(FAST || SET.fx === "uit") return;
  const old = document.getElementById("battlecry"); if(old) old.remove();
  const d = document.createElement("div");
  d.id = "battlecry";
  d.innerHTML = `<div class="bc">⚔ GEVECHT ⚔</div>`;
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1250);
  ["#row0","#row1"].forEach(sel => {
    const e = document.querySelector(sel); if(!e) return;
    e.classList.remove("battlenow"); void e.offsetWidth; e.classList.add("battlenow");
    setTimeout(()=>e.classList.remove("battlenow"), 1300);
  });
}
function spellSel(p, c){ return `.slot[data-act="spell"][data-p="${p}"][data-col="${c}"]`; }
/* ✦ witte flits met stralen op een plek */
function fxLight(sel){
  if(!fxOn()) return;
  const host = document.querySelector(sel); if(!host) return;
  const r = host.getBoundingClientRect(), fx = document.getElementById("fx"); if(!fx) return;
  const box = document.createElement("div");
  box.style.cssText = `position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;pointer-events:none;z-index:82`;
  const b = document.createElement("div"); b.className = "lightburst"; box.appendChild(b);
  for(let i=0;i<8;i++){
    const ray = document.createElement("div"); ray.className = "lray";
    ray.style.setProperty("--a", (i*45) + "deg");
    ray.style.animationDelay = (i*0.012) + "s";
    box.appendChild(ray);
  }
  fx.appendChild(box);
  setTimeout(() => box.remove(), 700);
}
/* Korte melding bij het begin van een hele beurt — goud voor jou, staalblauw voor de ander. */
function turnCry(p){
  AU.play("turn", {mine: NET.on ? p === NET.seat : (S.vsBot ? p === 0 : p === 0)});
  if(FAST || SET.fx === "uit") return;
  const old = document.getElementById("turncry"); if(old) old.remove();
  const solo = NET.on || S.vsBot;                       // is er een "jij"?
  const mine = NET.on ? p === NET.seat : (S.vsBot ? p === 0 : p === 0);
  const d = document.createElement("div");
  d.id = "turncry"; d.className = mine ? "mine" : "theirs";
  const kop = solo ? (mine ? "JOUW BEURT" : "TEGENSTANDER") : `SPELER ${p+1}`;
  const sub = solo && !mine ? `${pName(p)} is aan zet · beurt ${S.turnNo[p]}` : `aan zet · beurt ${S.turnNo[p]}`;
  d.innerHTML = `<div class="tc">${kop}<span class="sm">${sub}</span></div>`;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 1450);
  const side = document.querySelector(`.pside[data-side="${p}"]`);
  if(side){ side.classList.remove("turnnow"); void side.offsetWidth; side.classList.add("turnnow");
    setTimeout(() => side.classList.remove("turnnow"), 1400); }
}
function jolt(sel, cls){
  if(!fxOn()) return;
  const e = document.querySelector(sel); if(!e) return;
  e.classList.remove(cls); void e.offsetWidth; e.classList.add(cls);
  setTimeout(()=>e.classList.remove(cls), 600);
}

/* 🔥 vuurbal van bron naar doel, daarna een inslag */
function fxFire(fromSel, toSel){
  const to = rectOf(toSel); if(!to) return;
  AU.play("fire");
  if(!fxOn()){ AU.play("burn"); return; }
  const b = ctr(to);
  const from = fromSel ? rectOf(fromSel) : null;
  const a = from ? ctr(from) : {x:b.x, y:b.y - 190};
  fxHold = (typeof performance !== "undefined" ? performance.now() : Date.now()) + 320;
  const ball = fxDiv("fball", {left:a.x + "px", top:a.y + "px", transition:"transform .34s cubic-bezier(.35,.05,.5,1)"});
  fxAdd(ball, 460);
  const trails = [];
  requestAnimationFrame(()=>{ ball.style.transform = `translate(${b.x - a.x}px,${b.y - a.y}px)`; });
  if(fxFull()){
    const iv = setInterval(()=>{
      const r = ball.getBoundingClientRect();
      const t = fxDiv("ftrail", {left:(r.left + r.width/2) + "px", top:(r.top + r.height/2) + "px"});
      fxAdd(t, 480); trails.push(t);
    }, 34);
    setTimeout(()=>clearInterval(iv), 330);
  }
  setTimeout(()=>{ fxBurn(to); }, 330);
}
function fxBurn(to){
  AU.play("burn");
  if(!fxOn()) return;
  const b = ctr(to);
  const flash = fxDiv("", Object.assign(fxBox(to), {position:"fixed"}));
  const sc = document.createElement("div"); sc.className = "scorch";
  flash.appendChild(sc); fxAdd(flash, 620);
  const ring = fxDiv("shock", {left:(b.x - 46) + "px", top:(b.y - 46) + "px", width:"92px", height:"92px"});
  fxAdd(ring, 560);
  if(fxFull()){
    const r2 = fxDiv("shock", {left:(b.x - 30) + "px", top:(b.y - 30) + "px", width:"60px", height:"60px",
      borderColor:"rgba(255,255,220,.9)"});
    r2.style.animationDelay = "70ms"; fxAdd(r2, 620);
  }
  const n = fxScale(16);
  for(let i=0;i<n;i++){
    const ang = (Math.PI*2*i)/n + Math.random()*0.5, d = 34 + Math.random()*54;
    const sp = fxDiv("spark", {left:b.x + "px", top:b.y + "px",
      background:`radial-gradient(circle, #fff1c4, ${["#ffb347","#ff7a2e","#e0491a"][i%3]} 60%, rgba(180,50,10,0))`});
    sp.style.setProperty("--tx", Math.cos(ang)*d + "px");
    sp.style.setProperty("--ty", (Math.sin(ang)*d - 14) + "px");
    sp.style.setProperty("--d", (0.45 + Math.random()*0.35) + "s");
    fxAdd(sp, 900);
  }
}
/* creature valt uiteen in as */
function fxAsh(sel, el){
  if(FAST) return;
  const w = fxWait(); if(w > 12){ setTimeout(()=>fxAsh(sel, el), w); return; }
  const r = rectOf(sel); if(!r) return;
  AU.play("ash");
  if(!fxOn()) return;
  const wrap = fxDiv("", Object.assign(fxBox(r), {position:"fixed"}));
  const g = document.createElement("div");
  g.className = "fxghost";
  g.innerHTML = cardFaceHTML(el);
  wrap.appendChild(g);
  const cols = {vuur:["#ff9d4d","#d8552a","#5c2a17"], water:["#8fd0f5","#3f8fd0","#1d3f60"],
                gras:["#9adb7d","#4f9a4a","#24401f"], steen:["#c8bba4","#8b7f6d","#453f36"]}[el] || ["#b9c4cf","#6d7783","#333b45"];
  const n = fxScale(22);
  for(let i=0;i<n;i++){
    const p = document.createElement("div");
    p.className = "ash";
    const sz = 3 + Math.random()*6;
    p.style.setProperty("--w", sz + "px");
    p.style.setProperty("--h", (sz*0.7 + Math.random()*3) + "px");
    p.style.setProperty("--c", cols[i % cols.length]);
    p.style.setProperty("--tx", (Math.random()*2 - 1) * (30 + Math.random()*44) + "px");
    p.style.setProperty("--ty", -(40 + Math.random()*80) + "px");
    p.style.setProperty("--rot", (Math.random()*720 - 360) + "deg");
    p.style.setProperty("--d", (0.55 + Math.random()*0.5) + "s");
    p.style.left = (Math.random()*100) + "%";
    p.style.top = (25 + Math.random()*65) + "%";
    wrap.appendChild(p);
  }
  fxAdd(wrap, 1200);
}
/* 🌿 doorns die over het doel groeien, plus druppels naar de bron */
function fxThorns(sel, srcSel){
  const r = rectOf(sel); if(!r) return;
  AU.play("thorn");
  if(!fxOn()) return;
  const wrap = fxDiv("", Object.assign(fxBox(r, 8), {position:"fixed"}));
  const W = r.width + 16, H = r.height + 16;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "thorns");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = W + "px"; svg.style.height = H + "px";
  const vines = fxFull() ? 4 : 2;
  const NS = "http://www.w3.org/2000/svg";
  for(let v=0; v<vines; v++){
    /* elke rank kronkelt van de ene rand naar de andere dwars over de kaart heen */
    const vertical = v % 2 === 1;
    const span = vertical ? H : W, thick = vertical ? W : H;
    const amp = thick * (0.24 + 0.1*(v%2));
    const mid = thick * (0.5 + (v < 2 ? -0.16 : 0.18));
    const dir = v < 2 ? 1 : -1;
    const N = 9, pts = [];
    for(let i=0;i<=N;i++){
      const t = i/N;
      const along = (dir > 0 ? t : 1 - t) * (span + 14) - 7;
      const off = mid + Math.sin(t*Math.PI*2.15 + v*1.7) * amp * (0.35 + t*0.75);
      pts.push(vertical ? [off, along] : [along, off]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      const cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2;
      d += ` Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    d += ` T${pts[pts.length-1][0].toFixed(1)} ${pts[pts.length-1][1].toFixed(1)}`;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    let len = 0;
    for(let i=1;i<pts.length;i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    len *= 1.25;
    path.style.setProperty("--len", len.toFixed(0));
    path.style.animationDelay = (v*0.07) + "s, " + (0.72 + v*0.03) + "s";

    for(let i=1;i<pts.length-1;i+=2){
      const a = pts[i-1], b = pts[i+1], px = pts[i][0], py = pts[i][1];
      const nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
      const nl = Math.hypot(nx, ny) || 1;
      const side = (i % 4 === 1) ? 1 : -1;
      const ux = (nx/nl)*side, uy = (ny/nl)*side;
      const L = 7 + Math.random()*4, Wd = 3.2;
      const tri = document.createElementNS(NS, "polygon");
      tri.setAttribute("points",
        `${(px + ux*L).toFixed(1)},${(py + uy*L).toFixed(1)} ` +
        `${(px - uy*Wd).toFixed(1)},${(py + ux*Wd).toFixed(1)} ` +
        `${(px + uy*Wd).toFixed(1)},${(py - ux*Wd).toFixed(1)}`);
      const del = 0.1 + v*0.07 + (i/pts.length)*0.28;
      tri.style.animationDelay = del + "s, " + (0.72 + v*0.03) + "s";
      svg.appendChild(tri);
    }
  }
  wrap.appendChild(svg);
  fxAdd(wrap, 1300);
  if(srcSel){
    const sr = rectOf(srcSel);
    if(sr){
      const a = ctr(r), b = ctr(sr);

  }
}

/* Zet een plaat om in een SVG, met horizontaal samengevoegde blokjes. */
function pixSVG(el){
  const art = PIX_ART[el], pal = PIX_PAL[el];
  if(!art) return "";
  const w = art[0].length, h = art.length;
  let r = "";
  for(let y=0;y<h;y++){
    let x = 0;
    while(x < w){
      const c = art[y][x];
      let n = 1;
      while(x + n < w && art[y][x+n] === c) n++;
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[+c]}"/>`;
      x += n;
    }
  }
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" shape-rendering="crispEdges">${r}</svg>`;
}
const PIX_CACHE = {};
const pixArt = el => (PIX_CACHE[el] || (PIX_CACHE[el] = pixSVG(el)));

function destroyCre(p, c, cause){
  const cr = P(p).cols[c].cre; if(!cr) return;
  const w = fxWait();

  pop(creSel(p,c), "✝", "kill");

function applyDamage(id, srcEl, base, o){
  const f = findCre(id); if(!f) return {done:false};
  let out = dmgOutcome(srcEl, f.cr.card.el, base);
  if(o && o.ignoreImmune && out === "immuun") out = base;    // 🟣 Verzengende Woede raakt ook Water
  if(o && o.alwaysKill && !o.protect) out = "kill";
  const sel = creSel(f.p, f.c);
  if(!(o && o.noFx) && srcEl === "vuur" && out !== "immuun"){
    const sc = o && o.srcSel ? o.srcSel : null;
    fxFire(sc, sel);
  }
  if(out === "immuun"){
    pop(sel, "IMMUUN", "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} is <em>immuun</em> voor ${icon(srcEl)} ${EL[srcEl].name}.`);
    return {destroyed:false};
  }
  if(o && o.protect){
    const newHp = out === "kill" ? Math.min(f.cr.hp, 1) : Math.max(1, f.cr.hp - out);
    const lost = f.cr.hp - newHp;
    f.cr.hp = newHp;
    pop(sel, lost > 0 ? "-" + lost : "beschermd", lost > 0 ? "dmg" : "imm");
    addLog(`${icon(f.cr.card.el)} in kolom ${f.c+1} kan niet vernietigd worden door deze trigger en blijft op ${f.cr.hp} leven.`);
    return {destroyed:false};
  }
  if(out === "kill"){
    addLog(`${icon(srcEl)} ${EL[srcEl].name} is sterk tegen ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name}: <em>instakill</em>!`, true);
    pop(sel, "INSTAKILL", "kill");
    destroyCre(f.p, f.c, "instakill");
    return {destroyed:true, wasP:f.p};
  }
  f.cr.hp -= out;
  pop(sel, "-" + out, "dmg");
  addLog(`${icon(srcEl)} doet ${out} schade aan ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}).`);
  if(f.cr.hp <= 0){ destroyCre(f.p, f.c, "schade"); return {destroyed:true, wasP:f.p}; }
  return {destroyed:false};
}

async function chooseCre(p, ids, prompt, optional, meta){
  if(!ids.length) return null;
  const selfId = meta && meta.selfId != null ? meta.selfId : null;
  // Principe: gedwongen je eigen bord targeten hoeft nooit — dan wordt de keuze optioneel.
  if(!optional && ids.every(id => { if(id === selfId) return true; const f = findCre(id); return f && f.p === p; })){
    optional = true;
    prompt += ` <span style="opacity:.7">(alleen eigen doelen — optioneel)</span>`;
  }
  await ensureHolder(p);
  return await waitUI("choice", {p, kind:"cre", valid:ids, prompt, optional, meta});
}
/* Mag deze lichtkaart nu gespeeld worden? */
function lightPlayable(p, card){
  if(!card || card.el !== "licht" || !LIGHTS[card.lk]) return false;
  const k = card.lk;
  if(LIGHTS[k].cost && P(p).life <= LIGHTS[k].cost) return false;   // je mag jezelf niet doodbetalen
  if(LIGHTS[k].tribute && !allCreIds((cr, pp) => pp === p).length) return false;   // zonder offer geen activatie
  if(k === "negate"){
    const top = S.stack[S.stack.length-1];
    return !!(top && top.type === "play" && top.ctrl === opp(p));
  }
  if(k === "dfusion") return aeFuseAny(p) && openCols(p).length > 0;
  if(k === "kuriboh") return emptyCols(p).length > 0;
  if(k === "darkhole") return allCreIds((cr, pp) => pp === p).length > 0;
  if(k === "siphon")   return allCreIds().length > 0;
  if(k === "reborn")   return P(p).grave.length > 0;
  return true;
}

  await ensureHolder(p);
  return await waitUI("opt", {p, prompt, opts});
}
async function chooseSlot(p, slots, prompt, cancellable, meta){
  if(!slots || !slots.length){ addLog("Geen geldige plek — die stap vervalt."); return null; }
  await ensureHolder(p);
  return await waitUI("slot", {p, valid:slots, prompt, cancellable, meta});
}

/* ================= CHAIN / STACK ================= */
/* ============ DOELWITTEN VASTLEGGEN BIJ HET AANKONDIGEN ============
   Als je een kaart speelt kies je meteen wat je target. Dat doelwit staat vast op de chain;
   is het bij het resolven weg (dood, verplaatst, teruggehaald), dan fizzelt dat effect. */
function effsOf(el, origin){
  if(el === "steen") return [{el, origin}, {el, origin}];      // tweemaal +1, los van elkaar
  if(el === "vuur" || el === "gras" || el === "water") return [{el, origin}];
  return [];
}
/* De effecten die deze zet triggert, in de volgorde waarin ze straks resolven. */
function plannedEffects(p, card, asSpell, col, opts){
  if(asSpell) return effsOf(card.el, "spell");
  const o = opts || {};
  let own = o.forceEffs ? o.forceEffs.slice() : (o.skipOwn ? [] : effsOf(card.el, "creature"));
  if(o.dubbel) own = own.concat(own.map(e => Object.assign({}, e)));   // 🟣 Getijdenstroom
  const sp = P(p).cols[col] && P(p).cols[col].spell;
  return own.concat(sp ? effsOf(sp.card.el, "spell") : []);
}
/* Geldige doelwitten. De gespeelde kaart staat op dit moment al op het veld, dus hij zit
   gewoon in allCreIds(); selfId dient alleen nog om hem waar nodig uit te sluiten. */
function targetsForEff(p, e, selfId, cardEl, exclIds){
  const skip = id => exclIds && exclIds.includes(id);
  if(e.el === "vuur")  return fireTargets(p).filter(id => !skip(id) && !(e.origin === "creature" && id === selfId));
  if(e.el === "gras")  return allCreIds(cr => !skip(cr.card.id) && cr.card.el !== "vuur");
  if(e.el === "steen") return allCreIds(cr => !skip(cr.card.id));
  if(e.el === "water") return waterTargets(p).filter(id => id !== selfId && !skip(id));
  return [];
}
const effPrompt = {
  vuur:  "🔥 Vuur: kies nu je doelwit (%D% schade; een eigen creature offer je: instakill + trek een kaart — eigen 🔥 Vuur en eigen kolommen met een 🔥-spell kun je niet aanwijzen)",
  gras:  "🌿 Gras: kies nu wie je entanglet (−1/+1 · op 🪨 Steen −2/+2)",
  steen: "🪨 Steen: kies nu wie er +1 leven krijgt",
  water: "💧 Water: kies nu een eigen creature om opnieuw te spelen"
};
/* Vraagt per effect één doelwit en geeft het plan terug, of "cancel". */
async function declarePlan(p, card, asSpell, col, opts){
  const o = opts || {};
  const selfId = asSpell ? null : card.id;
  const plan = plannedEffects(p, card, asSpell, col, o);
  for(let i=0;i<plan.length;i++){
    const e = plan[i];
    const ids = targetsForEff(p, e, selfId, card.el, o.excl);
    if(!ids.length){ e.tid = null; continue; }
    const bron = e.origin === "spell" ? " <span style='opacity:.7'>(spell-trigger)</span>" : "";
    const nr = plan.filter(x => x.el === e.el && x.origin === e.origin).length > 1
      ? ` <span style="opacity:.7">(${plan.slice(0,i+1).filter(x=>x.el===e.el&&x.origin===e.origin).length}/2)</span>` : "";
    const id = await chooseCre(p, ids,
      `<b>${pName(p)}</b> — ${effPrompt[e.el].replace("%D%", hasAe(p, "ae_fire6") ? "5" : "2")}${nr}${bron}`,
      e.el === "steen", {k:e.el, selfId});
    if(id === "cancel") return "cancel";
    e.tid = id;
    if(id != null){ const f = findCre(id); if(f){ e.tp = f.p; e.tc = f.c; } }
  }
  return plan;
}
/* Bouwt het stack-item voor één gepland effect. */
function effItem(p, e, selfId){
  const it = {type:"eff", el:e.el, ctrl:p, origin:e.origin, tid:e.tid, tp:e.tp, tc:e.tc, dec:true};
  if(e.el === "vuur"){
    it.excl = (e.origin === "creature" && selfId != null) ? [selfId] : [];
    it.srcId = e.origin === "creature" ? selfId : null;
    it.protect = e.origin === "spell" ? selfId : null;
  }
  if(e.el === "gras")  it.srcId = selfId;
  if(e.el === "water") it.exclId = selfId;
  return it;
}
/* Krijgt deze speler een reactievenster op deze link? Alleen als er iets te doen valt:
   – de aanval komt op hem af (blokken),
   – de kaart mikt op een van zijn eigen creatures (ontwijken, wegschuiven, offeren),
   – of het is zijn eigen link die ergens op mikt (doorchainen op je eigen zet).
   Voor al het andere is doorlaten de enige zinnige zet, en dat scheelt een hoop spatie. */
function magReageren(wie, it){
  if(it.type === "attack"){
    if(wie === it.ctrl) return false;                       // alleen de verdediger blokt
    // en blokken kan alleen in de aangevallen kolom; staat daar al iets, dan rest hooguit ✦ licht
    return (openCols(wie).includes(it.col) && handHasFlash(wie)) || handHasLight(wie);
  }
  const doelen = Array.isArray(it.plan) ? it.plan
               : (it.plan && it.plan.tid != null ? [it.plan] : []);
  // Met een ✦ lichtkaart in de hand mag je altijd reageren — anders zou ✦ Volledige
  // Negatie nooit aan bod komen.
  if(wie !== it.ctrl && handHasLight(wie)) return true;
  // 🪨 +1 leven en 💧 herspelen bedreigen niemand — daar hoeft niemand op te reageren.
  const bedreigt = e => e.tid != null && (e.el === "vuur" || e.el === "gras" || it.type === "light");
  return doelen.some(e => { if(!bedreigt(e)) return false;
                            const f = findCre(e.tid); return f && f.p === wie; });
}
async function chainLoop(){
  while(S.stack.length && !S.over){
    const top = S.stack[S.stack.length-1];
    /* Allebei de spelers mogen op de bovenste link reageren voordat hij resolvet.
       Eerst degene die de link er net op zette — die houdt de prioriteit en mag dus
       op zijn eigen kaart doorchainen — daarna de ander. Pas als ze allebei
       doorlaten resolvet de bovenste link. */
    /* Alleen op een gespeelde kaart of een aanval mag gereageerd worden. Losse effecten
       die daaruit voortkomen resolven meteen — anders krijg je een venster per mini-effect. */
    if(top.type === "eff"){ await resolveTop(); continue; }
    /* En zelfs dan niet iedereen: alleen wie er écht iets mee kan. Zie magReageren. */
    const beurten = [top.ctrl, opp(top.ctrl)].filter(wie => PRIOALL || magReageren(wie, top));
    let toegevoegd = false;
    for(const wie of beurten){
      if(S.over) return;
      if(S.stack[S.stack.length-1] !== top) break;      // er is intussen iets bijgekomen
      if(!hasLegalFlash(wie)) continue;
      const r = await askPriority(wie);
      if(S.over) return;
      if(r !== "pass"){
        const card = takeFromHand(wie, r.cardId);
        if(r.light) await announceLight(wie, card, true);
        else if(r.fuse){
          addLog(`${pName(wie)} start ⚡ 🟣 <em>${AETHERS[r.fuseKey].name}</em>.`, true);
          await announceFusion(wie, card, r.tributeId, r.fuseKey);
        }
        else await announcePlay(wie, card, false, r.col, true);
        toegevoegd = true;
        break;
      }
      addLog(`${pName(wie)} reageert niet.`);
    }
    if(toegevoegd) continue;
    await resolveTop();
  }
  if(!S.over) backToPhase();
}
async function askPriority(p){
  while(true){
    await ensureHolder(p);
    const r = await waitUI("priority", {p});
    if(r === "pass" || r == null) return "pass";
    const card = P(p).hand.find(cd => cd.id === r);
    if(!card) return "pass";                       // onbekende kaart: gewoon doorlaten
    if(card.el === "licht"){
      if(!lightPlayable(p, card)) continue;
      return {cardId:r, light:true};
    }
    const canCre = EL[card.el].flash && openCols(p).length > 0;
    const canFuse = fuseOk(p, card.el, "flash");
    let mode = "cre";
    if(canCre && canFuse){
      const m = await waitUI("pickmode", {p, cardId:r, creOk:true, spOk:false, fuseOk:true, flashCtx:true});
      if(m === "cancel") continue;
      mode = m;
    } else if(canFuse && !canCre) mode = "fuse";
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de creature die je offert`, true, {k:"tribute"});
      if(tid === null) continue;
      return {cardId:r, fuse:true, tributeId:tid, fuseKey:f.key};
    }
    const slots = creSlotsFor(p, card.el);
    const s = await waitUI("slot", {p, valid:slots, cancellable:true,
      prompt:`Kies een plek voor ⚡ ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel") continue;
    return {cardId:r, col:s.c};
  }
}
function takeFromHand(p, cardId){
  const i = P(p).hand.findIndex(cd => cd.id === cardId);
  return P(p).hand.splice(i,1)[0];
}
async function resolveTop(){
  const it = S.stack.pop();
  S.ui = {mode:"busy"}; render();
  await sleep(120);
  if(it.type === "play") await resolvePlay(it);
  else if(it.type === "light") await resolveLight(it);
  else if(it.type === "attack") await resolveAttack(it);
  else await resolveEffect(it);
  render();
}
function pushOwnEffect(p, col, cre){
  const el = cre.card.el;
  if(el === "vuur")  S.stack.push({type:"eff", el:"vuur",  ctrl:p, excl:[cre.card.id], srcId:cre.card.id, protect:null, origin:"creature"});
  if(el === "gras")  S.stack.push({type:"eff", el:"gras",  ctrl:p, srcId:cre.card.id, origin:"creature"});
  if(el === "steen"){
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});   // tweemaal +1
  }
  if(el === "water") S.stack.push({type:"eff", el:"water", ctrl:p, exclId:cre.card.id, origin:"creature"});
}
function pushSpellTrigger(p, col, trigCre){
  const sp = P(p).cols[col].spell; if(!sp) return;
  const el = sp.card.el, tid = trigCre ? trigCre.card.id : null;
  addLog(`✦ Spell-trigger: ${icon(el)} ${EL[el].name} in kolom ${col+1} van ${pName(p)}.`);
  if(el === "vuur")  S.stack.push({type:"eff", el:"vuur",  ctrl:p, excl:[], srcId:null, protect:tid, origin:"spell"});
  if(el === "gras")  S.stack.push({type:"eff", el:"gras",  ctrl:p, srcId:tid, origin:"spell"});
  if(el === "steen"){
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"});
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"});
  }
  if(el === "water" && tid !== null) S.stack.push({type:"eff", el:"water", ctrl:p, exclId:tid, origin:"spell"});
}
/* ============ SPELEN ============
   Het NEERLEGGEN van een creature of spell gaat buiten de chain om: de kaart staat er
   meteen en dat is niet te onderbreken. Daarna gaat de kaart als link de chain op en
   volgen zijn effecten volledig de gewone chain-logica. */
async function placeNow(p, card, asSpell, col, opts){
  const o = opts || {}, slot = P(p).cols[col];
  if(asSpell){
    if(slot.spell){
      P(slot.spell.card.owner).grave.push(slot.spell.card);
      addLog(`De oude spell ${icon(slot.spell.card.el)} ${EL[slot.spell.card.el].name} in kolom ${col+1} wordt gediscard.`, true);
    }
    slot.spell = {card};
    render(); AU.play("place"); await sleep(140);
    return true;
  }
  if(slot.cre && slot.cre.card.el === "wolk" && card.el !== "wolk"){
    addLog(`☁️ De wolk in kolom ${col+1} van ${pName(p)} lost op.`);
    slot.cre = null; render();
  }
  if(slot.cre){ P(p).hand.push(card); addLog(`Creature-plek bezet: ${icon(card.el)} keert terug naar de hand.`); return false; }
  placeCre(p, col, card);
  if(o.keepHp != null && slot.cre){                       // 💧 herspelen: levens blijven, tokens niet
    slot.cre.hp = o.keepHp;
    if(o.keepHp !== (EL[card.el].hp || 2))
      addLog(`💧 ${icon(card.el)} ${EL[card.el].name} houdt zijn ${o.keepHp} levens; entangle-tokens vallen weg.`);
  }
  render();
  if(o.splash) fxSplash(creSel(p, col)); else AU.play("place");
  await sleep(140);
  return true;
}
function pushPlay(p, card, asSpell, col, flash, plan){
  S.stack.push({type:"play", ctrl:p, card, asSpell, col, flash, plan:plan || []});
  const tg = (plan || []).filter(e => e.tid != null).map(e => {
    const f = findCre(e.tid);
    return f ? `${icon(f.cr.card.el)} ${pName(f.p)} kol ${f.c+1}` : "?";
  });
  addLog(`${pName(p)} speelt ${icon(card.el)} <em>${EL[card.el].name}</em> als ${asSpell?"spell":"creature"}${flash?" ⚡(flash)":""} → kolom ${col+1}${tg.length?` · target: ${tg.join(" + ")}`:""}.`, true);
}
/* Kaart direct neerleggen, doelwitten kiezen, en dan als link op de chain. */
async function announcePlay(p, card, asSpell, col, flash, opts){
  const ok = await placeNow(p, card, asSpell, col, opts);
  if(!ok) return false;
  const plan = await declarePlan(p, card, asSpell, col, {onField:true});
  pushPlay(p, card, asSpell, col, flash, plan === "cancel" ? [] : plan);
  return true;
}
/* Fusie: het offer en de nieuwe creature staan er meteen; de effecten gaan de chain op. */
async function announceFusion(p, card, tributeId, fuseKey, opts){
  if(typeof window !== "undefined" && window.__fuseN) window.__fuseN[p]++;   // testteller
  const o = opts || {};
  let col;
  if(tributeId == null){                       // ✦ Directe Fusie: geen offer nodig
    col = o.col;
    if(col == null) return false;
    addLog(`🟣 ${AETHERS[fuseKey].name} verschijnt zonder offer in kolom ${col+1} van ${pName(p)} (✦ Directe Fusie).`, true);
    const ok = await placeNow(p, card, false, col, {});
    if(!ok) return false;
  } else {
    const t = findCre(tributeId);
    if(!t || t.p !== p){ P(card.owner).grave.push(card); addLog(`De fusie mist zijn offer en verdwijnt in het graf.`, true); return false; }
    col = t.c;
    addLog(`🟣 Fusie: ${pName(p)} offert ${icon(t.cr.card.el)} ${EL[t.cr.card.el].name} en roept ${icon(card.el)} <em>${EL[card.el].name}</em> op in kolom ${col+1}.`, true);
    destroyCre(p, col, "🟣 fusie-offer");
    placeCre(p, col, card);
  }
  const me = P(p).cols[col].cre;
  if(!me) return false;
  if(fuseKey === "fu_stone") me.hp = 4;
  render(); AU.play("place"); await sleep(180);
  /* Het fusie-effect VERVANGT het gewone speel-effect van de creature. */
  addLog(fuseKey === "fu_water"
    ? `🟣 Dieptestroom trekt een kaart en laat daarna het gewone ${icon(card.el)} ${EL[card.el].name}-effect gewoon afgaan.`
    : `🟣 ${AETHERS[fuseKey].name} vervangt het gewone speel-effect van ${icon(card.el)} ${EL[card.el].name}.`);
  const fo = {onField:true, skipOwn:true};
  if(fuseKey === "fu_water") fo.forceEffs = [{el:"water", origin:"fusie"}];   // trek 1 én het gewone effect
  if(fuseKey === "fu_stone"){
    // 🟣 Bergrug zet meteen een tweede Steen neer; samen doen ze eenmalig tweemaal het Steen-effect.
    const free = openCols(p, col);
    if(free.length){
      const sl = await chooseSlot(p, free.map(c => ({p, c, kind:"cre"})), `🟣 Bergrug: kies een plek voor de tweede 🪨 Steen (4 levens)`, false, {el:"steen"});
      const card2 = {id:++cid, el:"steen", owner:p, token:true};
      await placeNow(p, card2, false, sl.c, {});
      if(P(p).cols[sl.c].cre) P(p).cols[sl.c].cre.hp = 4;
      addLog(`🟣 Bergrug plaatst een tweede 🪨 Steen met 4 levens in kolom ${sl.c+1}.`, true);
      render();
    } else addLog("🟣 Bergrug: geen vrije plek voor de tweede 🪨 Steen.");
    fo.forceEffs = [0,1,2,3].map(() => ({el:"steen", origin:"fusie"}));
  }
  const plan = await declarePlan(p, card, false, col, fo);
  S.stack.push({type:"play", ctrl:p, card, asFuse:true, fuseKey, col,
                fuseEff: fuseKey !== "fu_stone", plan: plan === "cancel" ? [] : plan});
  return true;
}
/* ============ ✦ LICHTKAARTEN ============
   Een lichtkaart komt op een spell-plek, flitst, en gaat meteen naar het graf. Zijn effect
   volgt de chain — behalve Volledige Negatie, die meteen afgaat. */
async function announceLight(p, card, flash){
  const k = card.lk;
  if(k === "dfusion") return await announceDirectFusion(p, card, flash);
  /* Tribute-kaarten kosten naast het leven ook een eigen creature — er komt niets voor terug. */
  let offerId = null;
  if(LIGHTS[k].tribute){
    const eigen = allCreIds((cr, pp) => pp === p);
    if(!eigen.length) return "cancel";
    const tid = await chooseCre(p, eigen,
      `<b>${pName(p)}</b> — ✦ ${LIGHTS[k].name}: welke eigen creature offer je?`, true, {k:"tribute"});
    if(tid === "cancel" || tid == null) return "cancel";
    offerId = tid;
  }
  const s = await chooseSlot(p, freeSpellCols(p).map(c => ({p, c, kind:"spell"})),
    `Kies een spell-plek voor ✦ ${LIGHTS[k].name}`, true);
  if(s === "cancel") return "cancel";
  const col = s.c, slot = P(p).cols[col];
  if(slot.spell){
    P(slot.spell.card.owner).grave.push(slot.spell.card);
    addLog(`De oude spell ${icon(slot.spell.card.el)} ${EL[slot.spell.card.el].name} in kolom ${col+1} wordt gediscard.`, true);
  }
  slot.spell = {card};
  render(); AU.play("light"); fxLight(spellSel(p, col)); await sleep(FAST ? 0 : 330);
  slot.spell = null; render();
  if(LIGHTS[k].cost){
    P(p).life -= LIGHTS[k].cost;
    addLog(`${pName(p)} betaalt ${LIGHTS[k].cost} leven voor ✦ ${LIGHTS[k].name} (nog ${P(p).life}).`);
  }
  if(offerId != null){
    const f = findCre(offerId);
    if(f && f.p === p){
      addLog(`${pName(p)} offert ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} in kolom ${f.c+1} voor ✦ ${LIGHTS[k].name}.`, true);
      destroyCre(f.p, f.c, `✦ ${LIGHTS[k].name}`);
      render(); await sleep(FAST ? 0 : 220);
    } else {
      addLog(`Het offer voor ✦ ${LIGHTS[k].name} is er niet meer — de kaart gaat naar het graf.`, true);
      P(card.owner).grave.push(card); render();
      return true;
    }
  }
  if(k === "negate"){
    P(card.owner).grave.push(card);
    addLog(`${pName(p)} speelt ✦ <em>Volledige Negatie</em> ⚡ — dit gaat meteen af.`, true);
    doNegate(p); render();
    return true;
  }
  let plan = {};
  if(k === "siphon"){
    const ids = allCreIds();
    const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — ✦ Levensroof: kies de creature die je leegzuigt`, true, {k:"siphon"});
    if(id === "cancel"){ P(card.owner).grave.push(card); return true; }
    const f = id != null ? findCre(id) : null;
    plan = {tid:id, tp:f ? f.p : null, tc:f ? f.c : null};
  }
  if(k !== "master") P(card.owner).grave.push(card);   // Elementaal Meester keert terug naar de hand
  render();
  S.stack.push({type:"light", ctrl:p, card, lk:k, col, flash, plan});
  const tg = plan.tid != null && findCre(plan.tid)
    ? ` · target: ${icon(findCre(plan.tid).cr.card.el)} ${pName(plan.tp)} kol ${plan.tc+1}` : "";
  addLog(`${pName(p)} speelt ✦ <em>${LIGHTS[k].name}</em>${flash ? " ⚡(flash)" : ""} → kolom ${col+1}${tg}.`, true);
  return true;
}
async function announceDirectFusion(p, card, flash){
  const keys = aeList(p).filter(k => AETHERS[k].fuse);
  if(!keys.length) return "cancel";
  const fk = keys.length === 1 ? keys[0]
    : await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Directe Fusie: welke fusie roep je op?`,
        keys.map(k => ({v:k, label:AETHERS[k].name, ic:icon(AETHERS[k].el)})));
  const el = AETHERS[fk].el;
  const slots = openCols(p).map(c => ({p, c, kind:"cre"}));
  if(!slots.length) return "cancel";
  const s = await chooseSlot(p, slots, `✦ Directe Fusie: kies een plek voor 🟣 ${AETHERS[fk].name} ${icon(el)}`, true, {el});
  if(s === "cancel") return "cancel";
  P(p).life -= 1;
  addLog(`${pName(p)} betaalt 1 leven voor ✦ Directe Fusie (nog ${P(p).life}).`);
  card.el = el; delete card.lk;                       // de lichtkaart wórdt de fusiecreature
  fxLight(spellSel(p, s.c)); AU.play("light");
  return await announceFusion(p, card, null, fk, {col:s.c, direct:true});
}
/* Volledige Negatie: haalt de bovenste kaart-link van de tegenstander volledig weg. */
function doNegate(p){
  for(let i = S.stack.length - 1; i >= 0; i--){
    const it = S.stack[i];
    if(it.type !== "play" || it.ctrl !== opp(p)) continue;
    S.stack.splice(i, 1);
    if(it.asSpell){
      const sl = P(it.ctrl).cols[it.col];
      if(sl.spell && sl.spell.card.id === it.card.id) sl.spell = null;
    } else {
      const f = findCre(it.card.id);
      if(f){ fxLight(creSel(f.p, f.c)); P(f.p).cols[f.c].cre = null; }
    }
    P(it.card.owner).grave.push(it.card);
    AU.play("light");
    addLog(`✦ Volledige Negatie: ${icon(it.card.el)} <em>${EL[it.card.el].name}</em> van ${pName(it.ctrl)} wordt volledig genegeerd — kaart naar het graf, alle effecten van de chain.`, true);
    return true;
  }
  addLog("✦ Volledige Negatie vindt geen kaart om te negeren.");
  return false;
}
async function resolveLight(it){
  if(typeof window !== "undefined" && window.__lichtN) window.__lichtN[it.lk] = (window.__lichtN[it.lk]||0) + 1;   // testteller
  const p = it.ctrl, k = it.lk;
  if(k === "greed"){
    addLog(`✦ Bron van Gulzigheid: ${pName(p)} trekt 2 kaarten.`, true);
    await drawN(p, 2, "✦ Bron van Gulzigheid"); return;
  }
  if(k === "darkhole"){
    let n = 0;
    for(let c=0;c<5;c++) if(P(p).cols[c].cre){ destroyCre(p, c, "✦ Zwart Gat"); n++; }
    render(); await sleep(FAST ? 0 : 220);
    addLog(`✦ Zwart Gat vernietigt ${n} eigen creature${n===1?"":"s"}${n?` — ${pName(p)} trekt er ${n}`:""}.`, true);
    if(n) await drawN(p, n, "✦ Zwart Gat");
    return;
  }
  if(k === "kuriboh"){
    const free = emptyCols(p);
    if(!free.length){ addLog("✦ Wolkenzwerm: geen vrije plek over."); return; }
    for(const c of free){
      placeCre(p, c, {id:++cid, el:"wolk", owner:p, token:true});
      render(); fxLight(creSel(p, c)); await sleep(FAST ? 0 : 90);
    }
    AU.play("light");
    addLog(`✦ Wolkenzwerm zet ${free.length} wolk-creature${free.length===1?"":"s"} neer bij ${pName(p)}.`, true);
    render(); return;
  }
  if(k === "master"){
    const el = await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Elementaal Meester: welk element wordt deze kaart?`,
      ORDER.map(e => ({v:e, label:EL[e].name, ic:EL[e].icon})));
    const card = it.card;
    card.el = el; delete card.lk;
    P(p).hand.push(card);
    addLog(`✦ Elementaal Meester wordt ${icon(el)} <em>${EL[el].name}</em> — getoond aan ${pName(opp(p))} en terug in de hand van ${pName(p)}.`, true);
    render(); return;
  }
  if(k === "gamble"){
    const t = await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Gokkersbrouwsel: welk type gok je?`,
      ORDER.concat(["licht"]).map(e => ({v:e, label:EL[e].name, ic:EL[e].icon})));
    const voor = P(p).hand.map(c => c.id);
    await drawN(p, 3, "✦ Gokkersbrouwsel");
    if(S.over) return;
    const nieuw = P(p).hand.filter(c => !voor.includes(c.id));
    let weg = 0, houd = 0;
    for(const cd of nieuw){
      if(cd.el === t){ houd++; continue; }
      const i = P(p).hand.findIndex(x => x.id === cd.id);
      if(i >= 0){ const c2 = P(p).hand.splice(i,1)[0]; P(c2.owner).grave.push(c2); weg++; }
    }
    addLog(`✦ Gokkersbrouwsel op ${icon(t)} ${EL[t].name}: ${houd} gehouden, ${weg} gediscard.`, true);
    render(); return;
  }
  if(k === "reborn"){
    /* Alles komt uit je eigen graf: óf terug in de hand, óf meteen als creature met +3 levens. */
    const g = P(p).grave;
    const grafLabel = cd => ({label:(cd.lk ? LIGHTS[cd.lk].name : EL[cd.el].name), ic:(cd.lk ? "✦" : EL[cd.el].icon)});
    const kanSummon = openCols(p).length > 0 && g.some(cd => ORDER.includes(cd.el));
    const opts = [];
    if(g.length) opts.push({v:"hand", label:"Kaart uit je graf terug in de hand", ic:"🖐"});
    if(kanSummon) opts.push({v:"summon", label:"Creature uit je graf oproepen (+3 levens)", ic:"⚔"});
    if(!opts.length){ addLog("✦ Zielenoproep: je graf biedt niets — het effect verdampt."); return; }
    const m = opts.length === 1 ? opts[0].v
      : await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Zielenoproep: kies`, opts);
    const mag = m === "summon" ? cd => ORDER.includes(cd.el) : () => true;
    const kandidaten = g.map((cd, i) => ({cd, i})).filter(x => mag(x.cd)).slice(-24);
    if(!kandidaten.length){ addLog("✦ Zielenoproep: geen geschikte kaart in je graf."); return; }
    const idx = await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Zielenoproep: welke kaart uit je graf?`,
      kandidaten.map(x => Object.assign({v:x.i}, grafLabel(x.cd))));
    const card = g.splice(idx, 1)[0];
    if(!card){ addLog("✦ Zielenoproep: die kaart ligt er niet meer."); return; }
    if(m === "hand"){
      P(p).hand.push(card);
      addLog(`✦ Zielenoproep: ${pName(p)} pakt ${card.lk ? "✦ " + LIGHTS[card.lk].name : icon(card.el) + " " + EL[card.el].name} terug in de hand.`, true);
      render(); return;
    }
    const slots = openCols(p).map(c => ({p, c, kind:"cre"}));
    if(!slots.length){ g.push(card); addLog("✦ Zielenoproep: geen vrije plek — de kaart blijft in het graf."); return; }
    const sl = await chooseSlot(p, slots, `✦ Zielenoproep: kies een plek voor ${icon(card.el)} ${EL[card.el].name} (+3 levens)`, false, {el:card.el});
    const ok = await placeNow(p, card, false, sl.c, {});
    if(!ok) return;
    P(p).cols[sl.c].cre.hp += 3;
    addLog(`✦ Zielenoproep roept ${icon(card.el)} <em>${EL[card.el].name}</em> uit het graf op met ${P(p).cols[sl.c].cre.hp} levens.`, true);
    render();
    const plan = await declarePlan(p, card, false, sl.c, {onField:true});
    pushPlay(p, card, false, sl.c, false, plan === "cancel" ? [] : plan);
    return;
  }
  if(k === "siphon"){
    const ids = allCreIds();
    const t = {dec:true, el:"licht", tid:it.plan.tid, tp:it.plan.tp, tc:it.plan.tc};
    const id = await effTarget(t, p, ids, `<b>${pName(p)}</b> — ✦ Levensroof: kies een creature`, true, {k:"siphon"});
    if(id === "fizzle" || id == null){ if(id == null) addLog("✦ Levensroof overgeslagen."); return; }
    const f = findCre(id); if(!f) return;
    const win = Math.max(0, f.cr.hp);
    f.cr.hp = 0;
    P(p).life += win;
    fxLight(creSel(f.p, f.c)); AU.play("light");
    pop(creSel(f.p, f.c), "-" + win, "dmg");
    addLog(`✦ Levensroof zuigt ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} leeg: ${pName(p)} krijgt ${win} leven${win===1?"":"s"} erbij (nu ${P(p).life}).`, true);
    destroyCre(f.p, f.c, "✦ Levensroof");
    render(); return;
  }
}
/* Resolveren van een kaart-link: de kaart staat er al, dus alleen de effecten gaan de stack op. */
async function resolvePlay(it){
  const p = it.ctrl;
  if(it.asFuse){
    for(let i = (it.plan||[]).length - 1; i >= 0; i--) S.stack.push(effItem(p, it.plan[i], it.card.id));
    // het fusie-effect gaat er bovenop: dat resolvet als eerste
    if(it.fuseEff !== false) S.stack.push({type:"eff", el:it.fuseKey, ctrl:p, srcId:it.card.id, origin:"fusie"});
    return;
  }
  const selfId = it.asSpell ? null : it.card.id;
  for(let i = (it.plan||[]).length - 1; i >= 0; i--) S.stack.push(effItem(p, it.plan[i], selfId));
}
function placeCre(p, col, card){
  P(p).cols[col].cre = {card, hp:(EL[card.el].hp || 2), played:S.gTurn, attackedT:-1, ent:0};
  addLog(`${icon(card.el)} ${EL[card.el].name} verschijnt in kolom ${col+1} van ${pName(p)}${EL[card.el].hp > 2 ? ` met ${EL[card.el].hp} levens` : ""}.`);
}
const drainPer = el => el === "steen" ? 2 : 1;   // 🌿 is sterk tegen 🪨: dubbele drain per token
/* Per token: −drainPer bij het doel, evenveel +1 bij de bron. Stopt zodra het doel valt. */
function entangleDrain(targetId, srcId, p, tokens){
  for(let i=0;i<tokens;i++){
    const g = findCre(targetId); if(!g) break;
    const per = drainPer(g.cr.card.el);
    g.cr.hp -= per;
    pop(creSel(g.p, g.c), "-" + per, "dmg");
    if(srcId != null) for(let k=0;k<per;k++){ if(findCre(srcId)) gainLife(srcId, p, "🌿 drain"); }
    if(g.cr.hp <= 0){
      addLog(`🌿 De drain maakt ${icon(g.cr.card.el)} ${EL[g.cr.card.el].name} af.`, true);
      destroyCre(g.p, g.c, "🌿 drain"); break;
    }
  }
}
/* 🔥 mag alles van je tegenstander raken. Aan je eigen kant (waar je de creature offert)
   kun je géén 🔥 Vuur aanwijzen en niets in een kolom met een 🔥 Vuur-spell. */
function fireTargets(p){
  return allCreIds((cr, pp, cc) => pp !== p
    || (cr.card.el !== "vuur" && !(P(pp).cols[cc].spell && P(pp).cols[cc].spell.card.el === "vuur")));
}
/* 💧 herspeelt alleen je eigen creatures — geen 💧 Water en niets in een kolom met een 💧-spell. */
function waterTargets(p){
  return allCreIds((cr, pp, cc) => pp === p && cr.card.el !== "water"
    && !(P(pp).cols[cc].spell && P(pp).cols[cc].spell.card.el === "water"));
}
/* Was het doelwit al vastgelegd? Dan die gebruiken — of fizzelen als hij er niet meer is.
   Zo niet (effect dat pas tijdens het resolven ontstond), dan alsnog vragen. */
async function effTarget(it, p, ids, prompt, optional, meta){
  if(it.dec){
    if(it.tid == null) return null;                 // bij het aankondigen overgeslagen
    const f = findCre(it.tid);
    const weg = !f || (it.tp != null && (f.p !== it.tp || f.c !== it.tc));   // dood, weg of verhuisd
    if(weg || !ids.includes(it.tid)){
      const nm = EL[it.el] ? EL[it.el].name : it.el;
      addLog(`${icon(it.el)} Het aangewezen doelwit van ${nm} is er niet meer — het effect <em>fizzelt</em>.`, true);
      pop(".slot.cr", "FIZZEL", "imm");
      AU.play("place");
      return "fizzle";
    }
    return it.tid;
  }
  return await chooseCre(p, ids, prompt, optional, meta);
}
async function resolveEffect(it){
  const p = it.ctrl;

  if(it.el === "vuur"){
    const big = hasAe(p, "ae_fire6");                       // 🟣 Verzengende Woede
    const dmg = big ? 5 : 2;
    const ids = fireTargets(p).filter(id => !(it.excl || []).includes(id));
    if(!ids.length){ addLog("🔥 Geen doelwit: aan je eigen kant tellen 🔥 Vuur en kolommen met een 🔥-spell niet mee."); return; }
    const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 🔥 Vuur: kies een creature (${dmg} schade; een eigen creature offer je: instakill + trek een kaart)`, false, {k:"vuur"});
    if(id === "fizzle") return;
    if(id === null){ addLog("🔥 Effect overgeslagen."); return; }
    const f = findCre(id);
    let offer = false;
    const fSrc = it.srcId != null && findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null;
    if(it.protect === id){
      applyDamage(id, "vuur", dmg, {protect:true, ignoreImmune:big, srcSel:fSrc});
    } else if(f.p === p){
      addLog(`🔥 offert de eigen ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name}: <em>instakill</em>!`, true);
      fxFire(fSrc, creSel(f.p, f.c));
      destroyCre(f.p, f.c, "🔥 offer");
      offer = true;
    } else {
      applyDamage(id, "vuur", dmg, {ignoreImmune:big, srcSel:fSrc});
    }
    render();
    if(offer && it.srcId !== id){
      addLog(`🔥 offerde een eigen creature: ${pName(p)} trekt een kaart.`, true);
      await sleep(220); await drawN(p, 1, "🔥 Vuur");
    }
    return;
  }

  if(it.el === "gras"){
    const ids = allCreIds(cr => cr.card.el !== "vuur");     // 🔥 is immuun voor entangle
    if(!ids.length){ addLog("🌿 Geen geldig doelwit (🔥 Vuur is immuun voor entangle)."); return; }
    const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 🌿 Gras: kies een creature om te entanglen (−1 leven daar, +1 hier · op 🪨 Steen −2/+2)`, false, {k:"gras"});
    if(id === "fizzle") return;
    if(id === null){ addLog("🌿 Entangle overgeslagen."); return; }
    const f = findCre(id);
    const n = hasAe(p, "ae_grassx2") ? 2 : 1;               // 🟣 Woekergroei
    const src = it.srcId != null ? findCre(it.srcId) : null;
    const gSrcSel = src ? creSel(src.p, src.c) : null;
    fxThorns(creSel(f.p, f.c), gSrcSel);
    f.cr.ent += n;
    pop(creSel(f.p, f.c), `🌿 +${n}`, "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}) krijgt ${n} entangle-token${n>1?"s":""}${n>1?" (🟣 Woekergroei)":""} — nu ${f.cr.ent}.`, true);
    entangleDrain(id, src ? it.srcId : null, p, n);
    render(); return;
  }

  if(it.el === "steen"){
    const ids = allCreIds();
    if(!ids.length){ addLog("🪨 Geen creature om +1 leven te geven."); return; }
    const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 🪨 Steen: geef een creature +1 leven (optioneel)`, true, {k:"steen"});
    if(id === "fizzle") return;
    if(id === null){ addLog("🪨 +1 overgeslagen."); return; }
    gainLife(id, p, "🪨 Steen", "rock"); render();
    return;
  }

  if(it.el === "water"){
    const ids = waterTargets(p).filter(x => x !== it.exclId);
    if(!ids.length){ addLog("💧 Geen eigen creature om te herspelen (💧 Water en kolommen met een 💧-spell tellen niet mee)."); }
    else {
      const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 💧 Water: kies een eigen creature om opnieuw te spelen`, true, {k:"water"});
      if(id === "fizzle"){ /* doelwit weg */ }
      else if(id === null) addLog("💧 Herspelen overgeslagen.");
      else {
        const f = findCre(id);
        const owner = f.p, card = f.cr.card, fromCol = f.c, keepHp = f.cr.hp;
        const slots = Array.from(new Set(openCols(owner).concat([fromCol]))).sort((a,b)=>a-b).map(c => ({p:owner, c, kind:"cre"}));
        fxSplash(creSel(owner, fromCol));
        await sleep(260);
        P(owner).cols[fromCol].cre = null; render();
        const sl = await chooseSlot(p, slots, `Kies waar ${icon(card.el)} ${EL[card.el].name} opnieuw verschijnt`, false, {el:card.el});
        addLog(`💧 ${icon(card.el)} ${EL[card.el].name} wordt opnieuw gespeeld in kolom ${sl.c+1}.`, true);
        await placeNow(owner, card, false, sl.c, {splash:true, keepHp});
        // 🟣 Getijdenstroom: de herspeelde creature doet zijn effect twee keer
        const rplan = await declarePlan(owner, card, false, sl.c,
          {onField:true, dubbel: hasAe(p, "ae_watercycle")});
        if(hasAe(p, "ae_watercycle")) addLog(`🟣 Getijdenstroom: ${icon(card.el)} ${EL[card.el].name} doet zijn effect <b>twee keer</b>.`, true);
        pushPlay(owner, card, false, sl.c, false, rplan === "cancel" ? [] : rplan);
      }
    }
    return;
  }

  if(it.el === "fu_fire"){
    const big = hasAe(p, "ae_fire6");                       // 🟣 Verzengende Woede: één doel krijgt 5
    const foes = () => allCreIds((cr, pp) => pp === opp(p));
    if(!foes().length){ addLog("🟣 Assekern: er staat niets van je tegenstander om te raken."); return; }
    const aSrc = findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null;
    let id = null;
    if(big){                                                // alleen dan is er iets te kiezen
      id = await chooseCre(p, foes(), `<b>${pName(p)}</b> — 🟣 Assekern: kies het hoofddoel (5 vuurschade; de rest krijgt 2)`, true, {k:"vuur"});
      if(id !== null){ applyDamage(id, "vuur", 5, {ignoreImmune:true, srcSel:aSrc}); render(); await sleep(160); }
    }
    addLog(`🟣 Assekern: 2 vuurschade aan ${big ? "elke andere" : "elke"} vijandelijke creature.`, true);
    for(const other of foes()){
      if(S.over) break;
      if(other === id) continue;
      applyDamage(other, "vuur", 2, {ignoreImmune:big, srcSel:aSrc});
    }
    render();
    return;
  }
  if(it.el === "fu_water"){ addLog(`🟣 Dieptestroom: ${pName(p)} trekt 1 kaart; daarna gaat het gewone 💧-effect af.`, true); await drawN(p, 1, "🟣 Dieptestroom"); return; }
  if(it.el === "fu_stone") return;      // 🟣 Bergrug zit volledig in het gedeclareerde plan
  if(it.el === "fu_grass"){
    const foes = allCreIds((cr, pp) => pp === opp(p) && cr.card.el !== "vuur");
    if(!foes.length){ addLog("🟣 Wurgranken: geen vijandelijke creature om te entanglen."); return; }
    const n = hasAe(p, "ae_grassx2") ? 2 : 1;
    addLog(`🟣 Wurgranken: elke vijandelijke creature krijgt ${n} entangle-token${n>1?"s":""}.`, true);
    for(const fid of foes){
      if(S.over) break;
      const f = findCre(fid); if(!f) continue;
      fxThorns(creSel(f.p, f.c), findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null);
      f.cr.ent += n;
      entangleDrain(fid, it.srcId, p, n);
      render(); await sleep(120);
    }
    return;
  }
}
async function resolveAttack(it){
  const p = it.ctrl, col = it.col;
  const att = P(p).cols[col].cre;
  if(!att || att.card.id !== it.creId){ addLog("De aanvaller is er niet meer: aanval vervalt."); return; }
  if(att.ent > 0){ addLog(`${icon(att.card.el)} is entangled: de aanval gaat niet door!`, true); return; }
  const def = P(opp(p)).cols[col].cre;
  const power = atkOf(att, p);
  const el = document.querySelector(creSel(p, col));
  if(el) el.classList.add(p === 0 ? "lunge-up" : "lunge-down");
  AU.play("attack");
  const fromR = rectOf(creSel(p, col));
  const toR = def ? rectOf(creSel(opp(p), col)) : rectOf(`.pside[data-side="${opp(p)}"] .plife`);
  if(fromR && toR){
    const x1 = fromR.left + fromR.width/2, y1 = fromR.top + fromR.height/2;
    const x2 = toR.left + toR.width/2, y2 = toR.top + toR.height/2;
    const len = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1);
    const ln = document.createElement("div");
    ln.className = "atkline";
    ln.style.left = x1+"px"; ln.style.top = y1+"px"; ln.style.width = len+"px";
    ln.style.transform = `rotate(${ang}rad)`;
    document.getElementById("fx").appendChild(ln);
    setTimeout(() => ln.remove(), 500);
  }
  await sleep(300);
  if(!def){
    P(opp(p)).life -= power;
    const lifeEl = document.querySelector(`.pside[data-side="${opp(p)}"]`);
    if(lifeEl) lifeEl.classList.add("shake");
    pop(rectOf(`.pside[data-side="${opp(p)}"] .plife`), "-" + power, "dmg");
    addLog(`${icon(att.card.el)} ${EL[att.card.el].name} raakt <em>${pName(opp(p))}</em> direct voor ${power} leven${power>1?"s":""}.`, true);
    if(P(opp(p)).life <= 0) return gameOver(p, pName(opp(p)) + " heeft geen levens meer.");
    return;
  }
  applyDamage(def.card.id, att.card.el, power, {srcCre: att, noFx:true});
}
async function upkeepEntangle(p){
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if(cr && cr.ent > 0){
      cr.ent -= 1;
      pop(creSel(p,c), "🌿 −1 token", "imm");
      addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} (kolom ${c+1}, ${pName(p)}) verliest een entangle-token (nog ${cr.ent}).`);
      render(); await sleep(200);
    }
  }
}
async function startTurnSequence(){
  S.ui = {mode:"busy"}; S.botPlays = 0; S.botSpells = 0;
  S.phase = "upkeep"; render();
  turnCry(S.tp);
  await sleep(FAST ? 0 : 900);
  await upkeepEntangle(S.tp);
  if(S.over) return;
  S.phase = "draw"; render();
  S.trok3 = false;                               // 🟣 Bron van Overvloed rekent alleen af als je écht 3 trok
  if(S.gTurn === 1){ addLog("Speler 1 slaat de eerste draw phase over."); await sleep(300); }
  else { const n = hasAe(S.tp, "ae_draw3") ? 3 : 2;
    addLog(`${pName(S.tp)} trekt ${n} kaarten${n === 3 ? " (🟣 Bron van Overvloed)" : ""}.`);
    await drawN(S.tp, n);
    if(n === 3 && !S.over) S.trok3 = true; }
  if(S.over) return;
  S.phase = "main1";
  backToPhase();
}
function backToPhase(){
  S.actor = S.tp;
  if(!S.set.handoff && !S.vsBot) S.holder = S.tp;
  S.ui = {mode: S.phase === "battle" ? "battle" : "main"};
  render();
  if(isBot(S.tp) && !S.over){
    clearTimeout(botT);
    botT = setTimeout(botMove, FAST ? 0 : 750 + Math.random()*400);
  }
}
async function endTurn(){
  S.phase = "end"; S.ui = {mode:"busy"}; render();
  addLog(`${pName(S.tp)} beëindigt de beurt.`);
  /* 🟣 Bron van Overvloed: heb je die derde kaart deze beurt écht getrokken, dan kost dat
     je aan het eind van diezelfde beurt 1 leven. Sloeg je de draw phase over, dan niet. */
  if(!S.over && S.trok3 && hasAe(S.tp, "ae_draw3")){
    const p = S.tp;
    P(p).life -= 1;
    const lifeEl = document.querySelector(`.pside[data-side="${p}"]`);
    if(lifeEl) lifeEl.classList.add("shake");
    pop(rectOf(`.pside[data-side="${p}"] .plife`), "-1", "dmg");
    addLog(`🟣 Bron van Overvloed kost ${pName(p)} 1 leven (nog ${P(p).life}).`, true);
    render();
    if(P(p).life <= 0) return gameOver(opp(p), pName(p) + " is leeggebloed aan 🟣 Bron van Overvloed.");
    await sleep(FAST ? 0 : 260);
  }
  if(S.klok && S.klok.aan && !S.over){
    S.klok.t[S.tp] += KLOK_BONUS;
    addLog(`⏱ ${pName(S.tp)} krijgt ${Math.round(KLOK_BONUS/60)} minuten erbij (nu ${klokTekst(S.klok.t[S.tp])}).`);
  }
  await sleep(250);
  S.gTurn++; S.tp = opp(S.tp); S.turnNo[S.tp]++;
  await ensureHolder(S.tp);
  await startTurnSequence();
}
/* ================= KLOK =================
   Elke speler krijgt 5 minuten. Rond je je beurt af, dan komt er 2 minuten bij. De klok
   loopt bij degene die aan zet is — moet er iemand reageren, dan loopt zíjn klok, niet die
   van de speler wiens beurt het is. Op nul verlies je. De klok staat uit tot iemand hem
   start; daarna loopt hij voor allebei. */
const KLOK_START = 300, KLOK_BONUS = 120;
let KLOKT = null, KLOKLAST = 0;
function klokReset(houdAan){
  const aan = houdAan && S && S.klok ? S.klok.aan : false;
  if(S) S.klok = {aan, t:[KLOK_START, KLOK_START]};
}
/* Wiens klok loopt er nu? */
function klokWie(){
  if(!S || !S.klok || !S.klok.aan || S.over) return -1;
  const u = S.ui || {};
  if(["start","draft","aetherpick","banpick","handoff","over"].includes(u.mode)) return -1;
  if(pending && u.p != null) return u.p;
  if(u.mode === "main" || u.mode === "battle") return S.tp;
  return -1;
}
function klokTick(){
  if(!S || !S.klok || !S.klok.aan){ KLOKLAST = 0; return; }
  const nu = Date.now();
  const dt = KLOKLAST ? (nu - KLOKLAST) / 1000 : 0;
  KLOKLAST = nu;
  const w = klokWie();
  if(w < 0 || !dt) return;
  S.klok.t[w] = Math.max(0, S.klok.t[w] - dt);
  klokPaint();
  if(S.klok.t[w] <= 0 && !S.over){
    if(NET.on && NET.seat >= 0 && NET.seat !== w) return;   // de eigenaar meldt het zelf
    act({t:"klokuit", p:w});
  }
}
function klokVerloren(p){
  if(!S || S.over || !S.klok || !S.klok.aan) return;
  MUT++;
  S.klok.t[p] = 0;
  addLog(`⏱ <em>${pName(p)}</em> heeft geen tijd meer.`, true);
  gameOver(opp(p), pName(p) + " liet de klok aflopen.");
}
function klokStart(){
  if(!S || !S.klok || S.klok.aan) return;
  MUT++;
  S.klok.aan = true; KLOKLAST = Date.now();
  addLog(`⏱ De klok loopt: ${Math.round(KLOK_START/60)} minuten per speler, +${Math.round(KLOK_BONUS/60)} minuten per afgeronde beurt.`, true);
  render();
}
const klokTekst = sec => {
  const t = Math.max(0, Math.ceil(sec));
  return Math.floor(t/60) + ":" + String(t % 60).padStart(2, "0");
};
/* Alleen de cijfers bijwerken — een volledige render elke tick is zonde. */
function klokPaint(){
  if(!S || !S.klok) return;
  const w = klokWie();
  for(let p=0;p<2;p++){
    const el = document.querySelector(`.pklok[data-kp="${p}"]`);
    if(!el) continue;
    el.textContent = "⏱ " + klokTekst(S.klok.t[p]);
    el.classList.toggle("loopt", p === w);
    el.classList.toggle("krap", S.klok.t[p] <= 30);
  }
}
setInterval(klokTick, 200);
function gameOver(winner, reason){
  if(S.over) return;
  S.over = {winner, reason};
  AU.play((NET.on ? winner === NET.seat : (!S.vsBot || winner === 0)) ? "win" : "lose");
  if(S.mode === "commander" && S.match){
    S.match.wins[winner]++;
    S.over.matchDone = S.match.wins[winner] >= 2;
    addLog(`<em>${pName(winner)} wint potje ${S.match.game}!</em> Stand: ${S.match.wins[0]}–${S.match.wins[1]}. ${reason}`, true);

  } else {
    addLog(`<em>${pName(winner)} wint!</em> ${reason}`, true);
  }

}

const spellVal0 = {vuur:6.2, steen:4.0, gras:3.4, water:1.2};   // 🔥 voorop, 💧 achteraan
function botChoosePlayV1(p){
  const hand = P(p).hand.filter(cd => cd.el !== "licht");
  const empty = openCols(p);
  if(!hand.length) return null;

  /* Levensgevaar: dan telt geen zetlimiet meer — elke open laan waar een aanvaller
     doorheen kan wordt dichtgezet, desnoods met de laatste kaart uit de hand. */
  if(inNood(p) && empty.length){
    const gaten = [];
    for(let c=0;c<5;c++){
      const att = P(opp(p)).cols[c].cre;
      if(att && att.ent === 0 && !P(p).cols[c].cre && empty.includes(c)) gaten.push({c, att});
    }
    if(gaten.length){
      gaten.sort((a, b) => atkOf(b.att, opp(p)) - atkOf(a.att, opp(p)));
      const g = gaten[0];
      let best = null, bs = -99;
      for(const cd of hand){
        let sc = 1 + rnd() * 0.3;
        if(dmgOutcome(g.att.card.el, cd.el, 1) === "immuun") sc += 6;   // hij kan er niets mee
        if(EL[cd.el].strong === g.att.card.el) sc += 4;                 // en wij killen hem
        if(EL[g.att.card.el].strong === cd.el) sc -= 2;                 // wordt meteen weggeveegd
        if(cd.el === "steen") sc += 1;                                  // meer levens
        if(sc > bs){ bs = sc; best = cd; }
      }
      if(best) return {cardId: best.id, mode:"cre", col: g.c};
    }
  }

  /* Begint de bot het potje, dan zet hij precies één spell neer en past verder. */
  if(S.gTurn === 1 && S.tp === p){
    if(P(p).cols.some(c => c.spell)) return null;
    let best = null, bs = -99;
    for(const cd of hand){
      const sc = (spellVal0[cd.el] || 1) + rnd() * 0.4;
      if(sc > bs){ bs = sc; best = cd; }
    }
    return best ? {cardId: best.id, mode:"spell", col: 2} : null;
  }

  if(S.botPlays >= (P(p).hand.length > 5 ? 3 : 2)) return null;
  if(!empty.length) return null;
  let best = null, bestScore = 1.5;
  for(const cd of hand){
    for(const c of empty){
      let s = 2;
      const enemy = P(opp(p)).cols[c].cre;
      if(enemy){
        if(EL[cd.el].strong === enemy.card.el) s += 4;                       // wij instakillen hen in combat
        else if(dmgOutcome(enemy.card.el, cd.el, 1) === "immuun") s += 3;    // gratis blocker
        else if(EL[enemy.card.el].strong === cd.el) s -= 3;                  // zij instakillen ons
      } else s += 1;                                                          // open laan
      if(P(p).cols[c].spell) s += 4;      // hier triggert onze spell opnieuw — dat is het plan
      if(cd.el === "vuur"){
        let eff = 0;
        eachCre((cr,pp)=>{ if(pp===opp(p)){ const o = dmgOutcome("vuur", cr.card.el, 2);
          if(o === "kill" || (typeof o === "number" && cr.hp <= o)) eff = Math.max(eff, 3);
          else if(typeof o === "number") eff = Math.max(eff, 1); } });
        s += eff;
      }
      if(cd.el === "steen") s += 1.5;      // 3 levens en +1+1
      if(cd.el === "gras") s += 1;
      s += rnd() * 0.6;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "cre", col: c}; }
    }
  }
  // spells: de bot wil in beurt 1 en beurt 2 elk één spell neerzetten
  const spellVal = spellVal0;
  const spellsOpBord = P(p).cols.filter(c => c.spell).length;
  const wilSpell = S.turnNo[p] === 1 && spellsOpBord === 0;
  for(const cd of hand){
    for(let c=0;c<5;c++){
      if(P(p).cols[c].spell) continue;                 // eigen spell niet overschrijven
      let s = 2.2 + spellVal[cd.el] + (wilSpell ? 4 : 0);
      if(spellsOpBord === 0) s += 2;                   // zonder spell op het bord eerst er één neerzetten
      if(P(p).cols[c].cre) s -= 1.6;                   // triggert pas bij een vólgende creature hier
      if(!empty.includes(c)) s -= 0.5;
      if(cd.el === "vuur" && !allCreIds((cr,pp)=>pp===opp(p)).length) s -= 1.5;
      s += rnd() * 0.7;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "spell", col: c}; }
    }
  }
  return best;
}
function botChooseAttackV1(p){
