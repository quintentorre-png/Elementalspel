   Twee standen achter elkaar (uithalen, inslaan) en dan schudt de zaal.
   Zonder eigen tekeningen zie je zijn pixelversie; met tekeningen is het een animatie. */
async function baasSlag(){
  if(FAST) return;
  let el = document.getElementById("baasslag");
  if(!el){ el = document.createElement("div"); el.id = "baasslag"; document.body.appendChild(el); }
  /* Beide standen worden vooraf neergezet. Bij de klap wisselt alleen welke zichtbaar is —
     er wordt niets opnieuw geladen, dus er zit geen gaatje tussen uithalen en inslaan. */
  el.innerHTML = `<div class="bsfig bs1">${spriteSVG("rotsbaas_laadop")}</div>`
               + `<div class="bsfig bs2">${spriteSVG("rotsbaas_slag")}</div>`;
  el.className = "aan";
  await sleep(1200);                       // uithalen
  /* Inslaan en schudden in exact dezelfde stap: één klasse doet allebei. */
  const app = document.getElementById("app");
  if(app) app.classList.remove("beefthard");
  void el.offsetWidth;
  el.classList.add("slag");
  if(app) app.classList.add("beefthard");
  await sleep(900);                        // hij blijft staan terwijl de zaal natrilt
  if(app) app.classList.remove("beefthard");
  el.className = "aan slag weg";
  await sleep(900);
  el.className = ""; el.innerHTML = "";
}

const AU = {

  boot(){

        /* Ontbreekt het bestand, dan halen we elke naam weg die ernaar wees. */
        a.addEventListener("error", () => {
          Object.keys(MUZIEK).forEach(k => { if(MUZIEK[k] === pad) MUZIEK[k] = ""; });

        });

/* 🌿 doorns die over het doel groeien, plus druppels naar de bron */
function fxThorns(sel, srcSel){
  const r = rectOf(sel); if(!r) return;
  AU.play("thorn");
  if(!fxOn()) return;
  const wrap = fxDiv("", Object.assign(fxBox(r, 8), {position:"fixed"}));
  const W = r.width + 16, H = r.height + 16;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "thorns");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = W + "px"; svg.style.height = H + "px";
  const vines = fxFull() ? 4 : 2;
  const NS = "http://www.w3.org/2000/svg";
  for(let v=0; v<vines; v++){
    /* elke rank kronkelt van de ene rand naar de andere dwars over de kaart heen */
    const vertical = v % 2 === 1;
    const span = vertical ? H : W, thick = vertical ? W : H;
    const amp = thick * (0.24 + 0.1*(v%2));
    const mid = thick * (0.5 + (v < 2 ? -0.16 : 0.18));
    const dir = v < 2 ? 1 : -1;
    const N = 9, pts = [];
    for(let i=0;i<=N;i++){
      const t = i/N;
      const along = (dir > 0 ? t : 1 - t) * (span + 14) - 7;
      const off = mid + Math.sin(t*Math.PI*2.15 + v*1.7) * amp * (0.35 + t*0.75);
      pts.push(vertical ? [off, along] : [along, off]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      const cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2;
      d += ` Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    d += ` T${pts[pts.length-1][0].toFixed(1)} ${pts[pts.length-1][1].toFixed(1)}`;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    let len = 0;
    for(let i=1;i<pts.length;i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    len *= 1.25;
    path.style.setProperty("--len", len.toFixed(0));
    path.style.animationDelay = (v*0.07) + "s, " + (0.72 + v*0.03) + "s";
    svg.appendChild(path);
    /* doorns loodrecht op de rank */
    for(let i=1;i<pts.length-1;i+=2){
      const a = pts[i-1], b = pts[i+1], px = pts[i][0], py = pts[i][1];
      const nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
      const nl = Math.hypot(nx, ny) || 1;
      const side = (i % 4 === 1) ? 1 : -1;
      const ux = (nx/nl)*side, uy = (ny/nl)*side;
      const L = 7 + Math.random()*4, Wd = 3.2;
      const tri = document.createElementNS(NS, "polygon");
      tri.setAttribute("points",
        `${(px + ux*L).toFixed(1)},${(py + uy*L).toFixed(1)} ` +
        `${(px - uy*Wd).toFixed(1)},${(py + ux*Wd).toFixed(1)} ` +
        `${(px + uy*Wd).toFixed(1)},${(py - ux*Wd).toFixed(1)}`);
      const del = 0.1 + v*0.07 + (i/pts.length)*0.28;
      tri.style.animationDelay = del + "s, " + (0.72 + v*0.03) + "s";
      svg.appendChild(tri);
    }
  }
  wrap.appendChild(svg);
  fxAdd(wrap, 1300);
  if(srcSel){
    const sr = rectOf(srcSel);
    if(sr){
      const a = ctr(r), b = ctr(sr);
      const n = fxScale(5);
      for(let i=0;i<n;i++){
        const bead = fxDiv("drainbead", {left:(a.x + (Math.random()*30 - 15)) + "px", top:(a.y + (Math.random()*30 - 15)) + "px"});
        bead.style.setProperty("--tx", (b.x - a.x) + "px");
        bead.style.setProperty("--ty", (b.y - a.y) + "px");
        bead.style.setProperty("--d", (0.5 + i*0.07) + "s");
        bead.style.animationDelay = (0.16 + i*0.06) + "s";
        fxAdd(bead, 1400);
      }
    }
  }
}

/* Zet een plaat om in een SVG, met horizontaal samengevoegde blokjes. */
function pixSVG(el){
  const art = PIX_ART[el], pal = PIX_PAL[el];
  if(!art) return "";
  const w = art[0].length, h = art.length;
  let r = "";
  for(let y=0;y<h;y++){
    let x = 0;
    while(x < w){
      const c = art[y][x];
      let n = 1;
      while(x + n < w && art[y][x+n] === c) n++;
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[+c]}"/>`;
      x += n;
    }
  }
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" shape-rendering="crispEdges">${r}</svg>`;
}
const PIX_CACHE = {};
const pixArt = el => (PIX_CACHE[el] || (PIX_CACHE[el] = pixSVG(el)));

function waitUI(mode, data){
  return new Promise(res => {
    S.ui = Object.assign({mode}, data); pending = {res}; render();
    if(data && isBot(data.p) && mode !== "handoff")
      setTimeout(() => botDecide(mode), FAST ? 0 : 550 + Math.random()*450);
    else if(mode === "priority" && data && autoPassOn(data.p))
      setTimeout(() => {
        if(pending && S.ui.mode === "priority" && S.ui.p === data.p){
          addLog(`⚡ Autopass staat aan voor ${pName(data.p)} — reactie automatisch doorgelaten.`);
          act({t:"f", v:"pass"});
        }
      }, 130);
  });
}

async function ensureHolder(p){
  S.actor = p;
  if(NET.on){ S.holder = p; return; }
  if(S.vsBot){ if(!isBot(p)) S.holder = p; return; }
  if(!S.set.handoff){ S.holder = p; return; }
  if(S.holder === p) return;
  await waitUI("handoff", {p});
  S.holder = p;
}

const alziend = p => !!(S && S.ae && hasAe(p, "ae_alziend"));
const handVisible = p => NET.on ? p === NET.seat
  : ((!isBot(p) && (S.holder === p || !S.set.handoff || (S.vsBot && p === 0)))

/* ================= CORE FLOWS ================= */
async function drawN(p, n, why, geenLimiet){
  for(let i=0;i<n;i++){
    if(S.over) return;
    if(P(p).deck.length === 0){
      addLog(`${pName(p)} moet trekken met een <em>leeg deck</em> — en verliest!`, true);
      return gameOver(opp(p), pName(p)+" moest een kaart trekken uit een leeg deck.");
    }
    const card = P(p).deck.pop();
    AU.play("draw");
    const from = rectOf(`#deck${p}`), to = rectOf(`#hand${p}`);
    const face = handVisible(p) ? cardFaceHTML(card.el) : backHTML;
    await flyCard(from, to ? {left:to.left+to.width/2-30, top:to.top, width:60, height:84} : null, face, 400);
    P(p).hand.push(card);
    if(S.story){ if(!S.story.getrokken) S.story.getrokken = [0,0]; S.story.getrokken[p]++; }
    if(why) addLog(`${pName(p)} trekt een kaart (${why}).`);
    render();
  }
  if(!geenLimiet) await handLimiet(p);
}
/* ✋ Handlimiet: je speelt met maximaal zeven kaarten. Trek je daarboven, dan gooi je
   meteen weg tot je er weer zeven hebt — geen kaarten opsparen tot het einde. */
const HANDMAX = 7;
async function handLimiet(p){
  if(S.over) return;
  let veiligheid = 0;
  while(P(p).hand.length > HANDMAX && !S.over && veiligheid++ < 30){
    const ids = P(p).hand.map(c => c.id);
    await ensureHolder(p);
    const id = await waitUI("choice", {p, kind:"hand", valid:ids, optional:false, meta:{k:"handmax"},
      prompt:`<b>${pName(p)}</b> — <b>${P(p).hand.length}</b> kaarten in je hand, en er mogen er maar <b>${HANDMAX}</b> zijn. Klik er één weg.`});
    let i = P(p).hand.findIndex(c => c.id === id);
    if(i < 0) i = P(p).hand.length - 1;
    const cd = P(p).hand.splice(i, 1)[0];
    P(cd.owner).grave.push(cd);
    addLog(`✋ ${pName(p)} zit boven de handlimiet en gooit ${cd.lk ? "✦ " + LIGHTS[cd.lk].name : icon(cd.el) + " " + EL[cd.el].name} weg.`, true);
    render();
    if(!FAST) await sleep(200);
  }
}
function gainLife(id, byP, srcTxt, fx){
  const f = findCre(id); if(!f) return false;
  f.cr.hp += 1;
  if(fx === "rock") fxRocks(creSel(f.p, f.c));
  pop(creSel(f.p, f.c), "+1", "heal");
  if(srcTxt) addLog(`${icon(f.cr.card.el)} in kolom ${f.c+1} van ${pName(f.p)} krijgt +1 leven (${srcTxt}).`);
  return true;
}
function destroyCre(p, c, cause){
  const cr = P(p).cols[c].cre; if(!cr) return;
  /* 🕊 Genade: één keer per beurt blijft er eentje staan, op één leven. */
  if(hasAe(p, "ae_genade") && !EL[cr.card.el].token && !EL[cr.card.el].onsterfelijk
     && S.genade && S.genade[p] !== S.gTurn){
    S.genade[p] = S.gTurn;
    cr.hp = 1;
    pop(creSel(p, c), "🕊", "heal");
    addLog(`🕊 <em>Genade</em>: ${icon(cr.card.el)} ${EL[cr.card.el].name} van ${pName(p)} blijft staan op <b>1 leven</b>.`, true);
    render();
    return;
  }
  /* Sommige beesten gaan niet dood. Ze komen hooguit op nul uit en blijven staan. */
  if(EL[cr.card.el] && EL[cr.card.el].onsterfelijk){
    if(cr.hp > 0) cr.hp = 0;
    pop(creSel(p, c), "0", "imm");
    addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} zakt naar <b>0 levens</b> — en blijft staan. Hij gaat niet dood${cause ? ` (${cause})` : ""}.`, true);
    render();
    return;
  }
  const w = fxWait();
  if(w > 12) setTimeout(()=>AU.play("kill"), w); else AU.play("kill");
  fxAsh(creSel(p, c), cr.card.el);
  P(p).cols[c].cre = null;
  /* 💀 Wie hier omkomt blijft niet liggen. De kapitein zelf ook niet. */
  const st0 = S && S.story;
  let bewaard = false;
  if(st0 && st0.verzopen && p === 1){
    if(cr.card.el === "kapitein"){ st0.kapWeg = true; st0.kapKaart = cr.card; bewaard = true; }
    else if(cr.card.el !== "wolk") st0.verzopenN = (st0.verzopenN || 0) + 1;
  }
  if(!bewaard) P(cr.card.owner).grave.push(cr.card);
  pop(creSel(p,c), "✝", "kill");
  addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} van ${pName(p)} wordt vernietigd${cause ? ` (${cause})` : ""}.`, true);
}
function applyDamage(id, srcEl, base, o){
  const f = findCre(id); if(!f) return {done:false};
  if(inRook() && f.cr.dicht) rookOnthul(f, "er komt iets doorheen");
  let out = dmgOutcome(srcEl, f.cr.card.el, base);
  /* 🌧 Regen: vuur dooft. Alleen je eigen creatures voelen het nog — dat blijft je manier
     om er eentje op te offeren voor een kaart. */
  if(regentHet() && srcEl === "vuur"){
    const baas = (o && o.ctrl != null) ? o.ctrl : S.actor;
    if(f.p !== baas){
      pop(creSel(f.p, f.c), "🌧", "imm");
      addLog(`🌧 De regen dooft het vuur: ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} van ${pName(f.p)} blijft heel.`);
      return {destroyed:false};
    }
  }
  /* 🟣 Vonkoverslag springt sowieso naar de buren — ook als dit doelwit zelf niets voelt. */
  vonkOverslag(f.p, f.c, srcEl, o);
  if(!findCre(id)) return {destroyed:true, wasP:f.p, raak:true};
  if(o && o.ignoreImmune && out === "immuun") out = base;    // 🟣 Verzengende Woede raakt ook Water
  if(o && o.alwaysKill && !o.protect) out = "kill";
  const sel = creSel(f.p, f.c);
  if(!(o && o.noFx) && srcEl === "vuur" && out !== "immuun"){
    const sc = o && o.srcSel ? o.srcSel : null;
    fxFire(sc, sel);
  }
  if(out === "immuun"){
    pop(sel, "IMMUUN", "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} is <em>immuun</em> voor ${icon(srcEl)} ${EL[srcEl].name}.`);
    return {destroyed:false};
  }
  if(o && o.protect){
    const newHp = out === "kill" ? Math.min(f.cr.hp, 1) : Math.max(1, f.cr.hp - out);
    const lost = f.cr.hp - newHp;
    f.cr.hp = newHp;
    pop(sel, lost > 0 ? "-" + lost : "beschermd", lost > 0 ? "dmg" : "imm");
    addLog(`${icon(f.cr.card.el)} in kolom ${f.c+1} kan niet vernietigd worden door deze trigger en blijft op ${f.cr.hp} leven.`);
    return {destroyed:false, raak: lost > 0};
  }
  if(out === "kill"){
    addLog(`${icon(srcEl)} ${EL[srcEl].name} is sterk tegen ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name}: <em>instakill</em>!`, true);
    pop(sel, "INSTAKILL", "kill");
    destroyCre(f.p, f.c, "instakill");
    return {destroyed:true, wasP:f.p, raak:true};
  }
  f.cr.hp -= out;
  if(EL[f.cr.card.el].onsterfelijk && f.cr.hp < 0) f.cr.hp = 0;
  pop(sel, "-" + out, "dmg");
  addLog(`${icon(srcEl)} doet ${out} schade aan ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}).`);
  const weg = f.cr.hp <= 0 && !EL[f.cr.card.el].onsterfelijk;
  if(weg) destroyCre(f.p, f.c, "schade");
  return weg ? {destroyed:true, wasP:f.p, raak:true} : {destroyed:false, raak:true};
}
/* 🟣 Vonkoverslag: elk 🔥 dat raak is springt naar de buurkolommen aan diezelfde kant.
   Die overslag is elementloos (dus 💧 voelt hem ook) en springt zelf niet verder. */
function vonkOverslag(tp, tc, srcEl, o){
  if(srcEl !== "vuur" || (o && o.geenVonk)) return;
  const baas = (o && o.ctrl != null) ? o.ctrl : S.actor;
  if(!hasAe(baas, "ae_vonk")) return;
  [tc-1, tc+1].forEach(c => {
    if(c < 0 || c > 4) return;
    const cr = P(tp).cols[c].cre; if(!cr) return;
    cr.hp -= 1;
    pop(creSel(tp, c), "-1", "dmg");
    addLog(`🟣 <em>Vonkoverslag</em>: de vonk springt naar kolom ${c+1} van ${pName(tp)} — 1 schade aan ${icon(cr.card.el)} ${EL[cr.card.el].name}.`, true);
    if(cr.hp <= 0) destroyCre(tp, c, "🟣 Vonkoverslag");
  });
  render();
}
function bounceToHand(id){
  const f = findCre(id); if(!f) return;
  P(f.p).cols[f.c].cre = null;
  P(f.cr.card.owner).hand.push(f.cr.card);
  addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} van ${pName(f.p)} keert terug naar de hand.`);
}
function moveCre(p, from, to){
  P(p).cols[to].cre = P(p).cols[from].cre;
  P(p).cols[from].cre = null;
  addLog(`${pName(p)} verplaatst ${icon(P(p).cols[to].cre.card.el)} van kolom ${from+1} naar kolom ${to+1} (triggert geen spells).`);
}

/* ---- choices ---- */
async function chooseCre(p, ids, prompt, optional, meta){
  if(!ids.length) return null;
  /* In de tutorial wijzen we de speler naar de overkant: zichzelf entanglen is een
     leerzame fout die de les blokkeert. */
  if(p === 0){
    const tst = tutStap();
    if(tst && tst.doel === "vij"){
      const vij = ids.filter(id => { const f = findCre(id); return f && f.p === 1; });
      if(vij.length){ ids = vij; optional = false; }
    }
  }
  const selfId = meta && meta.selfId != null ? meta.selfId : null;
  // Principe: gedwongen je eigen bord targeten hoeft nooit — dan wordt de keuze optioneel.
  if(!optional && ids.every(id => { if(id === selfId) return true; const f = findCre(id); return f && f.p === p; })){
    optional = true;
    prompt += ` <span style="opacity:.7">(alleen eigen doelen — optioneel)</span>`;
  }
  await ensureHolder(p);
  return await waitUI("choice", {p, kind:"cre", valid:ids, prompt, optional, meta});
}
/* Mag deze lichtkaart nu gespeeld worden? */
function lightPlayable(p, card){
  if(!card || card.el !== "licht" || !LIGHTS[card.lk]) return false;
  const k = card.lk;
  if(LIGHTS[k].cost && P(p).life <= LIGHTS[k].cost) return false;   // je mag jezelf niet doodbetalen
  if(LIGHTS[k].tribute && !allCreIds((cr, pp) => pp === p).length) return false;   // zonder offer geen activatie
  if(k === "negate"){
    const top = S.stack[S.stack.length-1];
    return !!(top && top.type === "play" && top.ctrl === opp(p));
  }
  if(k === "dfusion") return aeFuseAny(p) && openCols(p).length > 0;
  if(k === "kuriboh") return emptyCols(p).length > 0;
  if(k === "darkhole") return allCreIds((cr, pp) => pp === p).length > 0;
  if(k === "siphon")   return allCreIds().length > 0;
  if(k === "reborn")   return P(p).grave.length > 0;
  return true;
}
async function chooseOpt(p, prompt, opts){
  await ensureHolder(p);
  return await waitUI("opt", {p, prompt, opts});
}
async function chooseSlot(p, slots, prompt, cancellable, meta){
  if(!slots || !slots.length){ addLog("Geen geldige plek — die stap vervalt."); return null; }
  await ensureHolder(p);
  return await waitUI("slot", {p, valid:slots, prompt, cancellable, meta});
}

/* ================= CHAIN / STACK ================= */
/* ============ DOELWITTEN VASTLEGGEN BIJ HET AANKONDIGEN ============
   Als je een kaart speelt kies je meteen wat je target. Dat doelwit staat vast op de chain;
   is het bij het resolven weg (dood, verplaatst, teruggehaald), dan fizzelt dat effect. */
function effsOf(el, origin){
  if(el === "steen") return [{el, origin}, {el, origin}];      // tweemaal +1, los van elkaar
  if(el === "vuur" || el === "gras" || el === "water") return [{el, origin}];
  return [];
}
/* De effecten die deze zet triggert, in de volgorde waarin ze straks resolven. */
function plannedEffects(p, card, asSpell, col, opts){
  if(asSpell) return effsOf(card.el, "spell");
  const o = opts || {};
  let own = o.forceEffs ? o.forceEffs.slice() : (o.skipOwn ? [] : effsOf(card.el, "creature"));
  if(o.dubbel) own = own.concat(own.map(e => Object.assign({}, e)));   // 🟣 Getijdenstroom
  const sp = P(p).cols[col] && P(p).cols[col].spell;
  return own.concat(sp ? effsOf(sp.card.el, "spell") : []);
}
/* Geldige doelwitten. De gespeelde kaart staat op dit moment al op het veld, dus hij zit
   gewoon in allCreIds(); selfId dient alleen nog om hem waar nodig uit te sluiten. */
function targetsForEff(p, e, selfId, cardEl, exclIds){
  const skip = id => exclIds && exclIds.includes(id);
  if(e.el === "vuur")  return fireTargets(p).filter(id => !skip(id) && !(e.origin === "creature" && id === selfId));
  if(e.el === "gras")  return allCreIds(cr => !skip(cr.card.id) && entBaar(cr));
  if(e.el === "steen") return allCreIds(cr => !skip(cr.card.id));
  if(e.el === "water") return waterTargets(p).filter(id => id !== selfId && !skip(id));
  return [];
}
const effPrompt = {
  vuur:  "🔥 Vuur: kies nu je doelwit (%D% schade; een eigen creature offer je: instakill + trek een kaart — eigen 🔥 Vuur en eigen kolommen met een 🔥-spell kun je niet aanwijzen)",
  gras:  "🌿 Gras: kies nu wie je entanglet (−1/+1 · op 🪨 Steen −2/+2)",
  steen: "🪨 Steen: kies nu wie er +1 leven krijgt",
  water: "💧 Water: kies nu een eigen creature om opnieuw te spelen"
};
/* Vraagt per effect één doelwit en geeft het plan terug, of "cancel". */
async function declarePlan(p, card, asSpell, col, opts){
  const o = opts || {};
  const selfId = asSpell ? null : card.id;
  const plan = plannedEffects(p, card, asSpell, col, o);
  for(let i=0;i<plan.length;i++){
    const e = plan[i];
    const ids = targetsForEff(p, e, selfId, card.el, o.excl);
    if(!ids.length){ e.tid = null; continue; }
    const bron = e.origin === "spell" ? " <span style='opacity:.7'>(spell-trigger)</span>" : "";
    const nr = plan.filter(x => x.el === e.el && x.origin === e.origin).length > 1
      ? ` <span style="opacity:.7">(${plan.slice(0,i+1).filter(x=>x.el===e.el&&x.origin===e.origin).length}/2)</span>` : "";
    const id = await chooseCre(p, ids,
      `<b>${pName(p)}</b> — ${effPrompt[e.el].replace("%D%", hasAe(p, "ae_fire6") ? "5" : "2")}${nr}${bron}`,
      e.el === "steen", {k:e.el, selfId});
    if(id === "cancel") return "cancel";
    e.tid = id;
    if(id != null){ const f = findCre(id); if(f){ e.tp = f.p; e.tc = f.c; } }
  }
  return plan;
}
/* Bouwt het stack-item voor één gepland effect. */
function effItem(p, e, selfId){
  const it = {type:"eff", el:e.el, ctrl:p, origin:e.origin, tid:e.tid, tp:e.tp, tc:e.tc, dec:true};
  if(e.el === "vuur"){
    it.excl = (e.origin === "creature" && selfId != null) ? [selfId] : [];
    it.srcId = e.origin === "creature" ? selfId : null;
    it.protect = e.origin === "spell" ? selfId : null;
  }
  if(e.el === "gras")  it.srcId = selfId;
  if(e.el === "water") it.exclId = selfId;
  return it;
}
/* Krijgt deze speler een reactievenster op deze link? Alleen als er iets te doen valt:
   – de aanval komt op hem af (blokken),
   – de kaart mikt op een van zijn eigen creatures (ontwijken, wegschuiven, offeren),
   – of het is zijn eigen link die ergens op mikt (doorchainen op je eigen zet).
   Voor al het andere is doorlaten de enige zinnige zet, en dat scheelt een hoop spatie. */
function magReageren(wie, it){
  if(it.type === "attack"){
    if(wie === it.ctrl) return false;                       // alleen de verdediger blokt
    // en blokken kan alleen in de aangevallen kolom; staat daar al iets, dan rest hooguit ✦ licht
    return (openCols(wie).includes(it.col) && handHasFlash(wie)) || handHasLight(wie);
  }
  const doelen = Array.isArray(it.plan) ? it.plan
               : (it.plan && it.plan.tid != null ? [it.plan] : []);
  // Met een ✦ lichtkaart in de hand mag je altijd reageren — anders zou ✦ Volledige
  // Negatie nooit aan bod komen.
  if(wie !== it.ctrl && handHasLight(wie)) return true;
  // 🪨 +1 leven en 💧 herspelen bedreigen niemand — daar hoeft niemand op te reageren.
  const bedreigt = e => e.tid != null && (e.el === "vuur" || e.el === "gras" || it.type === "light");
  return doelen.some(e => { if(!bedreigt(e)) return false;
                            const f = findCre(e.tid); return f && f.p === wie; });
}
async function chainLoop(){
  while(S.stack.length && !S.over){
    const top = S.stack[S.stack.length-1];
    /* Allebei de spelers mogen op de bovenste link reageren voordat hij resolvet.
       Eerst degene die de link er net op zette — die houdt de prioriteit en mag dus
       op zijn eigen kaart doorchainen — daarna de ander. Pas als ze allebei
       doorlaten resolvet de bovenste link. */
    /* Alleen op een gespeelde kaart of een aanval mag gereageerd worden. Losse effecten
       die daaruit voortkomen resolven meteen — anders krijg je een venster per mini-effect. */
    if(top.type === "eff"){ await resolveTop(); continue; }
    /* En zelfs dan niet iedereen: alleen wie er écht iets mee kan. Zie magReageren. */
    const tstap0 = tutStap();
    const beurten = (S.story && S.story.geenChain) ? []
      : [top.ctrl, opp(top.ctrl)].filter(wie => (PRIOALL || magReageren(wie, top))
          && !(wie === 0 && tstap0 && !tstap0.flash));
    let toegevoegd = false;
    for(const wie of beurten){
      if(S.over) return;
      if(S.stack[S.stack.length-1] !== top) break;      // er is intussen iets bijgekomen
      if(!hasLegalFlash(wie)) continue;
      const r = await askPriority(wie);
      if(S.over) return;
      if(r !== "pass"){
        const card = takeFromHand(wie, r.cardId);
        if(r.light) await announceLight(wie, card, true);
        else if(r.fuse){
          addLog(`${pName(wie)} start ⚡ 🟣 <em>${AETHERS[r.fuseKey].name}</em>.`, true);
          await announceFusion(wie, card, r.tributeId, r.fuseKey);
        }
        else await announcePlay(wie, card, false, r.col, true);
        toegevoegd = true;
        break;
      }
      addLog(`${pName(wie)} reageert niet.`);
    }
    if(toegevoegd) continue;
    await resolveTop();
  }
  if(!S.over) backToPhase();
}
async function askPriority(p){
  while(true){
    await ensureHolder(p);
    const r = await waitUI("priority", {p});
    if(r === "pass" || r == null) return "pass";
    const card = P(p).hand.find(cd => cd.id === r);
    if(!card) return "pass";                       // onbekende kaart: gewoon doorlaten
    if(p === 0 && tutAan()){
      const tst = tutStap();
      if(!tst || tst.flash !== card.el){ tutNudge("Nu nog niet reageren."); continue; }
      tutKlaarStap("flash", card.el);
    }
    if(card.el === "licht"){
      if(!lightPlayable(p, card)) continue;
      return {cardId:r, light:true};
    }
    const canCre = EL[card.el].flash && openCols(p).length > 0;
    const canFuse = fuseOk(p, card.el, "flash");
    let mode = "cre";
    if(canCre && canFuse){
      const m = await waitUI("pickmode", {p, cardId:r, creOk:true, spOk:false, fuseOk:true, flashCtx:true});
      if(m === "cancel") continue;
      mode = m;
    } else if(canFuse && !canCre) mode = "fuse";
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de creature die je offert`, true, {k:"tribute"});
      if(tid === null) continue;
      return {cardId:r, fuse:true, tributeId:tid, fuseKey:f.key};
    }
    const slots = creSlotsFor(p, card.el);
    const s = await waitUI("slot", {p, valid:slots, cancellable:true,
      prompt:`Kies een plek voor ⚡ ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel") continue;
    return {cardId:r, col:s.c};
  }
}
function takeFromHand(p, cardId){
  const i = P(p).hand.findIndex(cd => cd.id === cardId);
  return P(p).hand.splice(i,1)[0];
}
async function resolveTop(){
  const it = S.stack.pop();
  S.ui = {mode:"busy"}; render();
  await sleep(120);
  if(it.type === "play") await resolvePlay(it);
  else if(it.type === "light") await resolveLight(it);
  else if(it.type === "attack") await resolveAttack(it);
  else await resolveEffect(it);
  render();
}
function pushOwnEffect(p, col, cre){
  const el = cre.card.el;
  if(el === "vuur")  S.stack.push({type:"eff", el:"vuur",  ctrl:p, excl:[cre.card.id], srcId:cre.card.id, protect:null, origin:"creature"});
  if(el === "gras")  S.stack.push({type:"eff", el:"gras",  ctrl:p, srcId:cre.card.id, origin:"creature"});
  if(el === "steen"){
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});   // tweemaal +1
  }

}
function pushSpellTrigger(p, col, trigCre){
  const sp = P(p).cols[col].spell; if(!sp) return;
  const el = sp.card.el, tid = trigCre ? trigCre.card.id : null;
  addLog(`✦ Spell-trigger: ${icon(el)} ${EL[el].name} in kolom ${col+1} van ${pName(p)}.`);

    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"});

/* ============ SPELEN ============
   Het NEERLEGGEN van een creature of spell gaat buiten de chain om: de kaart staat er
   meteen en dat is niet te onderbreken. Daarna gaat de kaart als link de chain op en
   volgen zijn effecten volledig de gewone chain-logica. */
async function placeNow(p, card, asSpell, col, opts){
  const o = opts || {}, slot = P(p).cols[col];
  if(asSpell){
    if(slot.spell){
      P(slot.spell.card.owner).grave.push(slot.spell.card);
      addLog(`De oude spell ${icon(slot.spell.card.el)} ${EL[slot.spell.card.el].name} in kolom ${col+1} wordt gediscard.`, true);
    }
    slot.spell = {card};
    render(); AU.play("place"); await sleep(140);
    return true;
  }
  if(slot.cre && EL[slot.cre.card.el].overheen && card.el !== slot.cre.card.el){
    const oud = slot.cre.card.el;
    addLog(`${icon(oud)} ${oud === "wolk" ? "De wolk" : "Het skelet"} in kolom ${col+1} van ${pName(p)} ${oud === "wolk" ? "lost op" : "valt uit elkaar"}.`);
    slot.cre = null; render();
  }
  if(slot.cre){ P(p).hand.push(card); addLog(`Creature-plek bezet: ${icon(card.el)} keert terug naar de hand.`); return false; }
  placeCre(p, col, card);
  if(o.keepHp != null && slot.cre){                       // 💧 herspelen: levens blijven, tokens niet
    slot.cre.hp = o.keepHp;
    if(o.keepHp !== (EL[card.el].hp || 2))
      addLog(`💧 ${icon(card.el)} ${EL[card.el].name} houdt zijn ${o.keepHp} levens; entangle-tokens vallen weg.`);
  }
  render();
  if(o.splash) fxSplash(creSel(p, col)); else AU.play("place");
  await sleep(140);
  return true;
}
function pushPlay(p, card, asSpell, col, flash, plan){
  S.stack.push({type:"play", ctrl:p, card, asSpell, col, flash, plan:plan || []});
  const tg = (plan || []).filter(e => e.tid != null).map(e => {
    const f = findCre(e.tid);
    return f ? `${icon(f.cr.card.el)} ${pName(f.p)} kol ${f.c+1}` : "?";
  });
  addLog(`${pName(p)} speelt ${icon(card.el)} <em>${EL[card.el].name}</em> als ${asSpell?"spell":"creature"}${flash?" ⚡(flash)":""} → kolom ${col+1}${tg.length?` · target: ${tg.join(" + ")}`:""}.`, true);
}
/* Kaart direct neerleggen, doelwitten kiezen, en dan als link op de chain. */
async function announcePlay(p, card, asSpell, col, flash, opts){
  const ok = await placeNow(p, card, asSpell, col, opts);
  if(!ok) return false;
  /* 💨 In de rook legt hij zijn creatures dicht neer: geen effect, geen kaartbeeld. */
  if(inRook() && p === 1 && !asSpell && P(p).cols[col].cre && P(p).cols[col].cre.card.id === card.id){
    P(p).cols[col].cre.dicht = true;
    addLog(`💨 ${pName(p)} legt iets in kolom ${col+1}. Je ziet niet wat.`, true);
    pushPlay(p, card, asSpell, col, flash, []);
    render();
    return true;
  }
  const plan = await declarePlan(p, card, asSpell, col, {onField:true});
  pushPlay(p, card, asSpell, col, flash, plan === "cancel" ? [] : plan);
  await toonZet(p, cardFaceHTML(card.el, asSpell), `${icon(card.el)} <b>${EL[card.el].name}</b> als ${asSpell ? "spell" : "creature"} in kolom ${col+1}`,
    plan === "cancel" ? [] : plan);
  /* 🔥 Sommigen leven van jouw vuur. Ze vertellen dat alleen niet vooraf. */
  await storyBrandstof(p, card, asSpell);
  await bottenOp(p, card, asSpell, col);
  await vuurVerzuipt(p, card, asSpell, col);
  return true;
}
/* 🫧 Onder water blijft vuur niet branden. Zijn effect gaat gewoon af — het lichaam niet. */
async function vuurVerzuipt(p, card, asSpell, col){

/* 💀 De bodem hier is bot. Zet je iets zwaars neer, dan komt er iets omhoog. */
async function bottenOp(p, card, asSpell, col){
  const st = S && S.story;
  if(!st || !st.botten || asSpell || !card || card.el !== "steen" || p !== 0 || S.over) return;
  const vrij = emptyCols(p).filter(c => c !== col);
  if(!vrij.length){ addLog(`💀 Er rammelt iets in het zand, maar er is geen plek voor.`); return; }

  placeCre(p, c, {id:++cid, el:"skelet", owner:p, token:true});
  const cr = P(p).cols[c].cre;
  if(cr){ cr.hp = 1; cr.played = 0; }
  addLog(`💀 <em>Je 🪨 Steen zakt in het zand en er komt iets mee omhoog:</em> een skelet in kolom ${c+1}. 1 leven, 1 schade.`, true);
  if(!FAST){ fxSplash(creSel(p, c)); AU.play("place"); await sleep(220); }

/* De Balrog trekt een kaart telkens als jij 🔥 speelt — creature of spell, maakt niet uit. */
async function storyBrandstof(p, card, asSpell, hoe){

/* Fusie: het offer en de nieuwe creature staan er meteen; de effecten gaan de chain op. */

/* ============ ✦ LICHTKAARTEN ============

  }
  slot.spell = {card};

  if(offerId != null){
    const f = findCre(offerId);
    if(f && f.p === p){
      addLog(`${pName(p)} offert ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} in kolom ${f.c+1} voor ✦ ${LIGHTS[k].name}.`, true);
      destroyCre(f.p, f.c, `✦ ${LIGHTS[k].name}`);
      render(); await sleep(FAST ? 0 : 220);
    } else {
      addLog(`Het offer voor ✦ ${LIGHTS[k].name} is er niet meer — de kaart gaat naar het graf.`, true);
      P(card.owner).grave.push(card); render();

    await toonZet(p, cardFaceHTML("licht", true, card), `✦ <b>Volledige Negatie</b><span style="display:block;opacity:.75;font-size:.9em">jouw kaart verdwijnt van de chain</span>`, [], 1150);
    doNegate(p); render();
    return true;
  }
  let plan = {};
  if(k === "siphon"){
    const ids = allCreIds();
    const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — ✦ Levensroof: kies de creature die je leegzuigt`, true, {k:"siphon"});
    if(id === "cancel"){ P(card.owner).grave.push(card); return true; }
    const f = id != null ? findCre(id) : null;
    plan = {tid:id, tp:f ? f.p : null, tc:f ? f.c : null};
  }
  if(k !== "master") P(card.owner).grave.push(card);   // Elementaal Meester keert terug naar de hand
  render();
  if(hasAe(p, "ae_hemel")){

    addLog(`🟣 <em>Hemelschoon</em>: ${pName(p)} heelt 1 leven (nu ${P(p).life}) en trekt een kaart.`, true);
    pop(rectOf(`.pside[data-side="${p}"] .plife`), "+1", "heal");

  const tg = plan.tid != null && findCre(plan.tid)
    ? ` · target: ${icon(findCre(plan.tid).cr.card.el)} ${pName(plan.tp)} kol ${plan.tc+1}` : "";
  addLog(`${pName(p)} speelt ✦ <em>${LIGHTS[k].name}</em>${flash ? " ⚡(flash)" : ""} → kolom ${col+1}${tg}.`, true);
  return true;

async function announceDirectFusion(p, card, flash){

/* Volledige Negatie: haalt de bovenste kaart-link van de tegenstander volledig weg. */
function doNegate(p){
  for(let i = S.stack.length - 1; i >= 0; i--){
    const it = S.stack[i];
    if(it.type !== "play" || it.ctrl !== opp(p)) continue;
    S.stack.splice(i, 1);
    if(it.asSpell){
      const sl = P(it.ctrl).cols[it.col];
      if(sl.spell && sl.spell.card.id === it.card.id) sl.spell = null;
    } else {
      const f = findCre(it.card.id);
      if(f){ fxLight(creSel(f.p, f.c)); P(f.p).cols[f.c].cre = null; }
    }
    P(it.card.owner).grave.push(it.card);
    AU.play("light");
    addLog(`✦ Volledige Negatie: ${icon(it.card.el)} <em>${EL[it.card.el].name}</em> van ${pName(it.ctrl)} wordt volledig genegeerd — kaart naar het graf, alle effecten van de chain.`, true);
    return true;
  }
  addLog("✦ Volledige Negatie vindt geen kaart om te negeren.");
  return false;
}
async function resolveLight(it){

  }

    render(); await sleep(FAST ? 0 : 220);

    addLog(`✦ <em>Ontzag</em>: het hele bord van ${pName(foe)} houdt zich stil — volgende beurt valt er niets aan.`, true);

  }
  if(k === "gamble"){
    let t = await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Gokkersbrouwsel: welk type gok je?`,
      ORDER.concat(["licht"]).map(e => ({v:e, label:EL[e].name, ic:EL[e].icon})));
    if(!ORDER.includes(t) && t !== "licht") t = ORDER[Math.floor(rnd() * ORDER.length)] || "vuur";
    const voor = P(p).hand.map(c => c.id);
    await drawN(p, 3, "✦ Gokkersbrouwsel", true);
    if(S.over) return;
    const nieuw = P(p).hand.filter(c => !voor.includes(c.id));
    let weg = 0, houd = 0;
    for(const cd of nieuw){
      if(cd.el === t){ houd++; continue; }
      const i = P(p).hand.findIndex(x => x.id === cd.id);
      if(i >= 0){ const c2 = P(p).hand.splice(i,1)[0]; P(c2.owner).grave.push(c2); weg++; }
    }
    addLog(`✦ Gokkersbrouwsel op ${icon(t)} ${EL[t].name}: ${houd} gehouden, ${weg} gediscard.`, true);
    render(); await handLimiet(p); return;
  }
  if(k === "reborn"){

    const g = P(p).grave;

    if(kanSummon) opts.push({v:"summon", label:"Creature uit je graf oproepen (+3 levens)", ic:"⚔"});

    const m = opts.length === 1 ? opts[0].v
      : await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Zielenoproep: kies`, opts);
    const mag = m === "summon" ? cd => ORDER.includes(cd.el) : () => true;
    const kandidaten = g.map((cd, i) => ({cd, i})).filter(x => mag(x.cd)).slice(-24);
    if(!kandidaten.length){ addLog("✦ Zielenoproep: geen geschikte kaart in je graf."); return; }
    const idx = await chooseOpt(p, `<b>${pName(p)}</b> — ✦ Zielenoproep: welke kaart uit je graf?`,
      kandidaten.map(x => Object.assign({v:x.i}, grafLabel(x.cd))));
    const card = g.splice(idx, 1)[0];
    if(!card){ addLog("✦ Zielenoproep: die kaart ligt er niet meer."); return; }
    if(m === "hand"){
      P(p).hand.push(card);
      addLog(`✦ Zielenoproep: ${pName(p)} pakt ${card.lk ? "✦ " + LIGHTS[card.lk].name : icon(card.el) + " " + EL[card.el].name} terug in de hand.`, true);
      render(); return;
    }
    const slots = openCols(p).map(c => ({p, c, kind:"cre"}));
    if(!slots.length){ g.push(card); addLog("✦ Zielenoproep: geen vrije plek — de kaart blijft in het graf."); return; }
    const sl = await chooseSlot(p, slots, `✦ Zielenoproep: kies een plek voor ${icon(card.el)} ${EL[card.el].name} (+3 levens)`, false, {el:card.el});
    const ok = await placeNow(p, card, false, sl.c, {});
    if(!ok) return;
    P(p).cols[sl.c].cre.hp += 3;
    addLog(`✦ Zielenoproep roept ${icon(card.el)} <em>${EL[card.el].name}</em> uit het graf op met ${P(p).cols[sl.c].cre.hp} levens.`, true);
    render();
    const plan = await declarePlan(p, card, false, sl.c, {onField:true});
    pushPlay(p, card, false, sl.c, false, plan === "cancel" ? [] : plan);
    return;
  }
  if(k === "siphon"){
    const ids = allCreIds();
    const t = {dec:true, el:"licht", tid:it.plan.tid, tp:it.plan.tp, tc:it.plan.tc};
    const id = await effTarget(t, p, ids, `<b>${pName(p)}</b> — ✦ Levensroof: kies een creature`, true, {k:"siphon"});
    if(id === "fizzle" || id == null){ if(id == null) addLog("✦ Levensroof overgeslagen."); return; }
    const f = findCre(id); if(!f) return;
    const weg = Math.max(0, f.cr.hp);
    const win = Math.floor(weg / 2);          // je krijgt de helft terug, naar beneden afgerond
    f.cr.hp = 0;
    P(p).life += win;
    fxLight(creSel(f.p, f.c)); AU.play("light");
    pop(creSel(f.p, f.c), "-" + weg, "dmg");
    addLog(`✦ Levensroof zuigt ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} leeg (${weg} leven${weg===1?"":"s"}): ${pName(p)} krijgt daar de helft van — ${win} leven${win===1?"":"s"} erbij (nu ${P(p).life}).`, true);
    destroyCre(f.p, f.c, "✦ Levensroof");
    render(); return;
  }
}
/* Resolveren van een kaart-link: de kaart staat er al, dus alleen de effecten gaan de stack op. */
async function resolvePlay(it){
  const p = it.ctrl;
  if(it.asFuse){
    for(let i = (it.plan||[]).length - 1; i >= 0; i--) S.stack.push(effItem(p, it.plan[i], it.card.id));
    // het fusie-effect gaat er bovenop: dat resolvet als eerste
    if(it.fuseEff !== false) S.stack.push({type:"eff", el:it.fuseKey, ctrl:p, srcId:it.card.id, origin:"fusie"});
    return;
  }
  const selfId = it.asSpell ? null : it.card.id;
  for(let i = (it.plan||[]).length - 1; i >= 0; i--) S.stack.push(effItem(p, it.plan[i], selfId));
}
function placeCre(p, col, card){
  /* 🟣 Oerkracht: creatures van het gekozen element komen met +4 levens binnen. */
  const bonus = (S && S.aeKeuze && S.aeKeuze[p] === card.el && hasAe(p, "ae_hp3")) ? 4 : 0;
  const hp = (EL[card.el].hp || 2) + bonus;
  P(p).cols[col].cre = {card, hp, played:S.gTurn, attackedT:-1, ent:0};
  addLog(`${icon(card.el)} ${EL[card.el].name} verschijnt in kolom ${col+1} van ${pName(p)}${hp > 2 ? ` met ${hp} levens` : ""}${bonus ? " (🟣 Oerkracht)" : ""}.`);
}
/* 🔥 Vuur is immuun voor entangle — en sommige verhaalbeesten ook. */
const entBaar = cr => !!cr && cr.card.el !== "vuur" && !EL[cr.card.el].geenEnt;
const drainPer = el => el === "steen" ? 2 : 1;   // 🌿 is sterk tegen 🪨: dubbele drain per token
/* Per token: −drainPer bij het doel, evenveel +1 bij de bron. Stopt zodra het doel valt. */
function entangleDrain(targetId, srcId, p, tokens){
  for(let i=0;i<tokens;i++){
    const g = findCre(targetId); if(!g) break;
    const per = drainPer(g.cr.card.el);
    g.cr.hp -= per;
    pop(creSel(g.p, g.c), "-" + per, "dmg");
    if(srcId != null) for(let k=0;k<per;k++){ if(findCre(srcId)) gainLife(srcId, p, "🌿 drain"); }
    if(g.cr.hp <= 0){
      addLog(`🌿 De drain maakt ${icon(g.cr.card.el)} ${EL[g.cr.card.el].name} af.`, true);
      destroyCre(g.p, g.c, "🌿 drain"); break;
    }
  }
}
/* 🔥 mag alles van je tegenstander raken. Aan je eigen kant (waar je de creature offert)
   kun je géén 🔥 Vuur aanwijzen en niets in een kolom met een 🔥 Vuur-spell. */
function fireTargets(p){
  return allCreIds((cr, pp, cc) => pp !== p
    || (cr.card.el !== "vuur" && !(P(pp).cols[cc].spell && P(pp).cols[cc].spell.card.el === "vuur")));
}
/* 💧 herspeelt alleen je eigen creatures — maar wél allemaal, 💧 Water inbegrepen. */
function waterTargets(p){
  return allCreIds((cr, pp, cc) => pp === p);
}
/* Water dat in water plonst maakt geen golven: is het doelwit zelf 💧 Water, of ligt er
   al een 💧-spell onder hem, dan triggert de splashback niets — niet zijn eigen effect en
   niet de spell waar hij op landt. Dat houdt de boel ook eindig. */
function waterDoods(pp, cc){
  const f = P(pp).cols[cc];
  if(!f || !f.cre) return false;
  return f.cre.card.el === "water" || !!(f.spell && f.spell.card.el === "water");
}
/* Was het doelwit al vastgelegd? Dan die gebruiken — of fizzelen als hij er niet meer is.
   Zo niet (effect dat pas tijdens het resolven ontstond), dan alsnog vragen. */
async function effTarget(it, p, ids, prompt, optional, meta){
  if(inRook()){ const f0 = it && it.tid != null ? findCre(it.tid) : null; if(f0) rookOnthul(f0, "je wees hem aan"); }
  if(it.dec){
    if(it.tid == null) return null;                 // bij het aankondigen overgeslagen
    const f = findCre(it.tid);
    const weg = !f || (it.tp != null && (f.p !== it.tp || f.c !== it.tc));   // dood, weg of verhuisd
    if(weg || !ids.includes(it.tid)){
      const nm = EL[it.el] ? EL[it.el].name : it.el;
      addLog(`${icon(it.el)} Het aangewezen doelwit van ${nm} is er niet meer — het effect <em>fizzelt</em>.`, true);
      pop(".slot.cr", "FIZZEL", "imm");
      AU.play("place");
      return "fizzle";
    }
    return it.tid;
  }
  return await chooseCre(p, ids, prompt, optional, meta);
}

      addLog(`🔥 offerde een eigen creature: ${pName(p)} trekt een kaart.`, true);
      await sleep(220); await drawN(p, 1, "🔥 Vuur");

  }

  if(it.el === "gras"){
    const ids = allCreIds(entBaar);                        // 🔥 (en de Balrog) is immuun voor entangle
    if(!ids.length){ addLog("🌿 Geen geldig doelwit (🔥 Vuur is immuun voor entangle)."); return; }

    const gSrcSel = src ? creSel(src.p, src.c) : null;
    fxThorns(creSel(f.p, f.c), gSrcSel);
    f.cr.ent += n;
    pop(creSel(f.p, f.c), `🌿 +${n}`, "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}) krijgt ${n} entangle-token${n>1?"s":""}${n>1?" (🟣 Woekergroei)":""} — nu ${f.cr.ent}.`, true);
    entangleDrain(id, src ? it.srcId : null, p, n);
    render(); return;
  }

  if(it.el === "steen"){
    const ids = allCreIds();
    if(!ids.length){ addLog("🪨 Geen creature om +1 leven te geven."); return; }
    const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 🪨 Steen: geef een creature +1 leven (optioneel)`, true, {k:"steen"});
    if(id === "fizzle") return;
    if(id === null){ addLog("🪨 +1 overgeslagen."); return; }
    gainLife(id, p, "🪨 Steen", "rock"); render();

  }

  if(it.el === "water"){
    const ids = waterTargets(p).filter(x => x !== it.exclId);
    if(!ids.length){ addLog("💧 Geen eigen creature om te herspelen."); }
    else {
      const id = await effTarget(it, p, ids, `<b>${pName(p)}</b> — 💧 Water: kies een eigen creature om opnieuw te spelen`, true, {k:"water"});
      if(id === "fizzle"){ /* doelwit weg */ }
      else if(id === null) addLog("💧 Herspelen overgeslagen.");
      else {
        const f = findCre(id);
        const owner = f.p, card = f.cr.card, fromCol = f.c, keepHp = f.cr.hp;
        const doods = waterDoods(owner, fromCol);   // plons in het water: geen enkel effect
        const slots = Array.from(new Set(openCols(owner).concat([fromCol]))).sort((a,b)=>a-b).map(c => ({p:owner, c, kind:"cre"}));
        fxSplash(creSel(owner, fromCol));
        await sleep(260);
        P(owner).cols[fromCol].cre = null; render();
        const sl = await chooseSlot(p, slots,
          `Kies waar ${icon(card.el)} ${EL[card.el].name} opnieuw verschijnt`
          + (doods ? ` <span style="opacity:.85">— 💧 in 💧: <b>geen enkel effect</b>, ook de spell daar niet</span>` : ""),
          false, {el:card.el, doods});
        addLog(`💧 ${icon(card.el)} ${EL[card.el].name} wordt opnieuw gespeeld in kolom ${sl.c+1}.`, true);
        await placeNow(owner, card, false, sl.c, {splash:true, keepHp});
        await storyBrandstof(owner, card, false, "zet 🔥 Vuur met 💧 Water opnieuw neer");
        if(card.el === "water"){                    // uitgerust terug uit het water
          const nf = findCre(card.id);
          if(nf){
            nf.cr.hp += 3;
            addLog(`💧 ${icon("water")} Water komt uitgerust terug uit de plons: <b>+3 levens</b> (nu ${nf.cr.hp}).`, true);
            pop(creSel(nf.p, nf.c), "+3", "heal");
            render();
          }
        }
        if(doods){
          addLog(`💧 De plons valt in het water: er gaat <b>niets</b> af — niet het effect van ${icon(card.el)} ${EL[card.el].name}, en niet de spell in kolom ${sl.c+1}.`, true);

          pushPlay(owner, card, false, sl.c, false, rplan === "cancel" ? [] : rplan);
        }
      }
    }
    return;
  }

  if(it.el === "fu_fire"){
    const big = hasAe(p, "ae_fire6");                       // 🟣 Verzengende Woede: één doel krijgt 5
    const foes = () => allCreIds((cr, pp) => pp === opp(p));
    if(!foes().length){ addLog("🟣 Assekern: er staat niets van je tegenstander om te raken."); return; }
    const aSrc = findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null;
    let id = null;
    if(big){                                                // alleen dan is er iets te kiezen
      id = await chooseCre(p, foes(), `<b>${pName(p)}</b> — 🟣 Assekern: kies het hoofddoel (5 vuurschade; de rest krijgt 2)`, true, {k:"vuur"});
      if(id !== null){ applyDamage(id, "vuur", 5, {ignoreImmune:true, srcSel:aSrc}); render(); await sleep(160); }
    }
    addLog(`🟣 Assekern: 2 vuurschade aan ${big ? "elke andere" : "elke"} vijandelijke creature.`, true);
    for(const other of foes()){
      if(S.over) break;
      if(other === id) continue;
      applyDamage(other, "vuur", 2, {ignoreImmune:big, srcSel:aSrc});

    return;
  }
  if(it.el === "fu_water"){ addLog(`🟣 Dieptestroom: ${pName(p)} trekt 1 kaart; daarna gaat het gewone 💧-effect af.`, true); await drawN(p, 1, "🟣 Dieptestroom"); return; }
  if(it.el === "fu_stone") return;      // 🟣 Bergrug zit volledig in het gedeclareerde plan
  if(it.el === "fu_grass"){
    const foes = allCreIds((cr, pp) => pp === opp(p) && entBaar(cr));
    if(!foes.length){ addLog("🟣 Wurgranken: geen vijandelijke creature om te entanglen."); return; }
    const n = hasAe(p, "ae_grassx2") ? 2 : 1;
    addLog(`🟣 Wurgranken: elke vijandelijke creature krijgt ${n} entangle-token${n>1?"s":""}.`, true);
    for(const fid of foes){
      if(S.over) break;
      const f = findCre(fid); if(!f) continue;
      fxThorns(creSel(f.p, f.c), findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null);
      f.cr.ent += n;
      entangleDrain(fid, it.srcId, p, n);
      render(); await sleep(120);
    }
    return;
  }

async function resolveAttack(it){
  const p = it.ctrl, col = it.col;
  const att = P(p).cols[col].cre;
  if(!att || att.card.id !== it.creId){ addLog("De aanvaller is er niet meer: aanval vervalt."); return; }
  if(att.ent > 0){ addLog(`${icon(att.card.el)} is entangled: de aanval gaat niet door!`, true); return; }
  const def = P(opp(p)).cols[col].cre;
  const power = atkOf(att, p);
  const el = document.querySelector(creSel(p, col));
  if(el) el.classList.add(p === 0 ? "lunge-up" : "lunge-down");
  AU.play("attack");
  const fromR = rectOf(creSel(p, col));
  const toR = def ? rectOf(creSel(opp(p), col)) : rectOf(`.pside[data-side="${opp(p)}"] .plife`);
  if(fromR && toR){
    const x1 = fromR.left + fromR.width/2, y1 = fromR.top + fromR.height/2;
    const x2 = toR.left + toR.width/2, y2 = toR.top + toR.height/2;
    const len = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1);
    const ln = document.createElement("div");
    ln.className = "atkline";
    ln.style.left = x1+"px"; ln.style.top = y1+"px"; ln.style.width = len+"px";
    ln.style.transform = `rotate(${ang}rad)`;
    document.getElementById("fx").appendChild(ln);
    setTimeout(() => ln.remove(), 500);
  }
  await sleep(300);
  if(!def){
    if(regentHet() && att.card.el === "vuur"){
      addLog(`🌧 De regen dooft de aanval van ${icon("vuur")} <em>Vuur</em> — ${pName(opp(p))} blijft ongedeerd.`, true);
      return;
    }
    P(opp(p)).life -= power;
    if(power > 0) raakAanval(p);
    if(hasAe(opp(p), "ae_pijn") && P(opp(p)).life > 0){
      addLog(`🟣 <em>Loutering</em>: ${pName(opp(p))} loopt schade van zijn tegenstander op en trekt een kaart.`, true);
      await drawN(opp(p), 1);
    }
    const lifeEl = document.querySelector(`.pside[data-side="${opp(p)}"]`);
    if(lifeEl) lifeEl.classList.add("shake");
    pop(rectOf(`.pside[data-side="${opp(p)}"] .plife`), "-" + power, "dmg");
    addLog(`${icon(att.card.el)} ${EL[att.card.el].name} raakt <em>${pName(opp(p))}</em> direct voor ${power} leven${power>1?"s":""}.`, true);
    if(P(opp(p)).life <= 0) return gameOver(p, pName(opp(p)) + " heeft geen levens meer.");
    return;
  }
  const uit = applyDamage(def.card.id, att.card.el, power, {srcCre: att, noFx:true});
  if(uit && uit.raak) raakAanval(p);
}
/* 💤 Alleen een aanval die écht leven afneemt telt: fizzelt hij, wordt hij geblokt door
   immuniteit of houdt een entangle-token je creature thuis, dan blijf je slapen. */
function raakAanval(p){
  if(S && S.story && p === 0) S.story.aanvalDezeBeurt = true;
}
async function upkeepEntangle(p){
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if(cr && cr.ent > 0){
      cr.ent -= 1;
      pop(creSel(p,c), "🌿 −1 token", "imm");
      addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} (kolom ${c+1}, ${pName(p)}) verliest een entangle-token (nog ${cr.ent}).`);
      render(); await sleep(200);
    }
  }

/* 🟣 Oerkracht en 🟣 Eeuwige Terugkeer laten je aan het begin een element kiezen. */
async function aetherKeuzes(){
  if(!S || S.aeKeuzeGedaan) return;
  S.aeKeuzeGedaan = true;
  if(!S.aeKeuze) S.aeKeuze = [null, null];
  for(const p of [S.tp, opp(S.tp)]){
    const k = hasAe(p, "ae_hp3") ? "ae_hp3" : (hasAe(p, "ae_graf") ? "ae_graf" : null);
    if(!k || S.aeKeuze[p]) continue;
    const v = await chooseOpt(p, `<b>${pName(p)}</b> — 🟣 ${AETHERS[k].name}: kies een element`,
      ORDER.map(e => ({v:e, label:EL[e].name, ic:icon(e)})));
    S.aeKeuze[p] = ORDER.includes(v) ? v : "steen";
  }
  [0,1].forEach(p => {
    if(S.aeKeuze[p] && (hasAe(p, "ae_hp3") || hasAe(p, "ae_graf")))
      addLog(`🟣 ${pName(p)} kiest ${icon(S.aeKeuze[p])} <em>${EL[S.aeKeuze[p]].name}</em>.`, true);
  });
  render();
}
/* 🟣 Eeuwige Terugkeer: in je eindfase komt er een kaart van je element terug uit het graf. */
async function grafOproep(p){

  if(!el) return;

  if(!vrij.length){ addLog(`🟣 ${AETHERS.ae_graf.name}: het bord van ${pName(p)} zit vol.`); return; }

    `🟣 ${AETHERS.ae_graf.name}: kies een plek voor ${icon(el)} ${EL[el].name}`, false, {el});

async function startTurnSequence(){

     nog te staan, dan haal je hem weg voor die vastgeroest lijkt. */
  if(S.story && S.story.zeg && S.story.zeg.altijd && S.tp === 0 && S.story.zin){
    S.story.zin = null; S.story.zinHard = false; clearTimeout(ZEGT); ZEGT = null; zegPaint();
  }

               regenBij(); getijBij(); rotsMerkBij(); balrogHeelt(); hitteBij(); sluisBij(); wolkBij();
               ogenNoemen(); }
  if(!S.over && S.story && S.story.vrees) await serafVrees();

  if(S.story && S.story.stil && S.tp === 1){ addLog(`${pName(S.tp)} doet niets. Het is een struik.`); await sleep(FAST ? 0 : 300); }
  else if(S.gTurn === 1 || (S.story && S.story.gelijkStart && S.gTurn === 2)){
    addLog(`${pName(S.tp)} slaat de eerste draw phase over.`); await sleep(300); }
  else {
    /* 🟣 Bron van Overvloed kost aan het eind van de beurt 1 leven. Sta je op 1, dan zou die
       derde kaart je het potje kosten — dan laat je hem liggen en trek je er gewoon twee. */
    /* In de verhaalmodus trek je er maar één per beurt; 🟣 Bron van Overvloed maakt er twee van. */
    const bron = hasAe(S.tp, "ae_draw3");
    const teDuur = bron && P(S.tp).life <= 1;
    const basis = 1;
    const n = (bron && !teDuur) ? basis + 1 : basis;
    if(teDuur) addLog(`🟣 <em>Bron van Overvloed</em>: ${pName(S.tp)} staat op 1 leven en laat de tweede kaart liggen.`, true);
    addLog(`${pName(S.tp)} trekt ${n} kaart${n === 1 ? "" : "en"}${(bron && !teDuur) ? " (🟣 Bron van Overvloed)" : ""}.`);
    await drawN(S.tp, n);
    if(bron && !teDuur && !S.over) S.trok3 = true; }

  S.phase = "main1";
  if(S.story && S.story.opening) await storyOpening();
  if(!S.over && S.story && S.story.paniek) await vonkPaniek();
  if(S.over) return;
  backToPhase();
}
function backToPhase(){

  S.ui = {mode: S.phase === "battle" ? "battle" : "main"};

  if(isBot(S.tp) && !S.over){

}
async function endTurn(){

  }
  if(!S.over && hasAe(S.tp, "ae_graf")) await grafOproep(S.tp);
  if(!S.over && S.story && S.story.rotsAan) await rotsValNu();
  if(!S.over && S.story && S.story.lavaAan && S.gTurn % 2 === 0) await lavaBrandt();
  if(!S.over && S.story && S.story.drukAan && S.gTurn % 2 === 0) await drukPlet();
  if(!S.over && S.story && S.story.getijAan && S.gTurn % 2 === 0) await ebZakt();
  if(!S.over && S.story && S.story.verzopen) await verzopenTerug();
  if(!S.over && S.story && S.story.ovenAan && S.gTurn % 2 === 0) await ovenEet();
  if(!S.over && S.story && S.story.tronen) await tronenTrekken();
  if(!S.over && S.story && S.story.aangezicht) await serafAangezicht();
  if(!S.over && S.story && S.story.slaap) await storySlaap();
  if(!S.over && S.story && typeof storyEindeBeurt === "function") await storyEindeBeurt();
  if(!S.over && S.story && typeof storyVeldPraat === "function") await storyVeldPraat();
  if(!S.over && S.story && typeof storyPopup === "function") await storyPopup();
  if(S.over) return;
  await sleep(250);

/* ================= KLOK =================
   Elke speler krijgt 5 minuten. Rond je je beurt af, dan komt er 2 minuten bij. De klok
   loopt bij degene die aan zet is — moet er iemand reageren, dan loopt zíjn klok, niet die
   van de speler wiens beurt het is. Op nul verlies je. De klok staat uit tot iemand hem
   start; daarna loopt hij voor allebei. */
const KLOK_START = 300, KLOK_BONUS = 120;
let KLOKT = null, KLOKLAST = 0;
function klokReset(houdAan){
  const aan = houdAan && S && S.klok ? S.klok.aan : false;
  if(S) S.klok = {aan, t:[KLOK_START, KLOK_START]};
}
/* Wiens klok loopt er nu? */
function klokWie(){
  if(!S || !S.klok || !S.klok.aan || S.over) return -1;
  const u = S.ui || {};
  if(["start","draft","aetherpick","banpick","handoff","over"].includes(u.mode)) return -1;
  if(pending && u.p != null) return u.p;
  if(u.mode === "main" || u.mode === "battle") return S.tp;
  return -1;
}
function klokTick(){
  if(!S || !S.klok || !S.klok.aan){ KLOKLAST = 0; return; }
  const nu = Date.now();
  const dt = KLOKLAST ? (nu - KLOKLAST) / 1000 : 0;
  KLOKLAST = nu;
  const w = klokWie();
  if(w < 0 || !dt) return;
  S.klok.t[w] = Math.max(0, S.klok.t[w] - dt);
  klokPaint();
  if(S.klok.t[w] <= 0 && !S.over){
    if(NET.on && NET.seat >= 0 && NET.seat !== w) return;   // de eigenaar meldt het zelf
    act({t:"klokuit", p:w});
  }
}
function klokVerloren(p){
  if(!S || S.over || !S.klok || !S.klok.aan) return;
  MUT++;
  S.klok.t[p] = 0;
  addLog(`⏱ <em>${pName(p)}</em> heeft geen tijd meer.`, true);
  gameOver(opp(p), pName(p) + " liet de klok aflopen.");
}
function klokStart(){
  if(!S || !S.klok || S.klok.aan) return;
  MUT++;
  S.klok.aan = true; KLOKLAST = Date.now();
  addLog(`⏱ De klok loopt: ${Math.round(KLOK_START/60)} minuten per speler, +${Math.round(KLOK_BONUS/60)} minuten per afgeronde beurt.`, true);
  render();
}
const klokTekst = sec => {
  const t = Math.max(0, Math.ceil(sec));
  return Math.floor(t/60) + ":" + String(t % 60).padStart(2, "0");
};
/* Alleen de cijfers bijwerken — een volledige render elke tick is zonde. */
function klokPaint(){
  if(!S || !S.klok) return;
  const w = klokWie();
  for(let p=0;p<2;p++){
    const el = document.querySelector(`.pklok[data-kp="${p}"]`);
    if(!el) continue;
    el.textContent = "⏱ " + klokTekst(S.klok.t[p]);
    el.classList.toggle("loopt", p === w);
    el.classList.toggle("krap", S.klok.t[p] <= 30);
  }
}
setInterval(klokTick, 200);
function gameOver(winner, reason){
  if(S.over) return;
  /* Sommige tegenstanders zijn nog niet klaar als hun levens op zijn. */
  if(winner === 0 && S.story && !S.story.fase2Gedaan){
    const L2 = STORY[S.story.id] && STORY[S.story.id].fase2;
    if(L2){ S.story.fase2Gedaan = true; setTimeout(() => storyFase2(L2), 500); return; }
  }
  S.over = {winner, reason};
  const gewonnen = NET.on ? winner === NET.seat : (!S.vsBot || winner === 0);
  /* Is er een eigen winst- of verliesdeuntje, dan speelt die; anders de synth. */
  if(!AU.stinger(gewonnen ? "winst" : "verloren")) AU.play(gewonnen ? "win" : "lose");
  if(S.mode === "commander" && S.match){
    S.match.wins[winner]++;
    S.over.matchDone = S.match.wins[winner] >= 2;
    addLog(`<em>${pName(winner)} wint potje ${S.match.game}!</em> Stand: ${S.match.wins[0]}–${S.match.wins[1]}. ${reason}`, true);
    if(S.over.matchDone) addLog(`🏆 <em>${pName(winner)} wint de match ${S.match.wins[winner]}–${S.match.wins[opp(winner)]}!</em>`, true);
  } else {
    addLog(`<em>${pName(winner)} wint!</em> ${reason}`, true);
  }
  render();
  /* Verlies je een verhaal-potje, dan krijgt je tegenstander nog even het woord. */
  if(!FAST && winner === 1 && S.story && !S.story.verliesGezien){
    const L = STORY[S.story.id];
    if(L && (L.verlies || []).length){
      S.story.verliesGezien = true;
      const id = S.story.id;
      setTimeout(() => { if(S && S.over && !M) praatStart(id, "verlies"); }, 950);
    }
  }
}

async function playFlashInBattle(cardId){

  {

      return;
    }
    const canCre = EL[card.el].flash && openCols(p).length > 0;
    const canFuse = fuseOk(p, card.el, "flash");

    let mode = canFuse && !canCre ? "fuse" : "cre";
    if(canCre && canFuse){

      if(tid === null){ backToPhase(); return; }
      takeFromHand(p, cardId);
      addLog(`${pName(p)} start ⚡ 🟣 <em>${AETHERS[f.key].name}</em> (gevechtsfase).`, true);
      await announceFusion(p, card, tid, f.key);

      prompt:`Kies een plek voor ⚡ ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel"){ backToPhase(); return; }
    takeFromHand(p, cardId);
    await announcePlay(p, card, false, s.c, true);
    await chainLoop();
  } finally { busyFlag = false; }

function battleFlashOk(p, card){
  if(!magSpelen(p, card && card.id)) return false;
  if(!card) return false;
  if(card.el === "licht") return lightPlayable(p, card);
  return (EL[card.el].flash && openCols(p).length > 0) || fuseOk(p, card.el, "flash");
}
async function playFromHand(cardId){
  if(busyFlag) return;
  {                                        // eerst kijken of er iets te spelen valt: anders geen zet
    const c0 = P(S.tp).hand.find(cd => cd.id === cardId);
    if(!c0) return;
    if(c0.el === "licht" && !lightPlayable(S.tp, c0)) return;
    if(!magSpelen(S.tp, cardId)){
      addLog(`👁 Die kaart is genoemd — deze beurt blijft hij in je hand.`);
      backToPhase();
      return;
    }
    if(S.tp === 0 && !tutMag("kaart", c0)) return;
  }
  busyFlag = true; MUT++;
  try{
    const p = S.tp;
    const card = P(p).hand.find(cd => cd.id === cardId);
    if(!card) return;
    if(card.el === "licht"){
      if(!lightPlayable(p, card)){ backToPhase(); return; }
      const takenL = takeFromHand(p, cardId);
      const okL = await announceLight(p, takenL, false);
      if(okL === "cancel"){ P(p).hand.push(takenL); backToPhase(); return; }
      await chainLoop();
      return;
    }
    const creOk = canPlayCreature(p), spOk = freeSpellCols(p).length > 0;
    const fuOk = fuseOk(p, card.el);
    if(!creOk && !spOk && !fuOk) return;
    const mode = await waitUI("pickmode", {p, cardId, creOk, spOk, fuseOk:fuOk});
    if(mode === "cancel"){ backToPhase(); return; }
    if(p === 0 && !tutMag("mode", mode)){ backToPhase(); return; }
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de creature die je offert`, true, {k:"tribute"});
      if(tid === null){ backToPhase(); return; }
      takeFromHand(p, cardId);
      addLog(`${pName(p)} start 🟣 <em>${AETHERS[f.key].name}</em>.`, true);
      await announceFusion(p, card, tid, f.key);
      await chainLoop();
      return;
    }
    const asSpell = mode === "spell";
    let slots = asSpell ? freeSpellCols(p).map(c=>({p,c,kind:"spell"})) : creSlotsFor(p, card.el);
    const tstap = p === 0 ? tutStap() : null;
    if(tstap && tstap.col != null && slots.some(x => x.c === tstap.col))
      slots = slots.filter(x => x.c === tstap.col);
    const s = await waitUI("slot", {p, valid:slots, cancellable:true,
      prompt:`Kies een ${asSpell?"spell":"creature"}-plek voor ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel" || !s){ backToPhase(); return; }   // ook een lege/afgebroken keuze laat de kaart in je hand
    takeFromHand(p, cardId);
    await announcePlay(p, card, asSpell, s.c, false);
    if(p === 0) tutKlaarStap("kaart", {el:card.el, mode});
    await chainLoop();
  } finally { busyFlag = false; }
}
async function declareAttack(col){
  if(busyFlag) return; busyFlag = true; MUT++;

    const p = S.tp, cr = P(p).cols[col].cre;

    if(onthuld){                       // eerst zijn effect, dan pas de klap
      const eff = S.stack.filter(x => x.type === "eff" && x.srcId === cr.card.id);
      S.stack = S.stack.filter(x => !(x.type === "eff" && x.srcId === cr.card.id)).concat(eff);
    }
    addLog(`${pName(p)} valt aan met ${icon(cr.card.el)} <em>${EL[cr.card.el].name}</em> in kolom ${col+1}${def?"":" → rechtstreeks op "+pName(opp(p))}.`, true);

  } finally { busyFlag = false; }
}
async function advancePhase(kind){
