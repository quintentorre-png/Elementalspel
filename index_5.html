function helpHTML(){
  return `<div class="ovbox" style="text-align:left"><h2 style="text-align:center">Spelregels</h2>
  <div class="helptxt">
    <h3>Doel</h3><p>Breng je tegenstander van 5 naar 0 levens — of laat ze trekken uit een leeg deck (direct verlies).</p>
    <h3>Beurt</h3><p>Upkeep (per creature gaat één 🌿-token eraf) → Draw (2 kaarten) → Main → Gevecht → Main 2 → Einde. De startende speler slaat de allereerste draw over.</p>
    <h3>Deck</h3><p>Vier elementen, <b>10 van elk</b> = 40 kaarten. Beide spelers spelen hetzelfde deck.</p>
    <h3>Kaarten spelen</h3><p>Elke kaart kan als <b>creature</b> of als <b>spell</b> (in de spell-plek van een kolom). Een spell mag ook op een bezette spell-plek: de oude wordt dan gediscard. Een spell triggert direct bij het spelen én telkens wanneer je in die kolom een creature speelt. <b>Alle vier</b> de elementen mogen als creature ook <b>⚡ flash</b> gespeeld worden: als reactie in de chain, buiten je beurt en tijdens je eigen gevechtsfase.</p>
    <h3>Levens en aanval</h3><p>Een creature start met de levens van zijn element: 💧 Water 2, 🔥 Vuur 2, 🌿 Gras 2, 🪨 Steen <b>3</b>. Zijn <b>aanval is de helft van zijn levens</b>, naar beneden afgerond, minimaal 1 — dat geldt ook voor de schade aan een speler. Een dikke creature slaat dus harder.</p>
    <h3>Elementcirkel</h3><p>💧 → 🔥 → 🌿 → 🪨 → 💧 (sterk tegen). Sterk tegen zwak = <b>instakill</b>; zwak tegen sterk = <b>immuun</b>. Geldt voor alle schade tussen creatures. Spelers hebben geen element.</p>
    <h3>De vier elementen</h3><p>
      <b>💧 Water</b> — kies een creature en speel hem <b>opnieuw</b>, op dezelfde of een andere vrije plek. Hij <b>houdt zijn levens</b>; alleen zijn entangle-tokens vallen weg. Zijn speel-effect en de spell in de kolom waar hij landt triggeren opnieuw. Niet te richten op een 💧 Water-creature of op een creature in een kolom met een 💧-spell.<br>
      <b>🪨 Steen</b> — 3 levens. Bij het spelen: geef <b>tweemaal +1 leven</b> aan een creature naar keuze (mag dezelfde zijn, mag je eigen of die van de ander).<br>
      <b>🔥 Vuur</b> — 2 schade aan een creature naar keuze. <b>Op 💧 Water doet Vuur niets.</b> Richt je het op een <b>eigen</b> creature, dan is dat een offer: instakill + een kaart trekken (ook op je eigen Water).<br>
      <b>🌿 Gras</b> — geef een creature een <b>entangle-token</b>. Elke token draint <b>−1 leven bij het doel en +1 bij de Gras zelf</b>, en kan het doel dus doden — ook een 🪨 Steen, maar gewoon leven voor leven, geen instakill. Op 🔥 Vuur werkt entangle niet.</p>
    <h3>Entangle</h3><p>Tokens <b>stapelen</b>. Een creature met tokens kan niet aanvallen. In de upkeep van de eigenaar gaat er per creature één token af.</p>
    <h3>Chain</h3><p>Speel je een kaart of val je aan, dan mag de tegenstander eerst reageren met een flash voordat het resolvet — je ziet daarbij <b>wat</b> er op de chain staat. Reacties resolven in omgekeerde volgorde (laatste eerst).</p>
    <h3>Gevecht</h3><p>Een creature valt altijd recht vooruit: de creature in dezelfde kolom, of anders de speler. Creatures mogen meteen aanvallen in de beurt dat ze gespeeld zijn — alleen in de allereerste beurt van de startende speler geldt summoning sickness.</p>
    <h3>Eigen bord targeten</h3><p>Zou een effect je dwingen om alléén je eigen kant van het bord te targeten, dan is die keuze automatisch optioneel.</p>
    <h3>🟣 Commander (best of 3)</h3><p>Per potje worden er 3 <b>aether-kaarten</b> onthuld — de startende speler kiest er één, dan de ander; de laatste wordt weggelegd. Een aether is een blijvende kracht die niet verwijderd kan worden en <b>cumulatief</b> is: wat je in potje 1 koos houd je in potje 2 en 3.<br><br>Daarna de <b>banfase</b>: je trekt <b>10</b> kaarten in potje 1 en <b>5</b> in potje 2 en 3, en mag daarvan bannen zoveel je wilt — gebande kaarten zijn weg voor de héle match. Na elk potje drukken beide spelers op <b>Klaar</b> voor het volgende; de <b>verliezer</b> kiest dan als eerste een aether én begint.</p>
    <h3>🟣 Fusie</h3><p>Vier van de aethers zijn <b>fusies</b>. Heb je er één, dan kun je die kaart uit je hand ook als fusie spelen: je <b>offert direct</b> een eigen creature van het bijbehorende element (dat offer is onreageerbaar) en zet de fusie-creature op die plek neer, mét een eenmalig extra effect bovenop zijn gewone speel-effect. 🔥 Assekern en 🌿 Wurgranken zijn <b>quickspell</b> (mag in de chain), 💧 Dieptestroom en 🪨 Bergrug zijn sorcery (alleen in je eigen main).</p>
    <h3>🌐 Live online spelen</h3><p>Op de gehoste versie klik je op <b>Live online</b>. Je krijgt een <b>roomcode</b> van vier tekens (en een link met die code erin). Je vriend opent dezelfde pagina, klikt op <b>Meedoen</b>, vult de code in — en jullie zijn direct verbonden, browser aan browser. Zetten komen meteen aan, er zit een <b>chat</b> naast het bord, en valt de verbinding weg dan komen jullie via dezelfde code terug in dezelfde partij.<br><br>Je ziet alleen je eigen hand. Wel eerlijk vermeld: de partij reist als startgetal plus zettenlijst, dus iemand die de pagina uitleest kán de kaarten van de ander afleiden. Prima voor een potje met een vriend, geen bescherming tegen wie per se wil valsspelen.<br><br>Binnen Claude werkt live niet (netwerkverkeer is daar geblokkeerd): daar kun je synchroniseren via de pagina zelf, of via een <b>partijcode</b> die je elkaar stuurt.</p>
    <h3>Besturing</h3><p><b>Spatie</b> of <b>Enter</b> = doorlaten / overslaan / bevestigen. <b>Esc</b> of het <b>☰</b>-icoon rechtsboven = menu. Tegen de bot speel jij Speler 1.</p>
    <div style="text-align:center;margin:10px 0">${circleSVG(180)}</div>
  </div>
  <div style="text-align:center"><button class="obtn ovclose" data-act="btn" data-btn="closemodal">Sluiten</button></div></div>`;
}
function render(){
  if(!S || FAST) return;
  const hl = uiHl();
  const BOT = (NET.on && NET.seat === 1) ? 1 : 0, TOP = 1 - BOT;   // je eigen kant staat altijd onderaan
  $("#pside1").dataset.side = TOP; $("#pside0").dataset.side = BOT;
  $("#pside1").innerHTML = psideHTML(TOP);
  $("#pside0").innerHTML = psideHTML(BOT);
  $("#hand" + TOP).innerHTML = handHTML(TOP, hl);
  $("#hand" + BOT).innerHTML = handHTML(BOT, hl);
  $("#row1").innerHTML = [0,1,2,3,4].map(c=>slotHTML(TOP,c,hl)).join("");
  $("#row0").innerHTML = [0,1,2,3,4].map(c=>slotHTML(BOT,c,hl)).join("");
  $("#piles1").innerHTML = pilesHTML(TOP);
  $("#piles0").innerHTML = pilesHTML(BOT);
  $("#ribbon").innerHTML = PHASES.map(([k,lab])=>`<span class="ph-step${S.phase===k?" on":""}">${lab}</span>`).join("");
  $("#turnbadge").innerHTML = (S.mode==="commander" && S.match ? `🟣 Potje ${S.match.game} · ${S.match.wins[0]}–${S.match.wins[1]}<br>` : "") + `Beurt ${S.turnNo[S.tp]}<b>${pName(S.tp)}</b>`;
  $("#actions").innerHTML = actionsHTML();
  $("#chain").innerHTML = chainHTML();
  $("#log").innerHTML = S.log.map(l=>`<div class="le${l.hot?" hot":""}">${l.html}</div>`).join("");
  const cb = $("#chatbox");
  if(cb){
    if(NET.on && NET.chan === "live"){
      const focused = document.activeElement && document.activeElement.id === "chatin";
      const val = focused ? document.activeElement.value : "";
      const dot = LIVE.joined ? "on" : "off";
      cb.innerHTML = `<div class="chathead"><span class="cdot ${dot}"></span>${LIVE.joined ? "verbonden" : (LIVE.status || "geen verbinding")}${LIVE.code ? ` · room <b>${LIVE.code}</b>` : ""}</div>
        <div class="chatlog">${LIVE.chat.map(c => c.sys
          ? `<div class="cmsg sys">${c.text}</div>`
          : `<div class="cmsg"><b class="${c.who === (NET.seat===0?"S1":"S2") ? "me" : "them"}">${c.who}</b> ${c.text.replace(/</g,"&lt;")}</div>`).join("")}</div>
        <div class="chatin"><input id="chatin" type="text" maxlength="300" placeholder="bericht…" autocomplete="off"><button class="shcopy" data-act="btn" data-btn="sendchat">➤</button></div>`;
      const cl = cb.querySelector(".chatlog"); if(cl) cl.scrollTop = cl.scrollHeight;
      if(focused){ const ni = document.getElementById("chatin"); if(ni){ ni.value = val; ni.focus(); } }
    } else cb.innerHTML = "";
  }
  const fab = document.getElementById("menufab");
  if(fab) fab.classList.toggle("show", S.ui.mode !== "start");
  const b = bannerHTML();
  const bn = $("#banner");
  if(b){ bn.classList.remove("hidden"); bn.innerHTML = `<span class="btxt">${b}</span>`; }
  else bn.classList.add("hidden");
  const ov = overlayHTML();
  const ovEl = $("#overlay");
  ovEl.innerHTML = ov;
  ovEl.classList.toggle("show", !!ov);
  setPreview(null);
}

/* ================= INPUT ================= */
const doAct = a => act(a);
["pointerdown","keydown"].forEach(ev => document.addEventListener(ev, () => AU.boot(), {once:true}));
document.addEventListener("input", e => {
  const t = e.target.closest('[data-act="vol"]'); if(!t) return;
  const v = (+t.value) / 100, kind = t.dataset.kind;
  AU.boot();
  if(kind === "music") AU.setMusic(v); else AU.setSfx(v);
  saveSet();
  const lab = t.parentElement.querySelector(".val"); if(lab) lab.textContent = Math.round(v*100) + "%";
});
document.addEventListener("change", e => {
  const t = e.target.closest('[data-act="vol"]'); if(!t) return;
  if(t.dataset.kind === "sfx") AU.play("place");
});
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if(!t || !S) return;
  if(t.dataset.act === "btn") AU.play("click");
  const act = t.dataset.act;
  if(act === "btn") return onBtn(t.dataset.btn, t);
  if(S.over) return;
  if(act === "aepick"){
    if(S.ui.mode === "aetherpick" && !isBot(S.ui.p)) doAct({t:"f", v:+t.dataset.i});
    return;
  }
  if(act === "bansel"){
    if(S.ui.mode === "banpick" && !isBot(S.ui.p)){
      const id = +t.dataset.id, s = S.ui.sel, i = s.indexOf(id);
      if(i < 0) s.push(id); else s.splice(i, 1);
      render();
    }
    return;
  }
  const p = +t.dataset.p;
  if(act === "grave"){ M = {type:"grave", p}; render(); return; }
  const u = S.ui;
  if(act === "hand"){
    const id = +t.dataset.id;
    if(u.mode === "main" && S.actor===S.tp && p === S.tp && mayAct(p)) doAct({t:"play", id});
    else if(u.mode === "battle" && p === S.tp && mayAct(p) && !isBot(p)
            && battleFlashOk(p, P(p).hand.find(cd => cd.id === id))) doAct({t:"bflash", id});
    else if(u.mode === "priority" && p === u.p && !isBot(p)){
      const card = P(p).hand.find(cd => cd.id === id);
      if(card && ((EL[card.el].flash && emptyCols(p).length) || fuseOk(p, card.el, "flash"))) doAct({t:"f", v:id});
    }
    else if(u.mode === "choice" && u.kind === "hand" && p === u.p && !isBot(p) && u.valid.includes(id)) doAct({t:"f", v:id});
    return;
  }
  if(act === "cre" || act === "spell"){
    const c = +t.dataset.col;
    if(u.p != null && isBot(u.p)) return;
    if(u.mode === "slot"){
      const kind = act === "cre" ? "cre" : "spell";
      if(u.valid.some(s => s.p===p && s.c===c && s.kind===kind)) doAct({t:"f", v:{p, c}});
      return;
    }
    if(u.mode === "choice" && u.kind === "cre" && act === "cre"){
      const cr = P(p).cols[c].cre;
      if(cr && u.valid.includes(cr.card.id)) doAct({t:"f", v:cr.card.id});
      return;
    }
    if(u.mode === "battle" && act === "cre" && p === S.tp){
      const cr = P(p).cols[c].cre;
      if(cr && canAttack(cr, p)) doAct({t:"atk", c});
      return;
    }
  }
});

function normURL(str){

async function onLiveData(m){

  }
  if(m.t === "need"){ liveSync(); return; }
  if(m.t === "sync"){
    NET.seed = m.seed; NET.kind = m.kind || NET.kind; NET.log = m.log || [];
    if(m.chat && m.chat.length > LIVE.chat.length) LIVE.chat = m.chat;
    NET.buf = [];

    render(); return;
  }
  if(m.t === "ready"){ NET.log.push({t:"rdy", p:m.p}); doReady(m.p); return; }
  if(m.t === "surrender"){
    if(!S.over){ NET.log.push({t:"sur", p:m.p}); doSurrender(m.p); render(); }
    return;

  if(m.t === "act"){
    if(m.from === NET.log.length) await applyRemote(m.acts || []);
    else if(m.from > NET.log.length) liveSend({t:"need"});

async function packCode(){
  const obj = {s:NET.seed, k:NET.kind, l:NET.log.concat(NET.buf)};
  const json = JSON.stringify(obj);
  try{
    if(typeof CompressionStream === "function"){
      const cs = new CompressionStream("gzip");
      const st = new Blob([json]).stream().pipeThrough(cs);
      const buf = new Uint8Array(await new Response(st).arrayBuffer());
      let bin = ""; for(const b of buf) bin += String.fromCharCode(b);
      return "EL1" + btoa(bin).replace(/=+$/,"");
    }
  }catch(e){}
  return "EL0" + btoa(unescape(encodeURIComponent(json))).replace(/=+$/,"");
}
async function unpackCode(code){
  const c = String(code || "").replace(/\s+/g, "");
  const body = c.slice(3), tag = c.slice(0,3);
  const b64 = body + "=".repeat((4 - body.length % 4) % 4);
  try{
    if(tag === "EL1"){
      const bin = atob(b64); const arr = new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      const ds = new DecompressionStream("gzip");
      const st = new Blob([arr]).stream().pipeThrough(ds);
      return JSON.parse(await new Response(st).text());
    }
    if(tag === "EL0") return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }catch(e){}
  return null;
}

  try{
    const st = JSON.parse(localStorage.getItem("elementaal_live") || "null");
    if(st && st.code && liveAvailable() && !NET.on) LIVE.resume = st;
  }catch(e){}
  let snap = null;
  if(el){ try{ snap = JSON.parse(decodeURIComponent(escape(atob(el.textContent.trim())))); }catch(e){} }
  if(snap && snap.v === 1){
    if(snap.shareUrl && (!SHARE.url || SHARE.guess)){ SHARE.url = snap.shareUrl; SHARE.guess = false; }
    NET.on = true; NET.seed = snap.seed; NET.kind = snap.kind; NET.seats = snap.seats;
    NET.log = snap.log || []; NET.buf = []; NET.ver = snap.ver || 0; NET.shareUrl = snap.shareUrl || "";
    NET.me = myId();
    NET.seat = NET.seats.indexOf(NET.me);
    await replay(NET.seed, NET.log);
    if(NET.seat < 0 && NET.seats.indexOf(null) < 0) NET.status = "je kijkt mee als toeschouwer";
    render();
  }
  if(!NET.api){
    try{ NET.api = (typeof claude !== "undefined" && claude.use) ? await claude.use("artifact") : null; }
    catch(e){ NET.api = null; }
    NET.ready = true; render();
  }
}
/* ================= ACTIES (deterministische zettenlijst) ================= */
const GAME_BTNS = ["startpvp","startbot","cmdpvp","cmdbot","onlpvp","onlcmd","nextgame","newgame",
  "handoffok","handoffdirect","tobattle","endbattle","endturn","pass","cancel","skip",
  "asCre","asSpell","asFuse","cancelmode","copyCre","copySpell"];
function readyState(){                     // de bot is altijd meteen klaar
  const rd = S.ready || [false, false];
  return [rd[0] || isBot(0), rd[1] || isBot(1)];
}
function doReady(p){
  if(!S.over || S.over.matchDone) return;
  if(!S.ready) S.ready = [false, false];
  if(S.ready[p]) return;
  MUT++;
  S.ready[p] = true;
  addLog(`${pName(p)} is klaar voor het volgende potje.`);
  render();
  const rd = readyState();
  if(rd[0] && rd[1]) setTimeout(() => { if(S.over && !S.over.matchDone) nextGame(); }, 500);
}
function doSurrender(p){
  if(!S || S.over) return;
  MUT++;
  addLog(`<em>${pName(p)}</em> geeft op.`, true);
  gameOver(opp(p), pName(p) + " gaf de partij op.");
}
function runAction(a){
  if(!a) return;
  if(a.t === "sur") return doSurrender(a.p);
  if(a.t === "rdy") return doReady(a.p);
  if(a.t === "play") return playFromHand(a.id);
  if(a.t === "bflash") return playFlashInBattle(a.id);
  if(a.t === "atk") return declareAttack(a.c);
  if(a.t === "f") return feed(a.v);
  if(a.t === "b") return onBtn(a.b, null, true);
}
function act(a){
  if(NET.on){
    if(!netMayAct(a)) return;
    NET.buf.push(a);
  }
  const m0 = MUT;
  runAction(a);
  if(MUT === m0){ if(NET.on) NET.buf.pop(); return; }   // deed niets: niet opnemen
  REC.log.push(a);
  if(NET.on) netAfterAction();
}
function onBtn(btn, el, fromAction){
  const u = S.ui;
  if(!fromAction && GAME_BTNS.includes(btn)){
    if(btn === "banconfirm") return;
    return act({t:"b", b:btn});
  }
  switch(btn){
    case "startpvp": case "startbot": case "cmdpvp": case "cmdbot":
      if(u.mode==="start"){
        S.vsBot = (btn === "startbot" || btn === "cmdbot");
        addLog(NET.on ? "🌐 Online partij — jij bent <em>" + pName(NET.seat) + "</em>."
          : (S.vsBot ? "Je speelt tegen <em>de Bot 🤖</em>. Veel succes!" : "Hotseat: twee spelers op één scherm."), true);
        MUT++;
        if(btn === "cmdpvp" || btn === "cmdbot"){
          S.mode = "commander";
          S.match = {wins:[0,0], game:1, bannedEl:[[],[]], firstPicker:0};
          S.ae = [[],[]];
          S.ui = {mode:"busy"}; render();
          commanderSetup();
        } else {
          dealHands(0);
          S.ui = {mode:"busy"}; render();
          startTurnSequence();
        }
      } break;
    case "livehost_classic": if(u.mode==="start") liveHost("classic"); break;
    case "livehost_cmd": if(u.mode==="start") liveHost("commander"); break;
    case "livejoin": M = {type:"join"}; LIVE.err = ""; render(); break;
    case "resumelive": {
      const st = LIVE.resume; LIVE.resume = null;
      if(!st) break;
      NET.kind = st.kind || "classic";
      if(st.role === "host"){
        NET.on = true; NET.chan = "live"; NET.seat = 0; NET.log = []; NET.buf = [];
        LIVE.role = "host"; LIVE.code = st.code; LIVE.joined = false; LIVE.chat = [];
        S.vsBot = false; S.set.handoff = false;
        openPeer(); render();
      } else liveJoin(st.code);
      break;
    }
    case "dojoin": { const i = document.getElementById("roomin"); M = null; liveJoin(i ? i.value : ""); break; }
    case "liveleave": liveLeave(); break;
    case "copyroom": copyText(SHARE.url ? SHARE.url.split("#")[0] + "#room=" + LIVE.code : LIVE.code, "room"); break;
    case "sendchat": sendChat(); break;
    case "onlpvp": if(u.mode==="start"){ netCreate("classic"); } break;
    case "onlcmd": if(u.mode==="start"){ netCreate("commander"); } break;
    case "netjoin": netJoin(); break;
    case "netcancel": NET.on = false; NET.seat = -1; NET.log = []; NET.buf = []; NET.status = ""; newGame(); break;
    case "ready": if(S.over && !S.over.matchDone) act({t:"rdy", p: NET.on ? NET.seat : S.tp}); break;
    case "ready0": if(S.over && !S.over.matchDone) act({t:"rdy", p:0}); break;
    case "ready1": if(S.over && !S.over.matchDone) act({t:"rdy", p:1}); break;
    case "nextgame": nextGame(); break;
    case "banconfirm":
      if(u.mode==="banpick" && !isBot(u.p)) act({t:"f", v:u.sel.slice()}); break;
    case "handoffok": if(u.mode==="handoff") feed(true); break;
    case "handoffdirect": MUT++; S.holder = S.actor; render(); break;
    case "tobattle": case "endbattle": case "endturn":
      if((u.mode==="main"||u.mode==="battle") && !S.over) advancePhase(btn); break;
    case "pass": if(u.mode==="priority" && !isBot(u.p)) feed("pass"); break;
    case "cancel": if(u.mode==="slot" && u.cancellable && !isBot(u.p)) feed("cancel"); break;
    case "skip": if(u.mode==="choice" && u.optional && !isBot(u.p)) feed(null); break;
    case "asCre": if(u.mode==="pickmode" && u.creOk && !isBot(u.p)) feed("cre"); break;
    case "asSpell": if(u.mode==="pickmode" && u.spOk && !u.flashCtx && !isBot(u.p)) feed("spell"); break;
    case "asFuse": if(u.mode==="pickmode" && u.fuseOk && !isBot(u.p)) feed("fuse"); break;
    case "cancelmode": if(u.mode==="pickmode" && !isBot(u.p)) feed("cancel"); break;
    case "menu": M = {type:"menu"}; render(); break;
    case "share": M = {type:"share"}; render(); break;
    case "codepanel": netShowCode(); break;
    case "copycode": copyText(NET.codeOut || "", "code"); break;
    case "loadcode": {
      const ta = document.getElementById("codein");
      if(ta) netJoinCode(ta.value);
      break;
    }
    case "joincode": M = {type:"code"}; NET.codeOut = ""; NET.codeErr = ""; render(); break;
    case "onlcode_classic": netCreateCode("classic"); break;
    case "onlcode_cmd": netCreateCode("commander"); break;
    case "copygame": copyText(SHARE.url, "game"); break;
    case "copyjoin": copyText(joinURL(), "join"); break;
    case "savelink": {
      const inp = document.getElementById("shinput");
      if(inp && setShareURL(inp.value)) render();
      break;
    }
    case "menuback": M = (M && M.back === "lobby") ? null : {type:"menu"}; render(); break;
    case "sharefromlobby": M = {type:"share", back:"lobby"}; render(); break;
    case "askSurrender": M = {type:"menu", confirm:"sur"}; render(); break;
    case "askLeave": M = {type:"menu", confirm:"leave"}; render(); break;
    case "surrender":
      M = null;
      act({t:"sur", p: NET.on ? NET.seat : S.tp});
      render(); break;
    case "surrenderleave":
      M = null;
      act({t:"sur", p: NET.on ? NET.seat : S.tp});
      setTimeout(() => { if(NET.chan === "live") liveLeave(); else if(NET.buf.length) netPublish().then(netLeave); else netLeave(); }, 600);
      break;
    case "leavegame": M = null; if(NET.chan === "live") liveLeave(); else netLeave(); break;
    case "askLeaveLive": M = {type:"menu", confirm:"leave"}; render(); break;
    case "tomain": M = null; NET.on = false; NET.seat = -1; NET.log = []; NET.buf = []; newGame(); break;
    case "help": M = {type:"help"}; render(); break;
    case "tutorial": M = {type:"tutorial", step:0, deck:(el && el.dataset.deck) || (S.mode==="commander" ? "commander" : "classic")}; render(); break;
    case "tutswitch": if(M && M.type==="tutorial"){ M.deck = M.deck==="commander" ? "classic" : "commander"; M.step = 0; render(); } break;
    case "tutnext": if(M && M.type==="tutorial" && M.step < TUTS[M.deck].length-1){ M.step++; render(); } break;
    case "tutprev": if(M && M.type==="tutorial" && M.step > 0){ M.step--; render(); } break;
    case "tutgo": if(M && M.type==="tutorial" && el){ M.step = +el.dataset.step; render(); } break;
    case "audio": M = {type:"audio"}; render(); break;
    case "fx_vol": case "fx_subtiel": case "fx_uit":
      SET.fx = b.slice(3); saveSet(); render();
      if(SET.fx !== "uit"){ const rr = rectOf(".slot.cr"); if(rr) fxBurn(rr); }
      break;
    case "closemodal": M = null; render(); break;
    case "restart":
      if(NET.on){ M = {type:"restart"}; render(); }
      else if(S.over) newGame(); else { M = {type:"restart"}; render(); }
      break;
    case "newgame": M = null; if(NET.on) netRestart(); else newGame(); break;
    case "handofftoggle":
      S.set.handoff = !S.set.handoff;
      addLog(S.set.handoff ? "👁 Hotseat-privacy <em>aan</em>: scherm-doorgeef bij beurtwissel." : "👁 Hotseat-privacy <em>uit</em>: beide handen zichtbaar zonder overdracht.", true);
      render(); break;
  }
}
document.addEventListener("mouseover", e => {
  const ae = e.target.closest("[data-pvae]");
  if(ae){
    const k = ae.dataset.pvae, d = AETHERS[k];
    setPreview(`<div class="pv" style="border-color:#9d6fd8">
      <div class="pvhead" style="background:linear-gradient(160deg,#7a55b8,#3a2560)"><span class="ic">🟣</span><span class="nm">${d.name}</span></div>
      <div class="sec"><div class="sect" style="color:#b48be0">Aether · passief · niet te verwijderen</div><p>${d.txt}</p></div>
    </div>`);
    return;
  }
  const t = e.target.closest("[data-pv]");
  if(!t){ return; }
  const el = t.dataset.pv;
  const cur = t.dataset.pvhp ? {hp:+t.dataset.pvhp,
    sick:(t.dataset.pvst||"").includes("s"), ent:+(t.dataset.pvent||0), spent:(t.dataset.pvst||"").includes("a"),
    atk:+(t.dataset.pvatk||0)} : null;
  setPreview(pvHTML(el, {cur}));
});
document.addEventListener("mouseout", e => {
  const t = e.target.closest("[data-pv]");
  if(t) setPreview(null);
});
document.addEventListener("keydown", e => {
  if(!S) return;
  const tg = e.target;
  if(tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA")){
    if(e.key === "Enter"){
      if(tg.id === "chatin"){ e.preventDefault(); sendChat(); }
      else if(tg.id === "roomin"){ e.preventDefault(); const v = tg.value; M = null; liveJoin(v); }
      else if(tg.id === "shinput"){ e.preventDefault(); if(setShareURL(tg.value)) render(); }
    }
    if(e.key === "Escape") tg.blur();
    return;   // in een invoerveld nooit spelacties triggeren
  }
  if(M && M.type === "tutorial" && (e.key === "ArrowRight" || e.key === "ArrowLeft")){
    e.preventDefault();
    if(e.key === "ArrowRight" && M.step < TUTS[M.deck].length - 1) M.step++;
    if(e.key === "ArrowLeft" && M.step > 0) M.step--;
    render(); return;
  }
  if(e.key === "Escape"){
    if(M){ if(M.type === "menu" && M.confirm){ M = {type:"menu"}; render(); } else { M = null; render(); } return; }
    const u = S.ui;
    if(u.p != null && isBot(u.p)) return;
    if(u.mode === "slot" && u.cancellable){ doAct({t:"f", v:"cancel"}); return; }
    if(u.mode === "pickmode"){ doAct({t:"f", v:"cancel"}); return; }
    if(u.mode !== "start"){ M = {type:"menu"}; render(); }
    return;
  }
  if(e.code !== "Space" && e.key !== "Enter") return;
  if(M && M.type === "tutorial"){
    e.preventDefault();
    if(M.step < TUTS[M.deck].length - 1){ M.step++; } else { M = null; }
    render(); return;
  }
  if(M || S.over) return;
  e.preventDefault();
  const u = S.ui;
  if(u.p != null && isBot(u.p)) return;
  if(u.mode === "priority") doAct({t:"f", v:"pass"});
  else if(u.mode === "choice" && u.optional) doAct({t:"f", v:null});
  else if(u.mode === "handoff") doAct({t:"f", v:true});
  else if(u.mode === "banpick") doAct({t:"f", v:u.sel.slice()});
  else if(S.set.handoff && !S.vsBot && S.actor !== S.holder && (u.mode==="main" || u.mode==="battle")){ S.holder = S.actor; render(); }
});

/* start */
newGame();
netBoot();

</script>
