<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>Elementaal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{
  --bg:#0e1216; --board:#141a20; --cell:#1c242c; --cell-hi:#27313b;
  --line:#2f3a45; --line-soft:#242e37;
  --ink:#e9e4d6; --muted:#8b96a0; --dim:#5c6873;
  --gold:#c9a86a; --gold-soft:#8f7443; --danger:#d5503c; --good:#5cb56e;
  --water:#3f8fd8; --steen:#b8874f; --vuur:#d5503c; --gras:#4da35c;
  --cw:clamp(56px,7vw,92px); --chh:calc(var(--cw)*1.4);
  --hw:clamp(60px,7.2vw,96px); --hh:calc(var(--hw)*1.4);
  font-size:15px;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Alegreya Sans",system-ui,sans-serif;
  overflow:hidden;
  -webkit-user-select:none; user-select:none;
}
button{font-family:inherit; cursor:pointer}
#app{
  height:100vh; display:grid;
  grid-template-columns:minmax(210px,270px) minmax(0,1fr) minmax(150px,190px);
  gap:0; position:relative;
  background:
    radial-gradient(1200px 700px at 50% 42%, rgba(201,168,106,.05), transparent 60%),
    radial-gradient(900px 500px at 50% -10%, rgba(63,143,216,.05), transparent 55%),
    radial-gradient(900px 500px at 50% 110%, rgba(213,80,60,.05), transparent 55%),
    var(--bg);
}
/* ---------- left rail ---------- */
#left{display:flex; flex-direction:column; min-height:0; padding:10px 8px 10px 12px; gap:10px; border-right:1px solid var(--line-soft)}
#preview{flex:0 0 auto; display:flex; justify-content:center}
#chain{flex:0 0 auto; max-height:34vh; overflow-y:auto}
#log{flex:1 1 0; min-height:0; overflow-y:auto; font-size:.8rem; color:var(--muted);
  border-top:1px solid var(--line-soft); padding-top:6px; scrollbar-width:thin}
#log .le{padding:2px 2px; line-height:1.3; border-left:2px solid transparent; padding-left:6px}
#log .le.hot{color:var(--ink); border-left-color:var(--gold-soft)}
#log .le em{color:var(--gold); font-style:normal}
/* ---------- right rail ---------- */
#right{display:flex; flex-direction:column; min-height:0; padding:16px 12px 12px 8px; gap:8px;
  border-left:1px solid var(--line-soft); align-items:center}
#piles1{margin-top:2px}
#piles0{margin-bottom:22px}
#rtools{margin-top:2px}
#piles1,#piles0{display:flex; gap:10px; align-items:flex-start}
#rmid{flex:1 1 0; min-height:0; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:10px; width:100%}
#turnbadge{font-family:Cinzel,serif; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.5}
#turnbadge b{color:var(--gold); display:block; font-size:.9rem}
#actions{display:flex; flex-direction:column; gap:8px; width:100%; align-items:center}
.abtn{
  width:100%; padding:10px 8px; border-radius:10px; border:1px solid var(--gold-soft);
  background:linear-gradient(180deg,#3a3221,#241f14);
  color:var(--gold); font-family:Cinzel,serif; font-weight:700; font-size:.82rem; letter-spacing:.06em;
  box-shadow:0 2px 10px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06);
  transition:filter .15s, transform .1s;
}
.abtn:hover{filter:brightness(1.25)} .abtn:active{transform:translateY(1px)}
.abtn.primary{border-color:var(--gold); color:#f4e8c8;
  background:linear-gradient(180deg,#59491f,#33290f);
  box-shadow:0 0 18px rgba(201,168,106,.28), inset 0 1px 0 rgba(255,255,255,.1); animation:btnpulse 1.6s ease-in-out infinite}
.abtn.ghost{border-color:var(--line); color:var(--muted); background:linear-gradient(180deg,#222a32,#171d23)}
@keyframes btnpulse{0%,100%{box-shadow:0 0 10px rgba(201,168,106,.18)}50%{box-shadow:0 0 22px rgba(201,168,106,.4)}}
#rtools{display:flex; gap:6px}
.tbtn{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#1a2129; color:var(--muted); font-size:.85rem}
.tbtn:hover{color:var(--ink); border-color:var(--gold-soft)}
/* ---------- piles ---------- */
.pile{position:relative; width:calc(var(--cw)*.82); height:calc(var(--chh)*.82); cursor:default}
.pile .lab{position:absolute; left:50%; transform:translateX(-50%); bottom:-15px; font-size:.62rem; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; white-space:nowrap}
.pile .cnt{position:absolute; right:-7px; top:-7px; min-width:20px; height:20px; padding:0 4px; border-radius:10px;
  background:#0b0e12; border:1px solid var(--gold-soft); color:var(--gold); font-size:.7rem; font-weight:700;
  display:flex; align-items:center; justify-content:center; z-index:3}
.deckstack{position:absolute; inset:0}
.deckstack .cardback{position:absolute; inset:0}
.pile.grave{cursor:pointer}
.pile.grave .gtop{position:absolute; inset:0; opacity:.75; filter:saturate(.55) brightness(.8)}
.pile.grave:hover .gtop{opacity:1}
.pile .empty{position:absolute; inset:0; border:1px dashed var(--line); border-radius:8px; opacity:.5}
/* ---------- center ---------- */
#center{display:grid; grid-template-rows:auto 1fr auto; min-height:0; min-width:0; position:relative; padding:6px 10px}
.pside{display:flex; align-items:center; gap:14px; padding:2px 6px; min-height:calc(var(--hh) + 8px)}
.pside .pinfo{display:flex; flex-direction:column; gap:2px; min-width:120px}
.pname{font-family:Cinzel,serif; font-weight:700; font-size:.82rem; letter-spacing:.1em; color:var(--muted)}
.pname.active{color:var(--gold); text-shadow:0 0 12px rgba(201,168,106,.5)}
.plife{display:flex; gap:3px; align-items:center}
.plife .hp{width:13px; height:13px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #ff8d7d, #b3311f 70%); box-shadow:0 0 6px rgba(213,80,60,.6)}
.plife .hp.off{background:#2a3038; box-shadow:none; opacity:.6}
.plife .lnum{margin-left:6px; font-weight:700; color:var(--danger); font-size:.9rem}
.pdeckinfo{font-size:.68rem; color:var(--dim)}
/* hand */
.hand{flex:1; display:flex; justify-content:center; align-items:center; min-width:0; height:var(--hh); position:relative}
.hcard{width:var(--hw); height:var(--hh); margin:0 calc(var(--hw)*-0.13); position:relative;
  transition:transform .15s, box-shadow .15s; flex:0 0 auto}
.pside.bottom .hcard.up:hover{transform:translateY(calc(var(--hh)*-0.05)) scale(1.07); z-index:5}
.pside.top .hcard.up:hover{transform:translateY(calc(var(--hh)*0.05)) scale(1.07); z-index:5}
.hcard.legal{cursor:pointer}
.hcard.legal .card{box-shadow:0 0 0 2px var(--gold), 0 0 16px rgba(201,168,106,.55)}
.hcard.flashlegal .card{box-shadow:0 0 0 2px #7fd0ff, 0 0 18px rgba(80,180,255,.6); animation:flashglow 1.2s ease-in-out infinite}
@keyframes flashglow{0%,100%{box-shadow:0 0 0 2px #7fd0ff,0 0 10px rgba(80,180,255,.4)}50%{box-shadow:0 0 0 2px #bce7ff,0 0 22px rgba(120,200,255,.8)}}
.hcard.unplayable .card{filter:brightness(.55) saturate(.6)}
/* ---------- field ---------- */
#fieldwrap{display:flex; flex-direction:column; justify-content:center; min-height:0; gap:10px; position:relative; padding:0 4px}
.frow{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:clamp(6px,1vw,14px); justify-items:center}
.col{position:relative; width:calc(var(--cw) + 18px); height:calc(var(--chh) + 20px)}
.slot{position:absolute; border-radius:9px}
.slot.cr{left:0; bottom:0; width:var(--cw); height:var(--chh); z-index:2}
.slot.sp{right:0; width:calc(var(--cw)*.74); height:calc(var(--chh)*.74); z-index:1}
.frow.rowtop .slot.cr{bottom:0; top:auto}
.frow.rowtop .slot.sp{top:0; transform:rotate(7deg)}
.frow.rowbot .slot.cr{top:0; bottom:auto}
.frow.rowbot .slot.sp{bottom:0; transform:rotate(-7deg)}
.slot .ph{position:absolute; inset:0; border:1.5px dashed var(--line); border-radius:9px; opacity:.55;
  display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:.85rem; background:rgba(255,255,255,.015)}
.slot.sp .ph::after{content:"✦"; opacity:.6}
.slot.cr .ph::after{content:""}
.slot.hl{cursor:pointer}
.slot.sp.hl{z-index:6}
.slot.cr.hl{z-index:7}
.slot.tgt,.slot.atk{z-index:5}
.slot.hl .ph, .slot.hl .card{box-shadow:0 0 0 2px var(--gold), 0 0 18px rgba(201,168,106,.6); opacity:1; border-style:solid; animation:slotpulse 1.1s ease-in-out infinite}
@keyframes slotpulse{0%,100%{box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(201,168,106,.4)}50%{box-shadow:0 0 0 2px #ecd9ac,0 0 22px rgba(201,168,106,.85)}}
.slot.tgt{cursor:pointer}
.slot.tgt .card{box-shadow:0 0 0 2px #ff9d4d, 0 0 20px rgba(255,140,60,.7); animation:tgtpulse 1s ease-in-out infinite}
@keyframes tgtpulse{0%,100%{box-shadow:0 0 0 2px #ff9d4d,0 0 12px rgba(255,140,60,.5)}50%{box-shadow:0 0 0 2px #ffc78f,0 0 24px rgba(255,160,80,.9)}}
.slot.atk{cursor:pointer}
.slot.atk .card{box-shadow:0 0 0 2px var(--danger), 0 0 18px rgba(213,80,60,.65); animation:atkpulse 1.2s ease-in-out infinite}
@keyframes atkpulse{0%,100%{box-shadow:0 0 0 2px var(--danger),0 0 10px rgba(213,80,60,.45)}50%{box-shadow:0 0 0 2px #ff8f7d,0 0 22px rgba(255,110,90,.85)}}
.slot.spent .card{filter:brightness(.7) saturate(.75)}
/* creature statuses */
.stat{position:absolute; left:-6px; top:-6px; display:flex; flex-direction:column; gap:2px; z-index:4}
.stat span{width:18px; height:18px; border-radius:50%; background:#0c1014; border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; font-size:.62rem}
.hpgem{position:absolute; right:-7px; bottom:-7px; z-index:4; min-width:22px; height:22px; padding:0 3px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #4a5560, #171d23 75%);
  border:1px solid var(--gold-soft); color:#fff; font-weight:700; font-size:.8rem;
  display:flex; align-items:center; justify-content:center; text-shadow:0 1px 2px #000}
.hpgem.buff{border-color:var(--good); color:#a8ecb5}
.hpgem.hurt{border-color:var(--danger); color:#ffb3a6}
.understack{position:absolute; z-index:0; inset:0}
.understack i{position:absolute; inset:0; border-radius:9px; display:block;
  background:linear-gradient(160deg,#2a2440,#161226); border:1px solid #3a3148;
  box-shadow:0 2px 5px rgba(0,0,0,.5)}
.understack i::after{content:"✦"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--gold); opacity:.5; font-size:.8rem}
/* ---------- ribbon ---------- */
#ribbon{display:flex; align-items:center; justify-content:center; gap:4px; padding:8px 0; margin:2px auto;
  position:relative; width:min(92%, 680px); z-index:3}
#ribbon::before,#ribbon::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold-soft))}
#ribbon::after{background:linear-gradient(90deg,var(--gold-soft),transparent)}
.ph-step{font-family:Cinzel,serif; font-size:.62rem; letter-spacing:.12em; text-transform:uppercase;
  color:var(--dim); padding:3px 9px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
.ph-step.on{color:#f1e2ba; border-color:var(--gold-soft); background:rgba(201,168,106,.1); text-shadow:0 0 10px rgba(201,168,106,.6)}
/* ---------- banner ---------- */
#banner{position:absolute; top:calc(var(--hh)*.96 + 8px); left:50%; transform:translateX(-50%); z-index:30;
  max-width:min(90%,560px); text-align:center; pointer-events:none; transition:opacity .2s}
#banner .btxt{display:inline-block; padding:7px 18px; border-radius:22px; background:rgba(10,13,17,.92);
  border:1px solid var(--gold-soft); color:#f0e6c8; font-size:.88rem; box-shadow:0 4px 18px rgba(0,0,0,.6)}
#banner .btxt b{color:var(--gold)}
#banner.hidden{opacity:0}
/* ---------- cards ---------- */
.card{position:absolute; inset:0; border-radius:9px; overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  background:linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%);
  box-shadow:0 3px 8px rgba(0,0,0,.55), inset 0 0 0 1px rgba(0,0,0,.35);
  display:flex; flex-direction:column;
}
.card .cn{font-family:Cinzel,serif; font-weight:700; font-size:.56rem; letter-spacing:.08em; text-transform:uppercase;
  text-align:center; padding:3px 2px 1px; color:rgba(255,255,255,.92); text-shadow:0 1px 2px rgba(0,0,0,.7); white-space:nowrap; overflow:hidden}
.card .ci{flex:1; display:flex; align-items:center; justify-content:center; font-size:calc(var(--cw)*.42);
  text-shadow:0 2px 8px rgba(0,0,0,.5); filter:drop-shadow(0 0 6px rgba(255,255,255,.15))}
.card .cm{text-align:center; font-size:.52rem; padding:1px 2px 3px; color:rgba(255,255,255,.75); letter-spacing:.05em; text-transform:uppercase}
.card.spellcard{filter:saturate(.85)}
.card.spellcard .ci{font-size:calc(var(--cw)*.34)}
.el-water{--c1:#5da5e6; --c2:#1c4f86}
.el-steen{--c1:#cfa06a; --c2:#6e4b26}
.el-vuur{--c1:#e87258; --c2:#8e2417}
.el-gras{--c1:#6cbd79; --c2:#256030}
.cardback{border-radius:9px; border:1px solid #3a3148;
  background:
    radial-gradient(circle at 50% 42%, rgba(201,168,106,.22), transparent 55%),
    linear-gradient(160deg,#252033,#141020);
  box-shadow:0 3px 8px rgba(0,0,0,.55);
  display:flex; align-items:center; justify-content:center}
.cardback::after{content:"✦"; color:var(--gold); font-size:1.15rem; opacity:.85; text-shadow:0 0 10px rgba(201,168,106,.7)}
.hcard>.card,.hcard>.cardback{position:absolute; inset:0}
/* ---------- preview ---------- */
#preview .pv{width:min(238px,100%); border-radius:14px; border:1px solid var(--gold-soft);
  background:linear-gradient(165deg,#1b222a,#10151b); box-shadow:0 8px 30px rgba(0,0,0,.6); overflow:hidden}
.pv .pvhead{display:flex; align-items:center; gap:9px; padding:10px 12px;
  background:linear-gradient(160deg,var(--c1),var(--c2)); border-bottom:1px solid rgba(0,0,0,.4)}
.pv .pvhead .ic{font-size:1.5rem; filter:drop-shadow(0 1px 3px rgba(0,0,0,.6))}
.pv .pvhead .nm{font-family:Cinzel,serif; font-weight:700; font-size:1.05rem; letter-spacing:.1em; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6)}
.pv .sec{padding:8px 12px; border-bottom:1px solid var(--line-soft)}
.pv .sec:last-child{border-bottom:none}
.pv .sect{font-family:Cinzel,serif; font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); margin-bottom:3px}
.pv .sec p{font-size:.78rem; line-height:1.4; color:#cfd6dc}
.pv .vs{font-size:.72rem; color:var(--muted); padding:7px 12px; display:flex; justify-content:space-between}
.pv .vs b{font-weight:700}
.pv .cur{padding:6px 12px; font-size:.78rem; color:var(--gold); border-top:1px solid var(--line-soft)}
/* circle diagram (default preview) */
#preview .circ{width:min(238px,100%); border-radius:14px; border:1px solid var(--line);
  background:linear-gradient(165deg,#171d24,#0f1419); padding:10px 6px 4px; text-align:center}
#preview .circ .t{font-family:Cinzel,serif; font-size:.68rem; letter-spacing:.16em; color:var(--muted); text-transform:uppercase}
#preview .circ svg{width:100%; height:auto}
/* ---------- chain ---------- */
#chain .cht{font-family:Cinzel,serif; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); margin:2px 0 5px}
.chitem{display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px; margin-bottom:5px;
  background:linear-gradient(160deg,#1d242c,#151a20); border:1px solid var(--line); font-size:.76rem; line-height:1.25}
.chitem.top{border-color:var(--gold-soft); box-shadow:0 0 12px rgba(201,168,106,.2)}
.chitem .chic{width:26px; height:26px; flex:0 0 auto; border-radius:6px; display:flex; align-items:center; justify-content:center;
  font-size:.85rem; background:linear-gradient(160deg,var(--c1),var(--c2)); border:1px solid rgba(255,255,255,.15)}
.chitem .who{color:var(--gold); font-weight:700}
.chitem .first{margin-left:auto; font-size:.6rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; flex:0 0 auto}
/* ---------- fx ---------- */
#fx{position:fixed; inset:0; pointer-events:none; z-index:80}
.fly{position:fixed; z-index:81; transition:transform .45s cubic-bezier(.4,.1,.3,1), opacity .45s; will-change:transform}
.pop{position:fixed; z-index:82; font-family:Cinzel,serif; font-weight:700; font-size:1.25rem; text-shadow:0 2px 6px #000;
  animation:popup 1s ease-out forwards; white-space:nowrap}
@keyframes popup{0%{transform:translate(-50%,0) scale(.6); opacity:0}18%{transform:translate(-50%,-8px) scale(1.15); opacity:1}75%{opacity:1}100%{transform:translate(-50%,-34px) scale(1); opacity:0}}
.pop.dmg{color:#ff7a63}.pop.heal{color:#7fe08f}.pop.imm{color:#bcd5ea; font-size:.95rem}.pop.kill{color:#ffb14d}
.lunge-up{animation:lup .3s ease-in-out}
.lunge-down{animation:ldn .3s ease-in-out}
@keyframes lup{0%,100%{transform:translateY(0)}45%{transform:translateY(-26px) scale(1.07)}}
@keyframes ldn{0%,100%{transform:translateY(0)}45%{transform:translateY(26px) scale(1.07)}}
.atkline{position:fixed; z-index:79; height:3px; background:linear-gradient(90deg,rgba(213,80,60,.1),#ff8668,rgba(213,80,60,.1));
  transform-origin:0 50%; border-radius:2px; opacity:0; animation:lineflash .45s ease-out forwards; box-shadow:0 0 10px rgba(255,120,90,.8)}
@keyframes lineflash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
/* ---------- kaart-effecten ---------- */
.fxl{position:fixed; z-index:81; pointer-events:none; will-change:transform,opacity}
/* vuur */
.fball{width:34px; height:34px; margin:-17px 0 0 -17px; border-radius:50%;
  background:radial-gradient(circle at 38% 34%, #fff6d8 0%, #ffd166 22%, #ff7a2e 52%, #c2320f 78%, rgba(120,26,6,0) 100%);
  box-shadow:0 0 18px 6px rgba(255,132,50,.65), 0 0 44px 14px rgba(255,90,20,.3);
  animation:fbspin .5s linear infinite}
@keyframes fbspin{to{transform:rotate(360deg)}}
.ftrail{width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%;
  background:radial-gradient(circle,#ffca6a 0%,#ff6a1e 55%,rgba(200,60,10,0) 100%);
  animation:ftfade .45s ease-out forwards}
@keyframes ftfade{0%{opacity:.9; transform:scale(1)}100%{opacity:0; transform:scale(.25)}}
.spark{width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; animation:sparkfly var(--d,.7s) cubic-bezier(.2,.6,.4,1) forwards}
@keyframes sparkfly{0%{opacity:1; transform:translate(0,0) scale(1)}
  100%{opacity:0; transform:translate(var(--tx),var(--ty)) scale(.2)}}
.shock{border-radius:50%; border:3px solid rgba(255,208,130,.95); animation:shockout .45s ease-out forwards;
  box-shadow:0 0 22px rgba(255,150,60,.75), inset 0 0 18px rgba(255,140,50,.5)}
@keyframes shockout{0%{transform:scale(.12); opacity:1}100%{transform:scale(1.65); opacity:0}}
.scorch{position:absolute; inset:-6px; border-radius:12px; animation:scorchflash .5s ease-out forwards;
  background:radial-gradient(circle at 50% 50%, rgba(255,236,190,.95) 0%, rgba(255,146,50,.8) 35%, rgba(190,50,10,.45) 65%, rgba(120,20,0,0) 100%);
  mix-blend-mode:screen}
@keyframes scorchflash{0%{opacity:0; transform:scale(.5)}14%{opacity:1; transform:scale(1.04)}100%{opacity:0; transform:scale(1.16)}}
/* uiteenvallen */
.ash{position:absolute; width:var(--w); height:var(--h); background:var(--c); border-radius:1px;
  animation:ashrise var(--d) cubic-bezier(.25,.7,.4,1) forwards; opacity:.95}
@keyframes ashrise{0%{transform:translate(0,0) rotate(0deg); opacity:.95}
  100%{transform:translate(var(--tx),var(--ty)) rotate(var(--rot)); opacity:0}}
.ghost{position:absolute; inset:0; animation:ghostout .62s ease-in forwards; transform-origin:50% 60%}
@keyframes ghostout{0%{opacity:.85; filter:blur(0) brightness(1)}
  45%{opacity:.55; filter:blur(2px) brightness(1.8)}
  100%{opacity:0; filter:blur(9px) brightness(2.6); transform:scale(1.12) translateY(-10px)}}
/* doorns */
.thorns{position:absolute; inset:-8px; overflow:visible}
.thorns path{fill:none; stroke:#4d9b45; stroke-width:3.2; stroke-linecap:round;
  filter:drop-shadow(0 0 5px rgba(90,215,95,.65));
  stroke-dasharray:var(--len); stroke-dashoffset:var(--len);
  animation:vinegrow .38s ease-out forwards, vinefade .5s ease-in .62s forwards}

/* water */
.splashring{border-radius:50%; border:3px solid rgba(126,206,255,.9); animation:ringout .55s ease-out forwards;

@keyframes rockfall{0%{opacity:0; transform:translate(var(--fx0),-92px) rotate(0deg)}

const ORDER = ["water","steen","vuur","gras"];   // cirkel: 💧→🔥→🌿→🪨→💧

const weakTo = el => ORDER.find(e => EL[e].strong === el); // element that instakills el
const PHASES = [["upkeep","Upkeep"],["draw","Draw"],["main1","Main"],["battle","Gevecht"],["main2","Main 2"],["end","Einde"]];

/* ================= STATE ================= */
let S = null, pending = null, cid = 0, busyFlag = false;
let FAST = false;                       // replay: geen animaties, geen renders
let RNG = 1, SEED = 1;
function srand(sd){ RNG = (sd >>> 0) || 1; SEED = RNG; }
const REC = {seed:1, log:[]};
let MUT = 0;   // telt echte spelmutaties; alleen effectieve zetten worden opgenomen
function fp(){   // compacte vingerafdruk van de stand (voor replay-controle)
  const c = p => P(p).cols.map(x =>
    (x.cre ? x.cre.card.el + x.cre.hp + "e" + x.cre.ent : "-") +
    "/" + (x.spell ? x.spell.card.el : "-")).join(",");
  return JSON.stringify({t:S.tp, ph:S.phase, m:S.ui.mode, st:S.stack.length,
    l:[P(0).life,P(1).life], d:[P(0).deck.length,P(1).deck.length],
    h:[P(0).hand.map(x=>x.el).join(""),P(1).hand.map(x=>x.el).join("")],
    g:[P(0).grave.map(x=>x.el).sort().join(""),P(1).grave.map(x=>x.el).sort().join("")],
    b:[c(0),c(1)], ae:S.ae, w:S.match?S.match.wins:null, o:S.over?S.over.winner:null});
}
function rnd(){ RNG |= 0; RNG = RNG + 0x6D2B79F5 | 0;
  let t = Math.imul(RNG ^ RNG >>> 15, 1 | RNG);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
  return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const $ = s => document.querySelector(s);
const opp = p => 1 - p;
const P = p => S.pl[p];
const sleep = ms => FAST ? Promise.resolve() : new Promise(r => setTimeout(r, ms));
const pName = p => (S && S.vsBot && p === 1) ? "de Bot 🤖"
  : (NET.on && p === NET.seat ? "jij (Speler " + (p+1) + ")" : "Speler " + (p + 1));
const isBot = p => !!(S && S.vsBot && p === 1);
const aeList = p => (S && S.ae && S.ae[p]) || [];
const hasAe = (p, k) => aeList(p).includes(k);
const aeFuseKey = (p, el) => aeList(p).find(k => AETHERS[k].fuse && AETHERS[k].el === el) || null;
const aeFuse = (p, el) => { const k = aeFuseKey(p, el); return k ? Object.assign({key:k}, AETHERS[k].fuse) : null; };
const aeFuseAny = p => aeList(p).some(k => AETHERS[k].fuse);
function fuseTributes(p, el){          // welke eigen creatures kun je offeren voor deze fusie?
  const f = aeFuse(p, el);
  if(!f) return [];
  return allCreIds((cr, pp) => pp === p && cr.card.el === f.tribute);
}
function fuseOk(p, el, speed){
  const f = aeFuse(p, el);
  if(!f) return false;
  if(speed && f.speed !== speed) return false;
  return fuseTributes(p, el).length > 0;
}
const aeBoosts = (p, el) => aeList(p).some(k => AETHERS[k].el === el);   // aether die dit element opwaardeert?
const atkOf = (cr, p) => {            // aanvalskracht: helft van de levens, minimaal 1
  if(!cr) return 1;
  if(cr.card.el === "steen" && hasAe(p, "ae_stonefull")) return Math.max(1, cr.hp);
  return Math.max(1, Math.floor(cr.hp / 2));
};
let botPlan = null, botT = null;

function buildDeck(p){
  const banned = (S && S.match ? S.match.bannedEl[p] : []) || [];
  const cnt = {}; ORDER.forEach(el => cnt[el] = 10);   // 4 elementen × 10 = 40 kaarten
  banned.forEach(el => { if(cnt[el] > 0) cnt[el]--; });
  return shuffle(ORDER.flatMap(el => Array.from({length:cnt[el]}, () => ({id:++cid, el, owner:p}))));
}
function resetBoard(){
  pending = null; busyFlag = false; botPlan = null; clearTimeout(botT);
  S.pl = [0,1].map(i => ({life:5, deck:[], hand:[], grave:[], cols:Array.from({length:5}, () => ({cre:null, spell:null}))}));
  S.pl[0].deck = buildDeck(0); S.pl[1].deck = buildDeck(1);
  S.stack = []; S.over = null; S.gTurn = 1; S.phase = "upkeep"; S.botPlays = 0;
}
function dealHands(starter){
  S.tp = starter; S.actor = starter;
  S.turnNo = [0,0]; S.turnNo[starter] = 1;
  for(let i=0;i<4;i++) P(starter).hand.push(P(starter).deck.pop());
  for(let i=0;i<3;i++) P(opp(starter)).hand.push(P(opp(starter)).deck.pop());
  addLog(`<em>${pName(starter)}</em> begint: 4 kaarten, eerste draw overgeslagen. ${pName(opp(starter))} start met 3 kaarten.`, true);
}
function newGame(keepSeed){
  cid = 0; pending = null; busyFlag = false; botPlan = null; clearTimeout(botT);
  if(!keepSeed) srand((Date.now() ^ Math.floor(Math.random()*1e9)) >>> 0);
  REC.seed = SEED; REC.log = [];
  const prevBot = S ? S.vsBot : false;
  const prevSet = S && S.set ? S.set : {handoff:true};
  S = { pl:null, tp:0, gTurn:1, phase:"upkeep", stack:[], over:null, actor:0, holder:0,
        set:prevSet, log:[], turnNo:[1,0], vsBot:prevBot, botPlays:0,
        mode:"classic", ae:[[],[]], match:null };
  resetBoard();
  S.ui = {mode:"start"};
  render();
}
/* ---- Commander (best of 3) ---- */
async function commanderSetup(){
  const m = S.match, starter = m.firstPicker;
  addLog(`— 🟣 Potje ${m.game} · stand ${m.wins[0]}–${m.wins[1]} — ${pName(starter)} kiest eerst en begint.`, true);
  const taken = [].concat(S.ae[0], S.ae[1]);
  let offer = shuffle(Object.keys(AETHERS).filter(k => !taken.includes(k))).slice(0,3);
  const i1 = await waitUI("aetherpick", {p:starter, cards:offer.slice(), order:1});
  const k1 = offer[i1]; S.ae[starter].push(k1); offer.splice(i1,1);
  addLog(`${pName(starter)} kiest 🟣 <em>${AETHERS[k1].name}</em>.`, true);
  const i2 = await waitUI("aetherpick", {p:opp(starter), cards:offer.slice(), order:2});
  const k2 = offer[i2]; S.ae[opp(starter)].push(k2); offer.splice(i2,1);
  addLog(`${pName(opp(starter))} kiest 🟣 <em>${AETHERS[k2].name}</em>; ${AETHERS[offer[0]].name} wordt weggelegd.`, true);
  const nBan = m.game === 1 ? 10 : 5;
  for(const p of [starter, opp(starter)]){
    const six = [];
    for(let i=0;i<nBan && P(p).deck.length;i++) six.push(P(p).deck.pop());
    if(!isBot(p)) await ensureHolder(p);
    const banIds = await waitUI("banpick", {p, cards:six, sel:[]});
    const bans = six.filter(c => banIds.includes(c.id));
    const keep = six.filter(c => !banIds.includes(c.id));
    bans.forEach(c => m.bannedEl[p].push(c.el));
    P(p).deck.push(...keep); shuffle(P(p).deck);
    addLog(`${pName(p)} bant ${bans.length} kaart${bans.length===1?"":"en"}${bans.length?" ("+bans.map(c=>icon(c.el)).join(" ")+")":""} voor de rest van de match.`, true);
  }
  dealHands(starter);
  await ensureHolder(starter);
  await startTurnSequence();
}
function nextGame(){
  if(!S.over || S.mode !== "commander" || !S.match) return;
  MUT++;
  const loser = opp(S.over.winner);
  S.match.game++; S.match.firstPicker = loser; S.ready = [false, false];
  resetBoard();
  S.ui = {mode:"busy"}; render();
  commanderSetup();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- lookups ---- */
function eachCre(fn){ for(let p=0;p<2;p++) for(let c=0;c<5;c++){ const cr=P(p).cols[c].cre; if(cr) fn(cr,p,c); } }
function allCreIds(pred){ const out=[]; eachCre((cr,p,c)=>{ if(!pred || pred(cr,p,c)) out.push(cr.card.id); }); return out; }
function findCre(id){ let hit=null; eachCre((cr,p,c)=>{ if(cr.card.id===id) hit={cr,p,c}; }); return hit; }
function emptyCols(p, excl){ const out=[]; for(let c=0;c<5;c++) if(!P(p).cols[c].cre && c!==excl) out.push(c); return out; }
function freeSpellCols(p){ return [0,1,2,3,4]; } // spells mogen een bezette spell-plek overschrijven (oude wordt gediscard)
function handHasFlash(p){ return P(p).hand.some(cd => EL[cd.el].flash); }
function flashFuseOk(p){
  if(!aeFuseAny(p)) return false;
  return P(p).hand.some(cd => fuseOk(p, cd.el, "flash"));
}
function hasLegalFlash(p){ return (handHasFlash(p) && emptyCols(p).length > 0) || flashFuseOk(p); }
function canPlayCreature(p){ return emptyCols(p).length > 0; }
function creSlotsFor(p, el){
  return emptyCols(p).map(c => ({p, c, kind:"cre"}));
}
function canAttack(cr, p){
  // Summoning sickness bestaat alleen in de allereerste beurt van de startende speler
  return p === S.tp && S.phase === "battle" && (S.gTurn > 1 || cr.played < S.gTurn) && cr.attackedT !== S.gTurn && cr.ent === 0;
}
function dmgOutcome(srcEl, tgtEl, base){
  if(EL[srcEl].strong === tgtEl) return "kill";       // sterk tegen zwak: instakill
  if(EL[tgtEl].strong === srcEl) return "immuun";     // zwak tegen sterk: geen effect
  return base;
}

async function flyCard(fromR, toR, inner, ms=450){
  if(FAST || !fromR || !toR){ return; }
  const d=document.createElement("div");
  d.className="fly"; d.innerHTML=inner;
  d.style.left=fromR.left+"px"; d.style.top=fromR.top+"px";
  d.style.width=fromR.width+"px"; d.style.height=fromR.height+"px";
  const k=d.firstElementChild; if(k){ k.style.position="absolute"; k.style.inset="0"; }
  document.getElementById("fx").appendChild(d);
  await sleep(20);
  const sx=(toR.left+toR.width/2)-(fromR.left+fromR.width/2);
  const sy=(toR.top+toR.height/2)-(fromR.top+fromR.height/2);
  d.style.transform=`translate(${sx}px,${sy}px) scale(${toR.width/fromR.width})`;
  await sleep(ms); d.remove();
}
function pop(sel, text, cls){
  if(FAST) return;
  const w = fxWait(); if(w > 12){ setTimeout(()=>pop(sel, text, cls), w); return; }
  const r = typeof sel==="string" ? rectOf(sel) : sel; if(!r) return;
  const d=document.createElement("div");
  d.className="pop "+cls; d.textContent=text;
  d.style.left=(r.left+r.width/2)+"px"; d.style.top=(r.top+r.height*0.25)+"px";
  document.getElementById("fx").appendChild(d);
  setTimeout(()=>d.remove(), 1100);
}

   of een data:-URI. Leeg = het spel synthetiseert het geluid zelf.
   MUSIC is bewust leeg gelaten: zet er je eigen muziekbestand in en het loopt vanzelf. */
const SOUNDS = {
  music:  "",          // achtergrondmuziek, wordt eindeloos herhaald
  fire:   "",          // 🔥 vuurbal onderweg
  burn:   "",          // 🔥 inslag
  ash:    "",          // creature valt uiteen

const SET = {music:0.5, sfx:0.75, fx:"vol"};   // fx: "vol" | "subtiel" | "uit"
try{ const raw = localStorage.getItem("elementaal.set"); if(raw) Object.assign(SET, JSON.parse(raw)); }catch(e){}
function saveSet(){ try{ localStorage.setItem("elementaal.set", JSON.stringify(SET)); }catch(e){} }
const fxOn = () => SET.fx !== "uit" && !FAST;
const fxFull = () => SET.fx === "vol";
const fxScale = n => Math.max(1, Math.round(n * (fxFull() ? 1 : 0.45)));

/* ================= AUDIO ================= */
const AU = {
  ctx:null, master:null, sfxG:null, musEl:null, started:false, custom:{},
  boot(){
    if(this.started) return;
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) { this.started = true; return; }
    try{
      this.ctx = new C();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.9; this.master.connect(this.ctx.destination);
      this.sfxG = this.ctx.createGain(); this.sfxG.gain.value = SET.sfx; this.sfxG.connect(this.master);
    }catch(e){ this.ctx = null; }
    this.started = true;
    this.startMusic();
  },
  resume(){ if(this.ctx && this.ctx.state === "suspended") this.ctx.resume(); },
  setSfx(v){ SET.sfx = v; if(this.sfxG) this.sfxG.gain.value = v; },
  setMusic(v){ SET.music = v; if(this.musEl) this.musEl.volume = v; },
  startMusic(){
    if(this.musEl || !SOUNDS.music) return;
    try{
      const a = new Audio(SOUNDS.music);
      a.loop = true; a.volume = SET.music; a.preload = "auto";
      const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{});
      this.musEl = a;
    }catch(e){}
  },
  /* eigen bestand als die er is, anders de synth */
  play(name, opt){
    if(FAST) return;
    this.boot(); this.resume();
    const src = SOUNDS[name];
    if(src){
      try{ const a = new Audio(src); a.volume = SET.sfx; const pr = a.play(); if(pr && pr.catch) pr.catch(()=>{}); }catch(e){}
      return;
    }
    if(!this.ctx || SET.sfx <= 0) return;
    try{ (this["s_" + name] || function(){}).call(this, opt || {}); }catch(e){}
  },
  /* --- bouwstenen --- */
  noise(dur){
    const n = Math.floor(this.ctx.sampleRate * dur);
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = b; return src;
  },
  env(node, t0, peak, atk, dec){
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + atk + dec);
    node.connect(g); g.connect(this.sfxG);
    return g;
  },
  tone(type, f0, f1, t0, dur, peak){
    const o = this.ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
    this.env(o, t0, peak, 0.012, dur);
    o.start(t0); o.stop(t0 + dur + 0.05);
    return o;
  },
  filtNoise(dur, type, f0, f1, peak, q){
    const t0 = this.ctx.currentTime;
    const n = this.noise(dur);
    const f = this.ctx.createBiquadFilter(); f.type = type;
    f.frequency.setValueAtTime(f0, t0);
    f.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t0 + dur);
    f.Q.value = q || 1;
    n.connect(f);
    this.env(f, t0, peak, 0.015, dur);
    n.start(t0); n.stop(t0 + dur + 0.05);
    return t0;
  },
  /* --- stemmen --- */
  s_fire(){   // wegzoevende vuurbal
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.42, "bandpass", 420, 1500, 0.9, 2.2);
    this.tone("sawtooth", 150, 420, t0, 0.34, 0.17);
  },
  s_burn(){   // inslag
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.30, "lowpass", 2600, 320, 0.85, 1);
    this.tone("sine", 190, 46, t0, 0.30, 0.5);
    this.tone("triangle", 620, 120, t0 + 0.01, 0.14, 0.16);
  },
  s_ash(){    // uiteenvallen: knisperende sintels
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.75, "highpass", 900, 5200, 0.22, 0.7);
    this.tone("sine", 120, 40, t0, 0.5, 0.28);
    for(let i=0;i<8;i++){
      const tt = t0 + 0.05 + Math.random()*0.55;
      const o = this.ctx.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(1800 + Math.random()*2600, tt);
      const g = this.ctx.createGain();
      g.gain.setValueAtTime(0.05 + Math.random()*0.05, tt);
      g.gain.exponentialRampToValueAtTime(0.0001, tt + 0.05);
      o.connect(g); g.connect(this.sfxG); o.start(tt); o.stop(tt + 0.07);
    }
  },
  s_water(){  // plons + druppels
    const t0 = this.ctx.currentTime;
    this.filtNoise(0.34, "bandpass", 2600, 700, 0.55, 1.4);
    this.tone("sine", 700, 190, t0, 0.16, 0.20);
    for(let i=0;i<4;i++){
      const tt = t0 + 0.14 + i*0.075 + Math.random()*0.04;
      this.tone("sine", 1500 + Math.random()*900, 420, tt, 0.09, 0.10);
    }
  },
  s_rock(){   // steen die neerkomt
    const t0 = this.ctx.currentTime;
    this.tone("sine", 130, 42, t0, 0.34, 0.6);
    this.filtNoise(0.14, "lowpass", 1500, 260, 0.5, 1);
    this.filtNoise(0.07, "highpass", 2400, 5200, 0.16, 0.8);
  },
  s_thorn(){  // ritselende, knerpende ranken
    const t0 = this.ctx.currentTime;
    const n = this.noise(0.5);
    const f = this.ctx.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 5.5;
    f.frequency.setValueAtTime(900, t0);
    f.frequency.exponentialRampToValueAtTime(2300, t0 + 0.45);
    const lfo = this.ctx.createOscillator(); lfo.type = "square"; lfo.frequency.value = 26;
    const lg = this.ctx.createGain(); lg.gain.value = 0.16;
    lfo.connect(lg);
    n.connect(f);
    const g = this.env(f, t0, 0.52, 0.05, 0.45);
    lg.connect(g.gain);
    lfo.start(t0); lfo.stop(t0 + 0.55);
    n.start(t0); n.stop(t0 + 0.55);
    this.tone("triangle", 300, 130, t0 + 0.05, 0.3, 0.10);
  },
  s_place(){  const t0 = this.ctx.currentTime; this.filtNoise(0.10, "lowpass", 1800, 500, 0.30, 1); this.tone("triangle", 340, 190, t0, 0.10, 0.12); },
  s_attack(){ const t0 = this.ctx.currentTime; this.filtNoise(0.17, "bandpass", 3200, 900, 0.42, 2.4); this.tone("sawtooth", 480, 150, t0, 0.13, 0.12); },
  s_kill(){   const t0 = this.ctx.currentTime; this.tone("sine", 300, 60, t0, 0.45, 0.34); this.filtNoise(0.28, "lowpass", 1300, 200, 0.34, 1); },
  s_draw(){   this.filtNoise(0.12, "highpass", 1400, 4200, 0.20, 0.8); },
  s_click(){  const t0 = this.ctx.currentTime; this.tone("square", 900, 620, t0, 0.05, 0.085); },
  s_win(){    const t0 = this.ctx.currentTime; [392,494,587,784].forEach((f,i)=> this.tone("triangle", f, f, t0 + i*0.11, 0.34, 0.16)); },

let fxHold = 0;                       // tot wanneer visuele feedback wacht (vuurbal onderweg)

function fxLayer(){ return document.getElementById("fx"); }

function fxDiv(cls, css){ const d = document.createElement("div"); d.className = "fxl " + cls; Object.assign(d.style, css); return d; }
const ctr = r => ({x:r.left + r.width/2, y:r.top + r.height/2});

/* 🌿 doorns die over het doel groeien, plus druppels naar de bron */
function fxThorns(sel, srcSel){
  const r = rectOf(sel); if(!r) return;
  AU.play("thorn");
  if(!fxOn()) return;
  const wrap = fxDiv("", Object.assign(fxBox(r, 8), {position:"fixed"}));
  const W = r.width + 16, H = r.height + 16;
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "thorns");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = W + "px"; svg.style.height = H + "px";
  const vines = fxFull() ? 4 : 2;
  const NS = "http://www.w3.org/2000/svg";
  for(let v=0; v<vines; v++){
    /* elke rank kronkelt van de ene rand naar de andere dwars over de kaart heen */
    const vertical = v % 2 === 1;
    const span = vertical ? H : W, thick = vertical ? W : H;
    const amp = thick * (0.24 + 0.1*(v%2));
    const mid = thick * (0.5 + (v < 2 ? -0.16 : 0.18));
    const dir = v < 2 ? 1 : -1;
    const N = 9, pts = [];
    for(let i=0;i<=N;i++){
      const t = i/N;
      const along = (dir > 0 ? t : 1 - t) * (span + 14) - 7;
      const off = mid + Math.sin(t*Math.PI*2.15 + v*1.7) * amp * (0.35 + t*0.75);
      pts.push(vertical ? [off, along] : [along, off]);
    }
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for(let i=1;i<pts.length;i++){
      const a = pts[i-1], b = pts[i];
      const cx = (a[0]+b[0])/2, cy = (a[1]+b[1])/2;
      d += ` Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${cx.toFixed(1)} ${cy.toFixed(1)}`;
    }
    d += ` T${pts[pts.length-1][0].toFixed(1)} ${pts[pts.length-1][1].toFixed(1)}`;
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", d);
    let len = 0;
    for(let i=1;i<pts.length;i++) len += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    len *= 1.25;
    path.style.setProperty("--len", len.toFixed(0));
    path.style.animationDelay = (v*0.07) + "s, " + (0.72 + v*0.03) + "s";
    svg.appendChild(path);
    /* doorns loodrecht op de rank */
    for(let i=1;i<pts.length-1;i+=2){
      const a = pts[i-1], b = pts[i+1], px = pts[i][0], py = pts[i][1];
      const nx = -(b[1]-a[1]), ny = (b[0]-a[0]);
      const nl = Math.hypot(nx, ny) || 1;
      const side = (i % 4 === 1) ? 1 : -1;
      const ux = (nx/nl)*side, uy = (ny/nl)*side;
      const L = 7 + Math.random()*4, Wd = 3.2;
      const tri = document.createElementNS(NS, "polygon");
      tri.setAttribute("points",
        `${(px + ux*L).toFixed(1)},${(py + uy*L).toFixed(1)} ` +
        `${(px - uy*Wd).toFixed(1)},${(py + ux*Wd).toFixed(1)} ` +
        `${(px + uy*Wd).toFixed(1)},${(py - ux*Wd).toFixed(1)}`);
      const del = 0.1 + v*0.07 + (i/pts.length)*0.28;
      tri.style.animationDelay = del + "s, " + (0.72 + v*0.03) + "s";
      svg.appendChild(tri);
    }
  }
  wrap.appendChild(svg);
  fxAdd(wrap, 1300);
  if(srcSel){
    const sr = rectOf(srcSel);
    if(sr){
      const a = ctr(r), b = ctr(sr);
      const n = fxScale(5);
      for(let i=0;i<n;i++){
        const bead = fxDiv("drainbead", {left:(a.x + (Math.random()*30 - 15)) + "px", top:(a.y + (Math.random()*30 - 15)) + "px"});
        bead.style.setProperty("--tx", (b.x - a.x) + "px");
        bead.style.setProperty("--ty", (b.y - a.y) + "px");
        bead.style.setProperty("--d", (0.5 + i*0.07) + "s");
        bead.style.animationDelay = (0.16 + i*0.06) + "s";
        fxAdd(bead, 1400);
      }
    }
  }
}

function gainLife(id, byP, srcTxt, fx){

function destroyCre(p, c, cause){
  const cr = P(p).cols[c].cre; if(!cr) return;
  const w = fxWait();
  if(w > 12) setTimeout(()=>AU.play("kill"), w); else AU.play("kill");
  fxAsh(creSel(p, c), cr.card.el);
  P(p).cols[c].cre = null;
  P(cr.card.owner).grave.push(cr.card);
  pop(creSel(p,c), "✝", "kill");
  addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} van ${pName(p)} wordt vernietigd${cause ? ` (${cause})` : ""}.`, true);
}
function applyDamage(id, srcEl, base, o){
  const f = findCre(id); if(!f) return {done:false};
  let out = dmgOutcome(srcEl, f.cr.card.el, base);
  if(o && o.ignoreImmune && out === "immuun") out = base;    // 🟣 Verzengende Woede raakt ook Water
  if(o && o.alwaysKill && !o.protect) out = "kill";
  const sel = creSel(f.p, f.c);
  if(!(o && o.noFx) && srcEl === "vuur" && out !== "immuun"){
    const sc = o && o.srcSel ? o.srcSel : null;
    fxFire(sc, sel);
  }
  if(out === "immuun"){
    pop(sel, "IMMUUN", "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} is <em>immuun</em> voor ${icon(srcEl)} ${EL[srcEl].name}.`);
    return {destroyed:false};
  }
  if(o && o.protect){
    const newHp = out === "kill" ? Math.min(f.cr.hp, 1) : Math.max(1, f.cr.hp - out);
    const lost = f.cr.hp - newHp;
    f.cr.hp = newHp;
    pop(sel, lost > 0 ? "-" + lost : "beschermd", lost > 0 ? "dmg" : "imm");
    addLog(`${icon(f.cr.card.el)} in kolom ${f.c+1} kan niet vernietigd worden door deze trigger en blijft op ${f.cr.hp} leven.`);
    return {destroyed:false};
  }
  if(out === "kill"){
    addLog(`${icon(srcEl)} ${EL[srcEl].name} is sterk tegen ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name}: <em>instakill</em>!`, true);
    pop(sel, "INSTAKILL", "kill");
    destroyCre(f.p, f.c, "instakill");
    return {destroyed:true, wasP:f.p};
  }
  f.cr.hp -= out;
  pop(sel, "-" + out, "dmg");
  addLog(`${icon(srcEl)} doet ${out} schade aan ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}).`);
  if(f.cr.hp <= 0){ destroyCre(f.p, f.c, "schade"); return {destroyed:true, wasP:f.p}; }
  return {destroyed:false};
}

/* ================= CHAIN / STACK ================= */
function pushPlay(p, card, asSpell, col, flash){
  S.stack.push({type:"play", ctrl:p, card, asSpell, col, flash});
  addLog(`${pName(p)} speelt ${icon(card.el)} <em>${EL[card.el].name}</em> als ${asSpell?"spell":"creature"}${flash?" ⚡(flash)":""} → kolom ${col+1}.`, true);
}
async function chainLoop(){
  while(S.stack.length && !S.over){
    const top = S.stack[S.stack.length-1];
    const resp = opp(top.ctrl);
    if(hasLegalFlash(resp)){
      const r = await askPriority(resp);
      if(S.over) return;
      if(r !== "pass"){
        const card = takeFromHand(resp, r.cardId);
        if(r.fuse){
          S.stack.push({type:"play", ctrl:resp, card, asFuse:true, tributeId:r.tributeId, fuseKey:r.fuseKey});
          addLog(`${pName(resp)} start ⚡ 🟣 <em>${AETHERS[r.fuseKey].name}</em>.`, true);
        }
        else pushPlay(resp, card, false, r.col, true);
        continue;
      }
      addLog(`${pName(resp)} reageert niet.`);
    }
    await resolveTop();
  }
  if(!S.over) backToPhase();
}
async function askPriority(p){
  while(true){
    await ensureHolder(p);
    const r = await waitUI("priority", {p});
    if(r === "pass") return "pass";
    const card = P(p).hand.find(cd => cd.id === r);
    const canCre = EL[card.el].flash && emptyCols(p).length > 0;
    const canFuse = fuseOk(p, card.el, "flash");
    let mode = "cre";
    if(canCre && canFuse){
      const m = await waitUI("pickmode", {p, cardId:r, creOk:true, spOk:false, fuseOk:true, flashCtx:true});
      if(m === "cancel") continue;
      mode = m;
    } else if(canFuse && !canCre) mode = "fuse";
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de ${icon(f.tribute)} ${EL[f.tribute].name} die je offert`, true, {k:"tribute"});
      if(tid === null) continue;
      return {cardId:r, fuse:true, tributeId:tid, fuseKey:f.key};
    }
    const slots = creSlotsFor(p, card.el);
    const s = await waitUI("slot", {p, valid:slots, cancellable:true,
      prompt:`Kies een plek voor ⚡ ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel") continue;
    return {cardId:r, col:s.c};
  }
}
function takeFromHand(p, cardId){
  const i = P(p).hand.findIndex(cd => cd.id === cardId);
  return P(p).hand.splice(i,1)[0];
}
async function resolveTop(){
  const it = S.stack.pop();
  S.ui = {mode:"busy"}; render();
  await sleep(120);
  if(it.type === "play") await resolvePlay(it);
  else if(it.type === "attack") await resolveAttack(it);
  else await resolveEffect(it);
  // 🟣 Getijdenstroom: bij elke gespeelde Water-kaart trek + discard
  if(it.type === "play" && it.card.el === "water" && hasAe(it.ctrl, "water_cycle") && !S.over
     && !P(it.ctrl).hand.some(c => c.id === it.card.id)){
    S.stack.push({type:"eff", el:"watercycle", ctrl:it.ctrl, origin:"aether"});
  }
  render();
}
function pushOwnEffect(p, col, cre){
  const el = cre.card.el;
  if(el === "vuur")  S.stack.push({type:"eff", el:"vuur",  ctrl:p, excl:[cre.card.id], srcId:cre.card.id, protect:null, origin:"creature"});
  if(el === "gras")  S.stack.push({type:"eff", el:"gras",  ctrl:p, srcId:cre.card.id, origin:"creature"});
  if(el === "steen"){
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"creature"});   // tweemaal +1
  }
  if(el === "water") S.stack.push({type:"eff", el:"water", ctrl:p, exclId:cre.card.id, origin:"creature"});
}
function pushSpellTrigger(p, col, trigCre){
  const sp = P(p).cols[col].spell; if(!sp) return;
  const el = sp.card.el, tid = trigCre ? trigCre.card.id : null;
  addLog(`✦ Spell-trigger: ${icon(el)} ${EL[el].name} in kolom ${col+1} van ${pName(p)}.`);
  if(el === "vuur")  S.stack.push({type:"eff", el:"vuur",  ctrl:p, excl:[], srcId:null, protect:tid, origin:"spell"});
  if(el === "gras")  S.stack.push({type:"eff", el:"gras",  ctrl:p, srcId:tid, origin:"spell"});
  if(el === "steen"){
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"});
    S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"});
  }
  if(el === "water" && tid !== null) S.stack.push({type:"eff", el:"water", ctrl:p, exclId:tid, origin:"spell"});
}
async function resolvePlay(it){
  const p = it.ctrl;

  if(it.asFuse){
    const t = findCre(it.tributeId);
    if(!t || t.p !== p){ P(it.card.owner).grave.push(it.card); addLog(`De fusie mist zijn offer en verdwijnt in het graf.`); return; }
    const col = t.c;
    addLog(`🟣 Fusie: ${pName(p)} offert ${icon(t.cr.card.el)} ${EL[t.cr.card.el].name} en roept ${icon(it.card.el)} <em>${EL[it.card.el].name}</em> op in kolom ${col+1}.`, true);
    destroyCre(p, col, "🟣 fusie-offer");
    placeCre(p, col, it.card);
    const me = P(p).cols[col].cre;
    if(it.fuseKey === "fu_stone") me.hp = 4;
    render(); await sleep(180);
    // eenmalig fusie-effect eerst plannen, daarna de gewone triggers (die resolven eerder)
    S.stack.push({type:"eff", el:it.fuseKey, ctrl:p, srcId:me.card.id, origin:"fusie"});
    pushSpellTrigger(p, col, me);
    pushOwnEffect(p, col, me);
    return;
  }

  const col = it.col, slot = P(p).cols[col];
  if(it.asSpell){
    if(slot.spell){
      P(slot.spell.card.owner).grave.push(slot.spell.card);
      addLog(`De oude spell ${icon(slot.spell.card.el)} ${EL[slot.spell.card.el].name} in kolom ${col+1} wordt gediscard.`, true);
    }
    slot.spell = {card:it.card};
    render(); AU.play("place"); await sleep(150);
    const el = it.card.el;
    if(el === "vuur")  S.stack.push({type:"eff", el:"vuur", ctrl:p, excl:[], srcId:null, protect:null, origin:"spell"});
    if(el === "gras")  S.stack.push({type:"eff", el:"gras", ctrl:p, srcId:null, origin:"spell"});
    if(el === "steen"){ S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"}); S.stack.push({type:"eff", el:"steen", ctrl:p, origin:"spell"}); }
    if(el === "water") S.stack.push({type:"eff", el:"water", ctrl:p, exclId:null, origin:"spell"});
    return;
  }

  if(slot.cre){ P(p).hand.push(it.card); addLog(`Creature-plek bezet: ${icon(it.card.el)} keert terug naar de hand.`); return; }
  placeCre(p, col, it.card);
  if(it.keepHp != null && slot.cre){                      // 💧 herspelen: levens blijven, entangle-tokens niet
    slot.cre.hp = it.keepHp;
    if(it.keepHp !== (EL[it.card.el].hp || 2))
      addLog(`💧 ${icon(it.card.el)} ${EL[it.card.el].name} houdt zijn ${it.keepHp} levens; entangle-tokens vallen weg.`);
  }
  render();
  if(it.splash) fxSplash(creSel(p, col)); else AU.play("place");
  await sleep(150);
  pushSpellTrigger(p, col, slot.cre);
  pushOwnEffect(p, col, slot.cre);
}
function placeCre(p, col, card){
  P(p).cols[col].cre = {card, hp:(EL[card.el].hp || 2), played:S.gTurn, attackedT:-1, ent:0};
  addLog(`${icon(card.el)} ${EL[card.el].name} verschijnt in kolom ${col+1} van ${pName(p)}${EL[card.el].hp > 2 ? ` met ${EL[card.el].hp} levens` : ""}.`);
}
function waterTargets(p){
  return allCreIds((cr, pp, cc) => cr.card.el !== "water"
    && !(P(pp).cols[cc].spell && P(pp).cols[cc].spell.card.el === "water"));
}
async function resolveEffect(it){
  const p = it.ctrl;

  if(it.el === "vuur"){
    const big = hasAe(p, "ae_fire6");                       // 🟣 Verzengende Woede
    const dmg = big ? 6 : 2;
    const ids = allCreIds(cr => !(it.excl || []).includes(cr.card.id));
    if(!ids.length){ addLog("🔥 Geen doelwit: het effect verdampt."); return; }
    const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — 🔥 Vuur: kies een creature (${dmg} schade; een eigen creature offer je: instakill + trek een kaart)`, false, {k:"vuur"});
    if(id === null){ addLog("🔥 Effect overgeslagen."); return; }
    const f = findCre(id);
    let offer = false;
    const fSrc = it.srcId != null && findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null;
    if(it.protect === id){
      applyDamage(id, "vuur", dmg, {protect:true, ignoreImmune:big, srcSel:fSrc});
    } else if(f.p === p){
      addLog(`🔥 offert de eigen ${icon(f.cr.card.el)} ${EL[f.cr.card.el].name}: <em>instakill</em>!`, true);
      fxFire(fSrc, creSel(f.p, f.c));
      destroyCre(f.p, f.c, "🔥 offer");
      offer = true;
    } else {
      applyDamage(id, "vuur", dmg, {ignoreImmune:big, srcSel:fSrc});
    }
    render();
    if(offer && it.srcId !== id){
      addLog(`🔥 offerde een eigen creature: ${pName(p)} trekt een kaart.`, true);
      await sleep(220); await drawN(p, 1, "🔥 Vuur");
    }
    return;
  }

  if(it.el === "gras"){
    const ids = allCreIds(cr => cr.card.el !== "vuur");     // 🔥 is immuun voor entangle
    if(!ids.length){ addLog("🌿 Geen geldig doelwit (🔥 Vuur is immuun voor entangle)."); return; }
    const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — 🌿 Gras: kies een creature om te entanglen (−1 leven daar, +1 hier)`, false, {k:"gras"});
    if(id === null){ addLog("🌿 Entangle overgeslagen."); return; }
    const f = findCre(id);
    const n = hasAe(p, "ae_grassx2") ? 2 : 1;               // 🟣 Woekergroei
    const src = it.srcId != null ? findCre(it.srcId) : null;
    const gSrcSel = src ? creSel(src.p, src.c) : null;
    fxThorns(creSel(f.p, f.c), gSrcSel);
    f.cr.ent += n;
    pop(creSel(f.p, f.c), `🌿 +${n}`, "imm");
    addLog(`${icon(f.cr.card.el)} ${EL[f.cr.card.el].name} (kolom ${f.c+1}, ${pName(f.p)}) krijgt ${n} entangle-token${n>1?"s":""}${n>1?" (🟣 Woekergroei)":""} — nu ${f.cr.ent}.`, true);
    for(let i=0;i<n;i++){
      if(!findCre(id)) break;
      const g = findCre(id);
      g.cr.hp -= 1;
      pop(creSel(g.p, g.c), "-1", "dmg");
      if(src && findCre(it.srcId)) gainLife(it.srcId, p, "🌿 drain");
      if(g.cr.hp <= 0){ addLog(`🌿 De drain maakt ${icon(g.cr.card.el)} ${EL[g.cr.card.el].name} af.`, true); destroyCre(g.p, g.c, "🌿 drain"); break; }
    }
    render(); return;
  }

  if(it.el === "steen"){
    const ids = allCreIds();
    if(!ids.length){ addLog("🪨 Geen creature om +1 leven te geven."); return; }
    const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — 🪨 Steen: geef een creature +1 leven (optioneel)`, true, {k:"steen"});
    if(id === null){ addLog("🪨 +1 overgeslagen."); return; }
    gainLife(id, p, "🪨 Steen", "rock"); render();
    return;
  }

  if(it.el === "water"){
    const ids = waterTargets(p).filter(x => x !== it.exclId);
    if(!ids.length){ addLog("💧 Geen creature om te herspelen (💧 Water en kolommen met een 💧-spell tellen niet mee)."); }
    else {
      const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — 💧 Water: kies een creature om opnieuw te spelen`, true, {k:"water"});
      if(id === null) addLog("💧 Herspelen overgeslagen.");
      else {
        const f = findCre(id);
        const owner = f.p, card = f.cr.card, fromCol = f.c, keepHp = f.cr.hp;
        const slots = emptyCols(owner).concat([fromCol]).sort().map(c => ({p:owner, c, kind:"cre"}));
        fxSplash(creSel(owner, fromCol));
        await sleep(260);
        P(owner).cols[fromCol].cre = null; render();
        const sl = await chooseSlot(p, slots, `Kies waar ${icon(card.el)} ${EL[card.el].name} opnieuw verschijnt`);
        addLog(`💧 ${icon(card.el)} ${EL[card.el].name} wordt opnieuw gespeeld in kolom ${sl.c+1}.`, true);
        S.stack.push({type:"play", ctrl:owner, card, asSpell:false, col:sl.c, flash:false, replay:true, splash:true, keepHp});
      }
    }
    if(hasAe(p, "ae_watercycle") && !S.over){               // 🟣 Getijdenstroom
      S.stack.push({type:"eff", el:"watercycle", ctrl:p, origin:"aether"});
    }
    return;
  }

  if(it.el === "watercycle"){
    addLog(`🟣 Getijdenstroom: ${pName(p)} trekt een kaart en discardt er een.`);
    await drawN(p, 1, "🟣 Getijdenstroom");
    if(S.over) return;
    const hand = P(p).hand;
    if(!hand.length) return;
    await ensureHolder(p);
    const id = await waitUI("choice", {p, kind:"hand", valid:hand.map(c => c.id),
      prompt:`<b>${pName(p)}</b> — 🟣 Getijdenstroom: kies een kaart om te discarden`, meta:{k:"discard"}});
    const i = P(p).hand.findIndex(c => c.id === id);
    if(i < 0) return;
    const cd = P(p).hand.splice(i, 1)[0];
    P(cd.owner).grave.push(cd);
    addLog(`${pName(p)} discardt ${icon(cd.el)} ${EL[cd.el].name}.`);
    return;
  }

  /* ---- fusie-effecten ---- */
  if(it.el === "fu_fire"){
    const big = hasAe(p, "ae_fire6");
    const main = big ? 6 : 2;
    const ids = allCreIds(cr => cr.card.id !== it.srcId);
    if(ids.length){
      const id = await chooseCre(p, ids, `<b>${pName(p)}</b> — 🟣 Assekern: kies het hoofddoel (${main} vuurschade)`, true, {k:"vuur"});
      const aSrc = findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null;
      if(id !== null){ applyDamage(id, "vuur", main, {ignoreImmune:big, srcSel:aSrc}); render(); await sleep(160); }
      for(const other of allCreIds(cr => cr.card.id !== it.srcId)){
        if(S.over) break;
        if(other === id) continue;
        applyDamage(other, "vuur", 2, {ignoreImmune:big});
      }
      render();
    }
    return;
  }
  if(it.el === "fu_water"){ addLog(`🟣 Dieptestroom: ${pName(p)} trekt 2 kaarten.`, true); await drawN(p, 2, "🟣 Dieptestroom"); return; }
  if(it.el === "fu_stone"){
    const free = emptyCols(p);
    if(!free.length){ addLog("🟣 Bergrug: geen vrije plek voor de tweede 🪨 Steen."); return; }
    const sl = await chooseSlot(p, free.map(c => ({p, c, kind:"cre"})), `🟣 Bergrug: kies een plek voor de tweede 🪨 Steen (4 levens)`);
    const card = {id:++cid, el:"steen", owner:p, token:true};
    placeCre(p, sl.c, card);
    P(p).cols[sl.c].cre.hp = 4;
    addLog(`🟣 Bergrug plaatst een tweede 🪨 Steen met 4 levens in kolom ${sl.c+1}.`, true);
    render();
    pushSpellTrigger(p, sl.c, P(p).cols[sl.c].cre);
    pushOwnEffect(p, sl.c, P(p).cols[sl.c].cre);
    return;
  }
  if(it.el === "fu_grass"){
    const foes = allCreIds((cr, pp) => pp === opp(p) && cr.card.el !== "vuur");
    if(!foes.length){ addLog("🟣 Wurgranken: geen vijandelijke creature om te entanglen."); return; }
    const n = hasAe(p, "ae_grassx2") ? 2 : 1;
    addLog(`🟣 Wurgranken: elke vijandelijke creature krijgt ${n} entangle-token${n>1?"s":""}.`, true);
    for(const fid of foes){
      if(S.over) break;
      const f = findCre(fid); if(!f) continue;
      fxThorns(creSel(f.p, f.c), findCre(it.srcId) ? creSel(findCre(it.srcId).p, findCre(it.srcId).c) : null);
      f.cr.ent += n;
      for(let i=0;i<n;i++){
        const g = findCre(fid); if(!g) break;
        g.cr.hp -= 1;
        if(findCre(it.srcId)) gainLife(it.srcId, p, "🌿 drain");
        if(g.cr.hp <= 0){ destroyCre(g.p, g.c, "🌿 drain"); break; }
      }
      render(); await sleep(120);
    }
    return;
  }
}
async function resolveAttack(it){
  const p = it.ctrl, col = it.col;
  const att = P(p).cols[col].cre;
  if(!att || att.card.id !== it.creId){ addLog("De aanvaller is er niet meer: aanval vervalt."); return; }
  if(att.ent > 0){ addLog(`${icon(att.card.el)} is entangled: de aanval gaat niet door!`, true); return; }
  const def = P(opp(p)).cols[col].cre;
  const power = atkOf(att, p);
  const el = document.querySelector(creSel(p, col));
  if(el) el.classList.add(p === 0 ? "lunge-up" : "lunge-down");
  AU.play("attack");
  const fromR = rectOf(creSel(p, col));
  const toR = def ? rectOf(creSel(opp(p), col)) : rectOf(`.pside[data-side="${opp(p)}"] .plife`);
  if(fromR && toR){
    const x1 = fromR.left + fromR.width/2, y1 = fromR.top + fromR.height/2;
    const x2 = toR.left + toR.width/2, y2 = toR.top + toR.height/2;
    const len = Math.hypot(x2-x1, y2-y1), ang = Math.atan2(y2-y1, x2-x1);
    const ln = document.createElement("div");
    ln.className = "atkline";
    ln.style.left = x1+"px"; ln.style.top = y1+"px"; ln.style.width = len+"px";
    ln.style.transform = `rotate(${ang}rad)`;
    document.getElementById("fx").appendChild(ln);
    setTimeout(() => ln.remove(), 500);
  }
  await sleep(300);
  if(!def){
    P(opp(p)).life -= power;
    const lifeEl = document.querySelector(`.pside[data-side="${opp(p)}"]`);
    if(lifeEl) lifeEl.classList.add("shake");
    pop(rectOf(`.pside[data-side="${opp(p)}"] .plife`), "-" + power, "dmg");
    addLog(`${icon(att.card.el)} ${EL[att.card.el].name} raakt <em>${pName(opp(p))}</em> direct voor ${power} leven${power>1?"s":""}.`, true);
    if(P(opp(p)).life <= 0) return gameOver(p, pName(opp(p)) + " heeft geen levens meer.");
    return;
  }
  applyDamage(def.card.id, att.card.el, power, {srcCre: att, noFx:true});
}
async function upkeepEntangle(p){
  for(let c=0;c<5;c++){
    const cr = P(p).cols[c].cre;
    if(cr && cr.ent > 0){
      cr.ent -= 1;
      pop(creSel(p,c), "🌿 −1 token", "imm");
      addLog(`${icon(cr.card.el)} ${EL[cr.card.el].name} (kolom ${c+1}, ${pName(p)}) verliest een entangle-token (nog ${cr.ent}).`);
      render(); await sleep(200);
    }
  }
}
async function startTurnSequence(){
  S.ui = {mode:"busy"}; S.botPlays = 0;
  S.phase = "upkeep"; render(); await sleep(250);
  await upkeepEntangle(S.tp);
  if(S.over) return;
  S.phase = "draw"; render();
  if(S.gTurn === 1){ addLog("Speler 1 slaat de eerste draw phase over."); await sleep(300); }
  else { const n = hasAe(S.tp, "ae_draw3") ? 3 : 2;
    addLog(`${pName(S.tp)} trekt ${n} kaarten${n === 3 ? " (🟣 Bron van Overvloed)" : ""}.`);
    await drawN(S.tp, n); }
  if(S.over) return;
  S.phase = "main1";
  backToPhase();
}
function backToPhase(){
  S.actor = S.tp;
  if(!S.set.handoff && !S.vsBot) S.holder = S.tp;
  S.ui = {mode: S.phase === "battle" ? "battle" : "main"};
  render();
  if(isBot(S.tp) && !S.over){
    clearTimeout(botT);
    botT = setTimeout(botMove, 750 + Math.random()*400);
  }
}
async function endTurn(){
  S.phase = "end"; S.ui = {mode:"busy"}; render();
  addLog(`${pName(S.tp)} beëindigt de beurt.`);
  await sleep(250);
  S.gTurn++; S.tp = opp(S.tp); S.turnNo[S.tp]++;
  await ensureHolder(S.tp);
  await startTurnSequence();
}
function gameOver(winner, reason){
  if(S.over) return;
  S.over = {winner, reason};
  AU.play((NET.on ? winner === NET.seat : (!S.vsBot || winner === 0)) ? "win" : "lose");
  if(S.mode === "commander" && S.match){
    S.match.wins[winner]++;
    S.over.matchDone = S.match.wins[winner] >= 2;
    addLog(`<em>${pName(winner)} wint potje ${S.match.game}!</em> Stand: ${S.match.wins[0]}–${S.match.wins[1]}. ${reason}`, true);
    if(S.over.matchDone) addLog(`🏆 <em>${pName(winner)} wint de match ${S.match.wins[winner]}–${S.match.wins[opp(winner)]}!</em>`, true);
  } else {
    addLog(`<em>${pName(winner)} wint!</em> ${reason}`, true);
  }
  render();
}

/* ================= PLAYER ACTIONS ================= */
async function playFlashInBattle(cardId){
  if(busyFlag) return; busyFlag = true; MUT++;
  try{
    const p = S.tp;
    const card = P(p).hand.find(cd => cd.id === cardId);
    if(!card) return;
    const canCre = EL[card.el].flash && emptyCols(p).length > 0;
    const canFuse = fuseOk(p, card.el, "flash");
    if(!canCre && !canFuse) return;
    let mode = canFuse && !canCre ? "fuse" : "cre";
    if(canCre && canFuse){
      mode = await waitUI("pickmode", {p, cardId, creOk:true, spOk:false, fuseOk:true, flashCtx:true});
      if(mode === "cancel"){ backToPhase(); return; }
    }
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de ${icon(f.tribute)} ${EL[f.tribute].name} die je offert`, true, {k:"tribute"});
      if(tid === null){ backToPhase(); return; }
      takeFromHand(p, cardId);
      S.stack.push({type:"play", ctrl:p, card, asFuse:true, tributeId:tid, fuseKey:f.key});
      addLog(`${pName(p)} start ⚡ 🟣 <em>${AETHERS[f.key].name}</em> (gevechtsfase).`, true);
      await chainLoop();
      return;
    }
    const s = await waitUI("slot", {p, valid:creSlotsFor(p, card.el), cancellable:true,
      prompt:`Kies een plek voor ⚡ ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel"){ backToPhase(); return; }
    takeFromHand(p, cardId);
    pushPlay(p, card, false, s.c, true);
    await chainLoop();
  } finally { busyFlag = false; }
}
function battleFlashOk(p, card){
  if(!card) return false;
  return (EL[card.el].flash && emptyCols(p).length > 0) || fuseOk(p, card.el, "flash");
}
async function playFromHand(cardId){
  if(busyFlag) return; busyFlag = true; MUT++;
  try{
    const p = S.tp;
    const card = P(p).hand.find(cd => cd.id === cardId);
    if(!card) return;
    const creOk = canPlayCreature(p), spOk = freeSpellCols(p).length > 0;
    const fuOk = fuseOk(p, card.el);
    if(!creOk && !spOk && !fuOk) return;
    const mode = await waitUI("pickmode", {p, cardId, creOk, spOk, fuseOk:fuOk});
    if(mode === "cancel"){ backToPhase(); return; }
    if(mode === "fuse"){
      const f = aeFuse(p, card.el);
      const tid = await chooseCre(p, fuseTributes(p, card.el),
        `🟣 ${AETHERS[f.key].name}: kies de ${icon(f.tribute)} ${EL[f.tribute].name} die je offert`, true, {k:"tribute"});
      if(tid === null){ backToPhase(); return; }
      takeFromHand(p, cardId);
      S.stack.push({type:"play", ctrl:p, card, asFuse:true, tributeId:tid, fuseKey:f.key});
      addLog(`${pName(p)} start 🟣 <em>${AETHERS[f.key].name}</em>.`, true);
      await chainLoop();
      return;
    }
    const asSpell = mode === "spell";
    const slots = asSpell ? freeSpellCols(p).map(c=>({p,c,kind:"spell"})) : creSlotsFor(p, card.el);
    const s = await waitUI("slot", {p, valid:slots, cancellable:true,
      prompt:`Kies een ${asSpell?"spell":"creature"}-plek voor ${icon(card.el)} ${EL[card.el].name}`});
    if(s === "cancel"){ backToPhase(); return; }
    takeFromHand(p, cardId);
    pushPlay(p, card, asSpell, s.c, false);
    await chainLoop();
  } finally { busyFlag = false; }
}
async function declareAttack(col){
  if(busyFlag) return; busyFlag = true; MUT++;
  try{
    const p = S.tp, cr = P(p).cols[col].cre;
    if(!cr || !canAttack(cr, p)) return;
    cr.attackedT = S.gTurn;
    const def = P(opp(p)).cols[col].cre;
    S.stack.push({type:"attack", ctrl:p, col, creId:cr.card.id});
    addLog(`${pName(p)} valt aan met ${icon(cr.card.el)} <em>${EL[cr.card.el].name}</em> in kolom ${col+1}${def?"":" → rechtstreeks op "+pName(opp(p))}.`, true);
    await chainLoop();
  } finally { busyFlag = false; }
}
async function advancePhase(kind){
  if(busyFlag) return; busyFlag = true; MUT++;
  try{
    if(kind === "tobattle"){ S.phase = "battle"; addLog(`${pName(S.tp)} gaat naar de gevechtsfase.`); backToPhase(); }
    else if(kind === "endbattle"){ S.phase = "main2"; backToPhase(); }
    else if(kind === "endturn"){ await endTurn(); }
  } finally { busyFlag = false; }
}

/* ================= BOT ================= */
async function botMove(){
  if(!S || S.over || !isBot(S.tp)) return;
  const m = S.ui.mode;
  if(m === "main"){
    const play = botChoosePlay();
    if(play){ S.botPlays++; botPlan = play; await playFromHand(play.cardId); return; }
    if(S.phase === "main1"){ advancePhase("tobattle"); return; }
    advancePhase("endturn"); return;
  }
  if(m === "battle"){
    const col = botChooseAttack();
    if(col !== null){ declareAttack(col); return; }
    advancePhase("endbattle"); return;
  }
}
function botChoosePlay(){
  const p = 1;
  if(S.botPlays >= (P(p).hand.length > 5 ? 3 : 2)) return null;
  const hand = P(p).hand, empty = emptyCols(p);
  if(!hand.length || !empty.length) return null;
  let best = null, bestScore = 1.5;
  for(const cd of hand){
    for(const c of empty){
      let s = 2;
      const enemy = P(0).cols[c].cre;
      if(enemy){
        if(EL[cd.el].strong === enemy.card.el) s += 4;                       // wij instakillen hen in combat
        else if(dmgOutcome(enemy.card.el, cd.el, 1) === "immuun") s += 3;    // gratis blocker
        else if(EL[enemy.card.el].strong === cd.el) s -= 3;                  // zij instakillen ons
      } else s += 1;                                                          // open laan
      if(cd.el === "vuur"){
        let eff = 0;
        eachCre((cr,pp)=>{ if(pp===0){ const o = dmgOutcome("vuur", cr.card.el, 2);
          if(o === "kill" || (typeof o === "number" && cr.hp <= o)) eff = Math.max(eff, 3);
          else if(typeof o === "number") eff = Math.max(eff, 1); } });
        s += eff;
      }
      if(cd.el === "steen") s += 1.5;      // 3 levens en +1+1
      if(cd.el === "gras") s += 1;
      s += rnd() * 0.6;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "cre", col: c}; }
    }
  }
  // spells: de bot speelt nu ook geregeld kaarten als spell
  const spellVal = {vuur:3.4, steen:2.8, gras:2.4, water:1.6};
  for(const cd of hand){
    for(let c=0;c<5;c++){
      if(P(p).cols[c].spell) continue;                 // eigen spell niet overschrijven
      let s = 1 + spellVal[cd.el];
      if(P(p).cols[c].cre) s -= 1.6;                   // triggert pas bij een vólgende creature hier
      if(!empty.includes(c)) s -= 0.5;
      if(cd.el === "vuur" && !allCreIds((cr,pp)=>pp===0).length) s -= 1.5;
      s += rnd() * 0.7;
      if(s > bestScore){ bestScore = s; best = {cardId: cd.id, mode: "spell", col: c}; }
    }
  }
  return best;
}
function botChooseAttack(){
  for(let c=0;c<5;c++){
    const cr = P(1).cols[c].cre;
    if(cr && canAttack(cr, 1)){
      const def = P(0).cols[c].cre;
      if(!def) return c;
      if(dmgOutcome(cr.card.el, def.card.el, 1) !== "immuun") return c;
    }
  }
  return null;
}
function botDecide(mode){
  if(!S || S.over || !pending || S.ui.mode !== mode || !isBot(S.ui.p)) return;
  if(mode === "aetherpick"){
    const prefer = ["ae_fire6","ae_stonefull","ae_grassx2","ae_draw3","ae_watercycle"];
    const idx = S.ui.cards.findIndex(k => prefer.includes(k));
    feed(idx >= 0 ? idx : 0); return;
  }
  if(mode === "banpick"){ feed([]); return; }
  if(mode === "pickmode"){ feed(botPlan && botPlan.mode === "spell" ? "spell" : "cre"); return; }
  if(mode === "slot"){
    const valid = S.ui.valid;
    let pick = null;
    if(botPlan && botPlan.col != null){ pick = valid.find(s => s.c === botPlan.col); botPlan.col = null; }
    if(!pick) pick = valid.find(s => s.kind === "cre" && !P(s.p).cols[s.c].cre) || valid[0];
    feed({p: pick.p, c: pick.c}); return;
  }
  if(mode === "priority"){
    const r = botPriority();
    if(r){ botPlan = {mode:"cre", col: r.col}; feed(r.cardId); }
    else feed("pass");
    return;
  }
  if(mode === "choice"){ feed(botChoice()); return; }
  if(mode === "handoff"){ feed(true); }
}
function botPriority(){
  const top = S.stack[S.stack.length - 1];
  if(!top || !hasLegalFlash(1)) return null;
  if(top.type === "attack" && top.ctrl === 0){
    const att = P(0).cols[top.col].cre;
    if(att && !P(1).cols[top.col].cre){
      const empty = emptyCols(1);
      // 1) gratis blocker: element waar de aanvaller niets tegen doet
      if(empty.includes(top.col)){
        const blk = P(1).hand.find(cd => EL[cd.el].flash && dmgOutcome(att.card.el, cd.el, 1) === "immuun");
        if(blk) return {cardId: blk.id, col: top.col};
      }
      // 2) gras-flash: entangle de aanvaller
      const pl = P(1).hand.find(cd => cd.el === "gras");
      if(pl && empty.length) return {cardId: pl.id, col: empty.includes(top.col) ? top.col : empty[0]};
    }
  }
  return null;
}
function botChoice(){
  const u = S.ui, ids = u.valid, m = u.meta || {};
  const F = id => findCre(id);
  if(u.kind === "hand" || m.k === "discard"){
    const hand = P(1).hand;
    const pick = hand[hand.length-1] || null;
    return pick ? pick.id : (ids[0] || null);
  }
  if(m.k === "tribute") return ids[0] || null;
  if(m.k === "vuur"){
    const big = hasAe(1, "ae_fire6"), dmg = big ? 6 : 2;
    let best = null, bs = -99;
    for(const id of ids){
      const f = F(id); if(!f) continue;
      const o = dmgOutcome("vuur", f.cr.card.el, dmg);
      let sc;
      if(f.p === 0) sc = (o === "kill" || (typeof o === "number" && f.cr.hp <= o)) ? 6 + f.cr.hp : (o === "immuun" && !big ? -5 : 1 + f.cr.hp * 0.2);
      else sc = f.cr.hp <= 1 ? 2 : -4;          // eigen offer alleen als het bijna dood is
      if(sc > bs){ bs = sc; best = id; }
    }
    if(u.optional && bs < 0) return null;
    return best !== null ? best : (ids[0] || null);
  }
  if(m.k === "gras"){
    let best = null, bs = -99;
    for(const id of ids){
      const f = F(id); if(!f) continue;
      let sc = f.p === 0 ? 3 + f.cr.hp * 0.3 : -3;
      if(f.p === 0 && f.cr.card.el === "steen") sc += 5;   // instakill
      if(sc > bs){ bs = sc; best = id; }
    }
    if(u.optional && bs < 0) return null;
    return best !== null ? best : (ids[0] || null);
  }
  if(m.k === "steen"){
    const own = ids.filter(id => F(id) && F(id).p === 1);
    return own[0] || (u.optional ? null : (ids[0] || null));
  }
  if(m.k === "water"){
    const own = ids.filter(id => F(id) && F(id).p === 1);   // eigen creature opnieuw spelen = effect opnieuw
    return own[0] || null;
  }
  if(m.k === "tribute") return ids[0] || null;
  if(m.k === "discard") return ids[ids.length-1] || null;
  return u.optional ? null : ids[0];
}

function circleSVG(w){
  const cx = 100, cy = 96, r = 60;
  const ring = [ORDER[0]];                       // volg de sterk-tegen-ketting, zo staan de pijlen netjes rond
  while(ring.length < ORDER.length){ const nx = EL[ring[ring.length-1]].strong; if(!nx || ring.includes(nx)) break; ring.push(nx); }
  ORDER.forEach(el => { if(!ring.includes(el)) ring.push(el); });
  const pos = ring.map((el, k) => { const a = (-90 + 360/ring.length*k) * Math.PI/180; return {el, x:cx + r*Math.cos(a), y:cy + r*Math.sin(a)}; });
  let arrows = "";
  for(let k=0;k<ORDER.length;k++){
    const a = pos[k], b = pos.find(q => q.el === EL[a.el].strong);
    if(!b) continue;
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    const ux = dx/L, uy = dy/L, m = 20;
    arrows += `<line x1="${a.x+ux*m}" y1="${a.y+uy*m}" x2="${b.x-ux*(m+4)}" y2="${b.y-uy*(m+4)}"
      stroke="#c9a86a" stroke-width="1.6" marker-end="url(#ah)" opacity=".85"/>`;
  }
  const nodes = pos.map(pt =>
    `<circle cx="${pt.x}" cy="${pt.y}" r="15" fill="#1c242c" stroke="#3a4552"/>
     <text x="${pt.x}" y="${pt.y+5}" text-anchor="middle" font-size="15">${icon(pt.el)}</text>`).join("");
  return `<svg viewBox="0 0 200 192" width="${w}">
    <defs><marker id="ah" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#c9a86a"/></marker></defs>
    ${arrows}${nodes}
    <text x="100" y="94" text-anchor="middle" font-size="8.5" fill="#8b96a0" font-family="Cinzel,serif" letter-spacing="1">STERK</text>
    <text x="100" y="104" text-anchor="middle" font-size="8.5" fill="#8b96a0" font-family="Cinzel,serif" letter-spacing="1">TEGEN ➜</text>
  </svg>`;
}

const TUT_CLASSIC = [

function tutorialHTML(){

  const cmd = M.deck === "commander";
  const dots = deck.map((_,k)=>`<span class="tdot${k===i?" on":""}${cmd?"":" cls"}" data-act="btn" data-btn="tutgo" data-step="${k}"></span>`).join("");
  return `<div class="ovbox" style="max-width:min(700px,94vw);text-align:left">
    <div style="text-align:center"><div style="font-size:2rem">${st.ic}</div>
      <h2 style="margin-bottom:4px">${st.t}</h2>
      <div style="font-family:Cinzel,serif;font-size:.66rem;letter-spacing:.14em;color:var(--dim);margin-bottom:4px">${cmd?"🟣 COMMANDER":"⚜️ KLASSIEK"} · TUTORIAL ${i+1} / ${deck.length}</div>
      <div style="margin-bottom:12px"><button class="tswitch" data-act="btn" data-btn="tutswitch">${cmd?"⚜️ Naar de klassieke tutorial":"🟣 Naar de Commander-tutorial"}</button></div></div>
    <div class="helptxt" style="font-size:.86rem"><p>${st.b}</p></div>
    ${tutVisual(st.v)}
    <div class="tnav">
      <button class="abtn ghost" style="width:auto;padding:9px 18px" data-act="btn" data-btn="tutprev" ${i===0?"disabled style='opacity:.35;width:auto;padding:9px 18px'":""}>◀ Terug</button>
      <div class="tdots">${dots}</div>
      ${last
        ? `<button class="obtn" style="padding:9px 22px" data-act="btn" data-btn="closemodal">Sluiten</button>`
        : `<button class="obtn" style="padding:9px 22px" data-act="btn" data-btn="tutnext">Verder ▶ <span style="opacity:.6;font-size:.7rem">[spatie]</span></button>`}
    </div></div>`;
}
